# One replica: every tunnel rides one of the US connector's WSS lanes, held by
# whichever pod the connector reached. No Kubernetes token. The image
# placeholder fleet-python is pinned by the overlay (python3 is all it needs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-us-egress
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fleet-us-egress
  template:
    metadata:
      labels:
        app: fleet-us-egress
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # the wheel, unpacked offline: nothing is fetched at start
        - name: dependency
          image: fleet-python
          command: ["python3", "-I", "-c", "import zipfile; zipfile.ZipFile('/program/websockets.whl').extractall('/deps')"]
          volumeMounts:
            - name: program
              mountPath: /program
              readOnly: true
            - name: deps
              mountPath: /deps
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: gateway
          image: fleet-python
          command: ["python3", "/program/us-egress.py", "gateway"]
          env:
            - name: PYTHONPATH
              value: /deps
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: FLEET_US_EGRESS_LISTEN
              value: "0.0.0.0:3128"
            - name: FLEET_US_EGRESS_WS_LISTEN
              value: "0.0.0.0:8090"
            - name: FLEET_US_EGRESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fleet-us-egress
                  key: token
          ports:
            - name: connect
              containerPort: 3128
            - name: reverse
              containerPort: 8090
          # /livez is the process: the ingress must keep taking reconnecting
          # connectors through an outage. /healthz says whether a US lane is up.
          readinessProbe:
            httpGet:
              path: /livez
              port: reverse
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: reverse
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
              # #4729: a request of 0 is the kubelet's first pick when the node's disk runs short
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: program
              mountPath: /program
              readOnly: true
            - name: deps
              mountPath: /deps
              readOnly: true
      volumes:
        - name: program
          configMap:
            name: fleet-us-egress
        - name: deps
          emptyDir:
            sizeLimit: 16Mi
