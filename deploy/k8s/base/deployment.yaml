# The hub: one Go binary, two replicas, on a managed Postgres (EPIC #2119).
#
# A release replaces the replicas one at a time (claude-fleet#2125): a new pod
# gets traffic only once /readyz says its database answers and has every
# migration this image knows; an old one leaves only after a new one is ready
# (maxUnavailable 0, maxSurge 1). Stopping, an old pod first sleeps out of the
# Service (preStop), then gets SIGTERM and finishes the requests it already took
# for up to CCQUOTA_SHUTDOWN_GRACE (25 s). So a release, a node drain or a
# deleted pod is 0 seconds down — hub-deploy measures it (downtime_seconds).
# The two replicas share the database (CCQUOTA_DB_URL) and find each other for
# the node links each holds (CCQUOTA_REPLICA*, claude-fleet#2124); background
# work runs once (internal/leader, #2123). No disk: nothing here mounts a volume
# that can get stuck attaching.
#
# Secret `ccquota-db` (made by a person, never in this repo — ../RUNBOOK.md
# «换库») holds `db-url` and `replica-token`. Not optional: a pod that cannot
# read them does not start, and with maxUnavailable 0 the old ones keep serving.
#
# Production still runs the single SQLite shape until the switch: overlays/prod
# adds the `sqlite` component (../components/sqlite-single — one replica,
# Recreate, the data disk). The switch removes that one line (../RUNBOOK.md).
#
# The image is the placeholder name `ccquota` with the placeholder tag
# `set-by-hub-deploy`: the overlay maps the name to its registry, and the
# hub-deploy workflow pins the tag (`prod-<sha7>`) at deploy time. The live tag
# is never recorded in this repo — read it from the cluster or from /version.
# So never `kubectl apply -k` by hand: run the workflow (../README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccquota-hub
  labels:
    app: ccquota-hub
spec:
  replicas: 2
  revisionHistoryLimit: 1
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ccquota-hub
  template:
    metadata:
      labels:
        app: ccquota-hub
    spec:
      # preStop 5 s + CCQUOTA_SHUTDOWN_GRACE 25 s + margin.
      terminationGracePeriodSeconds: 40
      # One replica per node where the cluster has room: a node going away
      # takes one of them, never both.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ccquota-hub
      containers:
        - name: ccquota
          image: ccquota:set-by-hub-deploy
          imagePullPolicy: IfNotPresent
          args:
            - --retention-days=60
            - --pricing=/etc/ccquota/pricing.json
          ports:
            - containerPort: 8787
          env:
            - name: CCQUOTA_VIEWER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: viewer-token
            - name: CCQUOTA_FLEET
              value: "1"
            - name: CCQUOTA_FLEET_CRED_KEY_FILE
              value: "/secrets/cred-key/key"
            - name: CCQUOTA_FLEET_SSH_CA_KEY
              value: "/secrets/ssh-ca/ca"
            - name: CCQUOTA_FLEET_OAUTH_REFRESH_VIA
              value: "node"
            - name: CCQUOTA_DB_URL
              valueFrom:
                secretKeyRef:
                  name: ccquota-db
                  key: db-url
            # Who this replica is and where the other one reaches it
            # (claude-fleet#2124): the pod's name and in-cluster address.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CCQUOTA_REPLICA
              value: "$(POD_NAME)"
            - name: CCQUOTA_REPLICA_URL
              value: "http://$(POD_IP):8787"
            - name: CCQUOTA_REPLICA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ccquota-db
                  key: replica-token
            - name: CCQUOTA_SHUTDOWN_GRACE
              value: "25s"
          lifecycle:
            # Out of the Service first: the endpoint removal reaches the
            # ingress while this pod still answers; only then SIGTERM.
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 20
          # Liveness never asks the database (an outage must not restart
          # every pod); readiness does — traffic only to a replica that can
          # serve it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8787
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 848Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: pricing
              mountPath: /etc/ccquota
              readOnly: true
            - name: ssh-ca
              mountPath: /secrets/ssh-ca
              readOnly: true
            - name: cred-key
              mountPath: /secrets/cred-key
              readOnly: true
      volumes:
        - name: pricing
          configMap:
            name: ccquota-pricing
        # Two secrets created by hand, never in this repo (../RUNBOOK.md); not
        # optional on purpose: missing ⇒ the hub does not start, rather than
        # running with the fleet vault silently off.
        - name: ssh-ca
          secret:
            secretName: ccquota-ssh-ca
            defaultMode: 0440
        - name: cred-key
          secret:
            secretName: ccquota-fleet-cred-key
            defaultMode: 0440
