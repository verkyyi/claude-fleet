# The hub (tokenledger/, the ccquota image) as one Deployment + its Service,
# Ingress, disruption budget and pricing table — two replicas on Postgres; the
# single SQLite shape and its data disk are ../components/sqlite-single. Nothing
# here names an environment: the namespace, registry, hostnames, TLS secret and every site-specific setting
# live in an overlay (overlays/prod). Deploy through the hub-deploy workflow —
# see ../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
  - ccquota-pricing.yaml
