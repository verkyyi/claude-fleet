# fleet-npm (#3548): Verdaccio, a read-only npm cache (verdaccio.yaml). Two
# replicas, each with its own disk (a read-through cache shares nothing), so one
# going away costs a slower install, never a failed one — npm has no fallback
# registry, the second replica is it.
apiVersion: v1
kind: Service
metadata:
  name: fleet-npm
  labels:
    app: fleet-npm
spec:
  type: ClusterIP
  # a user pod keeps asking the same replica, so its second install is a hit
  sessionAffinity: ClientIP
  selector:
    app: fleet-npm
  ports:
    - name: http
      port: 4873
      targetPort: 4873
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fleet-npm
  labels:
    app: fleet-npm
spec:
  serviceName: fleet-npm
  replicas: 2
  revisionHistoryLimit: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
  selector:
    matchLabels:
      app: fleet-npm
  template:
    metadata:
      labels:
        app: fleet-npm
        fleet/role: ops
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: fleet-npm
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verdaccio
          image: fleet-npm-cache:set-by-person
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4873
          env:
            - name: VERDACCIO_PORT
              value: "4873"
          readinessProbe:
            httpGet:
              path: /-/ping
              port: 4873
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/ping
              port: 4873
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: conf
              mountPath: /verdaccio/conf
              readOnly: true
            - name: storage
              mountPath: /verdaccio/storage
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: conf
          configMap:
            name: fleet-npm
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  # each replica its own disk: a read-through cache shares nothing (the cluster's
  # default StorageClass; ../README.md for another)
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleet-npm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fleet-npm
