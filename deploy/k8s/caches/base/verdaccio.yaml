# fleet-npm (#3548): a read-only npm cache. Every package is proxied from one
# upstream (the overlay's npmmirror) and kept on the disk; nobody publishes,
# nobody signs up. Tarball URLs are rewritten to this Service's own address.
storage: /verdaccio/storage/data
plugins: /verdaccio/plugins
listen: 0.0.0.0:4873
web:
  enable: false
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: -1
uplinks:
  upstream:
    url: https://registry.npmmirror.com/
    timeout: 30s
    # metadata is re-asked after this; tarballs are kept for good
    maxage: 5m
    fail_timeout: 1m
    cache: true
packages:
  '@*/*':
    access: $all
    publish: $nobody
    unpublish: $nobody
    proxy: upstream
  '**':
    access: $all
    publish: $nobody
    unpublish: $nobody
    proxy: upstream
server:
  keepAliveTimeout: 60
log:
  type: stdout
  format: json
  level: warn
