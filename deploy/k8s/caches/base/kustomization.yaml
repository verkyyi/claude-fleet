# The cluster's package caches — 包缓存 (claude-fleet#3548, EPIC #3500 C3):
# read-through caches for npm (Verdaccio, fleet-npm:4873), pip (devpi,
# fleet-pypi:3141) and Go (Athens, fleet-goproxy:3000), each a StatefulSet of two
# replicas with a disk apiece + a PDB. Environment-free; ../fleet-workers adds the namespace, the images and the
# upstreams. User pods find them through render.py --cluster-caches.
#
# Applied by a person (../README.md), never by hub-deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - npm.yaml
  - pypi.yaml
  - goproxy.yaml
configMapGenerator:
  - name: fleet-npm
    files:
      - config.yaml=verdaccio.yaml
  - name: fleet-pypi
    files:
      - start.sh=devpi-start.sh
