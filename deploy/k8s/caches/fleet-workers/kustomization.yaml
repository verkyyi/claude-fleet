# Beside the user pods in fleet-workers (#3548). Applied by a person (../README.md):
# pin each image by digest, and name the disks' class (an encrypted ESSD class).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet-workers
resources:
  - ../base
images:
  # mirrored into the cluster's registry from docker.io (verdaccio/verdaccio:6,
  # gomods/athens:v0.19.2) and built from ../pypi-image — pinned by digest at apply
  - name: fleet-npm-cache
    newName: registry-vpc.cn-shenzhen.aliyuncs.com/24haowan/verdaccio
  - name: fleet-pypi-cache
    newName: registry-vpc.cn-shenzhen.aliyuncs.com/24haowan/fleet-devpi
  - name: fleet-go-cache
    newName: registry-vpc.cn-shenzhen.aliyuncs.com/24haowan/athens
patches:
  - path: upstreams.yaml
