# The 「正在更新」 backend (claude-fleet#2052). ingress-nginx sends a request here
# — path and headers as they came — while the hub's Service has no ready
# endpoint (the Ingress's `default-backend` annotation): the Recreate seconds
# of every release. Everything answers 503 + Retry-After: 30. A browser asking
# for a page gets the bilingual page (refreshes itself every 15 s); the API,
# the MCP endpoint, the node channel, the installer and anything not asking
# for HTML get a short JSON body, so machines and clients retry as before.
#
# X-Original-URI is honoured too, in case `custom-http-errors` is ever turned
# on (then ingress-nginx rewrites the path to / and passes the real one there).
#
# A whole nginx.conf (not a conf.d drop-in): one worker, no root — it runs as
# the image's nginx user (uid 101), pid and temp files under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_original_uri $updating_path {
        ""      $uri;
        default $http_x_original_uri;
    }
    # First matching regex wins.
    map "$updating_path|$http_accept" $updating_doc {
        "~^/(v1|mcp|install|healthz|version)([/?|]|$)" /-/updating.json;
        "~\|.*text/html"                               /-/updating.html;
        default                                        /-/updating.json;
    }

    server {
        listen 8080 default_server;
        server_tokens off;
        root /usr/share/nginx/updating;
        charset utf-8;

        location = /-/ready {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            error_page 503 $updating_doc;
            return 503;
        }

        location = /-/updating.html {
            internal;
            default_type text/html;
            add_header Retry-After 30 always;
            add_header Refresh 15 always;
            add_header Cache-Control "no-store" always;
            try_files /updating.html =500;
        }

        location = /-/updating.json {
            internal;
            default_type application/json;
            add_header Retry-After 30 always;
            add_header Cache-Control "no-store" always;
            try_files /updating.json =500;
        }
    }
}
