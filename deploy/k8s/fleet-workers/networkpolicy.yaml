# fleet-workers' network rules (EPIC #3500 共同约定 6): deny by default; a user
# pod (fleet/role=user) reaches kube-dns, the shared services (fleet/role=ops:
# fleet-credproxy, fleet-egress, the package caches fleet-npm · fleet-pypi ·
# fleet-goproxy), the CI git mirror (arc-runners) and the hub — nothing else, not
# another user pod, not the internet. The shared services take requests from user pods only
# and go out on their own.
#
# ⚠️ ACK's flannel does not ENFORCE NetworkPolicy (docs/dev/MANAGED-LINUX.md «Egress
# guard»). On this cluster the walls that hold are the user pod's own egress
# guard (render.py --egress-closed) and fleet-egress's source check; these rules
# are the same contract written for the day the CNI enforces them (Terway with
# its policy engine, Calico) — keep them in step with render.py.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: fleet-workers
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-out
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: user
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # the shared services, at their pods' ports (policy sees the pod, not the Service)
    - to:
        - podSelector:
            matchLabels:
              fleet/role: ops
      ports:
        - {protocol: TCP, port: 8788}   # fleet-credproxy
        - {protocol: TCP, port: 3128}   # fleet-egress
        - {protocol: TCP, port: 4873}   # fleet-npm
        - {protocol: TCP, port: 3141}   # fleet-pypi
        - {protocol: TCP, port: 3000}   # fleet-goproxy
    # the CI's git mirror (render.py --git-mirror): fetches only, git://
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-runners
      ports:
        - {protocol: TCP, port: 9418}
    # the hub's public address (the node link, passes, the relay check): the
    # load balancer's IP, the same one render.py's --egress-allow names. The
    # TEST-NET placeholder allows nothing — replace it at apply (README.md).
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-in
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: user
  policyTypes: [Ingress]
  ingress:
    # the shared node's own entry port (fleet-linux-entry, until it retires —
    # EPIC #3500 step 6), from outside through its load balancer
    - ports:
        - {protocol: TCP, port: 22022}
    # a user pod's sshd: from the cluster's one door alone (#3549, C4) — never
    # another user pod
    - from:
        - podSelector:
            matchLabels:
              fleet/role: door
      ports:
        - {protocol: TCP, port: 22}
---
# The cluster's one door (#3549, EPIC #3500 C4; render.py --door): in from
# anyone on 22022 (its LoadBalancer, externalTrafficPolicy Local), out only to
# the user pods' sshd, kube-dns and the hub.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: door-in
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: door
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 22022}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: door-out
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: door
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              fleet/role: user
      ports:
        - {protocol: TCP, port: 22}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # the hub's public address (its table, the record) — replaced at apply, as user-out's
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-in
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: ops
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              fleet/role: user
      ports:
        - {protocol: TCP, port: 8788}
        - {protocol: TCP, port: 3128}
        - {protocol: TCP, port: 4873}
        - {protocol: TCP, port: 3141}
        - {protocol: TCP, port: 3000}
    # a throwaway Job (#3558): the package caches alone
    - from:
        - podSelector:
            matchLabels:
              fleet/role: job
      ports:
        - {protocol: TCP, port: 4873}
        - {protocol: TCP, port: 3141}
        - {protocol: TCP, port: 3000}
    # a service run's Job (#4005): the run egress and the credential proxy
    - from:
        - podSelector:
            matchLabels:
              fleet/role: job
              fleet/job-kind: svc
      ports:
        - {protocol: TCP, port: 3128}
        - {protocol: TCP, port: 8788}
    # a Job of an open kind (#3552: build · test · browser · load): the egress
    # too. untrusted carries no fleet/job-net label and never matches.
    - from:
        - podSelector:
            matchLabels:
              fleet/role: job
              fleet/job-net: open
      ports:
        - {protocol: TCP, port: 3128}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-out
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: ops
  policyTypes: [Egress]
  egress:
    # out to the hub's Service, the Singapore relays and the allowed hosts:
    # anywhere but the cloud metadata address
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 100.100.100.200/32
---
# A throwaway Job (#3558, C16; 共同约定 8): no public internet, the package caches
# and the CI git mirror alone — and nothing comes in. A service run's Job
# (fleet/job-kind svc) is not one of these: job-out-svc below is all it gets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-out
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: job
    matchExpressions:
      - {key: fleet/job-kind, operator: NotIn, values: [svc]}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              fleet/role: ops
      ports:
        - {protocol: TCP, port: 4873}
        - {protocol: TCP, port: 3141}
        - {protocol: TCP, port: 3000}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-runners
      ports:
        - {protocol: TCP, port: 9418}
---
# A Job of an open kind (#3552, C7): the cluster's one egress besides — the
# public internet only through it. A rule ADDS to job-out; untrusted has no
# fleet/job-net label, so job-out is all it gets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-out-open
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: job
      fleet/job-net: open
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              fleet/role: ops
      ports:
        - {protocol: TCP, port: 3128}
---
# A service run's Job (#4005, the SPACE EPIC C3): kube-dns, the run egress
# (fleet-egress-run:3128 — the hub and the open web, public addresses only) and
# the credential proxy (8788: the model, with a pass bound to the run) — no
# package cache, no git mirror, no other pod, nothing comes in. Its own egress
# guard (render.py svc_run_resources, closed) is the wall that holds on ACK.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: job-out-svc
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: job
      fleet/job-kind: svc
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              fleet/role: ops
              fleet/egress: run
      ports:
        - {protocol: TCP, port: 3128}
    - to:
        - podSelector:
            matchLabels:
              fleet/role: ops
      ports:
        - {protocol: TCP, port: 8788}
---
# The provisioner (#3558, C16): in from fleet-ops alone (fleet/role: control,
# #3734), out to the API server alone (its address is the cluster's: any, on
# 443 / 6443, never the cloud metadata address).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provisioner-in
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: provisioner
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              fleet/role: control
      ports:
        - {protocol: TCP, port: 8790}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 100.100.100.200/32
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
---
# fleet-ops (#3734; render.py --ops): nothing comes in. Out to kube-dns, the
# provisioner it hands tickets to, and on 443 / 6443 to the API server and the
# hub (both the cluster's / the internet's addresses: any, never the cloud
# metadata address).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-out
  namespace: fleet-workers
spec:
  podSelector:
    matchLabels:
      fleet/role: control
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              fleet/role: provisioner
      ports:
        - {protocol: TCP, port: 8790}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 100.100.100.200/32
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
