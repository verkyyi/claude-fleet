# Every pod in fleet-workers runs as its own account, and only two of them
# carry a token (claude-fleet#3558, EPIC #3500 C16 · 共同约定 2). The accounts
# say automountServiceAccountToken: false AND so does every pod that names
# them — a pod written later without the line still gets no token. A pod naming
# an account that is not here is never created: apply this layer before any
# user pod, door or Job (README.md).
#
#   fleet-user        a person's pod (render.py --user-pod)        no token
#   fleet-job         a throwaway Job (render.py --job)            no token
#   fleet-door        the cluster's one door (render.py --door)    no token
#   fleet-linux       the shared node until it retires (render.py) no token
#   fleet-credproxy · fleet-egress · fleet-npm · fleet-pypi · fleet-goproxy
#                     the shared services                          no token
#   fleet-ops         the central patrol (C1 / #3734): reads pods and their
#                     metrics, hands the hub's tickets on           read only
#   fleet-provisioner the one writer: by ticket, by template
#                     (../provisioner)                             write, fenced
#
# `kubectl auth can-i --list -n fleet-workers --as system:serviceaccount:fleet-workers:<name>`
# for each — the kind drill prints all of them (deploy/k8s/provisioner/kind-drill.sh).
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-user, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-job, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-door, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-linux, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-credproxy, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-egress, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-npm, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-pypi, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-goproxy, namespace: fleet-workers}
automountServiceAccountToken: false
---
# fleet-ops reads; it never writes (C1's write half moved to the provisioner).
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-ops, namespace: fleet-workers}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-ops, namespace: fleet-workers}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-ops, namespace: fleet-workers}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-ops}
subjects:
  - {kind: ServiceAccount, name: fleet-ops, namespace: fleet-workers}
