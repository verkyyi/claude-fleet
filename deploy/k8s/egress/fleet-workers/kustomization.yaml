# Example values (claude-fleet#3630): a deployment's own copy — ours is in its
# private deploy repo — replaces this directory's files at deploy time.
# Beside the user pods in fleet-workers. Applied by a person (../README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet-workers
resources:
  - ../base
images:
  # python3 is all it needs: the managed-node image, pinned by digest at apply
  - name: fleet-python
    newName: registry.example.com/acme/fleet-managed-node
patches:
  - path: deployment-env.yaml
