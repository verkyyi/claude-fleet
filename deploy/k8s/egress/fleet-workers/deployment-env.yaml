apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-egress
spec:
  template:
    spec:
      containers:
        - name: egress
          env:
            # the cluster's pod range (docs/dev/MANAGED-LINUX.md «Egress guard»)
            - name: FLEET_EGRESS_SOURCES
              value: "198.18.0.0/16"
            # a host the cluster cannot reach directly goes through a parent proxy
            # (extras/gh-relay: GitHub's git transport from a CN egress)
            - name: FLEET_EGRESS_VIA
              value: ".github.com=192.0.2.10:3128 .githubusercontent.com=192.0.2.10:3128 ghcr.io=192.0.2.10:3128"
