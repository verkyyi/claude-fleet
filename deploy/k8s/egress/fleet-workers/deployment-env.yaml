apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-egress
spec:
  template:
    spec:
      containers:
        - name: egress
          env:
            # the hub's ACK cluster's pod range (docs/MANAGED-LINUX.md «Egress guard»)
            - name: FLEET_EGRESS_SOURCES
              value: "172.20.0.0/16"
            # Claude auxiliary traffic and GitHub use the authenticated US parent.
            # No direct fallback if it becomes unavailable.
            - name: FLEET_EGRESS_VIA
              value: ".anthropic.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 .claude.ai=fleet-us-egress.fleet-workers.svc.cluster.local:3128 .claude.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 .claudeusercontent.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 .claudemcpcontent.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 http-intake.logs.us5.datadoghq.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 browser-intake-us5-datadoghq.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 storage.googleapis.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 registry.npmjs.org=fleet-us-egress.fleet-workers.svc.cluster.local:3128 formulae.brew.sh=fleet-us-egress.fleet-workers.svc.cluster.local:3128 .github.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 .githubusercontent.com=fleet-us-egress.fleet-workers.svc.cluster.local:3128 ghcr.io=fleet-us-egress.fleet-workers.svc.cluster.local:3128"
            # Fail startup if a Claude domain loses its mandatory parent route.
            - name: FLEET_EGRESS_REQUIRE_VIA
              value: ".anthropic.com .claude.ai .claude.com .claudeusercontent.com .claudemcpcontent.com http-intake.logs.us5.datadoghq.com browser-intake-us5-datadoghq.com storage.googleapis.com registry.npmjs.org formulae.brew.sh"
