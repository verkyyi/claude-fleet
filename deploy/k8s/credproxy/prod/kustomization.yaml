# Production: beside the hub in new-deploy, same ACR image. Applied by a
# person (../README.md), never by hub-deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: new-deploy
resources:
  - ../base
images:
  - name: ccquota
    newName: registry-vpc.cn-shenzhen.aliyuncs.com/24haowan/ccquota
patches:
  - path: deployment-env.yaml
  - path: ingress-hosts.yaml
