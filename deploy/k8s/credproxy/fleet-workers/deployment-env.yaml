apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccquota-credproxy
spec:
  template:
    metadata:
      labels:
        fleet/role: ops
    spec:
      # its own account, no token (#3558; ../../fleet-workers/serviceaccounts.yaml)
      serviceAccountName: fleet-credproxy
      automountServiceAccountToken: false
      containers:
        - name: credproxy
          env:
            # the hub's Service, across namespaces — never the public door
            - name: CCQUOTA_CREDPROXY_HUB_URL
              value: "http://ccquota-hub.new-deploy.svc.cluster.local"
            # the hub knows ONE credproxy token: the same value as new-deploy's
            # Secret ccquota/credproxy-token, copied into this namespace (README)
            - name: CCQUOTA_FLEET_CREDPROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fleet-credproxy
                  key: credproxy-token
            - name: CCQUOTA_CREDPROXY_RELAY_URL
              value: "https://relay.example.com"
