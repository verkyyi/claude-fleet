# The accounts render.py's pods name (../../../../fleet-workers/serviceaccounts.yaml,
# less fleet-egress and the caches', which this box does not run): none carries
# a token but fleet-ops (read) — the provisioner's own is in ../../../../provisioner.
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-user, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-job, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-door, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-linux, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-credproxy, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-ops, namespace: fleet-workers}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-ops, namespace: fleet-workers}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-ops, namespace: fleet-workers}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-ops}
subjects:
  - {kind: ServiceAccount, name: fleet-ops, namespace: fleet-workers}
