# The box's own settings. Secrets are referenced by name only (deploy/aws/README.md
# «Secrets»): the base's ccquota · ccquota-db · ccquota-ssh-ca · ccquota-fleet-cred-key
# (· ccquota-ssh-host-ca, optional), plus ccquota-site-env — every other
# CCQUOTA_* the hub needs (the GitHub sign-in pair, the session-pass key, the
# credential proxy's token), one key per variable; the account-op key that
# signs the provisioner's tickets is a file, Secret ccquota-account-key. Who
# administers it is ConfigMap ccquota-site (CCQUOTA_FLEET_ADMIN_USERS,
# CCQUOTA_GITHUB_ADMINS) — names, so not in this public tree either.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccquota-hub
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: ccquota
          envFrom:
            - configMapRef:
                name: ccquota-site
                optional: true
            - secretRef:
                name: ccquota-site-env
                optional: true
          env:
            # One hub, two audiences (task PNWW, tokenledger/hub/api/edge.go):
            # the Shenzhen ingress proxies claudefleet / ccquota.example.com and
            # *.preview.example.net here as Host core.tokenman.io with its
            # X-Forwarded-Host / -For / -Proto, which traefik passes on only from
            # the Shenzhen egress (forwardedHeaders.trustedIPs);
            # CCQUOTA_FORWARDED_HOSTS lists those hosts, CCQUOTA_PUBLIC_HOSTS
            # (host=origin) gives tokenman.io its own browser address and
            # CCQUOTA_SITE_HOSTS (host=on|sandbox) its own front page — all three
            # from ConfigMap ccquota-site. CCQUOTA_FLEET_PUBLIC_URL stays the
            # address machines dial and WeChat calls back on.
            - name: CCQUOTA_FLEET_PUBLIC_URL
              value: "https://core.tokenman.io"
            - name: CCQUOTA_PUBLIC_URL
              value: "https://core.tokenman.io"
            # the spare / own pods' tickets (docs/dev/MANAGED-LINUX.md «Spare pods»)
            - name: CCQUOTA_FLEET_ACCOUNT_KEY
              value: "/secrets/account-key/key"
          volumeMounts:
            - name: account-key
              mountPath: /secrets/account-key
              readOnly: true
      volumes:
        - name: account-key
          secret:
            secretName: ccquota-account-key
            defaultMode: 0440
