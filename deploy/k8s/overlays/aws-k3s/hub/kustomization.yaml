# The hub on the k3s box (task PNWW): ../../../base as it is — two replicas on
# Postgres (RDS, Secret ccquota-db), rolling one pod at a time, preStop, the
# PodDisruptionBudget — with the address, ECR, traefik and cert-manager.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleet-hub
resources:
  - ../../../base
  - redirect-https.yaml
  - pvc.yaml
images:
  - name: ccquota
    newName: ecr.invalid/fleet/ccquota
    newTag: set-by-deploy
patches:
  - path: deployment-env.yaml
  - path: ingress.yaml
  # traefik, not nginx: the base's nginx annotations mean nothing here (the
  # 「正在更新」 default-backend included — with two replicas there is always one up)
  - target: {kind: Ingress, name: ccquota-hub}
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: fleet-hub-redirect-https@kubernetescrd
      - op: replace
        path: /spec/ingressClassName
        value: traefik
