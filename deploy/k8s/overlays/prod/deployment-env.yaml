# Production settings. Secrets are only ever referenced by key (Secret
# `ccquota`, `smoke-creds`), never written here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccquota-hub
spec:
  template:
    spec:
      containers:
        - name: ccquota
          env:
            # The address people (and /install) use. Clients installed from the
            # old address keep it; it stays served (ingress-hosts.yaml).
            - name: CCQUOTA_FLEET_PUBLIC_URL
              value: "https://claudefleet.24haowan.com"
            - name: CCQUOTA_PUBLIC_URL
              value: "https://claudefleet.24haowan.com"
            # The public site at "/" (claude-fleet#3583): a stranger reads it,
            # someone signed in goes on to the console at /app. Unset (a
            # self-hoster's hub) "/" is the console.
            - name: CCQUOTA_SITE
              value: "on"
            - name: CCQUOTA_FLEET_ADMIN_USERS
              value: "verkyyi"
            # GitHub sign-in (#1984, wired by #2002). The client pair comes from
            # the GitHub App, written into Secret `ccquota` by hand; optional so
            # the pod still starts before they exist (both missing ⇒ sign-in off,
            # one WARN line). One without the other refuses to start.
            - name: CCQUOTA_GITHUB_ADMINS
              value: "verkyyi"
            - name: CCQUOTA_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: github-client-id
                  optional: true
            - name: CCQUOTA_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: github-client-secret
                  optional: true
            # The ways in that need no GitHub (#3604, EPIC #3570 C11): WeChat —
            # the open platform's website app (scan on a computer) and the
            # service account (inside WeChat) — and a mail through Amazon SES's
            # SMTP interface (smtp://<SES SMTP user>:<password>@email-smtp.<region>.amazonaws.com:587).
            # Every value is a key of Secret `ccquota`, put there by the
            # orchestrator; all optional — a way whose keys are missing is not
            # offered, and with none /signin stays GitHub's page byte for byte.
            # A WeChat id without its secret refuses to start; a mail URL with no
            # sender is logged and left off.
            - name: CCQUOTA_WECHAT_WEB_APPID
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: wechat-web-appid
                  optional: true
            - name: CCQUOTA_WECHAT_WEB_SECRET
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: wechat-web-secret
                  optional: true
            - name: CCQUOTA_WECHAT_MP_APPID
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: wechat-mp-appid
                  optional: true
            - name: CCQUOTA_WECHAT_MP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: wechat-mp-secret
                  optional: true
            - name: CCQUOTA_SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: smtp-url
                  optional: true
            - name: CCQUOTA_SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: smtp-from
                  optional: true
            # The cluster credential proxy's token (#1973, ../../credproxy):
            # admits `ccquota credproxy` to /v1/fleet/credproxy/resolve.
            # Optional: the key missing = that route answers 503, nothing else.
            - name: CCQUOTA_FLEET_CREDPROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: credproxy-token
                  optional: true
            # Session passes (C2, #1969 — #2092): the 32-byte signing key, its
            # own key in Secret `ccquota`. Optional: missing = the hub logs
            # "session passes are off" and those routes answer 503.
            - name: CCQUOTA_FLEET_SESSION_CRED_KEY
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: session-cred-key
                  optional: true
            # frl2 relay passes (#3561, EPIC #3500 C19): the 32-byte Ed25519
            # seed, its own key in Secret `ccquota`. Optional: missing = relay
            # credentials stay frl1 (no end), exactly as before.
            - name: CCQUOTA_FLEET_RELAY_SIGN_KEY
              valueFrom:
                secretKeyRef:
                  name: ccquota
                  key: relay-sign-key
                  optional: true
            # The Singapore relay (#1976, docs/CRED-RELAY.md).
            - name: CCQUOTA_FLEET_CRED_RELAY_URL
              value: "https://fleet-relay.24hw.cn"
            # Codex refreshes go through the relay above (#2137, EPIC #2133):
            # no admin node has to be online for a Codex token to be renewed.
            # The relay unreachable / refusing = an admin node (the base's
            # `node`), and a Claude refresh always takes the node path. Needs
            # the relay URL above and CCQUOTA_FLEET_SESSION_CRED_KEY (the hub
            # signs its relay pass with it — without it the hub refuses to
            # start). The audit row reads refresh_via=relay. Roll back: delete
            # this entry (the base's `node` comes back).
            - name: CCQUOTA_FLEET_OAUTH_REFRESH_VIA
              value: "relay"
            # The GitHub sign-in's token exchange goes through the relay above
            # (#3392): github.com times out from this cluster (api.github.com
            # does not), and a sign-in used to fail after 15 s. The hub posts
            # /github-oauth/login/oauth/access_token with its own frh1. pass;
            # relay down = github.com directly once (5 s + 8 s). Needs the relay
            # URL above, CCQUOTA_FLEET_SESSION_CRED_KEY and a relay carrying the
            # /github-oauth/ route (extras/cred-relay/Caddyfile). Log line:
            # "github sign-in: token exchanged through the relay …". Roll back:
            # delete this entry.
            - name: CCQUOTA_GITHUB_OAUTH_VIA
              value: "relay"
            # The hub reads every pool subscription's quota itself through the
            # relay above (#2169 code, switched on by #2182): readings no longer
            # depend on a node being online. Needs the relay URL above and
            # CCQUOTA_FLEET_SESSION_CRED_KEY (the hub signs its quota pass with
            # it — without it the hub refuses to start). Interval stays the
            # default 5m: the hub runs one replica, so the probe cost is paid
            # once. Roll back: delete this entry.
            - name: CCQUOTA_FLEET_HUB_QUOTA
              value: "relay"
            # Placement's load ceiling (#2882): macmini's load1 sits at 17-24 on
            # 15 cores from ~200 small fleet processes while 3-4 cores work, so
            # 0.8/core refused every new session there. 1.6 was set by hand
            # (`kubectl set env`) and lives here so an apply keeps it. It gates
            # only a machine whose agent does not report cpu_busy yet; one that
            # does is judged on CPU busy (CCQUOTA_FLEET_MAX_CPU_BUSY, default
            # 0.8, or the machine's own FLEET_MAX_CPU_BUSY). Roll back: delete
            # this entry once every node runs an agent that reports cpu_busy.
            - name: CCQUOTA_FLEET_MAX_LOAD_PER_CORE
              value: "1.6"
            - name: CCQUOTA_FLEET_ROUTES
              value: |-
                [{"hostname":"macmini","alias":"m5"},{"hostname":"mini2","alias":"m4"}]
            # Address records (claude-fleet#3073, EPIC #3067 C7): every
            # person's <name>.cf.24haowan.com, written by the hub only. The
            # token is ACME DNS-01's own (new-deploy/acme-dnspod), read here,
            # never copied — it covers the whole DNSPod account, so rotating
            # it means ACME too. No Secret ⇒ the pod starts and the loop makes
            # no call at all.
            - name: CCQUOTA_DNS_DP_ID
              valueFrom:
                secretKeyRef:
                  name: acme-dnspod
                  key: DP_Id
                  optional: true
            - name: CCQUOTA_DNS_DP_KEY
              valueFrom:
                secretKeyRef:
                  name: acme-dnspod
                  key: DP_Key
                  optional: true
            - name: CCQUOTA_DNS_DOMAIN
              value: "24haowan.com"
            - name: CCQUOTA_DNS_SUBDOMAIN
              value: "cf"
            # DNSPod's User-Agent contact (claude-fleet#3577: no longer in code).
            - name: CCQUOTA_DNS_CONTACT
              value: "fleet@24haowan.com"  # oss-ok: 生产覆盖层的值（原写死在代码里），随 #3630 搬进私有部署仓库
            # The brand site that reads /meter.json from the browser
            # (claude-fleet#3577: no longer in code; unset = no site).
            - name: CCQUOTA_METER_ORIGINS
              value: "https://www.24haowan.com https://24haowan.com"  # oss-ok: 生产覆盖层的值（原写死在代码里），随 #3630 搬进私有部署仓库
