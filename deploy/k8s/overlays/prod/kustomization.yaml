# Production: namespace new-deploy on the Aliyun ACK cluster, image from ACR
# (the cluster pulls over the VPC endpoint; hub-deploy pushes over the public
# one — same repository). The image tag stays the placeholder: hub-deploy pins
# `prod-<sha7>` at deploy time (../../README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: new-deploy
resources:
  - ../../base
# release-volume.yaml (the OSS PV + its claim) is NOT a resource: the deploy
# Role may not create a PersistentVolume or a claim, so a person applies it
# once with an admin kubeconfig before the patch below goes out (RUNBOOK.md
# «发布包»).
# The two-replica rolling shape on managed Postgres (mode=postgres): the
# `components: [sqlite]` lines went with the switch (../../RUNBOOK.md «换库»);
# a rollback reverts this commit.
images:
  - name: ccquota
    newName: registry-vpc.cn-shenzhen.aliyuncs.com/24haowan/ccquota
  - name: busybox
    newName: registry-vpc.cn-shenzhen.aliyuncs.com/24haowan/busybox
patches:
  - path: deployment-env.yaml
  - path: ingress-hosts.yaml
  - path: deployment-release.yaml
