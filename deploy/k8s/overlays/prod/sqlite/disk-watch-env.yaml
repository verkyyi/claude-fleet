# Where the data disk's watermark alerts go (kf-notify); the keys only, from
# Secret `smoke-creds`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccquota-hub
spec:
  template:
    spec:
      containers:
        - name: disk-watch
          env:
            - name: NOTIFY_URL
              valueFrom:
                secretKeyRef:
                  name: smoke-creds
                  key: NOTIFY_URL
            - name: NOTIFY_KEY
              valueFrom:
                secretKeyRef:
                  name: smoke-creds
                  key: NOTIFY_KEY
            - name: NOTIFY_DEST
              value: "alerts.prod"
