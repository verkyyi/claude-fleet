# The accounts this region's pods name (../../fleet-workers/serviceaccounts.yaml,
# less the egress', the caches', the door's and the shared node's, which this
# region does not run). None carries a token but fleet-ops (read) — the
# provisioner's own is in ../../provisioner. fleet-workers already holds these
# names from the old ACK hub's layer, same specs: applying them again changes
# nothing, and fleet-door / fleet-linux and the rest are left alone (README.md).
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-user, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-job, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-credproxy, namespace: fleet-workers}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fleet-ops, namespace: fleet-workers}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: fleet-ops, namespace: fleet-workers}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: fleet-ops, namespace: fleet-workers}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: fleet-ops}
subjects:
  - {kind: ServiceAccount, name: fleet-ops, namespace: fleet-workers}
