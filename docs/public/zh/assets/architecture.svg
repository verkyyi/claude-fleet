<text x="334" y="739" class="muted">备份</text>
<path class="connector" d="M320 844v-48m-5 5 5-5 5 5"/>
<text x="342" y="826" class="small muted">节点主动向外连接</text>
<rect class="card" x="32" y="856" width="576" height="226" rx="16"/>
<rect class="chip" x="52" y="871" width="34" height="34" rx="10"/>
