<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1510" viewBox="0 0 640 1510" role="img" aria-labelledby="title desc" lang="en">
<title id="title">The native agent runtime</title>
<desc id="desc">Four conceptual layers. Clients connect to the hub, the runtime control plane. Application services and central data share the hub boundary. Nodes keep native agent sessions running and connect outward to the hub. Model requests go from a node through the credential proxy to a model provider. Model keys stay at the hub, never in sessions.</desc>
<style>/*{{fleet_theme}}*/
/* Theme is embedded by docs-build; system colors keep the source SVG readable. */
:root{color-scheme:light dark}
text{font-family:var(--fleet-font-ui,system-ui,sans-serif);fill:var(--foreground,CanvasText);font-size:22px}
.title{font-family:var(--fleet-font-display,system-ui,sans-serif);font-size:34px;font-weight:700}
.eyebrow{font-size:19px;letter-spacing:1.5px;font-weight:600;fill:var(--link,CanvasText)}
.heading{font-size:26px;font-weight:600}
.muted{fill:var(--muted-foreground,CanvasText)}
.small{font-size:20px}
.number{font-size:19px;font-weight:600;fill:var(--link,CanvasText);text-anchor:middle}
.canvas{fill:var(--background,Canvas)}
.card{fill:var(--card,Canvas);stroke:var(--border,CanvasText);stroke-width:1.5}
.hub-boundary{fill:color-mix(in srgb,var(--fleet-blue,CanvasText) 5%,var(--background,Canvas));stroke:var(--fleet-blue,CanvasText);stroke-opacity:.55;stroke-width:1.5;stroke-dasharray:5 6}
.chip{fill:var(--background,Canvas);stroke:var(--border,CanvasText)}
.accent{fill:var(--link,CanvasText)}
.hub-accent{fill:var(--fleet-blue,CanvasText)}
.data-accent{fill:var(--fleet-sand,CanvasText)}
.node-accent{fill:var(--fleet-ok,CanvasText)}
.native{fill:color-mix(in srgb,var(--fleet-ok,CanvasText) 10%,var(--card,Canvas));stroke:color-mix(in srgb,var(--fleet-ok,CanvasText) 45%,var(--border,CanvasText))}
.proxy{fill:var(--accent,Canvas);stroke:var(--link,CanvasText);stroke-width:1.5}
.connector{fill:none;stroke:var(--muted-foreground,CanvasText);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rule{stroke:var(--border,CanvasText);stroke-width:1}
@media print{:root{color-scheme:light;--background:var(--fleet-ink);--card:var(--fleet-ink);--foreground:var(--fleet-bg);--muted-foreground:var(--fleet-bg);--border:var(--fleet-muted);--link:var(--fleet-clay-deep);--accent:var(--fleet-ink)}}</style>
