<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet · Task 列表设计</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24332e;background:#f4f5f2;font-size:14px;--line:#dce2dc;--muted:#64716a;--accent:#235e49}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:7px;background:white;color:inherit}button:hover{background:#edf2ec}button:focus-visible,input:focus-visible{outline:3px solid #7a9eeb;outline-offset:2px}button[aria-pressed=true],.primary{background:var(--accent);color:white;border-color:var(--accent)}.review{padding:12px 4vw;background:#e5ebe0;color:#41513c;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.review strong{font-size:13px}.review small{flex:1}.switch{display:flex;gap:6px}.switch button{min-height:44px;font-size:12px}.shell{max-width:1440px;margin:auto;padding:32px 4vw}.brand{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent)}header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 24px}h1{font-size:30px;font-weight:600;margin:6px 0}h2{font-size:19px;line-height:1.5}p{line-height:1.7}header p{margin:4px 0;color:var(--muted)}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:22px}input{min-height:44px;width:285px;max-width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#fff}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{border-color:transparent;background:transparent}.filters button[aria-pressed=true]{background:#e0e9df;color:#214e38}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}.list{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.list-head,.task{display:grid;grid-template-columns:minmax(180px,1.6fr) minmax(110px,.85fr) minmax(130px,1fr) 94px;gap:14px;align-items:center;padding:16px 18px}.list-head{font-size:12px;background:#f9faf7;color:var(--muted);padding-top:11px;padding-bottom:11px}.task{border-top:1px solid var(--line);min-height:102px}.task.selected{background:#f0f5ee;box-shadow:inset 3px 0 var(--accent)}.task h2{font-size:14px;font-weight:600;margin:0 0 6px}.meta{font-size:11px;color:var(--muted);line-height:1.7}.code{font-family:ui-monospace,monospace;margin-right:7px}.state{font-size:13px;line-height:1.6}.running{color:#236b55}.unknown{color:#896417}.attention{font-size:12px;color:#8c5a0c;margin-top:5px}.future{font-size:12px;line-height:1.7}.future small{display:block;color:var(--muted)}.row-actions{display:flex;gap:5px}.row-actions button{padding:6px 9px;font-size:12px}.stop{color:#8b4039}.detail{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;position:sticky;top:18px}.detail h2{margin:10px 0}.detail h3{font-size:12px;margin:24px 0 8px;color:var(--muted)}.detail p{font-size:13px;margin:8px 0}.detail .buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.detail .native{font-family:ui-monospace,monospace;font-size:11px;word-break:break-word}.notice{border-left:3px solid #c29245;padding:8px 10px;background:#fff7e7;font-size:12px;line-height:1.6;margin:14px 0}.detail .back{display:none}.quiet{color:var(--muted)}.legend{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.8}.feedback{min-height:30px;margin-top:16px;color:#355d47;font-size:13px}.empty{padding:45px 22px;text-align:center;color:var(--muted)}.mobile-label{display:none}.terminal-note{display:none}.terminal{background:#151e1b;color:#e0e6de;--line:#36423b;--muted:#abb8ae;--accent:#a6cc96}.terminal .shell{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}.terminal .review{background:#26342b;color:#dae4d4}.terminal .review button{background:#28362c;color:#dce8d5}.terminal .review button[aria-pressed=true]{background:#b8d3a4;color:#18231b}.terminal input,.terminal button,.terminal .list,.terminal .detail{background:#18231d;color:#e0e6de;border-radius:0}.terminal .filters button[aria-pressed=true]{background:#405138;color:#f0f4ec}.terminal .workspace{grid-template-columns:1fr}.terminal .detail{display:none;position:static;max-width:none}.terminal .workspace.detail-open .list{display:none}.terminal .workspace.detail-open .detail{display:block}.terminal .detail .back{display:inline-block}.terminal .list-head{background:#202c23}.terminal .task.selected{background:#324330}.terminal .task{min-height:85px}.terminal .row-actions{display:none}.terminal .list-head,.terminal .task{grid-template-columns:minmax(200px,1.5fr) 170px minmax(190px,1fr)}.terminal .list-head span:last-child{display:none}.terminal .running{color:#b3d2a5}.terminal .attention,.terminal .unknown{color:#edca83}.terminal .notice{background:#363023;color:#f0d6a6}.terminal .terminal-note{display:block;color:#b7c7ad;font-size:12px;line-height:1.8}.terminal .legend{display:none}.terminal h1{font-size:24px}.terminal .task h2{font-weight:500}.terminal .task{cursor:pointer}.terminal button.stop{color:#edb6a2}.terminal .primary{background:#324b31;color:#e8f4df}.terminal .feedback{color:#bdd7b2}
@media(max-width:1150px) and (min-width:761px){.workspace{grid-template-columns:1fr}.detail{position:static}.list-head,.task{grid-template-columns:minmax(160px,1.5fr) 130px minmax(130px,1fr) 94px}}
@media(max-width:760px){.review{padding:12px 18px;gap:8px}.review small{flex-basis:100%;order:3}.shell{padding:22px 18px}h1{font-size:26px}header{margin-bottom:20px}header p{font-size:12px;max-width:220px}.toolbar{gap:12px}input{width:100%}.filters{gap:4px}.filters button{padding:6px 10px;font-size:12px}.workspace{display:block}.list{background:transparent;border:none;overflow:visible}.list-head{display:none}.task{display:grid;grid-template-columns:1fr auto;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;padding:16px}.task .identity{grid-column:1/-1}.task h2{font-size:15px}.task .future{grid-column:1/-1}.task .row-actions{grid-column:1/-1;justify-content:flex-end}.task .state{grid-column:1/-1}.mobile-label{display:inline;color:var(--muted)}.detail{display:none;position:static}.workspace.detail-open .list{display:none}.workspace.detail-open .detail{display:block}.detail .back{display:inline-block}.terminal .task{grid-template-columns:1fr;gap:7px;border-radius:0}.terminal .task .identity,.terminal .task .state,.terminal .task .future{grid-column:1}.terminal .list{background:none}.terminal .task .meta{display:none}.terminal .workspace{display:block}.terminal .row-actions{display:flex}.terminal .list-head{display:none}}
</style>
</head>
<body>
<div class="review"><strong>设计预览 · Task 列表</strong><small>示例数据；操作仅在本页模拟，不影响真实任务。</small><div class="switch" aria-label="预览界面"><button data-mode="web" aria-pressed="true">Web</button><button data-mode="terminal" aria-pressed="false">Terminal</button><button id="reset">重置示例</button></div></div>
<main class="shell"><div class="brand">FLEET / WORKSPACE</div><header><div><h1>任务</h1><p>工作留在这里，随时打开或停止。</p></div><button id="create" class="primary">＋ 新建任务</button></header>
<div class="toolbar"><input id="search" aria-label="搜索任务" placeholder="搜索名称、编号或环境"><div class="filters" aria-label="筛选任务"></div></div>
<div class="workspace"><section class="list" aria-label="任务列表"></section><aside class="detail" aria-label="任务详情"></aside></div>
<div class="terminal-note">↑↓ 选择 · Enter 打开 · Tab 前往控件 · Esc 返回<br>浏览器演示：点击任务打开动作页；真实终端用 Tab 打开动作页，入口沿用 ⌘P / F12。</div>
<div class="legend">● 运行中　○ 非运行中　! 需要你　? 运行情况未知 · 打开不会启动任务</div>
<div class="feedback" role="status" aria-live="polite"></div></main>
<script>
'use strict';
const seed=[
{id:'NV03',title:'简化 Hub 任务',agent:'Codex',env:'macmini / claude-fleet',state:'run',native:'active',future:'无自动运行',schedule:false,note:'正在检查任务状态的读取路径。',artifact:'方案草稿 · 2 分钟前',history:'当前 Codex · 14:02；上次 Claude · 昨日 16:40'},
{id:'K8D2',title:'发布接口变更',agent:'Claude',env:'cloud-1 / api',state:'run',native:'PermissionRequest',attention:'需要你 · 批准部署命令',future:'无自动运行',schedule:false,note:'原生会话正在等待部署命令的权限确认。',artifact:'接口契约 v2 草稿',history:'当前 Claude · 13:50'},
{id:'A7P4',title:'检查服务可用性',agent:'Codex',env:'cloud-2 / ops',state:'idle',native:'idle',future:'14:30 · 每 30 分钟',schedule:true,note:'上次检查已记录。之后将按计划再次运行。',artifact:'检测记录 · 14:00',history:'最近 Codex · 14:00'},
{id:'M2R9',title:'编写 API v2 界面',agent:'Claude',env:'cloud-1 / web',state:'idle',native:'idle',future:'等 K8D2 的契约 v2',schedule:true,dependency:true,note:'契约 v2 发布后启动；上游空闲或停止不会触发。',artifact:'暂无产物',history:'最近 Claude · 13:42'},
{id:'J6W1',title:'调整登录页文案',agent:'Codex',env:'macmini / website',state:'idle',native:'idle',future:'无自动运行',schedule:false,note:'文案已更新。可以打开历史或继续提出修改。',artifact:'PR #128 已合并 · 12:48',history:'最近 Codex · 12:42；上次 Claude · 11:30'},
{id:'Q4N8',title:'分析日志中的超时',agent:'Claude',env:'cloud-3 / logs',state:'unknown',native:'最后观测：工具执行中',future:'无法确认原生计划',schedule:false,note:'节点失联；最后收到观测为 14:06，不能确认是否仍在运行。',artifact:'超时样本 · 14:05',history:'最后观测 Claude · 14:06'}
];
const names={all:'全部',run:'运行中',idle:'非运行中',attention:'需要你',auto:'有自动运行'};
let tasks=structuredClone(seed),selected='NV03',filter='all',mode='web',pending=new Set(),timers=[];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matches(t,f){return f==='all'||f===t.state||(f==='attention'&&!!t.attention)||(f==='auto'&&t.schedule)}
function visible(){const q=$('#search').value.toLowerCase();return tasks.filter(t=>matches(t,filter)&&[t.title,t.id,t.env,t.agent].join(' ').toLowerCase().includes(q))}
function state(t){return t.state==='run'?'● 运行中':t.state==='idle'?'○ 非运行中':'? 运行情况未知'}
function say(s){$('.feedback').textContent=s}
function detail(){const t=tasks.find(t=>t.id===selected);if(!t)return;$('.detail').innerHTML=`<button class="back" data-action="back">← 返回列表</button><div class="meta">${esc(t.id)} · TASK</div><h2>${esc(t.title)}</h2><div class="state ${t.state==='run'?'running':t.state}">${state(t)}</div>${t.attention?`<div class="notice">${esc(t.attention)}<br>请打开原生会话处理权限请求。</div>`:''}${t.receipt?`<div class="notice">${esc(t.receipt)}</div>`:''}<p>之后：${esc(t.future)}</p><div class="buttons"><button data-action="native">打开原生会话</button><button class="stop" data-action="stop" data-id="${t.id}">${pending.has(t.id)?'再次发送停止':'停止任务'}</button><button data-action="continue" data-id="${t.id}">继续工作</button></div><p class="quiet">停止当前执行并关闭自动唤醒，文件保留。</p><h3>当前会话</h3><p>${esc(t.agent)} · ${esc(t.env)}</p><p class="native">${esc(t.native)} · 示例观测 14:08${t.state==='unknown'?'（最后可信观测 14:06）':''}</p><h3>最近活动</h3><p>${esc(t.note)}</p><h3>产物</h3><p>${esc(t.artifact)}</p><h3>自动运行与依赖</h3><p>${esc(t.future)}${t.dependency?' · 指定产物发布才会触发；可查看上游任务。':''}</p>${t.dependency?'<button data-action="open" data-id="K8D2">查看 K8D2</button>':''}<p class="quiet">普通消息仅收取，不自动唤醒。</p><h3>会话历史</h3><p>${esc(t.history)}</p>`}
function render(){const list=visible();$('header p').textContent='共 '+tasks.length+' 个任务 · '+tasks.filter(t=>t.state==='unknown').length+' 个运行情况未知';const focused=document.activeElement;const focusAction=focused?.dataset.action;const focusId=focused?.dataset.id;$('.filters').innerHTML=Object.entries(names).map(([f,n])=>`<button data-filter="${f}" aria-pressed="${filter===f}">${n} <span>${tasks.filter(t=>matches(t,f)).length}</span></button>`).join('');$('.list').innerHTML='<div class="list-head"><span>任务</span><span>当前</span><span>之后</span><span>操作</span></div>'+list.map(t=>`<article class="task ${t.id===selected?'selected':''}" data-row="${t.id}" aria-label="${esc(t.id+' '+t.title)}"><div class="identity"><h2>${esc(t.title)}</h2><div class="meta"><span class="code">${t.id}</span>${esc(t.agent)} · ${esc(t.env)}</div></div><div class="state ${t.state==='run'?'running':t.state}">${state(t)}${t.attention?`<div class="attention">! ${esc(t.attention.replace('需要你 · ',''))}</div>`:''}</div><div class="future"><span class="mobile-label">之后：</span>${esc(t.future)}${t.receipt?`<small>${esc(t.receipt)}</small>`:''}</div><div class="row-actions"><button data-action="open" data-id="${t.id}">打开</button><button class="stop" data-action="stop" data-id="${t.id}">停止</button></div></article>`).join('')+(list.length?'':'<div class="empty">无匹配任务，试试清除搜索或切换筛选。</div>');detail();if(focusAction){const next=[...document.querySelectorAll('[data-action]')].find(b=>b.dataset.action===focusAction&&b.dataset.id===focusId&&b.offsetParent!==null);next?.focus({preventScroll:true})}}
function openTask(id){selected=id;render();$('.workspace').classList.add('detail-open');if(mode==='terminal'||innerWidth<=760)$('.detail .back').focus()}
function stop(id){const t=tasks.find(t=>t.id===id);if(pending.has(id)){say(`${id} 停止请求已在处理，重复请求已合并。`);return}pending.add(id);t.receipt='停止请求发送中…';render();say(`${id} 正在提交停止请求。`);timers.push(setTimeout(()=>{t.schedule=false;t.future='无自动运行';if(t.state==='unknown'){t.future='已关闭 Hub 自动唤醒';t.receipt='远端停止待确认；原生计划未知';t.note='Hub 已接受停止。节点重连将先执行停止；当前不能确认远端计算已停止。'}else{t.state='idle';t.native='idle / 模拟停止回执';delete t.attention;t.receipt='已停止，自动运行已关闭';t.note='用户停止了任务。文件和会话历史保留。'}pending.delete(id);render();say(`${id} ${t.receipt}。`)},650))}
function resume(id){const t=tasks.find(t=>t.id===id);if(pending.has(id)){say('停止请求仍在处理，请等待回执。');return}if(t.state==='unknown'){say('远端运行情况未知；必须先确认旧执行已停止，不能启动第二个会话。');return}if(t.state==='run'){openTask(id);say('当前会话仍在运行，请在原生会话中继续。');return}if(t.dependency){say('契约 v2 尚未发布。此原型不绕过依赖；正式界面提供明确的条件修改与单次手动运行入口。');return}t.state='run';t.native='active';t.receipt='已开始本次工作';t.note='继续一次工作；已停止的计划不会自动恢复。';render();say(`${id} 已开始一次工作。`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){const r=e.target.closest('[data-row]');if(r)openTask(r.dataset.row);return}if(b.dataset.mode){mode=b.dataset.mode;document.body.classList.toggle('terminal',mode==='terminal');document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===mode));$('.workspace').classList.remove('detail-open');return}if(b.dataset.filter){filter=b.dataset.filter;$('.workspace').classList.remove('detail-open');render();$(`[data-filter="${filter}"]`).focus();return}const id=b.dataset.id||selected;switch(b.dataset.action){case'open':openTask(id);break;case'back':$('.workspace').classList.remove('detail-open');$('#search').focus();break;case'stop':stop(id);break;case'continue':resume(id);break;case'native':say('原型入口：正式产品连接该 Task 的原生会话，审批仍在原生界面处理。');break}});
$('#search').addEventListener('input',render);
$('#reset').onclick=()=>{timers.forEach(clearTimeout);timers=[];pending.clear();tasks=structuredClone(seed);selected='NV03';filter='all';$('#search').value='';$('.workspace').classList.remove('detail-open');render();say('示例已重置。')};
$('#create').onclick=()=>{const id='NEW'+(tasks.length-5);tasks.unshift({id,title:'新任务示例',agent:'Codex',env:'默认环境',state:'idle',native:'尚无原生会话',future:'无自动运行',schedule:false,note:'正式表单填写描述、Agent 与环境，再明确选择开始或仅保存。',artifact:'暂无产物',history:'暂无会话'});filter='all';$('#search').value='';openTask(id);say('已创建仅保存的示例，没有启动执行。')};
document.addEventListener('keydown',e=>{if(mode!=='terminal'||e.target.matches('input,textarea')||e.ctrlKey||e.metaKey||e.altKey)return;const list=visible(),i=list.findIndex(t=>t.id===selected);if(['ArrowDown','ArrowUp'].includes(e.key)&&list.length){e.preventDefault();selected=list[(Math.max(i,0)+(e.key==='ArrowDown'?1:-1)+list.length)%list.length].id;render();$(`[data-row="${selected}"]`)?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();openTask(selected)}else if(e.key==='Escape'){$('.workspace').classList.remove('detail-open');$('#search').focus()}});
render();
</script>
</body></html>
