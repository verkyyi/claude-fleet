# What the hub needs from the cluster to run SPOT nodes (issue #1428): the
# right to create, read, list and delete pods in its own namespace — nothing
# else, nowhere else. Apply next to the hub's Deployment (the operator's infra
# repo holds that; this is the RBAC it adds). The ServiceAccount name must be
# the one the hub pod runs as (spec.serviceAccountName).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ccquota-hub
  namespace: new-deploy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ccquota-hub-spot
  namespace: new-deploy
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ccquota-hub-spot
  namespace: new-deploy
subjects:
  - kind: ServiceAccount
    name: ccquota-hub
    namespace: new-deploy
roleRef:
  kind: Role
  name: ccquota-hub-spot
  apiGroup: rbac.authorization.k8s.io
