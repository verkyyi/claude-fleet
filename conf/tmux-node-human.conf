# tmux-node-human.conf — fleet-human: what a PERSON can reach on a node's fleet
# server (issue #1840, EPIC #1851 C1). Loaded twice, both idempotent: at the end of
# conf/tmux-attention.conf (so a live reload carries it), and LAST in
# conf/tmux-fleet-server.conf — after the person's own ~/.tmux.conf, so a personal
# bind cannot put a delete back on this server.
#
# A node's windows are execution sessions. A client reaches them through a view
# session (prefix None, fleet-remote-view.sh) — but the node runs `mouse on` and
# the client's stage hands a right-click into the inner tmux, where tmux's stock
# menus carry Kill and Respawn. A direct attach, or the view's fallback that
# shares the fleet session itself, has the prefix too: x kills the pane, & the
# window, $ renames the session (which IS the fleet's socket name), < and > open
# the same menus. So, on this server:
#   - right-click on a pane (and Alt+right-click) opens a READ-ONLY menu: copy this
#     screen · which machine it is on · send it a message · open its issue —
#     unless the program in the pane asked for the mouse, which keeps it (stock);
#   - right-click on the status line does nothing (one static hint line here);
#   - prefix x & $ < > are unbound.
# No key here deletes or respawns anything; fleet-keys-selftest.sh leg 8 and the
# break-it drills `node-menu` / `node-prefix-keys` hold it. `:kill-window` typed at
# the command prompt is left to the pull-back (fleet-restore.sh --auto, drill
# `window-killed`): the session comes back on the next tick, same conversation.
unbind -T prefix x
unbind -T prefix &
unbind -T prefix '$'
unbind -T prefix <
unbind -T prefix >
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n MouseDown3StatusRight
unbind -n M-MouseDown3Status
unbind -n M-MouseDown3StatusLeft
unbind -n M-MouseDown3StatusRight
bind -n MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -T "#[align=centre]#{window_name}" -t = -x M -y M "复制这一屏" c { run-shell -b "bash ~/.claude/fleet/bin/fleet-human-menu.sh copy '#{pane_id}'" } "它在哪台：#{host_short}" w { display-message "#{window_name} 在 #{host_short}（fleet #{?#{session_group},#{session_group},#{session_name}}）" } "给它发消息…" m { command-prompt -p "发给 #{window_name}：" { set-option -w -t "#{window_id}" @fleet_human_msg "%%%" ; run-shell -b "bash ~/.claude/fleet/bin/fleet-human-menu.sh send '#{window_id}'" } } "#{?@issue,看它的单 ###{@issue},-看它的单（没有绑定）}" i { run-shell -b "bash ~/.claude/fleet/bin/fleet-human-menu.sh issue '#{window_id}'" } }
bind -n M-MouseDown3Pane display-menu -T "#[align=centre]#{window_name}" -t = -x M -y M "复制这一屏" c { run-shell -b "bash ~/.claude/fleet/bin/fleet-human-menu.sh copy '#{pane_id}'" } "它在哪台：#{host_short}" w { display-message "#{window_name} 在 #{host_short}（fleet #{?#{session_group},#{session_group},#{session_name}}）" } "给它发消息…" m { command-prompt -p "发给 #{window_name}：" { set-option -w -t "#{window_id}" @fleet_human_msg "%%%" ; run-shell -b "bash ~/.claude/fleet/bin/fleet-human-menu.sh send '#{window_id}'" } } "#{?@issue,看它的单 ###{@issue},-看它的单（没有绑定）}" i { run-shell -b "bash ~/.claude/fleet/bin/fleet-human-menu.sh issue '#{window_id}'" }
set -g @fleet_human "v1"
