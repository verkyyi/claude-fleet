# conf/tmux-bar.conf — a NODE's status line: one hint, nothing a person reads
# (issue #1714, EPIC #1710 C4; the full bar was issues #1534 / #1616).
#
# Sourced by conf/tmux-attention.conf right AFTER conf/fleet-palette.conf: every
# colour below is a `$PAL_*` name from that one table, which tmux expands while it
# parses THIS file — so this file cannot be read before the palette is (the reason
# it is a file of its own). Never write a hex here.
#
# The bar a person reads is the CLIENT's (conf/tmux-shell.conf → bin/tmux-status.sh:
# the machine, its account's quota, 入口). A client looks at this server through a
# view session with its status line OFF (fleet-remote-view.sh), so nothing below
# is ever on its screen. What is left is for someone who attached to the node
# session directly — not stopped, not advertised (EPIC #1710 decision 2): ONE line
# at the TOP saying to use `fleet`, and whose node this is. No #() job, no click
# range, nothing re-rendered: the line is static, so the tick is slow.
set -g status on
set -g status-position top
set -g status-interval 60
set -g status-justify left
set -g status-style "bg=$PAL_BG,fg=$PAL_FG"
set -g status-left-length 120
# LOGIN NAME — whose fleet this is (issue #1099): the server-level @login that
# fleet-up.sh / tmux-conf-reload.sh stamp with `id -un`; tmux's #{user} (3.3+) is
# the fallback for a server nobody stamped.
set -g status-left "#[fg=$PAL_YELLOW,bold] 请用 fleet 客户端 · run `fleet` #[default]#[fg=$PAL_DIM]· #{?@login,#{@login},#{user}} 的节点会话，只跑执行会话 #[default]"
set -g status-right ""
set -g status-right-length 0
set -g message-style "bg=$PAL_BG,fg=$PAL_BLUE"
set -g message-command-style "bg=$PAL_BG,fg=$PAL_BLUE"
