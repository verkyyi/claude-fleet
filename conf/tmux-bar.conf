# conf/tmux-bar.conf — the fleet's status bar (issue #1534, EPIC #1529 E5).
#
# Sourced by conf/tmux-attention.conf right AFTER conf/fleet-palette.conf: every
# colour below is a `$PAL_*` name from that one table, which tmux expands while it
# parses THIS file — so this file cannot be read before the palette is (the reason
# it is a file of its own). Never write a hex here.
#
# ONE LAYOUT, both modes (the EPIC's 改后 mockup is the contract):
#   left   ⌂ · login · ● N 待处理                         (this file)
#   right  hub mode    <machine> ● · 负载 · 内存 │ <account> 5h · 周 │ ● 入口
#          local mode  本机 · 负载 · 内存 · 盘 │ <account> 5h · 周
#          then the alert counts (bin/tmux-status.sh, bin/fleet-alerts.sh).
# `·` joins the fields of one chip, `│` separates chips. Narrower than 120
# columns the bar drops 内存 first, then 负载 (bin/tmux-status.sh, off `cw=`).
# status-interval 2 (was 5): the right side only reads caches already on this
# machine — never the network — so the faster tick costs a read, not a fetch.
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=$PAL_BG,fg=$PAL_FG"
# status-left-length: bumped 64→72 for the wider (iPad-friendly) tap-target
# padding added inside each status-left chip range (issue #347). The +8 cells of
# chip padding (two spaces flanking each of ⌂, the login name and ● instead of
# one) would otherwise truncate a long login name 8 cells sooner; +8 here keeps
# the headroom.
set -g status-left-length 72
# HUB ICON (#141, #166, #368): an always-on "⌂" as the LEFTMOST element, in every
# window — now NAV-ONLY (issue #368 folded the needy-hub signal into the "● N"
# badge, so the ⌂ no longer turns red). Its BACKGROUND encodes only WHERE you are,
# in two styles:
#   blue block (bg=$PAL_BLUE) when the ACTIVE window IS the hub — "you're here".
#   raised     (bg=$PAL_SEL)  otherwise — a clickable "go to hub" button.
# (status-left formats in the active window's context, so #W = current window
# name; #W==plan ⇒ hub post-#135.) A needy hub now surfaces in the "● N"
# badge itself — the plan window counts as a normal session in @attn_needs (#368) —
# instead of recoloring the ⌂. It stays wrapped in a clickable range=user|hub —
# clicking it runs `hub-zoom.sh --home` (issue #405): a CONSISTENT home tap
# that always lands on the half-dash / half-hub split, even when you're already
# on the hub (F9 without --home still jump-and-toggles the zoom — see the
# MouseDown1Status and F9 binds below).
# LOGIN NAME — whose fleet this is (issue #1099), NOT the fleet name (#S): one
# fleet per login, so the session name said nothing the login doesn't, and a
# second login on the same machine sees its own. Read from the server-level
# @login that fleet-up.sh / tmux-conf-reload.sh stamp with `id -un` — a plain
# option lookup, no `#(id -un)` fork per status-interval (#888). tmux's #{user}
# is the fallback for a server nobody stamped; it only exists from tmux 3.3, the
# install floor is 3.2, hence the stamp. Not a tap target (issue #1034: the repo
# picker the #S chip used to open is gone). · Then the LOCAL
# NEEDS BADGE: `· ● N 待处理` (issue #1534 spelled out what N counts) showing
# how many windows in THIS fleet are in the 'needs' state (@attn_needs, a session
# option set by bin/tmux-spinner.sh — now counts the plan/hub window too, #368),
# hidden at 0 and with NO per-redraw shell fork (the count is precomputed by the
# spinner). It carries a render-time ACTIVE-WINDOW DISCOUNT (#368, supersedes #363):
# status-left renders in the active window's context, so when the window you're ON
# is itself needy (#{@claude_state}==needs, and not an excluded dash/backlog panel)
# it drops off the count — you don't need to be pulled to a window you're already
# on — and the whole chip hides once the discounted count reaches 0. It's wrapped in
# a clickable range (range=user|attn) — clicking it cycles to the next needs window
# via next-attention.sh --needs-cycle (see the MouseDown1Status bind below; clicking
# needs `set -g mouse on`). prefix+a stays the keyboard path.
# · No cross-fleet dot (issue #980): one fleet per login (EPIC #977) holds every
# repo, so there is no OTHER fleet to wait on — the orange "● N" and its one-tap
# jump (#236/#368) are retired. The ● above is the one needs signal — BLUE since
# issue #1238, which gave the bar three levels with one colour each: ✖ red alarm
# and ▲ yellow warning are the fixed-width counts on status-right
# (bin/fleet-alerts.sh), ● blue is a session waiting on you.
#
# TAP-TARGET PADDING (issue #347): the two tap targets carry EXTRA inner padding —
# two spaces flanking ⌂, two after `● N 待处理` (and the `· ` before it rides in
# the same range) — so the clickable range itself is WIDER and easier to hit on
# iPad/Termius touch. The login name is no target (#1034) and is spaced as text:
# `  ⌂   login · ● 1 待处理`, the mockup's spacing (issue #1534). The padding sits INSIDE each #[range=user|…] … #[norange] pair
# (a space placed OUTSIDE a range isn't tappable), so it grows the tap zone, not just
# the visual gap; on the ⌂ hub and ● attn chips it also widens their colored bg
# block. status-left-length was bumped 64→72 (above) to keep the same room for a long
# login name. Font/glyph SIZE is client-side in Termius — tmux can only widen the
# tap-zone WIDTH, which is this.
#
# COMMA ESCAPING (do not "simplify" away): a literal comma inside a #[...] style
# that sits within a #{?cond,a,b} conditional MUST be written #, — tmux's
# conditional splits on the first UNESCAPED comma and #[...] does NOT protect it,
# so a bare "#[fg=x,bold]" truncates the branch to "#[fg=x" and the badge vanishes.
# (The ⌂ hub icon's two style branches and the ● dot escape their commas the same
# way; the arithmetic #{e|-:…,…} discount comma is protected by its own #{…} nesting,
# not by escaping.) The "#[fg=$PAL_BLUE,bold]" before the login name is outside every conditional,
# so its comma stays bare. No `│` closes the left side any more (issue #1534): the
# window list it used to fence off is blank in a fleet (tmux-attention.conf).
set -g status-left "#[range=user|hub]#{?#{==:#W,plan},#[fg=$PAL_BG#,bg=$PAL_BLUE#,bold]  ⌂  ,#[fg=$PAL_BLUE#,bg=$PAL_SEL]  ⌂  }#[default]#[norange]#[fg=$PAL_BLUE,bold] #{?@login,#{@login},#{user}} #[default]#[range=user|attn]#{?#{&&:#{==:#{@claude_state},needs},#{&&:#{!=:#W,dash},#{!=:#W,backlog}}},#{?@attn_needs,#{?#{e|-:#{@attn_needs},1},#[fg=$PAL_DIM]· #[fg=$PAL_BLUE#,bold]● #{e|-:#{@attn_needs},1} 待处理  #[default],},},#{?@attn_needs,#[fg=$PAL_DIM]· #[fg=$PAL_BLUE#,bold]● #{@attn_needs} 待处理  #[default],}}#[norange]"
set -g status-right-length 130
# status-right passes the CLIENT'S CURRENT WINDOW to the script as `k=v` args
# (issue #1482): its session, id, `@remote` (a proxy onto another machine),
# `@cc_account`, and the window-list formats + whether the bar saved them. In hub
# mode (CCQUOTA_FLEET=1 + the fleet's FLEET_SIDEBAR_SOURCE=hub) the bar then shows
# the machine THAT window's session is on, its account's quota and the hub; off
# hub mode the args are ignored and the bar is what it always was. `q:` shell-quotes
# each value; `k=` keeps an empty one in place. tmux re-runs the job the moment
# the expanded command changes, so a window switch swaps the chip at once.
# Issue #1534 adds three: `cw=` the client's width (the bar drops 内存, then 负载,
# below 120 columns), and `rl5=`/`rl7=` the window's own 5h / week reading
# (@rl5h/@rl7d, conf/statusline.sh) — the account chip's numbers off the hub.
set -g status-right "#(bash ~/.claude/fleet/bin/tmux-status.sh sess=#{q:session_name} win=#{window_id} remote=#{q:@remote} acct=#{q:@cc_account} wsf=#{q:window-status-format} wscf=#{q:window-status-current-format} wsaved=#{?@status_wlist_saved,1,} cw=#{client_width} rl5=#{q:@rl5h} rl7=#{q:@rl7d})"
set -g message-style "bg=$PAL_BG,fg=$PAL_BLUE"
set -g message-command-style "bg=$PAL_BG,fg=$PAL_BLUE"
