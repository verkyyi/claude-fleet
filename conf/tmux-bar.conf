# conf/tmux-bar.conf — the fleet's status bar (issue #1534, EPIC #1529 E5;
# issue #1616, EPIC #1615 C1: it draws only what wants your hand).
#
# Sourced by conf/tmux-attention.conf right AFTER conf/fleet-palette.conf: every
# colour below is a `$PAL_*` name from that one table, which tmux expands while it
# parses THIS file — so this file cannot be read before the palette is (the reason
# it is a file of its own). Never write a hex here.
#
# ONE LAYOUT, both modes:
#   left   ☰ · login · ● N                                 (this file, always)
#   right  only on its condition — a proxy window's machine, the account past
#          FLEET_STATUS_QUOTA_PCT, ⚠ GitHub, ✖ N ▲ N, ○ 入口 Nm, a container
#          down (bin/tmux-status.sh); empty while all is well.
# On a 54-column iPad / iPhone in portrait the whole bar stays ≤ 30 columns in
# every state (tmux-status-selftest.sh leg L pins it); narrower than 60 columns
# the login is cut to 8 characters and `待处理` goes.
# status-interval 2 (was 5): the right side only reads caches already on this
# machine — never the network — so the faster tick costs a read, not a fetch.
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=$PAL_BG,fg=$PAL_FG"
set -g status-left-length 40
# ☰ — THE LIST'S SWITCH (issue #1616), the LEFTMOST element, where ⌂ was and with
# its click range (range=user|hub). It does ONE thing: show the task list in this
# window, or hide it (bin/hub-zoom.sh --bar → fleet-sidebar.sh home … bar). It no
# longer jumps to a hub, focuses the list or opens anything else; a window too
# narrow for the list (an iPad in portrait) opens it as a popup the width of the
# screen. Its BACKGROUND says the state: blue block (bg=$PAL_BLUE) while the list
# is on screen here (@sidebar_worker and not zoomed — fleet-sidebar.sh's own
# view_up test), raised (bg=$PAL_SEL) otherwise — a button that shows it.
# LOGIN NAME — whose fleet this is (issue #1099), NOT the fleet name (#S): one
# fleet per login, so the session name said nothing the login doesn't, and a
# second login on the same machine sees its own. Read from the server-level
# @login that fleet-up.sh / tmux-conf-reload.sh stamp with `id -un` — a plain
# option lookup, no `#(id -un)` fork per status-interval (#888). tmux's #{user}
# is the fallback for a server nobody stamped; it only exists from tmux 3.3, the
# install floor is 3.2, hence the stamp. Narrower than 60 columns (the client's
# width) it is cut to 8 characters. Not a tap target (issue #1034).
# · Then the NEEDS BADGE `● N 待处理` (`● N` narrower than 60 columns): how many
# windows in THIS fleet are in the 'needs' state (@attn_needs, a session option
# set by bin/tmux-spinner.sh — counts the plan/hub window too, #368), hidden at 0
# and with NO per-redraw shell fork (the count is precomputed by the spinner). It
# carries a render-time ACTIVE-WINDOW DISCOUNT (#368, supersedes #363):
# status-left renders in the active window's context, so when the window you're ON
# is itself needy (#{@claude_state}==needs, and not an excluded dash/backlog panel)
# it drops off the count — you don't need to be pulled to a window you're already
# on — and the whole chip hides once the discounted count reaches 0. It's wrapped in
# a clickable range (range=user|attn) — clicking it cycles to the next needs window
# via next-attention.sh --needs-cycle (see the MouseDown1Status bind in
# tmux-attention.conf; clicking needs `set -g mouse on`). prefix+a stays the
# keyboard path. ● is BLUE since issue #1238, which gave the bar three levels with
# one colour each: ✖ red alarm and ▲ yellow warning are the counts on status-right
# (bin/fleet-alerts.sh), ● blue is a session waiting on you. No cross-fleet dot
# (issue #980): one fleet per login holds every repo.
#
# TAP-TARGET PADDING (issue #347): the two tap targets carry EXTRA inner padding —
# two spaces flanking ☰, two after `● N` — so the clickable range itself is WIDER
# and easier to hit on iPad/Termius touch. The padding sits INSIDE each
# #[range=user|…] … #[norange] pair (a space placed OUTSIDE a range isn't
# tappable), so it grows the tap zone, not just the visual gap. Font/glyph SIZE is
# client-side in Termius — tmux can only widen the tap-zone WIDTH, which is this.
#
# COMMA ESCAPING (do not "simplify" away): a literal comma inside a #[...] style
# that sits within a #{?cond,a,b} conditional MUST be written #, — tmux's
# conditional splits on the first UNESCAPED comma and #[...] does NOT protect it,
# so a bare "#[fg=x,bold]" truncates the branch to "#[fg=x" and the badge vanishes.
# (The ☰ icon's two style branches and the ● dot escape their commas the same
# way; the arithmetic #{e|-:…,…} discount comma is protected by its own #{…} nesting,
# not by escaping.) The "#[fg=$PAL_BLUE,bold]" before the login name is outside every conditional,
# so its comma stays bare. No `│` closes the left side (issue #1534): the window
# list it used to fence off is blank in a fleet (tmux-attention.conf).
set -g status-left "#[range=user|hub]#{?#{&&:#{@sidebar_worker},#{!=:#{window_zoomed_flag},1}},#[fg=$PAL_BG#,bg=$PAL_BLUE#,bold]  ☰  ,#[fg=$PAL_BLUE#,bg=$PAL_SEL]  ☰  }#[default]#[norange]#[fg=$PAL_BLUE,bold]#{?#{e|<:#{client_width},60},#{=8:#{?@login,#{@login},#{user}}},#{?@login,#{@login},#{user}}} #[default]#[range=user|attn]#{?#{&&:#{==:#{@claude_state},needs},#{&&:#{!=:#W,dash},#{!=:#W,backlog}}},#{?@attn_needs,#{?#{e|-:#{@attn_needs},1},#[fg=$PAL_BLUE#,bold]● #{e|-:#{@attn_needs},1}#{?#{e|<:#{client_width},60},, 待处理}  #[default],},},#{?@attn_needs,#[fg=$PAL_BLUE#,bold]● #{@attn_needs}#{?#{e|<:#{client_width},60},, 待处理}  #[default],}}#[norange]"
set -g status-right-length 130
# status-right passes the CLIENT'S CURRENT WINDOW to the script as `k=v` args
# (issue #1482): its session, id, `@remote` (a proxy onto another machine),
# `@cc_account`, and the window-list formats + whether the bar saved them. In hub
# mode (CCQUOTA_FLEET=1 + the fleet's FLEET_SIDEBAR_SOURCE=hub) the bar then reads
# the machine THAT window's session is on, its account's quota and the hub off the
# hub's caches; off hub mode only the account and the width are read. `q:` shell-quotes
# each value; `k=` keeps an empty one in place. tmux re-runs the job the moment
# the expanded command changes, so a window switch swaps the segments at once.
# Issue #1534 adds three: `cw=` the client's width (narrower than 60 columns the
# right side goes to its phone layout, issue #1616), and `rl5=`/`rl7=` the
# window's own 5h / week reading (@rl5h/@rl7d, conf/statusline.sh) — the quota
# segment's numbers off the hub.
set -g status-right "#(bash ~/.claude/fleet/bin/tmux-status.sh sess=#{q:session_name} win=#{window_id} remote=#{q:@remote} acct=#{q:@cc_account} wsf=#{q:window-status-format} wscf=#{q:window-status-current-format} wsaved=#{?@status_wlist_saved,1,} cw=#{client_width} rl5=#{q:@rl5h} rl7=#{q:@rl7d} rr=#{q:@remote_route} fb=#{?@fleet_fallback_reason,#{client_tty}:#{q:@fleet_fallback_reason},})"
set -g message-style "bg=$PAL_BG,fg=$PAL_BLUE"
set -g message-command-style "bg=$PAL_BG,fg=$PAL_BLUE"
