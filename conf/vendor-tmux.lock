# vendor-tmux.lock — the static tmux a computer with none gets (claude-fleet#2260).
#
# tmux's own release builds (github.com/tmux/tmux-builds): one statically linked
# binary per platform, no Homebrew, no apt. bin/fleet-client-pack.sh downloads
# each archive below, checks its SHA-256 and packs the binary into the hub's
# build (pack/vendor/tmux-<platform>), so the hub's /install/bundle.tar.gz carries
# it; bin/fleet-install.sh, when the bundle had none, downloads the archive for
# its own platform from the URL here and checks the same SHA-256. Either way it
# lands at ~/.local/share/claude-fleet-vendor/bin/tmux, which `fleet` puts first
# on PATH and fleet_find_tool tries first. No line for a platform → Homebrew /
# apt-get as before. Bumping tmux = new lines here, nothing else.
#
# <platform>      <sha256 of the archive>                                          <url>
