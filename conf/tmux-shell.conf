# conf/tmux-shell.conf — the tmux configuration of the fleet SHELL (issue #1484,
# EPIC #1479 C5): the `fleet` you type on your own computer. bin/fleet-shell.sh
# fills `__BIN__` (the bin/ the shell runs from — a conf-free mirror, see its
# header) and `__PREFIX__` (FLEET_SHELL_PREFIX, default C-b) and APPENDS the
# server's environment (`set-environment -g …`), then starts its own tmux server
# (`-L fleet-shell`) on the result. Nothing here touches a fleet's server.
#
# What is on screen: ONE window, `home` (`@shell_frame`, issue #1759): the task
# LIST pane on the left (fleet-sidebar.py — the hooks below draw it, and it never
# moves), and on the right a nested client of the shell's STAGE server
# (`__STAGE__`, conf/tmux-shell-stage.conf), which holds one window per machine
# (`m4 <name>`, `@remote=<node>:<wid>`, fleet-remote-view.sh) whose pane is a
# direct ssh into that machine's fleet session, and whose own top line is the right
# pane's title. A switch — to another machine or another row of the same one —
# happens on the stage, so nothing on THIS server is repainted: not the list, not
# a border, not the bar. The status BAR at the bottom: who is signed in, the ⟳
# slot, the keys of where the keyboard is — nothing else (issue #2365; the
# quota and 入口 ●/○ of tmux-status.sh went). The list takes NO keys (issue #1950, EPIC #1949
# C1): a tap on a row switches to it, a second tap or a right-click opens its menu,
# a tap on ▸ / ▾ folds — and a question it asks opens on one line under the
# session (bin/fleet-ask.py), with the keyboard there. `prefix q` = the previous
# machine's window (the stage's last window); ⌘↓ ⌘↑ ⌘[ ⌘] ⌘↩ ⌘P ⌘N (iTerm2) or
# prefix n p h l / c = switching sessions from anywhere (issue #1903, below); `prefix z` /
# `[` = zoom / scroll the session; F9 = zoom the right
# pane (this computer's pane, never sent on). These are the ONLY person's keys in
# the fleet (issue #1714): a node's fleet server binds none, and the view session
# a shell looks through has its prefix off, so __PREFIX__ is the only prefix that
# acts.

set -g mouse on
set -g prefix __PREFIX__
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
# No DECSLRM left/right margins on this server (issue #2362). tmux turns them on
# for iTerm2 by itself (its `margins` feature) and then scrolls or clears any
# rectangle narrower than the screen — the session pane beside the list, the
# inside of a popup — as a margin scroll (ESC[<l>;<r>s … ESC[<n>S). A popup's
# content travels that way too, so any slip in the terminal's margin handling
# leaves the session's text inside ⌘P's list and its borders gone. Without
# Cmg/Clmg tmux redraws those rows cell by cell, around every popup; the cost is
# bytes to a terminal on this same computer. An index of its own, so a reload
# sets it again instead of appending a copy.
set -s terminal-overrides[90] "*:Cmg@:Clmg@"
set -g focus-events on
set -g history-limit 20000
set -g renumber-windows on
# One window, one size per VIEWER (issue #1681): a view session (#1489) shares the
# fleet's windows, and the default `latest` sized every window by whichever client
# moved last — a phone dragged the wide window someone else was reading down to
# its own size, and back, a full-screen redraw each time. aggressive-resize sizes a
# window only by the clients looking at IT; several on one window → the smallest.
set -g window-size smallest
set -g aggressive-resize on
set -g allow-rename off
set-window-option -g automatic-rename off
set -g assume-paste-time 0
# Text selected in the right pane reaches THIS computer's clipboard (issue #1766).
# A selection in a machine's session is copied by THAT machine's tmux (its conf,
# tmux-attention.conf, says `on`), which sends it as OSC 52 to its terminal — the
# stage's pane, then ours. `external` (the default) drops an OSC 52 a pane sends,
# so the copy never reached iTerm2; `on` passes it on. The stage says the same
# (conf/tmux-shell-stage.conf). clipboard-osc52-selftest.sh pins the chain.
set -g set-clipboard on
# …and `on` sends only to a terminal whose description has `Ms` (issue #2758):
# tmux knows it for xterm* and for a tmux that answered its query, but a
# terminal described any other way (a phone's, a TERM tmux has no feature row
# for) got nothing. One row for every terminal — the escape every one that takes
# a copy reads; one that does not ignores it. Its own index, so a reload
# rewrites it instead of adding another.
set -s terminal-overrides[92] '*:Ms=\E]52;%p1%s;%p2%s\007'
# A selection made in THIS server's copy-mode (prefix [, the double-click below)
# leaves the same way: the drag's release, y and ↵ copy and close it, in either
# key style — tmux's stock binds, spelled out so a personal ~/.tmux.conf loaded
# before this one cannot leave a drag that copies nothing.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode    y     send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel
bind -T copy-mode    Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
# A machine's agent state (OSC 7501, wrapped as tmux passthrough by its relay —
# issue #2539) passes on toward the person's terminal the same way; `on` = only
# from a pane on screen, so the tab shows the session the person is looking at.
set -g allow-passthrough on
set -g status on
set -g status-interval 2   # the bar reads caches only (issue #1534, as conf/tmux-bar.conf)
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
# The left end says WHO IS SIGNED IN (issue #2365; #1779's ⌂ <machine> before):
# the GitHub login, orange with why when the hub cannot be asked or refuses this
# computer. Its own #() (one where read per 10 s, cached between ticks), never
# the bar's status-right job. After it, the client's own update for a moment
# (issue #1781): ✓ 已更新到 ….
set -g status-left-length 160
# THE BAR IS THREE THINGS (issue #2365 — 「一切优化为 CLI」): who is signed in (the
# badge, status-left's own #()), the ⟳ slot, and the keys of WHERE THE KEYBOARD
# IS. No quota, no 「N 等你」 (the list's red `!` and ⌘P's order say that), no
# machine, issue, PR or reap of the row in view (⌘P's rows and `fleet show` do):
# the bar is the same whichever list row is lit, in every layout — the
# one-session view (`@fleet_layout solo`, issue #2265) included.
# Between the badge and the keys, a slot of exactly two cells (issue #2228): ⟳
# while the task list waits on a frame (@fleet_refreshing, fleet-sidebar.py —
# lit past 3 s without one, held at least 1 s), two blanks otherwise — so the
# keys start on the same column either way, and the list itself never moves (its
# old 「刷新中…」 top row pushed every row down one). The slot comes and goes WITH
# the keys: narrower than 100 columns neither takes room.
set -g status-left "#(bash __BIN__/fleet-client-badge.sh cw=#{client_width})#{?#{e|>=:#{client_width},100},#{E:@fleet_hint_refresh}#{E:@fleet_hint},}"
# The keys (issue #1951, cut to the mode's by #2365). Pure format — no #(), no
# fork: which line is picked by where the keyboard is —
#   prefix pressed (#{client_key_table})        → the prefix keys
#   a popup open (@popup_open, @popup_title — dash-popup.sh) → ⌘P's panel keys,
#                                                 or esc for any other popup
#   a short question's pane (@stage_ask, fleet-ask.py) → ↵ / esc
#   the writing area in view (@fleet_view portal, fleet-sidebar.py) → its keys
#   else (the keyboard in a session)            → ⌘P ⌘T ⌘N, then ⌘↑↓ — or, in
#                                                 the one-session view, ⌃D —
#                                                 and ⌘Q (#2349)
# Each key is a `key-<tmux key>` range: a tap on it IS that key (send-keys -K,
# MouseDown1Status below), so the bar and the key table never disagree. Narrower
# than 100 columns the line goes — the badge keeps the room.
# No comma inside a hint (an #{?…} would split on it): one #[…] per attribute.
# The writing area's ⌘N 编排 · ⇧⇥ 交给编排 (issue #2146) only while a machine runs
# the orchestrating session — @fleet_orch, set by the list (fleet-sidebar.py
# bar_hint): ⌘N there goes to it (fleet-shell.sh portal), and back again.
# ⌘N itself goes to the orchestrating session (issue #2616) — the bar says 「⌘N 编排」
# — unless the client's FLEET_COMPOSE=1 brings the writing area back: @fleet_compose,
# set by fleet-shell.sh (stamp_ver), then reads 「新任务」 as before.
# An orchestrator that cannot count what waits behind its turn (Codex, no mod —
# issue #2617) adds 「编排在忙 · …」 to the session hint while it works:
# @fleet_orch_busy, the ui-lang text, set by the list (fleet-sidebar.py orch_busy).
set -g @fleet_hint_k1 "#[fg=#c0caf5]#[bold]"
set -g @fleet_hint_k0 "#[nobold]#[fg=#565f89]"
set -g @fleet_hint_refresh "#{?#{@fleet_refreshing},#[fg=#e0af68]⟳#[default] ,  }"
set -g @fleet_hint_session "#[range=user|key-User927]#{E:@fleet_hint_k1}⌘P#{E:@fleet_hint_k0} 会话与动作#[norange]  #[range=user|key-User932]#{E:@fleet_hint_k1}⌘T#{E:@fleet_hint_k0} 派单#[norange]  #[range=user|key-User928]#{E:@fleet_hint_k1}⌘N#{E:@fleet_hint_k0} #{?#{@fleet_compose},新任务,编排}#[norange]  #{?#{==:#{@fleet_layout},solo},#{E:@fleet_hint_k1}⌃\\#{E:@fleet_hint_k0} #{?#{@solo_shell},回到会话,会话 shell}  #[range=user|key-C-d]#{E:@fleet_hint_k1}⌃D#{E:@fleet_hint_k0} 放到后台#[norange],#[range=user|key-User920]#{E:@fleet_hint_k1}⌘↑↓#{E:@fleet_hint_k0} 切换#[norange]}  #[range=user|key-User931]#{E:@fleet_hint_k1}⌘Q#{E:@fleet_hint_k0} 退出 fleet#[norange]#{?#{@fleet_orch_busy},  #[fg=#e0af68]#{@fleet_orch_busy},}#[default]"
set -g @fleet_hint_compose "#[range=user|key-Enter]#{E:@fleet_hint_k1}↵#{E:@fleet_hint_k0} 发出#[norange]  #{E:@fleet_hint_k1}⇧↵#{E:@fleet_hint_k0} 换行  #[range=user|key-Tab]#{E:@fleet_hint_k1}Tab#{E:@fleet_hint_k0} 下一项#[norange]  #{?#{@fleet_orch},#[range=user|key-User928]#{E:@fleet_hint_k1}⌘N#{E:@fleet_hint_k0} 编排#[norange]  #[range=user|key-BTab]#{E:@fleet_hint_k1}⇧⇥#{E:@fleet_hint_k0} 交给编排#[norange]  ,}#[range=user|key-Escape]#{E:@fleet_hint_k1}esc#{E:@fleet_hint_k0} 回去#[norange]#[default]"
set -g @fleet_hint_ask "#[range=user|key-Enter]#{E:@fleet_hint_k1}↵#{E:@fleet_hint_k0} 确定#[norange]  #[range=user|key-Escape]#{E:@fleet_hint_k1}esc#{E:@fleet_hint_k0} 取消#[norange]#[default]"
# ⌘P's panel (issue #2365): its own bottom line says the same — fleet-quickopen.py PANEL_KEYS
set -g @fleet_hint_palette "#{E:@fleet_hint_k1}↵#{E:@fleet_hint_k0} 切过去  #{E:@fleet_hint_k1}⌃R#{E:@fleet_hint_k0} 改名  #{E:@fleet_hint_k1}⌃X#{E:@fleet_hint_k0} 回收  #{E:@fleet_hint_k1}⌃A#{E:@fleet_hint_k0} 回答  #{E:@fleet_hint_k1}⌃E#{E:@fleet_hint_k0} 回收方式  #{E:@fleet_hint_k1}⌃O#{E:@fleet_hint_k0} PR  #{E:@fleet_hint_k1}>#{E:@fleet_hint_k0} 命令  #[range=user|key-Escape]#{E:@fleet_hint_k1}esc#{E:@fleet_hint_k0} 关#[norange]#[default]"
set -g @fleet_hint_popup "#[range=user|key-Escape]#{E:@fleet_hint_k1}esc#{E:@fleet_hint_k0} 关#[norange]#[default]"
set -g @fleet_hint_prefix "#{E:@fleet_hint_k1}/#{E:@fleet_hint_k0} 会话与动作  #{E:@fleet_hint_k1}t#{E:@fleet_hint_k0} 派单  #{E:@fleet_hint_k1}c#{E:@fleet_hint_k0} #{?#{@fleet_compose},新任务,编排}  #{E:@fleet_hint_k1}n p#{E:@fleet_hint_k0} 切换  #{E:@fleet_hint_k1}d#{E:@fleet_hint_k0} 放到后台  #{E:@fleet_hint_k1}Q#{E:@fleet_hint_k0} 退出 fleet#[default]"
set -g @fleet_hint " #{?#{==:#{client_key_table},prefix},#{E:@fleet_hint_prefix},#{?#{&&:#{@popup_open},#{!=:#{@popup_open},0}},#{?#{==:#{@popup_title},popup_quickopen},#{E:@fleet_hint_palette},#{E:@fleet_hint_popup}},#{?#{@stage_ask},#{E:@fleet_hint_ask},#{?#{==:#{@fleet_view},portal},#{E:@fleet_hint_compose},#{E:@fleet_hint_session}}}}}"
# The right end draws nothing (issue #2365). tmux-status.sh still runs on the
# bar's tick for what it does besides drawing — the macOS notification for a
# session that starts waiting on you (fleet_alerts_notify), the alerts refresh,
# the window list's blanking in hub mode — with `part=quiet`, which prints
# nothing. The CLIENT'S CURRENT WINDOW rides in as `k=v` (issue #1482): tmux
# re-runs #() the moment the expanded command changes.
set -g status-right-length 1   # nothing drawn; the job still runs
set -g status-right "#(bash __BIN__/tmux-status.sh part=quiet sess=#{q:session_name} win=#{window_id} remote=#{q:@remote} acct=#{q:@cc_account} wsf=#{q:window-status-format} wscf=#{q:window-status-current-format} wsaved=#{?@status_wlist_saved,1,} cw=#{client_width})"
# `home` (issue #1759) is the shell's only window: the right pane's own title
# names the session, so the list here says nothing for it — nor for the
# one-session view's shell windows (@solo_shell, issues #2566, #2744): its keys say it.
set -g window-status-format "#{?#{||:#{@shell_frame},#{@solo_shell}},, #W }"
set -g window-status-current-format "#{?#{||:#{@shell_frame},#{@solo_shell}},,#[fg=#1a1b26]#[bg=#7aa2f7]#[bold] #W #[default]}"
# The right pane's own top border is the REMOTE's (its pane header: name, ctx%,
# model — EPIC #1479 rule 8); the list's own says nothing (its TASKS label went
# with issue #2167).
set -g pane-border-status top
set -g pane-border-style "fg=#3b4261"
# Focus is the cursor on the input line (issue #1764), never a border colour:
# the split and the top line stay one colour whichever pane holds the keys.
set -g pane-active-border-style "fg=#3b4261"
set -g pane-border-indicators off
set -g pane-border-format "#{?#{==:#{@sidebar},1},,#{?@shell_frame,,#[fg=#565f89] #{window_name} #[default]}}"

# --- keys of the shell itself ----------------------------------------------------
# prefix q: back to the machine you were on — the stage's previous window (issue
# #1759); a shell started before the stage, its own. (prefix h was the same until
# issue #1903 made it ⌘[: back through the sessions you were on — below.)
bind q if -F '#{@shell_frame}' { run-shell -b "tmux -L __STAGE__ last-window -t '=__STAGE__' >/dev/null 2>&1 || :" } { last-window }
# prefix E / g / Space (the keyboard onto the list) went with its keys (issue
# #1950). Unbound, not left out: a running server reloading this conf drops them
# too — and Space stays off, tmux's next-layout would re-lay the list out.
unbind E
unbind g
unbind Space
# prefix k (and ⌘J) went with issue #2362: the jump to the one waiting on you is
# a tap on the bar's 「! N 等你」 (MouseDown1Status below). Unbound, not left out:
# a running server reloading this conf drops it too.
unbind k
# prefix z / prefix [ act on the SESSION pane (issue #1105, moved from the node
# by #1714), never on the list. Elsewhere: tmux's defaults. (No `active-pane`
# client flag any more — tmux 3.8 removes it, #1761; the list's paste pin that
# used it went with its input line, #1950.)
bind z if -F '#{==:#{@sidebar},1}' { if -F '#{@sidebar_worker}' { run-shell -C "resize-pane -Z -t '#{@sidebar_worker}'" } } { resize-pane -Z }
bind [ if -F '#{==:#{@sidebar},1}' { if -F '#{@sidebar_worker}' { run-shell -C "copy-mode -t '#{@sidebar_worker}'" } } { copy-mode }
# prefix ? / ⌘/ (the page of keys, #1952) went with issue #2362: the keys are
# documented in docs/CLIENT.md. Unbound on reload too.
unbind ?
# F9: zoom the RIGHT pane — this computer's pane; the key never reaches the far end.
bind -n F9 if -F '#{?@fleet_single,,1}' { if -F '#{window_zoomed_flag}' { resize-pane -Z } { resize-pane -Z -t '{right}' } }
# prefix d detaches (tmux's default); the server, its connections and the list stay.
# ⌃D in the one-session view (issue #2265, EPIC #2259 共同约定 3) detaches too —
# 「退出」 is 「放到后台」: the session runs on, `fleet` comes back to it, and the
# attach prints where it is (fleet-shell.sh attach_client). The agent never sees
# this ⌃D — its own /exit still ends it. In a short question's pane (@stage_ask)
# and in every other layout ⌃D goes where it always went.
bind -n C-d if -F '#{&&:#{==:#{@fleet_layout},solo},#{!=:#{@stage_ask},1}}' { detach-client } { send-keys C-d }
# ⌃\ in the one-session view (issue #2566; #2744): to THIS SESSION's shell and
# back — a login shell of the machine the session runs on, as its login, in its
# working directory (fleet-remote-view.sh shell-open: the stage's current
# `@remote`), a window of this server marked `@solo_shell <node>:<worker id>`,
# one a session — the next press there selects it again; then the session and
# it in turn. The session's pane and its connection never move. The shell's
# `exit` closes it; its session reaped closes it too. prefix \ is the same for a
# keyboard with no ⌃\ (an iPad's Blink); prefix ! is THIS computer's shell in
# $HOME (#2566's ⌃\). In every other layout, and in a short question's pane, ⌃\
# goes where it always went.
bind -n 'C-\' if -F '#{&&:#{==:#{@fleet_layout},solo},#{!=:#{@stage_ask},1}}' { if -F '#{@solo_shell}' { last-window } { run-shell -b "bash __BIN__/fleet-remote-view.sh shell-open __SESS__ >/dev/null 2>&1 || :" } } { send-keys 'C-\' }
bind '\' if -F '#{==:#{@fleet_layout},solo}' { if -F '#{@solo_shell}' { last-window } { run-shell -b "bash __BIN__/fleet-remote-view.sh shell-open __SESS__ >/dev/null 2>&1 || :" } }
bind '!' if -F '#{==:#{@fleet_layout},solo}' { run-shell -b "bash __BIN__/fleet-remote-view.sh shell-open --local >/dev/null 2>&1 || :" }

# --- switching sessions from anywhere (issue #1903, EPIC #1906 C10) ---------------
# The table is bin/dash-keymap.sh --panel switch: on the Mac, iTerm2's `fleet`
# profile (bin/fleet-iterm-profile.py, written from that table) turns each ⌘ chord
# into a private code ESC [ <code> ~ that no terminal sends for a real key; tmux
# catches it as user-keys[<code>] → User<code>. Any other terminal: the prefix key
# beside it, same body. next / prev / back / fwd / ⌘P's pick queue a verb on the
# list's @sidebar_do and wake it with F12 (fleet-sidebar.py reads the queue whole,
# so two quick presses are two steps); the list's own jump() switches. ⌘↩ is F9,
# one body. A zoomed session is unzoomed
# first ({top-left} is the zoomed pane then, not the list); ⌘P keeps the zoom — the
# popup finds the list itself. No list on screen: nothing.
# fleet-keys-selftest.sh leg 10 holds the table, these lines, the sheet and the
# profile in lockstep; fleet-switch-selftest.sh sends every code to a real list.
set -s user-keys[920] "\e[920~"
set -s user-keys[921] "\e[921~"
set -s user-keys[922] "\e[922~"
set -s user-keys[923] "\e[923~"
set -s user-keys[924] "\e[924~"
set -s user-keys[925] "\e[925~"
set -s user-keys[926] "\e[926~"
set -s user-keys[927] "\e[927~"
set -s user-keys[928] "\e[928~"
set -s user-keys[929] "\e[929~"
set -s user-keys[930] "\e[930~"
set -s user-keys[931] "\e[931~"
set -s user-keys[932] "\e[932~"
# 924 (⌘J) and 926 (⌘/) are retired (issue #2362) but still CAUGHT: an iTerm2
# profile written before sends them until the client rewrites it, and a code
# tmux does not know would reach the session as raw bytes. Caught and unbound,
# the key does nothing.
set -s user-keys[924] "\e[924~"
set -s user-keys[926] "\e[926~"
unbind -n User924
unbind -n User926
# ⌘↓ / prefix n · ⌘↑ / prefix p: the session below / above, and the right pane follows at once
bind -n User920 { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do next >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'next ' ; send-keys -t '{top-left}' F12 } } }
bind n { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do next >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'next ' ; send-keys -t '{top-left}' F12 } } }
bind -n User921 { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do prev >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'prev ' ; send-keys -t '{top-left}' F12 } } }
bind p { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do prev >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'prev ' ; send-keys -t '{top-left}' F12 } } }
# ⌘[ / prefix h · ⌘] / prefix l: back / forward through the sessions you were on
# (no list on screen: prefix h is still the machine before, as prefix q)
bind -n User922 { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do back >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'back ' ; send-keys -t '{top-left}' F12 } } }
bind h { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do back >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'back ' ; send-keys -t '{top-left}' F12 } { if -F '#{@shell_frame}' { run-shell -b "tmux -L __STAGE__ last-window -t '=__STAGE__' >/dev/null 2>&1 || :" } { last-window } } } }
bind -n User923 { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do fwd >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'fwd ' ; send-keys -t '{top-left}' F12 } } }
bind l { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do fwd >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'fwd ' ; send-keys -t '{top-left}' F12 } } }
# ⌘↩: zoom the right pane (F9)
bind -n User925 if -F '#{?@fleet_single,,1}' { if -F '#{window_zoomed_flag}' { resize-pane -Z } { resize-pane -Z -t '{right}' } }
# ⌘P / prefix /: the panel of sessions AND actions (bin/fleet-quickopen.py, issue
# #2365) — type a few letters, ↵; ⌃R ⌃X ⌃A ⌃E ⌃O on the lit row; `>` the commands.
bind -n User927 run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size M --title popup_quickopen -- python3 __BIN__/fleet-quickopen.py --session '#{?#{session_group},#{session_group},#{session_name}}' >/dev/null 2>&1 || :"
bind / run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size M --title popup_quickopen -- python3 __BIN__/fleet-quickopen.py --session '#{?#{session_group},#{session_group},#{session_name}}' >/dev/null 2>&1 || :"
# ⌘K / prefix s (issue #2266) are ⌘P now (issue #2365: ONE panel of sessions and
# actions) — the switcher's 「+ 新会话」 and layout flip are its `>` commands.
bind -n User930 run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size M --title popup_quickopen -- python3 __BIN__/fleet-quickopen.py --session '#{?#{session_group},#{session_group},#{session_name}}' >/dev/null 2>&1 || :"
bind s run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size M --title popup_quickopen -- python3 __BIN__/fleet-quickopen.py --session '#{?#{session_group},#{session_group},#{session_name}}' >/dev/null 2>&1 || :"
# ⌘Q / prefix Q: 退出 fleet (issue #2349) — not prefix d's 放到后台: the client's
# every process on this computer goes (the list, the hub loop, the connections,
# its lease), the sessions keep running on their machines. No question first:
# nothing is lost, `fleet` comes back (fleet-shell.sh quit, which goes on in the
# background — it stops the very server that runs this).
bind -n User931 run-shell -b "bash __BIN__/fleet-shell.sh quit __SESS__ >/dev/null 2>&1 || :"
bind Q run-shell -b "bash __BIN__/fleet-shell.sh quit __SESS__ >/dev/null 2>&1 || :"
# ⌘T / prefix t: 派一件事 (issue #2753) — a title, a repo, ↵ files the issue and
# opens its worker, from any window: bin/fleet-quick-dispatch.py hands the list the
# writing area's own payload (fleet-compose.py), no model and no queue on the way.
bind -n User932 run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size S --title popup_dispatch -- python3 __BIN__/fleet-quick-dispatch.py --session '#{?#{session_group},#{session_group},#{session_name}}' >/dev/null 2>&1 || :"
bind t run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size S --title popup_dispatch -- python3 __BIN__/fleet-quick-dispatch.py --session '#{?#{session_group},#{session_group},#{session_name}}' >/dev/null 2>&1 || :"
# ⌘N / prefix c: the orchestrating session (issue #2616 — fleet-shell.sh portal,
# woken first when no machine runs it); with FLEET_COMPOSE=1 the writing area on
# the right (issue #1953) — the stage's `@fleet_role portal` window
# (bin/fleet-compose.py), made once and selected after; the list paints its
# 「新任务」 row as the one in view.
bind -n User928 run-shell -b "bash __BIN__/fleet-shell.sh portal __SESS__ >/dev/null 2>&1 || :"
bind c run-shell -b "bash __BIN__/fleet-shell.sh portal __SESS__ >/dev/null 2>&1 || :"
# ⌘. / prefix . (issue #2167): open or shut the sub-tasks of the session in view
# (on a sub-task: shut its parent) — a `fold` verb on the list's queue, as ⌘↑↓
# queue theirs; the list's caret from wherever the keyboard is.
bind -n User929 { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do fold >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'fold ' ; send-keys -t '{top-left}' F12 } } }
bind . { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do fold >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'fold ' ; send-keys -t '{top-left}' F12 } } }

# --- the one-pane layout (issue #1904, EPIC #1906 C11) ----------------------------
# On a screen too narrow for the list beside 80 columns of session (a phone in
# Termius, an iPad in portrait) — or FLEET_CLIENT_LAYOUT=single — the list's
# sync zooms the session and marks the window `@fleet_single` (fleet-sidebar.py
# fit_single). The list keeps running behind it; the way round is the stage's top
# line (‹ › and a tap on the title, bin/fleet-topbar.py) and these keys, for the
# Termius extra-key row: F1 the full-screen switcher (fleet-quickopen.py --full),
# F2 / F3 the session above / below, F4 the next one waiting on you. The switch
# keys above take the same road there (fleet-quickopen.py do — the zoomed pane is
# {top-left} then, not the list), and F9 / ⌘↩ leave the zoom alone. Not in the
# one-pane layout, F1–F4 go to the session as they always did.
bind -n F1 if -F '#{@fleet_single}' { run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline -w 100% -h 100% --title popup_quickopen -- python3 __BIN__/fleet-quickopen.py --full --session '#{?#{session_group},#{session_group},#{session_name}}' >/dev/null 2>&1 || :" } { send-keys F1 }
bind -n F2 if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do prev >/dev/null 2>&1 || :" } { send-keys F2 }
bind -n F3 if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do next >/dev/null 2>&1 || :" } { send-keys F3 }
bind -n F4 if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do needs >/dev/null 2>&1 || :" } { send-keys F4 }

# --- nothing here deletes the client's own frame (issue #1785) --------------------
# The client is the only way in: one stray prefix x on the list, a prefix & on
# `home`, or a right-click → Kill took the list or the right pane — or the whole
# window, and with it the server — away. So no key and no menu of this server
# kills a pane, a window or the server, and none renames the session the keeper
# and every hook find it by. prefix x / & / $ go; prefix < / > (the window / pane
# menus, Kill + Respawn) go; prefix w (choose-tree, whose x / X kill) goes — the
# shell has one window — and prefix s is ⌘K's switcher (issue #2266), no tree. A right-click is the pane's own (the list's menu, the
# session's mouse); the status line's menus (Kill, Rename) go. To leave: prefix d,
# or close the terminal. shell-unbreakable-selftest.sh scans this file and the
# stage's for a kill and drives each key on an isolated socket.
unbind x
unbind &
unbind '$'
unbind <
unbind >
unbind w
bind -n MouseDown3Pane if -F -t= '#{==:#{@sidebar},1}' { send-keys -M -t= } { select-pane -t= ; send-keys -M -t= }
bind -n M-MouseDown3Pane if -F -t= '#{==:#{@sidebar},1}' { send-keys -M -t= } { select-pane -t= ; send-keys -M -t= }
# A tap on the bar (issue #1951): a `key-<key>` range of the middle is that key,
# pressed on this client (send-keys -K: looked up in the key table like a real
# press — ⌘N's User928, esc in a question's pane); the right end's 「! n 等你」
# (`needs`, tmux-status.sh) jumps to the next session waiting on you — what ⌘J /
# prefix k did before issue #2362 (unzooming first, so {top-left} is the list;
# F10 wakes the list onto that row, the one-pane layout asks fleet-quickopen.py);
# the left end's 「入口不认这台电脑 · 请重新扫码」
# (`rescan`, fleet-client-badge.sh, issue #2112) opens `fleet login` — the scan —
# in a popup on this client. Anywhere else: tmux's own select-window.
bind -n MouseDown1Status if -F '#{m:key-*,#{mouse_status_range}}' { run-shell -C "send-keys -K -c '#{client_name}' '#{s/^key-//:mouse_status_range}'" } { if -F '#{==:#{mouse_status_range},needs}' { if -F '#{@fleet_single}' { run-shell -b "python3 __BIN__/fleet-quickopen.py do needs >/dev/null 2>&1 || :" } { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { send-keys -t '{top-left}' F10 } } } { if -F '#{==:#{mouse_status_range},rescan}' { run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size L --title popup_rescan -- bash __BIN__/fleet login >/dev/null 2>&1 || :" } { select-window -t= } } }
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft

# --- the list's mouse (issue #1950: it takes no keys) -----------------------------
# A tap, a release, a right-click or the wheel on the list goes to the list
# (fleet-sidebar.py reads them); a key goes where tmux sends it — the session.
# No key table routes the keyboard to the list any more (the `fleet-sidebar`
# table, its ↑↓ ↵ esc ⌃n ⌃o ⌃s ⌃t ⌃r ⌃i . ? and the paste pin went); a client a
# running server still holds in it is handed back by the list itself.
# A tap on the list changes nothing on the bar (issue #2365, undoing #1951's
# @fleet_on_list): the bar says where the keyboard is, never which row is lit.
bind -n Any if -F '#{mouse_x}' { send-keys -M -t= } { send-keys }
bind -n MouseDown1Pane if -F -t= '#{==:#{@sidebar},1}' { send-keys -M -t= } { select-pane -t= ; send-keys -M }
# A press on a divider selects the session it borders, never the list; a
# double-click on the session is select-word while the list is on screen (issue
# #820), zoom otherwise; on the divider it is zoom (moved from the node by #1714).
bind -n MouseDown1Border if -F -t= '#{!=:#{@sidebar},1}' { select-pane -t= }
bind -n DoubleClick1Pane if -F -t= '#{==:#{@sidebar},1}' { send-keys -M -t= } { if -F -t= '#{&&:#{@sidebar_worker},#{!=:#{window_zoomed_flag},1}}' { select-pane -t= ; if -F -t= '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M -t= } { copy-mode -H -t= ; send-keys -X -t= select-word ; run-shell -d 0.3 ; send-keys -X -t= copy-pipe-and-cancel } } { resize-pane -Z -t= } }
# The list/session divider is the LIST's border: its double-click zooms the
# session (issue #823), never the list.
bind -n DoubleClick1Border if -F -t= '#{==:#{@sidebar},1}' { if -F -t= '#{@sidebar_worker}' { run-shell -C -t= "resize-pane -Z -t '#{@sidebar_worker}'" } } { resize-pane -Z -t= }

# --- hooks: the list pane follows the current window and comes back after a close ---
set-hook -g session-window-changed[71] { if -F '#{?#{&&:#{@sidebar_worker},#{P:#{?#{&&:#{==:#{@sidebar},1},#{!=:#{pane_dead},1}},1,}}},,1}' { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{hook_session}' >/dev/null 2>&1 || :" } }
set-hook -g client-attached[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g client-detached[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g window-resized[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{hook_window}' >/dev/null 2>&1 || :" }
set-hook -g window-layout-changed[71] { if -F '#{?#{P:#{?#{&&:#{==:#{@sidebar},1},#{!=:#{pane_dead},1}},1,}},,1}' { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{hook_window}' >/dev/null 2>&1 || :" } }
set-hook -g pane-exited[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g pane-died[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g after-kill-pane[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g after-select-pane[71] { if -F '#{&&:#{||:#{==:#{@sidebar},1},#{==:#{@sidebar_slot},1}},#{pane_active}}' { last-pane } }
set-hook -g client-detached[0] 'set -g @popup_open 0'
# A click on a session's notification (issue #1951) that could not run a jump of
# its own (osascript, iTerm2's OSC 9) brings the terminal forward: that focus-in
# takes the jump fleet-client-actions.py notify left in @notify_jump. No jump
# armed: the format is false and nothing runs.
set-hook -g client-focus-in[72] { if -F '#{@notify_jump}' { run-shell -b "python3 __BIN__/fleet-client-actions.py jump-pending --session __SESS__ >/dev/null 2>&1 || :" } }
