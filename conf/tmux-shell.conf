# conf/tmux-shell.conf — the tmux configuration of the fleet SHELL (issue #1484,
# EPIC #1479 C5): the `fleet` you type on your own computer. bin/fleet-shell.sh
# fills `__BIN__` (the bin/ the shell runs from — a conf-free mirror, see its
# header) and `__PREFIX__` (FLEET_SHELL_PREFIX, default C-b) and APPENDS the
# server's environment (`set-environment -g …`), then starts its own tmux server
# (`-L fleet-shell`) on the result. Nothing here touches a fleet's server.
#
# What is on screen: ONE window, `home` (`@shell_frame`, issue #1759): the task
# LIST pane on the left (fleet-sidebar.py — the hooks below draw it, and it never
# moves), and on the right a nested client of the shell's STAGE server
# (`__STAGE__`, conf/tmux-shell-stage.conf), which holds one window per machine
# (`m4 <name>`, `@remote=<node>:<wid>`, fleet-remote-view.sh) whose pane is a
# direct ssh into that machine's fleet session, and whose own top line is the right
# pane's title. A switch — to another machine or another row of the same one —
# happens on the stage, so nothing on THIS server is repainted: not the list, not
# a border, not the bar. The status BAR at the bottom in hub mode (tmux-status.sh):
# its account's quota, 入口 ●/○. Keys: ↑↓ / Enter /
# . / ? on the list exactly as in a fleet (the `fleet-sidebar` table, copied from
# conf/tmux-attention.conf — ONE body per key, so fleet-sidebar-selftest.sh's
# invariants hold here too); `prefix q` = the previous machine's window (the
# stage's last window); ⌘↓ ⌘↑ ⌘[ ⌘] ⌘J ⌘↩ ⌘/ ⌘P (iTerm2) or prefix n p h l k / =
# switching sessions from anywhere (issue #1903, below); `prefix E` / `g` / `Space` = the keyboard onto the list; `prefix z` /
# `[` = zoom / scroll the session; `prefix ?` = every key; F9 = zoom the right
# pane (this computer's pane, never sent on). These are the ONLY person's keys in
# the fleet (issue #1714): a node's fleet server binds none, and the view session
# a shell looks through has its prefix off, so __PREFIX__ is the only prefix that
# acts.

set -g mouse on
set -g prefix __PREFIX__
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
set -g focus-events on
set -g history-limit 20000
set -g renumber-windows on
# One window, one size per VIEWER (issue #1681): a view session (#1489) shares the
# fleet's windows, and the default `latest` sized every window by whichever client
# moved last — a phone dragged the wide window someone else was reading down to
# its own size, and back, a full-screen redraw each time. aggressive-resize sizes a
# window only by the clients looking at IT; several on one window → the smallest.
set -g window-size smallest
set -g aggressive-resize on
set -g allow-rename off
set-window-option -g automatic-rename off
set -g assume-paste-time 0
# Text selected in the right pane reaches THIS computer's clipboard (issue #1766).
# A selection in a machine's session is copied by THAT machine's tmux (its conf,
# tmux-attention.conf, says `on`), which sends it as OSC 52 to its terminal — the
# stage's pane, then ours. `external` (the default) drops an OSC 52 a pane sends,
# so the copy never reached iTerm2; `on` passes it on. The stage says the same
# (conf/tmux-shell-stage.conf). clipboard-osc52-selftest.sh pins the chain.
set -g set-clipboard on
set -g status on
set -g status-interval 2   # the bar reads caches only (issue #1534, as conf/tmux-bar.conf)
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
# The left end says WHERE THE CLIENT RUNS (issue #1779): ⌂ MacBook · iTerm2, or
# ⌂ m5 ← <device> over ssh, orange when the hub cannot be asked. Its own #() (one
# where read per 10 s, cached between ticks), never the bar's status-right job.
# After it, the client's own update for a moment (issue #1781): ✓ 已更新到 ….
set -g status-left-length 90
set -g status-left "#(bash __BIN__/fleet-client-badge.sh cw=#{client_width})"
set -g status-right-length 130
# The CLIENT'S CURRENT WINDOW rides into the bar as `k=v` (issue #1482): tmux
# re-runs #() the moment the expanded command changes, so switching machines
# swaps the chip at once. `remote=` is what fleet_status_node reads; `cw=` is the
# width the bar drops 内存 then 负载 at (issue #1534).
set -g status-right "#(bash __BIN__/tmux-status.sh sess=#{q:session_name} win=#{window_id} remote=#{q:@remote} acct=#{q:@cc_account} wsf=#{q:window-status-format} wscf=#{q:window-status-current-format} wsaved=#{?@status_wlist_saved,1,} cw=#{client_width} rl5=#{q:@rl5h} rl7=#{q:@rl7d} rr=#{q:@remote_route} cr=#{?@fleet_client_remote,#{client_tty}:#{q:@fleet_client_remote},})"
# `home` (issue #1759) is the shell's only window: the right pane's own title
# names the session, so the list here says nothing for it.
set -g window-status-format "#{?@shell_frame,, #W }"
set -g window-status-current-format "#{?@shell_frame,,#[fg=#1a1b26]#[bg=#7aa2f7]#[bold] #W #[default]}"
# The right pane's own top border is the REMOTE's (its pane header: name, ctx%,
# model — EPIC #1479 rule 8); this one names the list and the machine.
set -g pane-border-status top
set -g pane-border-style "fg=#3b4261"
# Focus is the cursor on the input line (issue #1764), never a border colour:
# the split and the top line stay one colour whichever pane holds the keys.
set -g pane-active-border-style "fg=#3b4261"
set -g pane-border-indicators off
set -g pane-border-format "#{?#{==:#{@sidebar},1},#[fg=#565f89] TASKS #[default],#{?@shell_frame,,#[fg=#565f89] #{window_name} #[default]}}"

# --- keys of the shell itself ----------------------------------------------------
# prefix q: back to the machine you were on — the stage's previous window (issue
# #1759); a shell started before the stage, its own. (prefix h was the same until
# issue #1903 made it ⌘[: back through the sessions you were on — below.)
bind q if -F '#{@shell_frame}' { run-shell -b "tmux -L __STAGE__ last-window -t '=__STAGE__' >/dev/null 2>&1 || :" } { last-window }
# prefix E / g / Space: the task list, focused — the keyboard onto it (↑↓
# switch, ↵ / Esc hand it back). g and Space were the node's (conf/tmux-attention.conf
# until issue #1714): the person's keys live here now, the node has none.
bind E if -F '#{&&:#{@sidebar_worker},#{!=:#{window_zoomed_flag},1}}' { switch-client -T fleet-sidebar ; run-shell "bash __BIN__/fleet-sidebar.sh key '#{session_id}' Escape >/dev/null 2>&1 || :" ; run-shell -b "sh __BIN__/fleet-ui-lang.sh hint '#{client_name}' toast_shell_sidebar >/dev/null 2>&1 || :" }
bind g if -F '#{&&:#{@sidebar_worker},#{!=:#{window_zoomed_flag},1}}' { switch-client -T fleet-sidebar ; run-shell "bash __BIN__/fleet-sidebar.sh key '#{session_id}' Escape >/dev/null 2>&1 || :" ; run-shell -b "sh __BIN__/fleet-ui-lang.sh hint '#{client_name}' toast_shell_sidebar >/dev/null 2>&1 || :" }
bind Space if -F '#{&&:#{@sidebar_worker},#{!=:#{window_zoomed_flag},1}}' { switch-client -T fleet-sidebar ; run-shell "bash __BIN__/fleet-sidebar.sh key '#{session_id}' Escape >/dev/null 2>&1 || :" ; run-shell -b "sh __BIN__/fleet-ui-lang.sh hint '#{client_name}' toast_shell_sidebar >/dev/null 2>&1 || :" }
# prefix k (and ⌘J, issue #1903 — unzooming first, so {top-left} is the list): the 要你处理 jump from anywhere (issue #1771) — the list's ⌃k / a tap
# on its `! N 个在问你` line, with the keyboard left where it is. F10 wakes the
# list (fleet-sidebar.py): onto the next row waiting on you, and over to it.
bind k { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { send-keys -t '{top-left}' F10 } }
# prefix z / prefix [ with the keyboard ON the list act on the SESSION pane
# (issue #1105, moved from the node by #1714): while the list holds the keyboard
# the client's own pane is the list, so tmux's stock zoom / copy-mode would act on
# it. Both hand the keyboard back first. Away from the list: tmux's defaults.
bind z if -F '#{==:#{@sidebar},1}' { refresh-client -f '!active-pane' ; if -F '#{@sidebar_worker}' { run-shell -C "resize-pane -Z -t '#{@sidebar_worker}'" } } { resize-pane -Z }
bind [ if -F '#{==:#{@sidebar},1}' { refresh-client -f '!active-pane' ; if -F '#{@sidebar_worker}' { run-shell -C "copy-mode -t '#{@sidebar_worker}'" } } { copy-mode }
# prefix ?: every key, one sheet (bin/fleet-keys.sh), through the one popup door
# (dash-popup.sh, issue #1535) — the list's own `?` is the short sheet.
bind ? run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size L --title popup_keys -- bash __BIN__/fleet-keys.sh >/dev/null 2>&1 || :"
# F9: zoom the RIGHT pane — this computer's pane; the key never reaches the far end.
bind -n F9 if -F '#{window_zoomed_flag}' { resize-pane -Z } { resize-pane -Z -t '{right}' }
# prefix d detaches (tmux's default); the server, its connections and the list stay.

# --- switching sessions from anywhere (issue #1903, EPIC #1906 C10) ---------------
# The table is bin/dash-keymap.sh --panel switch: on the Mac, iTerm2's `fleet`
# profile (bin/fleet-iterm-profile.py, written from that table) turns each ⌘ chord
# into a private code ESC [ <code> ~ that no terminal sends for a real key; tmux
# catches it as user-keys[<code>] → User<code>. Any other terminal: the prefix key
# beside it, same body. next / prev / back / fwd / ⌘P's pick queue a verb on the
# list's @sidebar_do and wake it with F12 (fleet-sidebar.py reads the queue whole,
# so two quick presses are two steps); the list's own jump() switches. ⌘J / ⌘↩ /
# ⌘/ are prefix k / F9 / prefix ?, one body each. A zoomed session is unzoomed
# first ({top-left} is the zoomed pane then, not the list); ⌘P keeps the zoom — the
# popup finds the list itself. No list on screen: nothing.
# fleet-keys-selftest.sh leg 10 holds the table, these lines, the sheet and the
# profile in lockstep; fleet-switch-selftest.sh sends every code to a real list.
set -s user-keys[920] "\e[920~"
set -s user-keys[921] "\e[921~"
set -s user-keys[922] "\e[922~"
set -s user-keys[923] "\e[923~"
set -s user-keys[924] "\e[924~"
set -s user-keys[925] "\e[925~"
set -s user-keys[926] "\e[926~"
set -s user-keys[927] "\e[927~"
# ⌘↓ / prefix n · ⌘↑ / prefix p: the session below / above, and the right pane follows at once
bind -n User920 { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'next ' ; send-keys -t '{top-left}' F12 } }
bind n { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'next ' ; send-keys -t '{top-left}' F12 } }
bind -n User921 { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'prev ' ; send-keys -t '{top-left}' F12 } }
bind p { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'prev ' ; send-keys -t '{top-left}' F12 } }
# ⌘[ / prefix h · ⌘] / prefix l: back / forward through the sessions you were on
# (no list on screen: prefix h is still the machine before, as prefix q)
bind -n User922 { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'back ' ; send-keys -t '{top-left}' F12 } }
bind h { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'back ' ; send-keys -t '{top-left}' F12 } { if -F '#{@shell_frame}' { run-shell -b "tmux -L __STAGE__ last-window -t '=__STAGE__' >/dev/null 2>&1 || :" } { last-window } } }
bind -n User923 { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'fwd ' ; send-keys -t '{top-left}' F12 } }
bind l { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { set -pa -t '{top-left}' @sidebar_do 'fwd ' ; send-keys -t '{top-left}' F12 } }
# ⌘J: the next session waiting on you (prefix k) · ⌘↩: zoom the right pane (F9) · ⌘/: every key (prefix ?)
bind -n User924 { if -F '#{window_zoomed_flag}' { resize-pane -Z } ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { send-keys -t '{top-left}' F10 } }
bind -n User925 if -F '#{window_zoomed_flag}' { resize-pane -Z } { resize-pane -Z -t '{right}' }
bind -n User926 run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size L --title popup_keys -- bash __BIN__/fleet-keys.sh >/dev/null 2>&1 || :"
# ⌘P / prefix /: quick open — type a few letters, ↵ (bin/fleet-quickopen.py)
bind -n User927 run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size M --title popup_quickopen -- python3 __BIN__/fleet-quickopen.py --session '#{session_name}' >/dev/null 2>&1 || :"
bind / run-shell -b "bash __BIN__/dash-popup.sh --client '#{client_name}' --no-inline --size M --title popup_quickopen -- python3 __BIN__/fleet-quickopen.py --session '#{session_name}' >/dev/null 2>&1 || :"

# --- nothing here deletes the client's own frame (issue #1785) --------------------
# The client is the only way in: one stray prefix x on the list, a prefix & on
# `home`, or a right-click → Kill took the list or the right pane — or the whole
# window, and with it the server — away. So no key and no menu of this server
# kills a pane, a window or the server, and none renames the session the keeper
# and every hook find it by. prefix x / & / $ go; prefix < / > (the window / pane
# menus, Kill + Respawn) go; prefix s / w (choose-tree, whose x / X kill) go — the
# shell has one window. A right-click is the pane's own (the list's menu, the
# session's mouse); the status line's menus (Kill, Rename) go. To leave: prefix d,
# or close the terminal. shell-unbreakable-selftest.sh scans this file and the
# stage's for a kill and drives each key on an isolated socket.
unbind x
unbind &
unbind '$'
unbind <
unbind >
unbind s
unbind w
bind -n MouseDown3Pane if -F -t= '#{==:#{@sidebar},1}' { send-keys -M -t= } { select-pane -t= ; send-keys -M -t= }
bind -n M-MouseDown3Pane if -F -t= '#{==:#{@sidebar},1}' { send-keys -M -t= } { select-pane -t= ; send-keys -M -t= }
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft

# --- the list's key table (the ONE copy since issue #1714; the node's is gone) ----
bind -T fleet-sidebar Up if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' Up } { switch-client -T root ; refresh-client -f '!active-pane' ; send-keys }
bind -T fleet-sidebar Down if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' Down } { switch-client -T root ; refresh-client -f '!active-pane' ; send-keys }
bind -T fleet-sidebar Home if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' Home } { switch-client -T root ; refresh-client -f '!active-pane' ; send-keys }
bind -T fleet-sidebar End if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' End } { switch-client -T root ; refresh-client -f '!active-pane' ; send-keys }
bind -T fleet-sidebar Left if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' Left } { switch-client -T root ; refresh-client -f '!active-pane' ; send-keys }
bind -T fleet-sidebar Right if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' Right } { switch-client -T root ; refresh-client -f '!active-pane' ; send-keys }
bind -T fleet-sidebar Enter if -F -t '{top-left}' '#{@sidebar_input}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' Enter } { refresh-client -f '!active-pane' ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { send-keys -t '{top-left}' Enter } }
bind -T fleet-sidebar Escape if -F -t '{top-left}' '#{@sidebar_input}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' Escape } { refresh-client -f '!active-pane' ; if -F -t '{top-left}' '#{==:#{@sidebar},1}' { send-keys -t '{top-left}' Escape } }
bind -T fleet-sidebar Any if -F '#{mouse_x}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' } { switch-client -T root ; refresh-client -f '!active-pane' ; send-keys } }
bind -n Any if -F '#{mouse_x}' { send-keys -M -t= } { if -F -t '{top-left}' '#{&&:#{==:#{client_key_table},fleet-sidebar},#{==:#{@sidebar},1}}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' } { if -F '#{m:*active-pane*,#{client_flags}}' { refresh-client -f '!active-pane' } ; send-keys } }
bind -T fleet-sidebar C-M-S-F12 if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; refresh-client -f active-pane ; select-pane -t '{top-left}' } { switch-client -T fleet-sidebar ; refresh-client -f '!active-pane' }
bind -n C-M-S-F12 refresh-client -f '!active-pane'
bind -T fleet-sidebar M-a if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-a }
bind -T fleet-sidebar M-e if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-e }
bind -T fleet-sidebar M-w if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-w }
bind -T fleet-sidebar M-k if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-k }
# The list's ⌃n ⌃o ⌃s ⌃t ⌃r ⌃i, for a prefix that takes the ⌃ chord: their ⌥
# fallbacks (dash-keymap.sh --panel sidebar) rewritten to the ⌃ byte the list reads
# (issues #1532, #1714 — the node carried these until it lost its list).
bind -T fleet-sidebar M-n if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-n }
bind -T fleet-sidebar M-o if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-o }
bind -T fleet-sidebar M-s if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-s }
bind -T fleet-sidebar M-t if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-t }
bind -T fleet-sidebar M-r if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-r }
bind -T fleet-sidebar M-i if -F -t '{top-left}' '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -t '{top-left}' C-i }
# F9 while the list has the keyboard: hand it back and zoom the session, as root's F9.
bind -T fleet-sidebar F9 if -F '#{window_zoomed_flag}' { switch-client -T root ; refresh-client -f '!active-pane' ; resize-pane -Z } { switch-client -T root ; refresh-client -f '!active-pane' ; resize-pane -Z -t '{right}' }
bind -T fleet-sidebar WheelUpPane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; if -F -t= '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M -t= } { copy-mode -e -t= } }
bind -T fleet-sidebar WheelDownPane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; send-keys -M -t= }
bind -T fleet-sidebar MouseDown1Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; select-pane -t= ; send-keys -M }
bind -T fleet-sidebar MouseUp1Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; select-pane -t= ; send-keys -M }
bind -T fleet-sidebar SecondClick1Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; select-pane -t= ; send-keys -M }
bind -T fleet-sidebar DoubleClick1Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; if -F -t= '#{&&:#{@sidebar_worker},#{!=:#{window_zoomed_flag},1}}' { select-pane -t= ; if -F -t= '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M -t= } { copy-mode -H -t= ; send-keys -X -t= select-word ; run-shell -d 0.3 ; send-keys -X -t= copy-pipe-and-cancel } } { resize-pane -Z -t= } }
bind -T fleet-sidebar TripleClick1Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; select-pane -t= }
bind -T fleet-sidebar MouseDown3Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; select-pane -t= ; send-keys -M }
bind -T fleet-sidebar MouseDown2Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { switch-client -T root ; refresh-client -f '!active-pane' ; select-pane -t= ; if -F -t= '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M -t= } { paste-buffer -p -t= } }
bind -T fleet-sidebar MouseDown1Border if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar } { switch-client -T root ; refresh-client -f '!active-pane' ; select-pane -t= }
bind -T fleet-sidebar MouseUp1Border switch-client -T fleet-sidebar
bind -T fleet-sidebar SecondClick1Border switch-client -T fleet-sidebar
# The list/session divider is the LIST's border: its double-click zooms the session
# (issue #823), never the navigation it would re-enter.
bind -T fleet-sidebar DoubleClick1Border if -F -t= '#{==:#{@sidebar},1}' { if -F -t= '#{@sidebar_worker}' { switch-client -T root ; refresh-client -f '!active-pane' ; run-shell -C -t= "resize-pane -Z -t '#{@sidebar_worker}'" } { switch-client -T fleet-sidebar } } { switch-client -T root ; refresh-client -f '!active-pane' ; resize-pane -Z -t= }
bind -T fleet-sidebar TripleClick1Border switch-client -T fleet-sidebar
# A click on the list pane in root hands it the keyboard, as in a fleet.
bind -n MouseDown1Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { select-pane -t= ; send-keys -M }
# A press on the divider hands the list the keyboard; a double-click on the session
# is select-word while the list is on screen (issue #820), zoom otherwise; on the
# divider it is zoom (moved from the node by issue #1714).
bind -n MouseDown1Border if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar } { select-pane -t= }
bind -n DoubleClick1Pane if -F -t= '#{==:#{@sidebar},1}' { switch-client -T fleet-sidebar ; send-keys -M -t= } { if -F -t= '#{&&:#{@sidebar_worker},#{!=:#{window_zoomed_flag},1}}' { select-pane -t= ; if -F -t= '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M -t= } { copy-mode -H -t= ; send-keys -X -t= select-word ; run-shell -d 0.3 ; send-keys -X -t= copy-pipe-and-cancel } } { resize-pane -Z -t= } }
bind -n DoubleClick1Border resize-pane -Z

# --- hooks: the list pane follows the current window and comes back after a close ---
set-hook -g session-window-changed[71] { if -F '#{?#{&&:#{@sidebar_worker},#{P:#{?#{&&:#{==:#{@sidebar},1},#{!=:#{pane_dead},1}},1,}}},,1}' { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{hook_session}' >/dev/null 2>&1 || :" } }
set-hook -g client-attached[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g client-detached[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g window-resized[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{hook_window}' >/dev/null 2>&1 || :" }
set-hook -g window-layout-changed[71] { if -F '#{?#{P:#{?#{&&:#{==:#{@sidebar},1},#{!=:#{pane_dead},1}},1,}},,1}' { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{hook_window}' >/dev/null 2>&1 || :" } }
set-hook -g pane-exited[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g pane-died[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g after-kill-pane[71] { run-shell -b "bash __BIN__/fleet-sidebar.sh sync '#{session_id}' >/dev/null 2>&1 || :" }
set-hook -g after-select-pane[71] { if -F '#{&&:#{||:#{==:#{@sidebar},1},#{==:#{@sidebar_slot},1}},#{pane_active}}' { last-pane } }
set-hook -g client-detached[0] 'set -g @popup_open 0'
