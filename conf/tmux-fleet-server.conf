# tmux-fleet-server.conf — the file a NODE's fleet tmux server starts from
# (issue #1845). fleet-up.sh starts every fleet server with `-f` this file
# (fleet_server_new_session in bin/fleet-lib.sh), so the fleet layer no longer
# rides on the person's ~/.tmux.conf: a syntax error there (or a commented-out
# source line) used to skip the whole file and, with it, the reaper hooks, the
# rename guard and the window baseline — silently.
#
# 1. The fleet layer, resolved next to this file (no install path baked in). It
#    ends by stamping @fleet_conf_loaded; `fleet doctor`'s tmuxconf row reads it
#    off every fleet server (fleet_tmuxconf_check).
source-file -F "#{d:current_file}/tmux-attention.conf"
# 2. Then the person's own config — the same list a plain tmux reads — so their
#    settings still apply and still win over the fleet's opinionated defaults
#    (later wins). -q: a missing file is fine, and a file with an error is
#    skipped on its own; this file and the layer above are already loaded.
#    A ~/.tmux.conf that still sources tmux-attention.conf re-applies it: every
#    line there is idempotent (indexed hooks, plain sets).
source-file -q /etc/tmux.conf ~/.tmux.conf ~/.config/tmux/tmux.conf
# 3. Last, the node's human key layer once more (issue #1840): the person's file
#    above may re-bind tmux's stock deletes (prefix x / &, the Kill menus); on a
#    fleet server none of them come back.
source-file -F "#{d:current_file}/tmux-node-human.conf"
# 4. And the 看台's keys once more (issue #3000): its table starts as a copy of
#    root, so it is copied after everything above has had its say.
source-file -F "#{d:current_file}/tmux-view.conf"
