# ci-runner.lock — the GitHub Actions runner a managed machine's test runner uses
# (claude-fleet#3144, EPIC #3139 C5).
#
# bin/fleet-ci-runner.py (the machine daemon's `ci-runner` child, only where
# /var/db/fleet-node/ci.env exists) downloads the archive for its platform from
# the URL here, checks its SHA-256 before unpacking a byte, and keeps it in the
# root runtime's tools cache: <root>/tools/actions-runner/<sha256>/ (root, 0755).
# Each run is a fresh copy of that tree in the test login's home.
#
# Why here and not in release.json: an installed updater refuses a release.json
# naming a component it does not know (check_release), and a pinned artifact
# must sit on the hub before stable may move — both would stop every machine's
# update for a part only a machine with ci.env uses. The runner reaches GitHub
# to work at all, so it fetches from GitHub; the hash is the pin.
# Bumping the runner = new lines here, nothing else.
#
# <platform>      <sha256 of the archive>                                          <url>
