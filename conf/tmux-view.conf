# tmux-view.conf — the 看台's keys (issue #3000, EPIC #2999 C2, 共同约定 9).
#
# A 看台 is the grouped session a thin client attaches to on its home machine,
# `<fleet>@view-<id>` (fleet-remote-view.sh attach --thin): the client has no tmux
# of its own any more, so its ⌘ keys land HERE. They live in two key tables of
# their own — `fleet-view` (the 看台's session key-table, set by attach --thin
# once this file has defined it) and `fleet-view-pfx` (⌃] then a letter, for a
# terminal with no ⌘: a phone) — never in root or prefix, which stay exactly
# tmux's (the human layer's take-aways aside): a person attached to the fleet
# session itself sees no key of ours. fleet-keys-selftest.sh leg 8 holds both.
#
# Loaded at the end of conf/tmux-attention.conf and once more LAST in
# conf/tmux-fleet-server.conf (after the person's ~/.tmux.conf and the human
# layer), because `fleet-view` starts as a COPY of root: tmux does not fall back
# to root for a key a session's own key-table lacks (tmux 3.7, checked on an
# isolated socket — prefix still works, a root bind does not), so the 看台's
# mouse — wheel, click, drag, the read-only right-click menu — is root's own
# bindings copied over, after every layer that changes them.
#
# The private codes: iTerm2's `fleet` profile turns each ⌘ chord into
# `ESC [ <code> ~` (bin/dash-keymap.sh --panel switch, the one table). Caught as a
# server option, a code reaches no pane as raw bytes: in a session that is not a
# 看台 it is User<code> with nothing bound — it does nothing. 924 and 926 are
# retired codes an older profile still sends.
set -s user-keys[920] "\e[920~"
set -s user-keys[921] "\e[921~"
set -s user-keys[922] "\e[922~"
set -s user-keys[923] "\e[923~"
set -s user-keys[924] "\e[924~"
set -s user-keys[925] "\e[925~"
set -s user-keys[926] "\e[926~"
set -s user-keys[927] "\e[927~"
set -s user-keys[928] "\e[928~"
set -s user-keys[929] "\e[929~"
set -s user-keys[930] "\e[930~"
set -s user-keys[931] "\e[931~"
set -s user-keys[932] "\e[932~"
# Both tables, rebuilt whole (idempotent): root copied into fleet-view, then the
# 看台's keys off the switch table — ⌘↓ ⌘↑ ⌘[ ⌘] ⌘P ⌘K and ⌃] + its prefix
# letter (fleet-quickopen.py view-keys says which actions a 看台 has).
run-shell "python3 '#{d:current_file}/../bin/fleet-quickopen.py' view-keys"
set -g @fleet_view_keys "v1"
