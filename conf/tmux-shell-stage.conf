# conf/tmux-shell-stage.conf — the STAGE of the fleet shell (issue #1759): the
# tmux server that holds one proxy window per machine (`m4 <name>`,
# `@remote=<node>:<wid>`, fleet-remote-view.sh run --shell), seen through ONE
# nested client in the right pane of the shell's only window
# (conf/tmux-shell.conf). bin/fleet-shell.sh fills `__BIN__` / `__SESS__` and
# appends the server's environment, then starts it as `-L <session>-stage`.
#
# Why a server of its own: switching machines is a `select-window` HERE, which
# repaints only the nested client — the right pane of the person's screen. Done
# on the shell's own server (a window per machine, #1702's swap), the same switch
# repainted the whole screen: tmux redraws every client of a server on any
# `select-window`, `swap-pane`, `set-option` or `rename-window` on it. So nothing
# a switch does may touch the shell's server, and everything it does happens here.
#
# The person never types to this server: the shell's server has the prefix and
# every key, and passes the rest through the right pane. So no prefix here, no
# key of its own beyond tmux's mouse defaults, and its one status line is the
# right pane's title (the machine, the session, 中转 / 失联 / 旧) at its top.

set -g prefix None
set -g prefix2 None
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"
set -g escape-time 0
set -g focus-events on
set -g history-limit 2000
set -g renumber-windows on
set -g allow-rename off
set-window-option -g automatic-rename off
set -g window-size latest
set -g assume-paste-time 0
# A machine's copy (OSC 52 from its tmux) passes through to the shell's pane and
# on to the person's terminal (issue #1766; see conf/tmux-shell.conf).
set -g set-clipboard on
# A machine's agent state (OSC 7501, wrapped as tmux passthrough by its relay —
# issue #2539) passes on toward the person's terminal the same way; `on` = only
# from a pane on screen, so the tab shows the session the person is looking at.
set -g allow-passthrough on
set -g visual-activity off
set -g visual-bell off
set -g pane-border-status off
# The right pane's title, on top — the session's top line (issue #1904,
# bin/fleet-topbar.py): ‹ i/n ›  state  key  title …… PR  repo  @machine, off the
# record the task list writes (the same rows it paints). `gen=` is the list's
# @fleet_bar_gen: a new record changes the command, so tmux runs it again at
# once; `down=` / `rr=` are what only the stage knows about this machine's
# connection (⟳ while it reconnects, 中转 on the hub relay). It is the stage's
# own line, so it changes with the window without a byte outside the right pane.
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style "bg=#1a1b26,fg=#565f89"
set -g status-left-length 400
set -g status-left "#(python3 __BIN__/fleet-topbar.py render cw=#{client_width} gen=#{@fleet_bar_gen} down=#{@remote_down} rr=#{q:@remote_route} wn=#{q:window_name})"
# A tap on its parts (issue #1904): ‹ › the session above / below, the title the
# full-screen switcher, the key the issue, PR the PR, @machine what is known of it.
bind -n MouseDown1Status if -F '#{mouse_status_range}' { run-shell -b "python3 __BIN__/fleet-topbar.py click '#{mouse_status_range}' __SESS__ >/dev/null 2>&1 || :" }
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""
# No mouse menu of the stage kills (issue #1785): with prefix None its menus are
# the only commands a person can reach here, and tmux's pane / window menus carry
# Kill + Respawn — one right-click on a machine's pane closed its connection, and
# the last one closed the stage under the right pane. A right-click is the far
# end's (its own tmux has the mouse); a pane that takes no mouse gets nothing. The
# status line's menus (Kill, Rename) go: the shell finds this server by its name.
bind -n MouseDown3Pane select-pane -t= \; send-keys -M -t=
bind -n M-MouseDown3Pane select-pane -t= \; send-keys -M -t=
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3StatusLeft
# --- the server's environment follows (written by fleet-shell.sh) -------------------
