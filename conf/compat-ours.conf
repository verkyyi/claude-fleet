# conf/compat-ours.conf — the fleet maintainers' own addresses, for ONE version
# (issue #3577, EPIC #3569 C7). compat-1v: 下一批删.
#
# The programs carry no deployment's address any more: a hub, a relay, a brand
# host is a setting (fleet.conf [common], the pod's environment, a deploy
# overlay). A machine of ours that does not set the new key yet keeps working
# through THIS file, and only when its configured hub is one listed here — a
# machine pointed at any other hub never reads a value from it.
#
# <KEY>=<value>, one per line; read by bin/fleet_compat.py (the one reader).

# the hubs these values belong to (hostnames, space-separated)
FLEET_COMPAT_HUB_HOSTS=claudefleet.24haowan.com ccquota.24haowan.com
# FLEET_CRED_RELAY_URL's old built-in default (bin/fleet-node-linux.py)
FLEET_CRED_RELAY_URL=https://fleet-relay.24hw.cn
