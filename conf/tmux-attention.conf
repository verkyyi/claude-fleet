# tmux-attention.conf — the tmux configuration of a NODE's fleet server (claude-fleet).
# Loaded by conf/tmux-fleet-server.conf, the file every fleet server starts from
# (issue #1845); ~/.tmux.conf may source it too (bin/reapply-tmux-attention.sh).
# NB: paths below assume the canonical install dir ~/.claude/fleet — adjust if
# you installed elsewhere.
#
# A node's fleet session carries EXECUTION sessions only (issue #1714, EPIC #1710
# C4): the window baseline, each window's header, the reaper and the sleep hooks.
# Everything a person looks at or presses — the task list, the bar, the popups
# and keys — is the CLIENT's (conf/tmux-shell.conf, `fleet`). Window state
# (@claude_state, set by Claude Code hooks -> bin/set-claude-state.sh, and the
# spinner's @spin/@attn_needs, bin/tmux-spinner.sh) is still kept here: the
# client's list reads it.

# --- FLEET BASELINE: opinionated tmux defaults the fleet UX assumes ----------
# These moved here from the operator's personal ~/.tmux.conf (issue #222) so a
# FRESH install gets a consistent fleet UI/UX without hand-editing tmux.conf —
# previously they lived only in a pre-repo install.sh's ~/.tmux.conf, so the
# clickable footer, truecolor theme, and snappy ESC silently didn't work on a
# clean install. All are OPINIONATED: override any of them from your OWN
# ~/.tmux.conf AFTER the `source-file …tmux-attention.conf` line (later wins),
# or comment them out here. Truly personal bits (a prefix remap, personal binds)
# stay in your ~/.tmux.conf and are intentionally NOT shipped.
#
# mouse — REQUIRED: the client forwards a click or a wheel into the pane it
#   shows (conf/tmux-shell.conf), and only a server with mouse on hands it on to
#   Claude / opens copy-mode. Trade-off on a direct attach: mouse mode captures
#   select-to-copy in most terminals (hold Shift — or Option on macOS/iTerm).
set -g mouse on
# Truecolor — the theme below uses 24-bit hex colors (#1a1b26 …); without a
#   truecolor-capable TERM they degrade to the nearest 256-color. Set
#   default-terminal to match your terminal if it differs (e.g. screen-256color);
#   the Tc override is additive (-ga) and harmless when already truecolor. On
#   tmux ≥3.2 the modern spelling is `set -as terminal-features ",*:RGB"`.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Snappier ESC — the default 500ms delay makes the Claude TUI / vim feel laggy
#   on ESC; 10ms is imperceptible for prefix chords.
set -g escape-time 10
# No paste guessing (issue #1098) — REQUIRED by the task sidebar, not taste.
#   At the default 1ms, keys arriving together (an IME committing a whole CJK
#   phrase in one write) are judged a "paste" and sent to the ACTIVE pane — the
#   worker — without a key-table lookup, so the sidebar's `fleet-sidebar` table
#   never sees them. 0 turns the guess off. A real paste into Claude is
#   unaffected: the root table binds no printable key, so each key still lands
#   on the active pane, and a terminal's bracketed paste is not a guess at all.
#   Each fleet runs its own tmux server (-L <session>), so this reaches no other.
set -g assume-paste-time 0
# A terminal's bracketed paste (ESC[200~ … ESC[201~) is not a guess and is not
# looked up at all: tmux forwards every byte of it to the CLIENT's pane before
# any key table (3.4 and 3.6a alike) — so with the keyboard on the task sidebar
# it went to Claude (issue #1105). The task view PINS the client's own pane to
# itself while it holds the keyboard, via the `active-pane` client flag under
# which `select-pane` moves that ONE client's pane and not the window's (what
# every background script resolves). It drives that through the C-M-S-F12 bind
# below — never an inline select-pane in a key/mouse bind, which on 3.4 moved the
# window's active pane despite the flag — and drops it on hand-back.
# Deep scrollback — a long worker turn scrolls off a small buffer fast.
set -g history-limit 50000

set -g monitor-bell on
set -g allow-passthrough on
# Keep window numbers contiguous and matching display order (no gaps like 0,1,4,7)
# so prefix+N always targets the Nth window you see. base-index 1 = first window is 1.
set -g base-index 1
set -g renumber-windows on
# One window, one size per VIEWER (issue #1681): a view session (#1489) shares the
# fleet's windows, and the default `latest` sized every window by whichever client
# moved last — a phone dragged the wide window someone else was reading down to
# its own size, and back, a full-screen redraw each time. aggressive-resize sizes a
# window only by the clients looking at IT; several on one window → the smallest.
set -g window-size smallest
set -g aggressive-resize on
# Keep window names set explicitly at creation — the fleet navigates by name
# (dash / prefix+a), so don't let the running process rename windows out from
# under it. (Baseline; grouped with the block above conceptually.)
set -g allow-rename off
setw -g automatic-rename off

# --- per-window list: REMOVED (issue #105) ------------------------------------
# The per-window status strip grew unwieldy with many workers, so the list is
# gone — window-status-format/-current-format are empty and the bar collapses to
# status-left … status-right. The "who needs me" signal it carried now lives in
# a single compact needs-count badge in status-left (see below).
# The hub cue survives the removal: the always-on status-left "⌂" hub icon (#141)
# and the @hub pane-border title (further down) both render independently of
# the list.
# bin/tmux-spinner.sh still tracks per-window @spin/@sfg/@nfg + @claude_state
# (it drives the needs tally) — those just aren't rendered inline anymore.
set -g window-status-format ""
set -g window-status-current-format ""
setw -g window-status-separator ""

# --- TOP-OF-WINDOW HEADER: "you are here" per window (issue #267) --------------
# Every window shows a header at the TOP of its pane naming the session it holds
# — its name plus the bound ` ##{@issue}` when the window is issue-bound — so
# you always know which worker/scratch you're looking at, EXCEPT the hub, which
# keeps its own hub cue instead of an issue/name header (see the format's
# @hub / @dash branches below).
#
# `pane-border-status top` is ON globally so this reaches EVERY window uniformly —
# spawned (dash-issue-session.sh), restored (fleet-restore.sh's raw new-window),
# and ad-hoc alike — without each spawn path having to opt in. It costs 1 row of
# height per pane. Renders on single-pane windows too (verified tmux 3.6a; older
# tmux only drew pane borders with >1 pane). bin/hub-session.sh still sets it
# on the hub window explicitly, which is now just a redundant re-affirm.
#
# The format is a three-way branch on the pane's role markers:
#   @hub=1     → "▸ FLEET HUB · <login>" — nothing sets @hub automatically since
#                the hub went dash-only; kept for a pane an operator marks by hand
#                (the cue survives fullscreen zoom
#                via F9 / hub-zoom.sh, where the border is the only cue)
#   @dash=1    → empty — the hub's dash pane is part of the hub, so no issue/name
#                header (this is what "except the hub" means at the pane level)
#   else       → the worker/scratch header: name + the bound ##{@issue} — no
#                `WORKER` label, no `index:` (issue #1023: indexes shift on close,
#                navigate by name), no repo tag (the dash shows the repo)
#   Focus is COLOUR ONLY (issue #999): the words are a function of the pane, never
#   of focus — TASKS / the worker name keep the same text whether or not they hold
#   input; the focused one just gets its bg (amber sidebar under the fleet-sidebar
#   key table, a blue fill on the active worker's name otherwise), so the line
#   never jumps on a focus move.
# NB literal '#' before the issue needs '###' (## -> literal #, then #{@issue}).
# NB2 styles are written as SEPARATE tokens (#[fg=…]#[bold]), never the comma form
# #[fg=…,bold]: a comma inside #[…] is swallowed by the enclosing #{?…} as a branch
# separator and the whole branch renders empty (verified tmux 3.6a) — which is why
# the old comma-form hub title never actually drew.
#
# (The `@summary` segment that used to follow #issue here — the dash summarizer's
# one-liner republished as a window option, issue #455 — retired with the summary
# column in issue #535. window_name is still never touched: names are fleet-owned,
# allow-rename is off above, and fleet-restore reconciles open windows BY NAME.)
# --- the PR segment after the name: PR #N + its checks (issue #1954) ----------
# Right after the name a coloured block names the window's OPEN PR and whether its
# checks passed — the same for a Claude Code and a Codex session, because tmux
# draws it, not the agent (the mod's progress band stays as a mirror). It reads
# the window options bin/tmux-pr-refresh.sh (their single writer) stamps:
#   @pr_num   `#N` of the branch's open PR — no option / "" → no segment at all,
#             so a window without a PR keeps the header byte for byte
#   @pr_ci    ✓ green 「✓ 检查通过」 · … amber 「… 检查中」 · ✗ red 「✗ <red check
#             names>」 (@pr_fail, cut to 24 columns, … included; none named → 「检查没过」);
#             "" = the PR has no checks → just `PR #N`, muted
# Format only, no key (the node conf binds nothing). Panels never show it.
# --- the RIGHT side of the header: context % · model · effort (issue #1452) ---
# The worker/scratch branch ends with a right-aligned segment that replaces the
# Claude Code bottom status line (conf/statusline.sh prints nothing since #1452;
# it only stamps). It reads window options the status line stamps every render:
#   @ctx_pct   the context %, always shown while it exists — coloured by
#              @ctx_band (handoff = red, watch = amber, ok = green: the fleet's
#              own handoff lines, see statusline.sh), or, when no band is
#              stamped (a Codex window: fleet-codex-session.py stamps the %
#              alone), by the 80 / 50 fallback bands
#   @model     the display name, from pane_width 70
#   @effort    the effort level, from pane_width 100 (and only beside a model)
# so a narrow pane drops the effort first, then the model, and keeps the %. No
# @ctx_pct (a window that never rendered, a Codex window before its first
# measure) → no segment at all, and the header is byte for byte the old one.
# Panels never show it: the hub / dash / sidebar branches above don't reach it,
# and a window NAMED dash / plan / backlog is gated out by name.
# NB3 the `%` glyph is `#{@pct_sign}` (a global option set just below), never a
# literal: the format goes through strftime(3) once per draw AND once more for
# every #{?…} branch it sits in (five deep here), so `%%` is eaten on the second
# pass and the literal count would have to be 2^6. An option's VALUE is
# substituted after that level's pass and never re-expanded, so it survives at
# any depth (verified tmux 3.6a, both the border draw and display-message).
# NB4 `#{e|>=:…}`, not `#{>=:…}`: the bare comparison is a STRING compare
# ("120" < "60"); `e|` compares as numbers.
set -g @pct_sign '%'
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{@hub},1},#[fg=#7aa2f7]#[bold]▸ FLEET HUB · #{?@login,#{@login},#{user}} #[default],#{?#{==:#{@dash},1},,#{?#{==:#{@sidebar},1},#[fg=#565f89] TASKS #[default],#{?#{&&:#{pane_active},#{!=:#{client_key_table},fleet-sidebar}},#[fg=#1a1b26]#[bg=#7aa2f7]#[bold],#[fg=#565f89]} #{window_name}#{?#{@issue}, ###{@issue},}#{?#{@title_info}, · #{@title_info},} #[default]#{?#{m/r:^(dash|plan|backlog|home)$,#{window_name}},,#{?@pr_num,#{?#{==:#{@pr_ci},✗},#[fg=#1a1b26]#[bg=#f7768e]#[bold],#{?#{==:#{@pr_ci},…},#[fg=#1a1b26]#[bg=#e0af68]#[bold],#{?#{==:#{@pr_ci},✓},#[fg=#1a1b26]#[bg=#9ece6a]#[bold],#[fg=#a9b1d6]}}} PR #{@pr_num}#{?#{==:#{@pr_ci},✓}, ✓ 检查通过,}#{?#{==:#{@pr_ci},…}, … 检查中,}#{?#{==:#{@pr_ci},✗}, ✗ #{?@pr_fail,#{=/24/…:@pr_fail},检查没过},} #[default] ,}#{?#{@ctx_pct},#[align=right]#{?#{==:#{@ctx_band},handoff},#[fg=#f7768e],#{?#{==:#{@ctx_band},watch},#[fg=#e0af68],#{?#{==:#{@ctx_band},ok},#[fg=#9ece6a],#{?#{e|>=:#{@ctx_pct},80},#[fg=#f7768e],#{?#{e|>=:#{@ctx_pct},50},#[fg=#e0af68],#[fg=#9ece6a]}}}}}#{@ctx_pct}#{@pct_sign}#[default]#{?#{&&:#{@model},#{e|>=:#{pane_width},70}}, · #{@model},}#{?#{&&:#{@effort},#{&&:#{@model},#{e|>=:#{pane_width},100}}}, · #{@effort},} ,}}}}}"

# --- status bar: conf/tmux-bar.conf, coloured from conf/fleet-palette.conf -----
# (issue #1534). The bar's block moved to its own file because tmux expands a
# `$PAL_*` name while it PARSES a file, and a `source-file` placed above in THIS
# file only runs after the whole of it was parsed: the palette has to be loaded
# before the file that spells the colours is even read. `-F` resolves both beside
# this conf wherever it is installed; delete the two lines if you have a bar of
# your own.
source-file -F '#{d:current_file}/fleet-palette.conf'
source-file -F '#{d:current_file}/tmux-bar.conf'

# --- the person's keys, popups and list: NONE here (issue #1714, EPIC #1710 C4) --
# A node's fleet session carries execution sessions only. Every key, popup and
# list a person uses lives in the CLIENT — conf/tmux-shell.conf, `-L fleet-shell`
# (`fleet`) — and a client reaches this server through a VIEW session whose
# prefix is None and status off (fleet-remote-view.sh), so no prefix bind here
# could ever fire for it. Someone who attaches directly anyway (not stopped, not
# advertised) gets tmux's stock keys and the one-line hint at the top of the
# screen (conf/tmux-bar.conf). What went where — kept / moved to the client /
# deleted — is the table in PR #1714's description; in short:
#   moved   prefix g · Space · E (the list, focused), z · [ (act on the session
#           while the list has the keyboard), ? (the full key sheet), F9, h, the
#           list's key table and its hooks — all in conf/tmux-shell.conf
#   deleted prefix a (next needs: the list orders by it), b · u · ! · c (backlog
#           / usage / alerts / config popups), e (the client's list is not
#           optional), the ☰ / ● / ✖▲ bar clicks, the hub-visit meter [73]
#   kept    everything above this line, the window reaper [72] and the sleep
#           wake [72] below — execution, not presentation
#
# STOCK RESTORES (keep them — they are tmux's own bindings, not fleet keys): an
# older version of this file overrode these. tmux-conf-reload.sh unbinds a key
# that disappeared from this file, which would leave a STOCK key dead — a click
# that never reaches Claude, a prefix z that does nothing — so each is spelled
# here with tmux's default (3.6a `list-keys`) and the reload re-applies it.
# MouseDown1Status is not among them: its stock differs by version (3.4
# `select-window -t =`, 3.6a `switch-client -t =`), and on a node it only clicks
# the one static hint line — a reload leaves it unbound, which costs nothing.
# fleet-keys-selftest.sh ignores them (they restore, they do not add).
bind z resize-pane -Z
bind [ copy-mode
bind Space next-layout
bind E select-layout -E
bind c new-window
bind ! break-pane
bind ? list-keys -N
bind n next-window
bind r refresh-client
bind -n MouseDown1Pane select-pane -t = \; send-keys -M
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
# The list's hooks [71] and the hub-visit meter [73] left with the keys. A
# conf reload never removes a hook on its own, so a live server drops them here.
set-hook -gu session-window-changed[71]
set-hook -gu client-attached[71]
set-hook -gu client-detached[71]
set-hook -gu window-resized[71]
set-hook -gu window-layout-changed[71]
set-hook -gu pane-exited[71]
set-hook -gu pane-died[71]
set-hook -gu after-kill-pane[71]
set-hook -gu after-select-pane[71]
set-hook -gu session-window-changed[73]
set-hook -gu client-attached[73]
# A list an OLDER version drew in a node window (before #1713) has no hook left
# to take it away: one sync per session on this (re)load does — a node's sync
# only reaps (fleet-sidebar.sh). A fresh server has nothing to reap.
run-shell -b 'for s in $(tmux list-sessions -F "##{session_id}" 2>/dev/null); do bash ~/.claude/fleet/bin/fleet-sidebar.sh sync "$s"; done >/dev/null 2>&1 || :'

# A closed window takes its process trees with it (issue #1298): a disowned job,
# a Bash-tool `&`, an MCP server's headless browser, orphaned to init with its cwd
# in a worktree / scratchpad nobody is working in any more, is killed seconds
# after the close instead of found by a scan days later. The sweeper backgrounds
# itself and runs one schedule per burst of closes; FLEET_WINDOW_REAP=0 turns it off.
set-hook -g window-unlinked[72] { run-shell -b "bash ~/.claude/fleet/bin/fleet-window-reap.sh --hook '#{hook_session_name}' >/dev/null 2>&1 || :" }
set-hook -g pane-exited[72] { run-shell -b "bash ~/.claude/fleet/bin/fleet-window-reap.sh --hook >/dev/null 2>&1 || :" }
set-hook -g after-kill-pane[72] { run-shell -b "bash ~/.claude/fleet/bin/fleet-window-reap.sh --hook >/dev/null 2>&1 || :" }
# A session's identity goes where its agent pane goes (issue #1844): tmux has no
# after-break-pane hook, but `prefix !` links a new window, and a wrapper pane
# (@wrap_win) arriving in a window that is not its own is that break. Any other
# new window is untouched — the guard is one format test, no fork.
set-hook -g window-linked[74] { if -F '#{&&:#{@wrap_win},#{!=:#{@wrap_win},#{hook_window}}}' { run-shell -b "bash ~/.claude/fleet/bin/fleet-window-carry.sh '#{hook_window}' >/dev/null 2>&1 || :" } }
# Navigation/attach wake — OFF by default (issue #1050). `--nav` makes the call a
# no-op unless FLEET_SLEEP_WAKE=dwell: under the default `confirm`, arriving on a
# sleeper only shows its page, and it wakes from the page's double press (⏎ or a
# tap, twice within FLEET_SLEEP_WAKE_ARM s) or the sidebar menu's Wake. With
# `dwell` these are the old wake-on-arrival: DWELL (issue #822) — `--dwell 2`
# sleeps, then wakes only if the window is STILL the session's current one, so a
# window only passed over (sidebar ↑↓ follow, prefix n/p) never resumes. -b, so
# tmux never waits; fleet-sleep.sh exits before python when the knob says no.
# `#{?#{session_group},…}`: a shell's view session (`<fleet>@view-<id>`, issue #1489)
# fires these too — its group is named after the fleet session, so the script gets
# the fleet's name, never the view's.
set-hook -g session-window-changed[72] { if -F '#{==:#{@worker_lifecycle},sleeping}' { run-shell -b "bash ~/.claude/fleet/bin/fleet-sleep.sh wake '#{?#{session_group},#{session_group},#{session_name}}' '#{window_id}' --dwell 2 --nav" } }
set-hook -g client-attached[72] { if -F '#{==:#{@worker_lifecycle},sleeping}' { run-shell -b "bash ~/.claude/fleet/bin/fleet-sleep.sh wake '#{?#{session_group},#{session_group},#{session_name}}' '#{window_id}' --dwell 2 --nav" } }
# A popup a node-side script opens (dash-popup.sh stamps @popup_open, issues
# #308/#431) dies with its client: clear the flag the instant a client leaves.
set-hook -g client-detached[0] 'set -g @popup_open 0'

# let programs set the client clipboard (OSC52), e.g. gh-glance URL copy
set -g set-clipboard on
set -g focus-events on

# solid pane split line — no active-pane highlight on switch, not even tmux's
# half-coloured split (pane-border-indicators, issue #1764)
set -g pane-border-style 'fg=#565f89'
set -g pane-active-border-style 'fg=#565f89'
set -g pane-border-indicators off

# --- fleet-human: no key or menu on this server deletes a session (issue #1840) --
# The read-only right-click menu and the unbound prefix x & $ < > live in their
# own file, which conf/tmux-fleet-server.conf loads once more AFTER the person's
# ~/.tmux.conf. Here, so a live reload of this file carries it too.
source-file -F '#{d:current_file}/tmux-node-human.conf'

# --- the marker (issue #1845) — keep LAST ---------------------------------------
# Set only when this whole file parsed and ran, so a server carrying it has the
# fleet layer. `fleet doctor`'s tmuxconf row compares it with the value here
# (fleet_tmuxconf_check): bump it when a server must reload to carry a new rule.
set -g @fleet_conf_loaded "v2"
