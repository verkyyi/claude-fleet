# .gitleaks.toml — what `gitleaks git` may report in this repo's history, and
# nothing more (issue #3571, EPIC #3569 C1). Read by bin/oss-scan.sh --history.
#
# The default rule set stays on. Each [[allowlists]] below confirms ONE finding
# by commit + path + rule (condition AND) — never a whole directory, never a
# rule everywhere — so a new secret in the same file, or the same shape in
# another file or commit, is still reported. The verdict per finding is written
# in docs/dev/OSS-INVENTORY.md «历史里像密钥的 28 处» (2026-10-12, at ecae8bfa:
# 0 real secrets, 1 real host public key — not a credential).
#
# A new finding is never added here to make the scan quiet: confirm it first
# (the value's shape, never its text in a comment), and if it is real, revoke it.

[extend]
useDefault = true

[[allowlists]]
description = "#1 github-pat · bin/client-log-selftest.sh:51 @ 02e5f79e — 测试假数据：脱敏测试的输入（AKIA+字母表 / AbCdEf 重复）"
condition = "AND"
targetRules = ["github-pat"]
commits = ["02e5f79e507346572f3bd66866c7a5ed557042f2"]
paths = ['''^bin/client\-log\-selftest\.sh$''']

