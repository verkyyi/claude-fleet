<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{legal_title}} · {{brand}}</title>
<meta name="description" content="{{legal_desc}}">
<link rel="canonical" href="__ORIGIN__{{legal_path}}">
<link rel="alternate" hreflang="zh-CN" href="__ORIGIN__{{legal_zh}}">
<link rel="alternate" hreflang="en" href="__ORIGIN__{{legal_en}}">
<meta name="theme-color" content="{{fleet_bg}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/*{{fleet_theme}}*/
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--fleet-bg);color:var(--fleet-ink);font:400 16px/1.75 var(--fleet-font-ui);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--fleet-clay-hi);outline-offset:3px;border-radius:6px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.nav{position:sticky;top:0;z-index:30;background:rgba(25,24,42,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--fleet-line-2)}
.nav .wrap{display:flex;align-items:center;height:60px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font:750 19px/1 var(--fleet-font-display)}
.brand img{width:30px;height:30px}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:15px}
.nav-r a{color:var(--fleet-ink-2)} .nav-r a:hover{color:var(--fleet-ink)}
.lang{display:inline-flex;align-items:center;gap:5px;font:400 13px/1 var(--fleet-font-ui);color:var(--fleet-muted)!important}
.lang svg{width:14px;height:14px}
main{max-width:760px;margin:0 auto;padding:44px 32px 80px}
main h1{font:700 34px/1.25 var(--fleet-font-display);margin:0 0 18px}
main h2{font:650 21px/1.35 var(--fleet-font-display);margin:36px 0 10px}
main p,main ul,main ol{margin:0 0 14px;color:var(--fleet-ink-2)}
main li{margin:4px 0}
main strong{color:var(--fleet-ink)}
main a{color:var(--fleet-clay-hi);text-decoration:underline;text-underline-offset:2px}
main blockquote{margin:0 0 20px;padding:10px 16px;border-left:3px solid var(--fleet-clay);background:var(--fleet-clay-soft);border-radius:0 10px 10px 0}
main blockquote p{margin:0;color:var(--fleet-ink)}
main table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14.5px;display:block;overflow-x:auto}
main th,main td{border:1px solid var(--fleet-line);padding:7px 10px;text-align:left;vertical-align:top;color:var(--fleet-ink-2)}
main th{background:var(--fleet-bg-2);color:var(--fleet-ink)}
footer{border-top:1px solid var(--fleet-line-2);background:var(--fleet-bg-2);padding:13px 0;font-size:13.5px;color:var(--fleet-muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
footer a:hover{color:var(--fleet-ink)}
footer a[aria-current]{color:var(--fleet-ink)}
footer .gh{display:inline-flex;gap:6px;align-items:center}
footer .gh svg{width:16px;height:16px}
footer .disc{margin-left:auto;font-size:12.5px}
footer .disc a{text-decoration:underline;text-underline-offset:2px}
@media (max-width:640px){
  .wrap{padding:0 20px}
  .nav .wrap{height:56px;gap:8px}
  .nav-r{gap:16px}
  main{padding:28px 20px 60px}
  main h1{font-size:27px}
  footer .disc{margin-left:0;flex-basis:100%}
}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="{{path}}"><img src="/site/logo.svg" alt="">{{brand}}</a>
  <div class="nav-r">
    <a href="{{path}}">{{legal_home}}</a>
    <a class="lang" href="{{legal_other}}" hreflang="{{other_hreflang}}" lang="{{other_hreflang}}" aria-label="{{lang_group}}: {{other_name}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>{{lang_switch}}</a>
  </div>
</div></header>
<main>
{{legal_body}}
</main>
{{footer}}
</body>
</html>
