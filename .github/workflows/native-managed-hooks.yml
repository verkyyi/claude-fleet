name: native-managed-hooks

on:
  pull_request:
    paths:
      - 'bin/fleet-native-hook-cli-selftest.py'
      - 'bin/fleet-native-local-runtime-selftest.py'
      - 'bin/fleet-native-session-env-selftest.py'
      - 'bin/fleet-native-thread-stop-selftest.py'
      - 'extras/managed-node/Dockerfile'
      - 'bin/fleet-mcp.py'
      - 'bin/fleet_launch.py'
      - 'bin/fleet-agent-defaults.py'
      - 'conf/agent-defaults/codex/config.default.toml'
      - 'bin/fleet-codex-rpc.py'
      - 'bin/fleet-hooks-emit.sh'
      - 'hooks/settings-hooks.json'
      - 'hooks/codex-map.json'
      - 'hooks/bash-guard.py'
      - 'hooks/base-readonly-guard.py'
      - '.github/workflows/native-managed-hooks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-managed-hooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-managed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [exec, remote-tui]
    env:
      NATIVE_HOOK_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare native Linux sandbox prerequisites on disposable runner
        id: native_sandbox
        if: matrix.mode == 'exec'
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor-profiles apparmor-utils
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns &&
             test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          command -v bwrap
          bwrap --version
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / \
            --proc /proc --dev /dev -- /usr/bin/true
      - name: Fetch pinned official Codex package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-codex"
          curl --fail --location --max-time 120 \
            https://registry.npmjs.org/@openai/codex/-/codex-0.162.1-linux-x64.tgz \
            --output "$RUNNER_TEMP/codex.tgz"
          printf '%s  %s\n' \
            7232b699d1c87c47a9675950d4c5f7693402fbc9dc22cbe769c97feaf23674821c7cff3f32b853436faa46591714d0f32528f5777eaab88b333fedffe0250959 \
            "$RUNNER_TEMP/codex.tgz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/codex.tgz" -C "$RUNNER_TEMP/native-codex"
      - name: Verify local TUI runtime and worktree ownership without credentials
        if: matrix.mode == 'exec'
        run: |
          timeout 330 python3 bin/fleet-native-local-runtime-selftest.py --launch-flags --native-config \
            --codex "$RUNNER_TEMP/native-codex/package/vendor/x86_64-unknown-linux-musl/bin/codex"
      - name: Verify concurrent native TUI and MCP session environment ownership
        if: matrix.mode == 'exec'
        run: >-
          timeout 100 python3 bin/fleet-native-session-env-selftest.py --hooks
          --codex "$RUNNER_TEMP/native-codex/package/vendor/x86_64-unknown-linux-musl/bin/codex"
      - name: Verify native fork correlation, source cleanup and reconnect
        if: matrix.mode == 'exec'
        run: >-
          timeout 100 python3 bin/fleet-native-session-env-selftest.py --hooks --fork-seed
          --codex "$RUNNER_TEMP/native-codex/package/vendor/x86_64-unknown-linux-musl/bin/codex"
      - name: Verify native per-thread background-terminal lifecycle
        if: matrix.mode == 'exec'
        run: >-
          timeout 100 python3 bin/fleet-native-thread-stop-selftest.py
          --codex "$RUNNER_TEMP/native-codex/package/vendor/x86_64-unknown-linux-musl/bin/codex"
      - name: Compare native lifecycle against pinned Codex 0.163.0
        if: always() && matrix.mode == 'exec' && steps.native_sandbox.outcome == 'success'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-codex-comparison"
          curl --fail --location --max-time 120 \
            https://registry.npmjs.org/@openai/codex/-/codex-0.163.0-linux-x64.tgz \
            --output "$RUNNER_TEMP/codex-comparison.tgz"
          printf '%s  %s\n' \
            bb045a3acad8a202d085cc4033f1a8796af0d1021610c468edcf6033cb0a02f89591940796ef6444b2793e4b9f6d5f800468f2660230885749d0b089d0de9ef3 \
            "$RUNNER_TEMP/codex-comparison.tgz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/codex-comparison.tgz" -C "$RUNNER_TEMP/native-codex-comparison"
          timeout 100 python3 bin/fleet-native-thread-stop-selftest.py \
            --codex "$RUNNER_TEMP/native-codex-comparison/package/vendor/x86_64-unknown-linux-musl/bin/codex"
      - name: Test managed and optional hooks without PRoot or credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted"
          assert os.geteuid() != 0 and not Path("/etc/codex").exists()
          mode = os.environ["NATIVE_HOOK_MODE"]
          assert mode in ("exec", "remote-tui")
          binary = Path(os.environ["RUNNER_TEMP"], "native-codex/package/vendor/x86_64-unknown-linux-musl/bin/codex")
          assert binary.is_file() and os.access(binary, os.X_OK), "pinned package binary missing"
          namespace = os.stat("/proc/self/ns/mnt").st_ino
          script = Path("bin/fleet-native-hook-cli-selftest.py").resolve()
          subprocess.run(["sudo", "-n", "mkdir", "/etc/codex"], check=True)
          try:
              with tempfile.TemporaryDirectory(prefix="fleet-managed-system-", dir="/tmp") as system:
                  command = ["sudo", "-n", "unshare", "--mount", "--propagation", "private", "/bin/sh", "-eu", "-c",
                             'mount --bind "$1" /etc/codex; shift; exec "$@"', "fixture", system,
                             "setpriv", "--reuid", str(os.getuid()), "--regid", str(os.getgid()),
                             "--init-groups", "--no-new-privs", "env", "-i", "PATH=/usr/bin:/bin",
                             "GITHUB_ACTIONS=true", "RUNNER_ENVIRONMENT=github-hosted",
                             "FLEET_NATIVE_PARENT_MOUNT_NS=" + str(namespace),
                             "/usr/bin/python3", str(script), "--codex", str(binary),
                             "--managed-system-dir", system]
                  if mode == "remote-tui":
                      command.append("--remote-tui")
                  result = subprocess.run(command, check=False, timeout=300)
                  assert not list(Path("/etc/codex").iterdir()), "fixture escaped its mount namespace"
                  assert os.stat("/proc/self/ns/mnt").st_ino == namespace
                  assert result.returncode == 0, "native managed hook probe failed"
          finally:
              subprocess.run(["sudo", "-n", "rmdir", "/etc/codex"], check=True)
          PY
