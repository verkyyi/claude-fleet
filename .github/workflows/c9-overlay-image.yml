# The C9 TEST-ONLY overlay image (extras/managed-node/c9/Dockerfile, issue
# #4625): built on demand, never by a push, never consumed by stable or by a
# machine. It sits on the released managed-node image of the same commit (the
# `node image` status the train leaves, issue #4180) and is pushed ONLY as
# <repo>:c9-<sha>; C9-ISOLATION.md's recipe then names it by digest.
# Same runner, buildkitd, OIDC role and environment as the train's node image.
name: c9 overlay image

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "40-character commit whose released node image to overlay (empty = stable)"
        required: false
        default: ""
      node_a_login:
        description: "node-a workload login (a hub-adoptable name: [a-z0-9]{2,16})"
        required: false
        default: c9a
      node_b_login:
        description: "node-b workload login"
        required: false
        default: c9b
      hub_login:
        description: "hub workload login"
        required: false
        default: c9hub

concurrency:
  group: c9-overlay-image
  cancel-in-progress: false

jobs:
  build:
    name: c9 overlay
    runs-on: fleet-ack
    timeout-minutes: 30
    environment: node-image
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_REPO: ${{ vars.NODE_IMAGE_BUILD_REPO || vars.NODE_IMAGE_REPO }}
      GH_TOKEN: ${{ github.token }}
      IN_SHA: ${{ inputs.sha }}
      LOGIN_A: ${{ inputs.node_a_login }}
      LOGIN_B: ${{ inputs.node_b_login }}
      LOGIN_HUB: ${{ inputs.hub_login }}
    steps:
      - name: the commit and its released node image
        id: src
        run: |
          set -euo pipefail
          sha=$IN_SHA
          if [ -z "$sha" ]; then
            sha=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/stable" | jq -r .object.sha)
          fi
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::not a 40-character sha: $sha"; exit 1; }
          for l in "$LOGIN_A" "$LOGIN_B" "$LOGIN_HUB"; do
            printf '%s' "$l" | grep -Eqx '[a-z0-9]{2,16}' || { echo "::error::login $l is not [a-z0-9]{2,16}"; exit 1; }
          done
          desc=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$sha/statuses?per_page=100" \
            | jq -r '[.[] | select(.context == "node image" and .state == "success")][0].description // empty')
          digest=${desc##*@}
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' \
            || { echo "::error::$sha has no released node image (no 'node image' status)"; exit 1; }
          printf 'sha=%s\nbase=%s@%s\n' "$sha" "$BUILD_REPO" "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.src.outputs.sha }}
      - uses: ./.github/actions/hub-acr
        with:
          role: gha-claudefleet-node-image
      - name: build and push <repo>:c9-<sha>
        id: build
        env:
          SHA: ${{ steps.src.outputs.sha }}
          BASE: ${{ steps.src.outputs.base }}
        run: |
          set -uo pipefail
          : "${BUILDKIT_HOST:?BUILDKIT_HOST is not set (the cluster buildkitd)}"
          tls=(); [ -z "${BUILDKIT_TLSDIR:-}" ] || tls=(--tlsdir "$BUILDKIT_TLSDIR")
          out=$(mktemp -d)
          buildctl --addr "$BUILDKIT_HOST" ${tls[@]+"${tls[@]}"} build \
            --frontend dockerfile.v0 \
            --local context=. --local dockerfile=extras/managed-node/c9 \
            --opt platform=linux/amd64 \
            --opt build-arg:C9_BASE="$BASE" --opt build-arg:C9_SOURCE_SHA="$SHA" \
            --opt build-arg:C9_HUB_LOGIN="$LOGIN_HUB" \
            --opt build-arg:C9_NODE_A_LOGIN="$LOGIN_A" --opt build-arg:C9_NODE_B_LOGIN="$LOGIN_B" \
            --output "type=image,name=$BUILD_REPO:c9-$SHA,push=true" \
            --metadata-file "$out/meta.json" --progress plain || exit 1
          digest=$(jq -r '."containerimage.digest" // empty' "$out/meta.json")
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::pushed, but no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### C9 overlay \`${SHA:0:7}\` (test-only)"
            echo '```'
            echo "base   $BASE"
            echo "image  $BUILD_REPO@$digest"
            echo "logins hub=$LOGIN_HUB node-a=$LOGIN_A node-b=$LOGIN_B"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
