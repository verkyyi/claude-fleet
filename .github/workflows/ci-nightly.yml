name: CI nightly

# Every PR check, whole, once a day — the backstop of the PR gate's skips (issue
# #4816, EPIC #4810 C6; docs/dev/CI.md «每晚»).
#
# The PR gate (ci.yml) runs only what bin/ci-plan.sh says a change reaches: the Go
# blocks it maps (agent ⇒ agent + e2e, never hub …, narrowed by `go list -test`),
# each end-to-end check by its rules, and a skipped check reads green. A test that
# reads something outside what selected it goes red with nothing running it. This
# runs all of it on master:
#
#   * 22:17 UTC = 06:17 Beijing (beside selftests-nightly.yml, which keeps the Linux
#     selftests — not called here), and workflow_dispatch (`since`: the window's
#     start). `board` fixes the window: since = the commit the previous scheduled
#     run tested, else the first-parent commit a day before.
#   * every check ci.yml can call, with no plan: tokenledger.yml with its defaults —
#     the four Go blocks whole and every Postgres part; on a non-PR event it restores
#     no Go cache and runs `go test -race -count=1` (the test cache never answers
#     here) and uploads each part's `go test -v` log (go-log-* / pg-log-*); every
#     end-to-end check (task-acceptance, client-e2e on Linux and macOS, fleet-hub-mcp
#     on both, browser-attachment, hub-rolling …). Not oss-scan (it reads a PR's
#     diff) nor selftests (selftests-nightly.yml). The checks keep no schedule of
#     their own: this is their nightly.
#   * `report` (汇总) writes every check's result into the run's summary. A red
#     check is the run's red — GitHub's own failed-run notice is the alert; nothing
#     here files an issue (issue #4900 removed #4816's 「漏测自动开单」).
#
# Nothing here moves stable, releases or touches a machine.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI nightly @ {0}', github.ref_name) || 'CI nightly' }}

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'the window''s start for the miss analysis (default: the last scheduled run''s commit)'
        type: string
        required: false
        default: ''

concurrency:
  group: ci-nightly
  cancel-in-progress: false

# the most any called workflow's jobs ask for (as ci.yml)
permissions:
  contents: read
  actions: read

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.board.outputs.sha }}
      since: ${{ steps.board.outputs.since }}
      prev_run: ${{ steps.board.outputs.prev_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the commit and the window
        id: board
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since || '' }}
        run: |
          set -u
          sha=$(git rev-parse HEAD)
          # the last scheduled run before this one: its commit starts the window,
          # its nightly-checks artifact is tonight's --prev-checks
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-nightly.yml/runs?event=schedule&status=completed&per_page=10" \
                   --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | [.id, .head_sha] | @tsv" 2>/dev/null | head -1)
          prev_run=$(printf '%s' "$prev" | cut -f1) prev_sha=$(printf '%s' "$prev" | cut -f2)
          if [ -n "$SINCE" ]; then
            since=$(git rev-parse --verify -q "$SINCE^{commit}") || { echo "::error::$SINCE is not a commit"; exit 1; }
          elif [ -n "$prev_sha" ] && git merge-base --is-ancestor "$prev_sha" "$sha" 2>/dev/null; then
            since=$prev_sha
          else
            since=$(git rev-list -1 --first-parent --before="$(( $(git log -1 --format=%ct "$sha") - 86400 ))" "$sha")
          fi
          n=$( [ -z "$since" ] || git rev-list --first-parent --count "$since..$sha")
          { echo "sha=$sha"; echo "since=$since"; echo "prev_run=$prev_run"; } >> "$GITHUB_OUTPUT"
          echo "### 🌙 每晚全跑：master ${sha:0:7} · 窗口 ${since:0:7}..${sha:0:7}（${n:-0} 次合并）" >> "$GITHUB_STEP_SUMMARY"

  # every check ci.yml calls but selftests (selftests-nightly.yml) and oss-scan (a
  # PR's diff) — whole: no plan, so each runs its defaults
  tokenledger:
    needs: board
    uses: ./.github/workflows/tokenledger.yml
  shellcheck:
    needs: board
    uses: ./.github/workflows/shellcheck.yml
  task-acceptance:
    needs: board
    uses: ./.github/workflows/task-acceptance.yml
  client-e2e:
    needs: board
    uses: ./.github/workflows/client-e2e.yml
  fleet-hub-mcp:
    needs: board
    uses: ./.github/workflows/fleet-hub.yml
  browser-attachment:
    needs: board
    uses: ./.github/workflows/browser-attachment.yml
  hub-rolling:
    needs: board
    uses: ./.github/workflows/hub-rolling.yml
  hub-deploy-check:
    needs: board
    uses: ./.github/workflows/hub-deploy-check.yml
  cluster-perms:
    needs: board
    uses: ./.github/workflows/cluster-perms.yml
  native-claude-worktree:
    needs: board
    uses: ./.github/workflows/native-claude-worktree.yml
  native-managed-hooks:
    needs: board
    uses: ./.github/workflows/native-managed-hooks.yml
  node-join:
    needs: board
    uses: ./.github/workflows/node-join.yml
  web-chat-ui:
    needs: board
    uses: ./.github/workflows/web-chat-ui.yml
  web-console:
    needs: board
    uses: ./.github/workflows/web-console.yml

  report:
    # Every check's result in one table — the checks already carry their own red.
    name: 汇总
    needs: [board, tokenledger, shellcheck, task-acceptance, client-e2e, fleet-hub-mcp, browser-attachment, hub-rolling, hub-deploy-check, cluster-perms, native-claude-worktree, native-managed-hooks, node-join, web-chat-ui, web-console]
    if: "!cancelled() && needs.board.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: every check's result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - > checks.txt <<'PY'
          import json, os
          for job, v in json.loads(os.environ["NEEDS"]).items():
              if job != "board":
                  print(job.replace("-", "_"), v.get("result") or "unknown")
          PY
          cat checks.txt
          {
            echo "### 每晚全跑：各检查"
            echo '| 检查 | 结果 |'; echo '|---|---|'
            awk '{ printf "| %s | %s |\n", $1, $2 }' checks.txt
          } >> "$GITHUB_STEP_SUMMARY"
