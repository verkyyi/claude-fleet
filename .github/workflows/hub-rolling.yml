name: hub-rolling

# The rolling-release drill (claude-fleet#2125, EPIC #2119 C6): the hub as it
# runs after the switch — two replicas on Postgres, deploy/k8s/base — on a
# throwaway kind cluster in this runner. A probe inside the cluster hits
# /healthz and a write once a second while the hub is released three times,
# loses a pod, and takes a release that never gets ready plus hub-deploy's
# rollback of it; one second not 2xx is red (deploy/k8s/overlays/kind/drill.sh).
#
# Runs on every PR that touches what a release is made of: the manifests, the
# release scripts, this file, or the hub itself (its /readyz, its shutdown).
# Nothing here touches a real cluster, and it needs no credential.
#
# No pull goes to Docker Hub unauthenticated (claude-fleet#2734: its rate
# limit turned this red three reruns in a row): the daemon, the BuildKit
# builder and its image, and the two images the drill runs inside kind all
# come through mirror.gcr.io, Google's pull-through cache of Docker Hub.

on:
  pull_request:
    paths:
      - 'deploy/k8s/**'
      - '.github/actions/hub-release/**'
      - '.github/workflows/hub-rolling.yml'
      - 'tokenledger/**'
  workflow_dispatch:

concurrency:
  group: hub-rolling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The client /install serves (#1803): the Dockerfile refuses an empty pack.
      - name: Pack the client
        run: bin/fleet-client-pack.sh

      # The daemon's pulls (kind's node image, the preloads below) and the
      # builder's FROMs go through the mirror; Docker Hub stays the fallback.
      - name: Docker Hub through mirror.gcr.io
        run: |
          set -euo pipefail
          f=/etc/docker/daemon.json
          { sudo cat "$f" 2>/dev/null || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json
          sudo mv /tmp/daemon.json "$f"
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build the hub image
        uses: docker/build-push-action@v6
        with:
          context: tokenledger
          load: true
          tags: ccquota:drill-1
          build-args: |
            VERSION=drill
            GOPROXY=https://proxy.golang.org,direct
            DIST_TARGETS=linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Four tags of one image (a tag change is a release) and one that exits
      # at start — the release that never gets ready.
      - name: Tag the releases
        run: |
          set -euo pipefail
          for n in 2 3 4; do docker tag ccquota:drill-1 "ccquota:drill-$n"; done
          printf 'FROM ccquota:drill-1\nENTRYPOINT ["ccquota", "no-such-command"]\n' | docker build -q -t ccquota:drill-broken -

      - uses: helm/kind-action@v1
        with:
          cluster_name: hub-drill
          wait: 120s

      - name: Load the images into kind
        run: |
          set -euo pipefail
          for t in drill-1 drill-2 drill-3 drill-4 drill-broken; do kind load docker-image "ccquota:$t" --name hub-drill; done
          # The drill's own Postgres and prober: pulled here through the
          # daemon's mirror, so the kind node never asks Docker Hub for them.
          for i in postgres:16 curlimages/curl:8.10.1; do docker pull -q "$i"; kind load docker-image "$i" --name hub-drill; done

      - name: The drill (downtime_seconds must be 0)
        run: deploy/k8s/overlays/kind/drill.sh drill-1 drill-2 drill-3 drill-4 drill-broken

      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl -n hub-e2e get pod -o wide || true
          kubectl -n hub-e2e get events --sort-by=.lastTimestamp | tail -60 || true
          kubectl -n hub-e2e logs -l app=ccquota-hub -c ccquota --tail=80 --prefix || true
          kubectl -n hub-e2e logs prober || true
