name: client-e2e

# Every merge proves the installed client works (issue #1724, EPIC #1718 C6).
#
# The one way in is `curl -fsSL <hub>/install | sh`, then `fleet`. When that
# breaks, nobody gets in — and before this ran, the breakage was found by the
# next person who opened their client. bin/client-e2e.sh builds the whole road
# from THIS checkout: a hub (`ccquota hub`, 127.0.0.1) serving this commit's
# client files, a fake node whose real `ccquota agent` reports two sessions, the
# install line into a fresh HOME (its tmux step included), `fleet` opened
# headless on its own tmux socket, the node's sessions in its list, and one row
# opened in the right pane. Any step red = this job red, with the logs.
# bin/newcomer-e2e.sh (issue #2096) then walks the road BEFORE that, holding no
# operator credential: `fleet users add`, a clean HOME's install, `fleet login`
# confirmed by a drill code, `fleet` on the certificate alone, the renewal and
# the removal. bin/nogh-e2e-selftest.sh (issue #3605) walks the road with no
# GitHub at all: WeChat sign-in, a repo at an ssh address, ticket → session →
# fleet's own landing → cleanup → report, with a `gh` that must never be called.
#
# ubuntu on every PR (no master push re-run since issue #4663: its PR ran it on
# the change already) and nightly; macOS nightly (and on demand) — the BSD /
# bash 3.2 / Homebrew-tmux half, on its own clock (18:17 UTC).
on:
  pull_request:
    paths:
      - 'bin/**'
      - 'shell/**'
      - 'conf/**'
      - 'tokenledger/**'
      - '.github/workflows/client-e2e.yml'
  schedule:
    - cron: '7 19 * * *'   # 03:07 CST
  workflow_dispatch:

concurrency:
  group: client-e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    # Does this change reach these checks? (issue #4794, bin/ci-plan.sh — the
    # selftest selector over this workflow's entry files.) Not related ⇒ the job
    # below is skipped, which reads green; a schedule or a dispatch always runs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: bash bin/ci-plan.sh client-e2e origin/${{ github.base_ref }}

  ubuntu:
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.plan.outputs.run == 'true') && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            tokenledger/hub/go.sum
            tokenledger/agent/go.sum
      - name: Build ccquota from this checkout
        working-directory: tokenledger
        # pack the client it serves first (claude-fleet#1803)
        run: |
          ../bin/fleet-client-pack.sh
          # the hub's build and the node's, beside it as ccquota-node (claude-fleet#4814)
          (cd hub && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ccquota" ./cmd/ccquota)
          (cd agent && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ccquota-node" ./cmd/ccquota)
      - name: Install from the hub, open, list, switch
        run: bin/client-e2e.sh --ccquota "$RUNNER_TEMP/ccquota" 2>&1 | tee "$RUNNER_TEMP/client-e2e.log"
      - name: A newcomer — added, installed, signed in, opened, renewed, removed
        # claude-fleet#2096: the road before the client, with no operator credential
        if: success() || failure()
        run: bin/newcomer-e2e.sh --ccquota "$RUNNER_TEMP/ccquota" 2>&1 | tee "$RUNNER_TEMP/newcomer-e2e.log"
      - name: No GitHub — WeChat sign-in to the batch report, gh 0
        # claude-fleet#3605 (EPIC #3570 C13): 「没有 GitHub 账号时走得通的步骤」 7/7
        if: success() || failure()
        run: bin/nogh-e2e-selftest.sh --ccquota "$RUNNER_TEMP/ccquota" 2>&1 | tee "$RUNNER_TEMP/nogh-e2e.log"
      - name: Summary
        if: always()
        run: |
          { echo '### client-e2e (ubuntu)'; echo '```'; tail -n 20 "$RUNNER_TEMP/client-e2e.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '### newcomer-e2e (ubuntu)'; echo '```'; tail -n 20 "$RUNNER_TEMP/newcomer-e2e.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '### nogh-e2e (ubuntu)'; echo '```'; tail -n 20 "$RUNNER_TEMP/nogh-e2e.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: |
            tokenledger/hub/go.sum
            tokenledger/agent/go.sum
      - name: Build ccquota from this checkout
        working-directory: tokenledger
        # pack the client it serves first (claude-fleet#1803)
        run: |
          ../bin/fleet-client-pack.sh
          # the hub's build and the node's, beside it as ccquota-node (claude-fleet#4814)
          (cd hub && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ccquota" ./cmd/ccquota)
          (cd agent && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ccquota-node" ./cmd/ccquota)
      - name: Install from the hub, open, list, switch
        # /bin/bash is 3.2 here: the script runs on the operator's own shell
        run: /bin/bash bin/client-e2e.sh --ccquota "$RUNNER_TEMP/ccquota" 2>&1 | tee "$RUNNER_TEMP/client-e2e.log"
      - name: A newcomer — added, installed, signed in, opened, renewed, removed
        if: success() || failure()
        run: /bin/bash bin/newcomer-e2e.sh --ccquota "$RUNNER_TEMP/ccquota" 2>&1 | tee "$RUNNER_TEMP/newcomer-e2e.log"
      - name: No GitHub — WeChat sign-in to the batch report, gh 0
        if: success() || failure()
        run: /bin/bash bin/nogh-e2e-selftest.sh --ccquota "$RUNNER_TEMP/ccquota" 2>&1 | tee "$RUNNER_TEMP/nogh-e2e.log"
      - name: Summary
        if: always()
        run: |
          { echo '### client-e2e (macOS)'; echo '```'; tail -n 20 "$RUNNER_TEMP/client-e2e.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '### newcomer-e2e (macOS)'; echo '```'; tail -n 20 "$RUNNER_TEMP/newcomer-e2e.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          { echo '### nogh-e2e (macOS)'; echo '```'; tail -n 20 "$RUNNER_TEMP/nogh-e2e.log" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
