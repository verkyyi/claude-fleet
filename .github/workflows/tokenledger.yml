name: tokenledger

# TokenLedger (the ccquota hub + agent + web dashboard, Go) — merged into this
# repo under tokenledger/ with its full history (issue #1391). This is its old
# repo's ci.yml, moved here and scoped to the subdirectory:
#
#   - it runs ONLY when a change touches tokenledger/** (or this file) — the
#     same "run only what a change can break" rule as #1374. The shell
#     selftests, in turn, never run for a change confined to tokenledger/:
#     neither selftests*.yml path filter lists it, and run-selftests.sh
#     --changed ignores files outside the shipped shell trees
#     (bin/tokenledger-isolation-selftest.sh pins both directions).
#   - every step runs with working-directory tokenledger/, which is its own Go
#     module (github.com/verkyyi/claude-fleet/tokenledger) — there is no go.mod
#     at the repo root.
#   - no `push` run (issue #4663; a branch push only duplicated its PR's run):
#     its PR ran this on the change already, and the release train builds the
#     hub from the merged commit anyway.
on:
  pull_request:
    paths:
      - 'tokenledger/**'
      - '.github/workflows/tokenledger.yml'

concurrency:
  group: tokenledger-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: tokenledger

jobs:
  # Sharded like the Postgres leg below (claude-fleet#4067): internal/api ran
  # ~570-600s under -race on a runner (go test's 10m default timed it out,
  # claude-fleet#3146), then grew past the 20m cap on a slow one (1200s on
  # dd2107b2). `rest` runs gofmt + vet + every package but internal/api; each
  # `api-K` runs every API_SHARDS-th test of `go test -list` (sorted,
  # round-robin, so the union is the whole package by construction). Adding a
  # shard = one more `api-K` in `part` AND API_SHARDS raised to match.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [rest, api-1, api-2, api-3]
    env:
      API_SHARDS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: tokenledger/go.sum
      # The client /install serves lives once, in the repo's bin/ conf/ …
      # (claude-fleet#1803); a build packs it into fleetclient/pack/ first.
      - run: ../bin/fleet-client-pack.sh
      - if: matrix.part == 'rest'
        run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - if: matrix.part == 'rest'
        run: go vet ./...
      - name: pick this part's tests
        env:
          PART: ${{ matrix.part }}
        run: |
          set -eo pipefail
          case "$PART" in
            rest)
              pkgs=$(go list ./... | grep -vx 'github.com/verkyyi/claude-fleet/tokenledger/internal/api' | paste -sd' ')
              echo "PKGS=$pkgs" >> "$GITHUB_ENV"
              echo 'RUN=' >> "$GITHUB_ENV" ;;
            api-*)
              k=${PART#api-}
              [ "$k" -ge 1 ] && [ "$k" -le "$API_SHARDS" ] || { echo "::error::$PART is outside API_SHARDS=$API_SHARDS"; exit 1; }
              go test -race -list '.*' ./internal/api/ > /tmp/list.txt
              grep -E '^(Test|Example|Fuzz)' /tmp/list.txt | sort | awk -v n="$API_SHARDS" -v k="$k" 'NR % n == k % n' > /tmp/mine.txt
              echo "$PART: $(wc -l < /tmp/mine.txt) of $(grep -cE '^(Test|Example|Fuzz)' /tmp/list.txt) internal/api tests"
              [ -s /tmp/mine.txt ] || { echo "::error::$PART picked no test"; exit 1; }
              echo 'PKGS=./internal/api/' >> "$GITHUB_ENV"
              echo "RUN=^($(paste -sd'|' /tmp/mine.txt))\$" >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown part $PART"; exit 1 ;;
          esac
      - name: tests (${{ matrix.part }})
        run: go test -race -timeout 20m ${RUN:+-run "$RUN"} $PKGS

  # The Postgres leg (claude-fleet#2120, #2121; EPIC #2119): the same
  # internal/store AND internal/api tests — the api ones are where the fleet
  # half (machines, sessions, leases, the vault, device certificates, the
  # audit) is read and written — run against a real Postgres. CCQUOTA_DB_URL is
  # what switches the store over; with it set, each package's TestMain
  # (store.TestMainPostgres) gives every test database its own schema and
  # prints the tests the leg does not run (SKIP-PG …) — none since #2121, and
  # the job fails if one comes back or a test calls t.Skip on this leg. The
  # server is the image's default locale on purpose: the store must sort TEXT
  # byte for byte (COLLATE "C") without help from how the database was made.
  # postgres:16 comes from mirror.gcr.io (Google's cache of Docker Hub): an
  # unauthenticated Docker Hub pull hit its rate limit (claude-fleet#2734).
  #
  # Sharded (claude-fleet#3856): internal/api is ~1000 serial tests, each
  # paying ~1.3s for its own schema + migrations on Postgres under -race, so
  # the package alone ran 650-1220s by the runner — past the 20m cap on a slow
  # one. `store` runs store + leader + the migrate timing; each `api-K` runs
  # every API_SHARDS-th test of `go test -list` (sorted, round-robin, so the
  # union is the whole package by construction). Adding a shard = one more
  # `api-K` in `part` AND API_SHARDS raised to match.
  tokenledger-pg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [store, api-1, api-2, api-3]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CCQUOTA_DB_URL: postgres://postgres:ci-only@localhost:5432/postgres?sslmode=disable
      API_SHARDS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: tokenledger/go.sum
      - run: ../bin/fleet-client-pack.sh
      - name: pick this part's tests
        env:
          PART: ${{ matrix.part }}
        run: |
          set -eo pipefail
          case "$PART" in
            store)
              echo 'PKGS=./internal/store/... ./internal/leader/...' >> "$GITHUB_ENV"
              echo 'RUN=' >> "$GITHUB_ENV" ;;
            api-*)
              k=${PART#api-}
              [ "$k" -ge 1 ] && [ "$k" -le "$API_SHARDS" ] || { echo "::error::$PART is outside API_SHARDS=$API_SHARDS"; exit 1; }
              go test -race -list '.*' ./internal/api/ > /tmp/list.txt
              grep -E '^(Test|Example|Fuzz)' /tmp/list.txt | sort | awk -v n="$API_SHARDS" -v k="$k" 'NR % n == k % n' > /tmp/mine.txt
              echo "$PART: $(wc -l < /tmp/mine.txt) of $(grep -cE '^(Test|Example|Fuzz)' /tmp/list.txt) internal/api tests"
              [ -s /tmp/mine.txt ] || { echo "::error::$PART picked no test"; exit 1; }
              echo 'PKGS=./internal/api/' >> "$GITHUB_ENV"
              echo "RUN=^($(paste -sd'|' /tmp/mine.txt))\$" >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown part $PART"; exit 1 ;;
          esac
      # claude-fleet#2640 / #2479: internal/api alone ran 420-600s, then up to
      # 1220s (#3856), against go test's cap — hence the 20m and the shards.
      - name: tests on Postgres (${{ matrix.part }})
        run: |
          set -o pipefail
          go test -race -count=1 -v -timeout 20m ${RUN:+-run "$RUN"} $PKGS 2>&1 | tee /tmp/pg.log | grep -E '^(pg leg|  SKIP-PG|--- FAIL|--- SKIP|ok|FAIL|panic)|leader_test.go:[0-9]+: (handover|job )'
      # claude-fleet#2216: `ccquota db migrate` on a million usage_events
      # rows, without -race, each table's and phase's time in the summary.
      - name: db migrate timing (1M rows)
        if: matrix.part == 'store'
        env:
          CCQUOTA_MOVE_SPEED_ROWS: '1000000'
        run: |
          set -o pipefail
          go test -count=1 -v -run '^TestMoveDatabaseSpeed$' -timeout 15m ./internal/store/ 2>&1 | tee /tmp/move-speed.log | grep -E 'usage_events|indexes|moved|source:|--- |^(ok|FAIL)'
          { echo '### db migrate timing (1M rows)'; echo; echo '```'; grep -E 'usage_events|indexes|moved|source:' /tmp/move-speed.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Keep successful fixture output too: task-contract evidence must name
      # the tested generation/provider/result, not reconstruct a JSON example.
      - name: upload Postgres test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-log-${{ matrix.part }}
          path: /tmp/pg.log
          if-no-files-found: ignore
      - name: skip 0
        run: |
          if grep -E '^ *(SKIP-PG|--- SKIP)' /tmp/pg.log; then
            echo '::error::the Postgres leg skipped a test (above) — claude-fleet#2121 keeps it at 0'
            exit 1
          fi
      - name: summary
        if: always()
        run: |
          {
            echo '### tokenledger-pg (${{ matrix.part }})'
            echo
            echo "passed: $(grep -c '^ *--- PASS' /tmp/pg.log) · failed: $(grep -c '^ *--- FAIL' /tmp/pg.log) · skipped: $(grep -cE '^ *(--- SKIP|SKIP-PG)' /tmp/pg.log)"
            echo
            echo '```'
            grep -E '^(pg leg|  SKIP-PG|ok|FAIL)|leader_test.go:[0-9]+: (handover|job )' /tmp/pg.log || true
            echo '```'
            echo
            echo 'slowest tests:'
            echo
            echo '```'
            sed -nE 's/^--- (PASS|FAIL): ([^ ]+) \(([0-9.]+)s\)$/\3s \2/p' /tmp/pg.log | sort -rn | head -15 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cross-compile:
    # The whole adoption story is "download one binary", so a platform that
    # stops building is a release-blocking bug, not a nice-to-have.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: tokenledger/go.sum
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/ccquota
