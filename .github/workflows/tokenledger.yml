name: tokenledger

# TokenLedger (the ccquota hub + agent + web dashboard, Go) — merged into this
# repo under tokenledger/ with its full history (issue #1391). This is its old
# repo's ci.yml, moved here and scoped to the subdirectory:
#
#   - the PR gate (.github/workflows/ci.yml) calls it only when a change reaches
#     a Go block, and says which (claude-fleet#4815, bin/ci-plan.sh go): shared/
#     ⇒ all four, agent/ ⇒ agent + e2e, hub/ ⇒ hub + e2e, e2e/ ⇒ e2e, each
#     narrowed to the packages whose test binary depends on a changed one —
#     the inputs below; a dispatch (no inputs) runs everything. The shell
#     selftests, in turn, never run for a change confined to tokenledger/:
#     neither selftests*.yml path filter lists it, and run-selftests.sh
#     --changed ignores files outside the shipped shell trees
#     (bin/tokenledger-isolation-selftest.sh pins both directions).
#   - tokenledger/ holds four Go modules (EPIC #4810): hub/ (…/hub — the
#     hub, #4814), agent/ (…/agent — the node, #4812), shared/ (…/shared — what
#     both build in, #4811) and e2e/ (…/e2e — the联调 tests: a real node against
#     a real hub, through hub/apitest, #4814), joined by the go.mods' replaces.
#     GOWORK=off: each module must build on its own; go.work is for a person's
#     editor. No go.mod at tokenledger/ or the repo root: every step that walks
#     packages runs in its module's directory.
#   - no `push` run (issue #4663; a branch push only duplicated its PR's run):
#     its PR ran this on the change already, and the release train builds the
#     hub from the merged commit anyway.
on:
  # the PR gate calls it (.github/workflows/ci.yml, issue #4815) when bin/ci-plan.sh says
  # the change reaches it — its old `paths:` live there now
  workflow_call:
    inputs:
      parts:
        description: 'the `test` matrix (bin/ci-plan.sh go: go_parts)'
        type: string
        default: '["rest", "store", "api-1", "api-2", "api-3", "shared", "agent", "e2e"]'
      pg_parts:
        description: 'the Postgres matrix (go_pg_parts); [] = no Postgres leg'
        type: string
        default: '["store", "api-1", "api-2", "api-3", "e2e"]'
      build:
        description: 'which binaries cross-compile: hub, agent (go_build)'
        type: string
        default: 'hub agent'
      modules:
        description: 'the modules vet runs in (go_modules)'
        type: string
        default: 'shared agent hub e2e'
      api_shards:
        description: 'how many api-K parts the -race leg has (go_api_shards — off tokenledger/test-durations.txt)'
        type: string
        default: '3'
      pg_api_shards:
        description: 'how many api-K parts the Postgres leg has (go_pg_api_shards — off test-durations-pg.txt)'
        type: string
        default: '3'
      pkgs_shared:
        description: 'import paths to test, or ./... (go_pkgs_shared)'
        type: string
        default: './...'
      pkgs_agent:
        type: string
        default: './...'
      pkgs_hub:
        type: string
        default: './...'
      pkgs_e2e:
        type: string
        default: './...'
      # claude-fleet#4821: this repo's own PR on the Shenzhen cluster (ci.yml's
      # plan, fleet-train-runner.sh pr-pick) — lint, test and cross-compile; the
      # Postgres leg stays on GitHub's (its service container needs Docker)
      runs_on:
        description: 'runner labels: ubuntu-latest, or a JSON list (["fleet-ack"])'
        type: string
        default: ubuntu-latest
  workflow_dispatch:

defaults:
  run:
    working-directory: tokenledger

env:
  GOWORK: 'off'

jobs:
  # hub/api's tests are dealt into API_SHARDS parts by their recorded cost
  # (claude-fleet#4817): bin/ci-plan.sh sizes the count off
  # tokenledger/test-durations.txt (recorded seconds ÷ 240, 1..8), each
  # `api-K` lists the package (`go test -list`) and keeps its deal from
  # bin/go-test-shard.sh — longest first into the lightest part, so the union is
  # the whole package by construction. `store` runs hub/store (and below), `rest`
  # every other selected hub package but hub/api; `shared`, `agent` and `e2e` are the other three modules, their
  # selected packages. Every part prints its predicted load against what it
  # took; refresh the table with bin/go-test-durations.sh --run <run>, off the
  # go-log-* artifacts (`go test -v`). gofmt / vet / the modules selftest are
  # `lint`'s.
  # Each job's Go caches (claude-fleet#4817): restored on a PR only (its
  # previous push, else the newest of the same part), so an unchanged package's
  # test result and the -race build of everything it compiles come back; any
  # other caller (dispatch, a nightly) starts empty and runs -count=1. Before the
  # save bin/go-ci-cache.py drops what this job did not use — the repo's cache
  # is capped at 10 GB — and the summary prints what was reused.
  # On fleet-ack (claude-fleet#4821) the runner image IS the cache: Go 1.25 and
  # tokenledger's module + build caches are baked in (extras/ci-runner/Dockerfile),
  # so setup-go and the Actions cache (an ocean away) are skipped there, and
  # the summary's reuse line counts what the image held.
  lint:
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ !startsWith(inputs.runs_on, '[') }}
        with:
          go-version: '1.25'
          cache: false
      - name: Go caches (restore — a PR only)
        if: github.event_name == 'pull_request' && !startsWith(inputs.runs_on, '[')
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-lint-lint-${{ hashFiles('tokenledger/*/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-lint-lint-${{ hashFiles('tokenledger/*/go.sum') }}-
            go-${{ runner.os }}-lint-lint-
            go-${{ runner.os }}-lint-
            go-${{ runner.os }}-
      - run: python3 ../bin/go-ci-cache.py mark
      - run: ../bin/fleet-client-pack.sh
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - id: gotest
        env:
          MODULES: ${{ inputs.modules || 'shared agent hub e2e' }}
        run: for m in $MODULES; do (cd "$m" && go vet ./...) || exit 1; done
      # the blocks' dependency direction (EPIC #4810 共同约定 3): shared/ names no
      # other block, agent/ and hub/ only shared/ (hub/ not even in a test), e2e/
      # any of the three, and neither build has the other's package
      - run: ../bin/tokenledger-modules-selftest.sh
      - name: Go caches (save what this job used)
        if: always() && steps.gotest.outcome != 'skipped' && !startsWith(inputs.runs_on, '[')
        run: python3 ../bin/go-ci-cache.py prune
      - if: always() && steps.gotest.outcome != 'skipped' && !startsWith(inputs.runs_on, '[')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-lint-lint-${{ hashFiles('tokenledger/*/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  test:
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts || '["rest", "store", "api-1", "api-2", "api-3", "shared", "agent", "e2e"]') }}
    env:
      API_SHARDS: ${{ inputs.api_shards || '3' }}
      TABLE: test-durations.txt
      PKGS_SHARED: ${{ inputs.pkgs_shared || './...' }}
      PKGS_AGENT: ${{ inputs.pkgs_agent || './...' }}
      PKGS_HUB: ${{ inputs.pkgs_hub || './...' }}
      PKGS_E2E: ${{ inputs.pkgs_e2e || './...' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ !startsWith(inputs.runs_on, '[') }}
        with:
          go-version: '1.25'
          cache: false
      - name: Go caches (restore — a PR only)
        if: github.event_name == 'pull_request' && !startsWith(inputs.runs_on, '[')
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-race-${{ matrix.part }}-${{ hashFiles('tokenledger/*/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-race-${{ matrix.part }}-${{ hashFiles('tokenledger/*/go.sum') }}-
            go-${{ runner.os }}-race-${{ matrix.part }}-
            go-${{ runner.os }}-race-
            go-${{ runner.os }}-
      - run: python3 ../bin/go-ci-cache.py mark
      # The client /install serves lives once, in the repo's bin/ conf/ …
      # (claude-fleet#1803); a build packs it into fleetclient/pack/ first.
      - run: ../bin/fleet-client-pack.sh
      - name: pick this part's tests
        env:
          PART: ${{ matrix.part }}
        run: |
          set -eo pipefail
          # tokenledger/test-quarantine.txt (claude-fleet#4679): the PR gate
          # holds those tests out; GOFLAGS carries the -skip to every go test below.
          skip=$(../bin/tokenledger-quarantine.sh skip)
          if [ -n "$skip" ]; then
            echo "quarantined (tokenledger/test-quarantine.txt): $skip"
            echo "GOFLAGS=-skip=$skip" >> "$GITHUB_ENV"
          fi
          echo 'PRED=' >> "$GITHUB_ENV"
          case "$PART" in
            rest|store)
              # the plan's hub packages (./... = all of them): hub/api is api-K's,
              # hub/store (and below) the `store` part's, the rest `rest`'s
              if [ "$PKGS_HUB" = ./... ]; then all=$(cd hub && go list ./...); else all=$(printf '%s\n' $PKGS_HUB); fi
              st='^github\.com/verkyyi/claude-fleet/tokenledger/hub/store(/|$)'
              if [ "$PART" = store ]; then
                pkgs=$(printf '%s\n' "$all" | grep -E "$st" | paste -sd' ' -)
              else
                pkgs=$(printf '%s\n' "$all" | grep -vx 'github.com/verkyyi/claude-fleet/tokenledger/hub/api' | grep -vE "$st" | paste -sd' ' -)
              fi
              [ -n "$pkgs" ] || { echo "::error::$PART picked no hub package"; exit 1; }
              echo "MOD=hub" >> "$GITHUB_ENV"
              echo "PKGS=$pkgs" >> "$GITHUB_ENV"
              echo 'RUN=' >> "$GITHUB_ENV" ;;
            api-*)
              k=${PART#api-}
              [ "$k" -ge 1 ] && [ "$k" -le "$API_SHARDS" ] || { echo "::error::$PART is outside API_SHARDS=$API_SHARDS"; exit 1; }
              # by recorded cost (claude-fleet#4817): longest first, into the lightest
              # shard — every part deals the same list the same way, so the union is
              # the whole package; a test with no row costs the package's median
              (cd hub && go test -race -list '.*' ./api/) > /tmp/list.txt
              grep -E '^(Test|Example|Fuzz)' /tmp/list.txt > /tmp/all.txt
              ../bin/go-test-shard.sh deal --table "$TABLE" --pkg hub/api --shard "$k/$API_SHARDS" < /tmp/all.txt > /tmp/mine.txt 2> /tmp/pred.txt
              cat /tmp/pred.txt
              ../bin/go-test-shard.sh loads --table "$TABLE" --pkg hub/api --shards "$API_SHARDS" < /tmp/all.txt
              echo "PRED=$(sed -nE 's/.*, ~([0-9]+)s \(all.*/\1/p' /tmp/pred.txt)" >> "$GITHUB_ENV"
              [ -s /tmp/mine.txt ] || { echo "::error::$PART picked no test"; exit 1; }
              echo "MOD=hub" >> "$GITHUB_ENV"
              echo 'PKGS=./api/' >> "$GITHUB_ENV"
              echo "RUN=^($(paste -sd'|' /tmp/mine.txt))\$" >> "$GITHUB_ENV" ;;
            shared|agent|e2e)
              case "$PART" in shared) p=$PKGS_SHARED ;; agent) p=$PKGS_AGENT ;; e2e) p=$PKGS_E2E ;; esac
              [ -n "$p" ] || { echo "::error::$PART picked no package"; exit 1; }
              echo "MOD=$PART" >> "$GITHUB_ENV"
              echo "PKGS=$p" >> "$GITHUB_ENV"
              echo 'RUN=' >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown part $PART"; exit 1 ;;
          esac
          echo "$PART tests: $(grep '^PKGS=' "$GITHUB_ENV" | tail -1)"
      # -v so every test's seconds are in the log (the go-log-* artifact feeds the
      # table); the console keeps the package lines, the whole log only when red
      - name: tests (${{ matrix.part }})
        id: gotest
        env:
          COUNT: ${{ github.event_name != 'pull_request' && '-count=1' || '' }}
        run: |
          t0=$(date +%s)
          rc=0
          (cd "$MOD" && go test -race -v $COUNT -timeout 20m ${RUN:+-run "$RUN"} $PKGS) > /tmp/go.log 2>&1 || rc=$?
          echo "WALL=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          grep -E '^(ok|FAIL|--- FAIL|panic:)' /tmp/go.log || true
          if [ "$rc" != 0 ]; then
            echo '::group::go test output (red)'; cat /tmp/go.log; echo '::endgroup::'
          fi
          exit "$rc"
      - name: upload go test log
        if: always() && steps.gotest.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: go-log-${{ matrix.part }}
          path: /tmp/go.log
          if-no-files-found: ignore
      - name: summary
        if: always() && steps.gotest.outcome != 'skipped'
        env:
          PART: ${{ matrix.part }}
          LEG: test
        run: |
          set +e
          log=/tmp/go.log
          act=$(sed -nE 's/^--- (PASS|FAIL): [A-Za-z0-9_]+ \(([0-9.]+)s\)$/\2/p' "$log" | awk '{ s += $1 } END { printf "%.0f", s }')
          n=$(grep -cE '^--- (PASS|FAIL): ' "$log")
          if [ -z "$PRED" ]; then
            # a whole-package part: its packages' rows (import paths → under tokenledger/)
            short=$(sed -nE 's#^(ok|FAIL)[[:space:]]+github\.com/verkyyi/claude-fleet/tokenledger/([^[:space:]]+).*#\2#p' "$log" | sort -u | tr '\n' ' ')
            PRED=$(../bin/go-test-shard.sh sum --table "$TABLE" --pkg "$short")
          fi
          drift=$(awk -v p="$PRED" -v a="$act" 'BEGIN { if (p > 0) printf "%+.0f%%", (a - p) * 100 / p; else print "—" }')
          cache=$(python3 ../bin/go-ci-cache.py report --log "$log")
          echo "$cache"
          {
            echo "### $LEG ($PART)"
            echo
            echo '| 片 | 测试数 | 预测 | 实际（测试合计） | 偏差 | go test 墙钟 |'
            echo '|---|---|---|---|---|---|'
            echo "| $PART | $n | ${PRED:-0}s | ${act}s | $drift | ${WALL:-?}s |"
            echo
            echo "$cache"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Go caches (save what this job used)
        if: always() && steps.gotest.outcome != 'skipped' && !startsWith(inputs.runs_on, '[')
        run: python3 ../bin/go-ci-cache.py prune
      - if: always() && steps.gotest.outcome != 'skipped' && !startsWith(inputs.runs_on, '[')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-race-${{ matrix.part }}-${{ hashFiles('tokenledger/*/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The Postgres leg (claude-fleet#2120, #2121; EPIC #2119): the same
  # hub/store AND hub/api tests (and since claude-fleet#4814 the联调 tests in
  # e2e/, which open their stores the same way) — the api ones are where the fleet
  # half (machines, sessions, leases, the vault, device certificates, the
  # audit) is read and written — run against a real Postgres. CCQUOTA_DB_URL is
  # what switches the store over; with it set, each package's TestMain
  # (store.TestMainPostgres) gives every test database its own schema and
  # prints the tests the leg does not run (SKIP-PG …) — none since #2121, and
  # the job fails if one comes back or a test calls t.Skip on this leg. The
  # server is the image's default locale on purpose: the store must sort TEXT
  # byte for byte (COLLATE "C") without help from how the database was made.
  # postgres:16 comes from mirror.gcr.io (Google's cache of Docker Hub): an
  # unauthenticated Docker Hub pull hit its rate limit (claude-fleet#2734).
  #
  # Sharded (claude-fleet#3856): hub/api is ~1200 serial tests, each of which
  # paid ~1.3s for its own schema + migrations on Postgres under -race — until
  # claude-fleet#4817 made a test's store a `CREATE DATABASE … TEMPLATE` copy of
  # one migrated database (store.PGTemplate; the log's `pg leg: … per test` line
  # is the cost). `store` runs store + leader + the migrate timing; each `api-K`
  # keeps its deal of `go test -list` by tokenledger/test-durations-pg.txt
  # (bin/go-test-shard.sh), PG_API_SHARDS of them as the plan sized it.
  tokenledger-pg:
    if: github.event_name == 'workflow_dispatch' || inputs.pg_parts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.pg_parts || '["store", "api-1", "api-2", "api-3", "e2e"]') }}
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CCQUOTA_DB_URL: postgres://postgres:ci-only@localhost:5432/postgres?sslmode=disable
      API_SHARDS: ${{ inputs.pg_api_shards || '3' }}
      TABLE: test-durations-pg.txt
      PKGS_E2E: ${{ inputs.pkgs_e2e || './...' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Go caches (restore — a PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-pg-${{ matrix.part }}-${{ hashFiles('tokenledger/*/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-pg-${{ matrix.part }}-${{ hashFiles('tokenledger/*/go.sum') }}-
            go-${{ runner.os }}-pg-${{ matrix.part }}-
            go-${{ runner.os }}-pg-
            go-${{ runner.os }}-
      - run: python3 ../bin/go-ci-cache.py mark
      - run: ../bin/fleet-client-pack.sh
      - name: pick this part's tests
        env:
          PART: ${{ matrix.part }}
        run: |
          set -eo pipefail
          # tokenledger/test-quarantine.txt (claude-fleet#4679): the PR gate
          # holds those tests out; GOFLAGS carries the -skip to every go test below.
          skip=$(../bin/tokenledger-quarantine.sh skip)
          if [ -n "$skip" ]; then
            echo "quarantined (tokenledger/test-quarantine.txt): $skip"
            echo "GOFLAGS=-skip=$skip" >> "$GITHUB_ENV"
          fi
          echo 'PRED=' >> "$GITHUB_ENV"
          case "$PART" in
            store)
              echo "MOD=hub" >> "$GITHUB_ENV"
              echo 'PKGS=./store/... ./leader/...' >> "$GITHUB_ENV"
              echo 'RUN=' >> "$GITHUB_ENV" ;;
            api-*)
              k=${PART#api-}
              [ "$k" -ge 1 ] && [ "$k" -le "$API_SHARDS" ] || { echo "::error::$PART is outside API_SHARDS=$API_SHARDS"; exit 1; }
              # by recorded cost (claude-fleet#4817): longest first, into the lightest
              # shard — every part deals the same list the same way, so the union is
              # the whole package; a test with no row costs the package's median
              (cd hub && go test -race -list '.*' ./api/) > /tmp/list.txt
              grep -E '^(Test|Example|Fuzz)' /tmp/list.txt > /tmp/all.txt
              ../bin/go-test-shard.sh deal --table "$TABLE" --pkg hub/api --shard "$k/$API_SHARDS" < /tmp/all.txt > /tmp/mine.txt 2> /tmp/pred.txt
              cat /tmp/pred.txt
              ../bin/go-test-shard.sh loads --table "$TABLE" --pkg hub/api --shards "$API_SHARDS" < /tmp/all.txt
              echo "PRED=$(sed -nE 's/.*, ~([0-9]+)s \(all.*/\1/p' /tmp/pred.txt)" >> "$GITHUB_ENV"
              [ -s /tmp/mine.txt ] || { echo "::error::$PART picked no test"; exit 1; }
              echo "MOD=hub" >> "$GITHUB_ENV"
              echo 'PKGS=./api/' >> "$GITHUB_ENV"
              echo "RUN=^($(paste -sd'|' /tmp/mine.txt))\$" >> "$GITHUB_ENV" ;;
            e2e)
              echo "MOD=e2e" >> "$GITHUB_ENV"
              echo "PKGS=$PKGS_E2E" >> "$GITHUB_ENV"
              echo 'RUN=' >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown part $PART"; exit 1 ;;
          esac
      # claude-fleet#2640 / #2479: hub/api alone ran 420-600s, then up to
      # 1220s (#3856), against go test's cap — hence the 20m and the shards.
      - name: tests on Postgres (${{ matrix.part }})
        id: gotest
        env:
          COUNT: ${{ github.event_name != 'pull_request' && '-count=1' || '' }}
        run: |
          set -o pipefail
          t0=$(date +%s)
          rc=0
          (cd "$MOD" && go test -race $COUNT -v -timeout 20m ${RUN:+-run "$RUN"} $PKGS) > /tmp/pg.log 2>&1 || rc=$?
          echo "WALL=$(( $(date +%s) - t0 ))" >> "$GITHUB_ENV"
          grep -E '^(pg leg|  SKIP-PG|--- FAIL|--- SKIP|ok|FAIL|panic)|leader_test.go:[0-9]+: (handover|job )' /tmp/pg.log || true
          if [ "$rc" != 0 ]; then
            echo '::group::go test output (red)'; cat /tmp/pg.log; echo '::endgroup::'
          fi
          exit "$rc"
      # claude-fleet#2216: `ccquota db migrate` on a million usage_events
      # rows, without -race, each table's and phase's time in the summary.
      - name: db migrate timing (1M rows)
        if: matrix.part == 'store'
        env:
          CCQUOTA_MOVE_SPEED_ROWS: '1000000'
        run: |
          set -o pipefail
          cd hub && go test -count=1 -v -run '^TestMoveDatabaseSpeed$' -timeout 15m ./store/ 2>&1 | tee /tmp/move-speed.log | grep -E 'usage_events|indexes|moved|source:|--- |^(ok|FAIL)'
          { echo '### db migrate timing (1M rows)'; echo; echo '```'; grep -E 'usage_events|indexes|moved|source:' /tmp/move-speed.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Keep successful fixture output too: task-contract evidence must name
      # the tested generation/provider/result, not reconstruct a JSON example.
      - name: upload Postgres test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-log-${{ matrix.part }}
          path: /tmp/pg.log
          if-no-files-found: ignore
      - name: skip 0
        run: |
          if grep -E '^ *(SKIP-PG|--- SKIP)' /tmp/pg.log; then
            echo '::error::the Postgres leg skipped a test (above) — claude-fleet#2121 keeps it at 0'
            exit 1
          fi
      - name: pg summary
        if: always()
        run: |
          {
            echo '### tokenledger-pg (${{ matrix.part }})'
            echo
            echo "passed: $(grep -c '^ *--- PASS' /tmp/pg.log) · failed: $(grep -c '^ *--- FAIL' /tmp/pg.log) · skipped: $(grep -cE '^ *(--- SKIP|SKIP-PG)' /tmp/pg.log)"
            echo
            echo '```'
            grep -E '^(pg leg|  SKIP-PG|ok|FAIL)|leader_test.go:[0-9]+: (handover|job )' /tmp/pg.log || true
            echo '```'
            echo
            echo 'slowest tests:'
            echo
            echo '```'
            sed -nE 's/^--- (PASS|FAIL): ([^ ]+) \(([0-9.]+)s\)$/\3s \2/p' /tmp/pg.log | sort -rn | head -15 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: summary
        if: always() && steps.gotest.outcome != 'skipped'
        env:
          PART: ${{ matrix.part }}
          LEG: tokenledger-pg
        run: |
          set +e
          log=/tmp/pg.log
          act=$(sed -nE 's/^--- (PASS|FAIL): [A-Za-z0-9_]+ \(([0-9.]+)s\)$/\2/p' "$log" | awk '{ s += $1 } END { printf "%.0f", s }')
          n=$(grep -cE '^--- (PASS|FAIL): ' "$log")
          if [ -z "$PRED" ]; then
            # a whole-package part: its packages' rows (import paths → under tokenledger/)
            short=$(sed -nE 's#^(ok|FAIL)[[:space:]]+github\.com/verkyyi/claude-fleet/tokenledger/([^[:space:]]+).*#\2#p' "$log" | sort -u | tr '\n' ' ')
            PRED=$(../bin/go-test-shard.sh sum --table "$TABLE" --pkg "$short")
          fi
          drift=$(awk -v p="$PRED" -v a="$act" 'BEGIN { if (p > 0) printf "%+.0f%%", (a - p) * 100 / p; else print "—" }')
          cache=$(python3 ../bin/go-ci-cache.py report --log "$log")
          echo "$cache"
          {
            echo "### $LEG ($PART)"
            echo
            echo '| 片 | 测试数 | 预测 | 实际（测试合计） | 偏差 | go test 墙钟 |'
            echo '|---|---|---|---|---|---|'
            echo "| $PART | $n | ${PRED:-0}s | ${act}s | $drift | ${WALL:-?}s |"
            echo
            echo "$cache"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Go caches (save what this job used)
        if: always() && steps.gotest.outcome != 'skipped'
        run: python3 ../bin/go-ci-cache.py prune
      - if: always() && steps.gotest.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-pg-${{ matrix.part }}-${{ hashFiles('tokenledger/*/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The whole adoption story is "download one binary", so a platform that stops
  # building is a release-blocking bug, not a nice-to-have. The plan builds the
  # hub when its block is selected, the node when agent's is. ONE job for the
  # four platforms (claude-fleet#4817): each build took under a minute, but as
  # four matrix jobs each waited 2-11 minutes for a runner of its own.
  cross-compile:
    if: github.event_name == 'workflow_dispatch' || inputs.build != ''
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ !startsWith(inputs.runs_on, '[') }}
        with:
          go-version: '1.25'
          cache: false
      - name: Go caches (restore — a PR only)
        if: github.event_name == 'pull_request' && !startsWith(inputs.runs_on, '[')
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-xc-all-${{ hashFiles('tokenledger/*/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-xc-all-${{ hashFiles('tokenledger/*/go.sum') }}-
            go-${{ runner.os }}-xc-all-
            go-${{ runner.os }}-xc-
            go-${{ runner.os }}-
      - run: python3 ../bin/go-ci-cache.py mark
      - name: build ccquota for every platform
        id: gotest
        env:
          BUILD: ${{ inputs.build || 'hub agent' }}
        run: |
          set -eo pipefail
          # the hub's build (claude-fleet#4814), the node's own (claude-fleet#4812 —
          # what C3 ships to machines): two at a time, every one must build
          for b in $BUILD; do
            for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do echo "$b $t"; done
          done | xargs -P 2 -L 1 sh -c 'cd "$0" && CGO_ENABLED=0 GOOS=${1%/*} GOARCH=${1#*/} go build -o /dev/null ./cmd/ccquota && echo "built $0 $1"'
      - name: Go caches (save what this job used)
        if: always() && steps.gotest.outcome != 'skipped' && !startsWith(inputs.runs_on, '[')
        run: python3 ../bin/go-ci-cache.py prune
      - if: always() && steps.gotest.outcome != 'skipped' && !startsWith(inputs.runs_on, '[')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-xc-all-${{ hashFiles('tokenledger/*/go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
