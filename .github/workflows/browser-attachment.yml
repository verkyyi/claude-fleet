name: browser-attachment
# No master `push` run (issue #4663): its PR ran this on the change already, and a
# post-merge re-run only re-checked it beside the release train.
on:
  # the PR gate calls it (.github/workflows/ci.yml, issue #4815) when bin/ci-plan.sh says
  # the change reaches it — its old `paths:` live there now
  workflow_call:
  workflow_dispatch:
jobs:
  chromium:
    # pinned: ubuntu-latest moved to 26.04, where `playwright install chromium` refuses
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            tokenledger/hub/go.sum
            tokenledger/agent/go.sum
            tokenledger/e2e/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extras/browser-transport/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: extras/browser-transport
      - name: Dependencies for the isolated production TerminalView fixture
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: extras/web-console
      - run: npm run check
        working-directory: extras/browser-transport
      - run: node terminal-client.mjs
        working-directory: extras/browser-transport
      - run: npx playwright install --with-deps chromium
        working-directory: extras/browser-transport
      - name: Background schedule expiry preserves the current page and draft
        run: node extras/web-console/test/schedule-auth-browser.mjs
      - name: Schedule layout, history and creation receipt
        run: node extras/web-console/test/schedule-layout-browser.mjs
      - name: Pending task cancellation, conflicts and read-only controls
        run: node extras/web-console/test/task-cancel-browser.mjs
      - name: Explicit Task continue in the real app
        run: node extras/web-console/test/task-continue-browser.mjs
      - name: Studio restores live worker addresses and refreshes the same catalog
        run: node extras/web-console/test/studio-session-browser.mjs
      - name: A late transcript cannot erase a new chat turn
        run: node chat-history.mjs
        working-directory: extras/browser-transport
      - name: Session discovery preserves drafts and only a writable gate enables send (T944)
        run: node session-write.mjs
        working-directory: extras/browser-transport
      - name: Silent session streams reconnect without losing drafts or permissions (T944)
        run: node session-stream.mjs
        working-directory: extras/browser-transport
      - name: A late copy never puts an older conversation back; a second browser follows
        run: node chat-copy-order.mjs
        working-directory: extras/browser-transport
      - name: Opening the conversation lands on its newest message, and stays there (JDHN)
        run: node chat-scroll.mjs
        working-directory: extras/browser-transport
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Session archive on phone and desktop
        run: node extras/web-console/test/session-archive-browser.mjs
      - name: Actual browser to node adapter, UDP denial, no replay and cleanup
        # the联调 tests' block since claude-fleet#4814 (a real node against a real hub)
        working-directory: tokenledger/e2e
        run: |
          set -o pipefail
          go test -tags browseracceptance -count=1 -v -timeout 20m -run '^Test(Attachment|AttachmentDoor|TerminalConsole|ChatAttachment|TerminalRecovery)Chromium$' . 2>&1 | tee ../../browser-attachment.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-attachment-evidence
          path: |
            browser-attachment.log
            extras/browser-transport/evidence/
            extras/browser-transport/chat-*.zip
