name: cluster-perms

# The cluster half of BREAK-IT sa-token-in-user-pod, provisioner-off-template
# (claude-fleet#3558, EPIC #3500 C16), root-in-user-pod (#3757: a person's pod
# running, `ps` in both its containers), job-sees-keys (#3552: a throwaway Job
# of each trust) and svc-run-sees-keys (#4005: two service runs' Jobs, one after
# the other): fleet-workers' accounts, fleet-ops' Role, the provisioner, its
# Role and its admission policy on a throwaway kind
# cluster in this runner (deploy/k8s/provisioner/kind-drill.sh). The run's
# summary page carries `kubectl auth can-i --list` for every account. Nothing
# here touches a real cluster, and it needs no credential.
#
# Docker Hub pulls go through mirror.gcr.io (claude-fleet#2734), as hub-rolling's.

on:
  # the PR gate calls it (.github/workflows/ci.yml, issue #4815) when bin/ci-plan.sh says
  # the change reaches it — its old `paths:` live there now
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    # pinned: kind cannot import images on ubuntu-24.04's 26.04 (task DDBQ)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub through mirror.gcr.io
        run: |
          set -euo pipefail
          f=/etc/docker/daemon.json
          { sudo cat "$f" 2>/dev/null || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > /tmp/daemon.json
          sudo mv /tmp/daemon.json "$f"
          sudo systemctl restart docker
          docker info --format '{{.RegistryConfig.Mirrors}}'

      # a local registry: the policy admits images by digest only, so the
      # stand-ins are pushed and referenced as <registry>/<name>@sha256:…
      - uses: helm/kind-action@v1
        id: kind
        with:
          cluster_name: perms
          # no CNI yet: the nodes are Ready only once Calico is up (next step)
          wait: 0s
          registry: true
          config: deploy/k8s/provisioner/kind-config.yaml

      # NetworkPolicy has to be ENFORCED for the drill to mean anything (an
      # untrusted Job's cut from the internet, claude-fleet#3552): kind's own CNI
      # let a Job through default-deny, so Calico — its images from quay.io, not
      # Docker Hub's anonymous limit inside the kind node.
      - name: Calico
        run: |
          set -euo pipefail
          pool=10.244.0.0/16  # oss-ok: kind's own default pod range (kind-config.yaml)
          curl -fsSL https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/calico.yaml \
            | sed -e 's#docker.io/calico/#quay.io/calico/#' \
                  -e 's|# - name: CALICO_IPV4POOL_CIDR|- name: CALICO_IPV4POOL_CIDR|' \
                  -e "s|#   value: \"[0-9./]*\"|  value: \"$pool\"|" \
            | kubectl apply -f - >/dev/null
          kubectl -n kube-system rollout status ds/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl -n kube-system rollout status deploy/coredns --timeout=180s

      - name: The drill (every row; can-i for every account)
        run: deploy/k8s/provisioner/kind-drill.sh "${{ steps.kind.outputs.LOCAL_REGISTRY }}"
