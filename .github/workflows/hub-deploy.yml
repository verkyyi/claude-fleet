name: hub-deploy

# The ONE deploy job for the hub (tokenledger/, the ccquota image) — EPIC #1982
# C1, issue #1983. It builds the image, pushes it as `prod-<sha7>`, snapshots
# the database, starts the new image with the real config on a copy of it
# (`ccquota hub --check`, issues #2050 #2052), applies deploy/k8s/overlays/prod
# with that tag, waits for the rollout and checks /healthz + /version + the
# entry (/install, /version's stable, login/start — issue #2060) on every
# address. From the moment before the apply until the health check (or
# rollback) is done, a probe hits /healthz and a write once a second and the
# summary says how many seconds were down (downtime_seconds=<n>, issue #2125).
# The render's shape decides the rest: the single SQLite shape (one replica,
# Recreate, the data disk) is snapshotted and its new image checked on a copy
# first; the rolling shape (two replicas on Postgres) needs neither — RDS keeps
# its own backups, and a new pod that is not ready never replaces an old one.
#
# Who runs it (issue #3143, EPIC #3139 C4): the release train, and a person.
#   * the release train calls it (issue #3142, C3): `workflow_call` with `sha` =
#     the train's TRAIN_SHA, after the train's tests and precheck are green — the
#     image is `prod-<TRAIN_SHA>` built from that commit; the train then publishes
#     the same commit and moves stable to it, so the hub and stable never come
#     from two commits. The train's one lane is the batching.
#     It calls it TWICE (issue #3867, EPIC #3863 C4): `phase: build` the moment
#     the train boards — the `build` job alone, on the train's Linux runner (the
#     Shenzhen cluster's fleet-ack and its buildkitd when the train picked it,
#     else ubuntu-latest), pushes prod-<sha7> labelled with TRAIN_SHA while the
#     tests run (`bin/fleet-train-prebuild.sh look`: an image of that sha already
#     there is reused) — then `phase: deploy` once they are green, which builds
#     nothing and deploys only the image that build reported (`verify`: the tag's
#     digest and revision, BREAK-IT train-prebuild-wrong-sha). A red train
#     deploys nothing; its image stays in the registry for the next.
#   * `workflow_dispatch` is the repair road: this commit by hand, or an EXISTING
#     `tag` (no build; the snapshot step still runs) — the rollback.
# A merge no longer deploys by itself: the push trigger (and its quiet-master
# hold, issue #2052) retired with C4 — a second deployer on another clock is how
# the hub and stable came from two commits (BREAK-IT train-hub-stable-split), and
# how one red release held up the ones after it (BREAK-IT train-superseded-red).
#
# Nobody approves a run any more (issue #2013, 方案 B), so the job is its own
# safety net: it reads the live image before it changes anything and, when the
# rollout or the health check fails, `kubectl set image`s that image back and
# goes red (the database is never restored automatically — the snapshot path is
# in the summary, RUNBOOK.md has the restore). Every run writes a summary (old →
# new, the commits between, schema changes, env changes, snapshot, rollback),
# comments on issue $HUB_DEPLOY_NOTIFY_ISSUE (repo variable; unset = silent),
# and the pause switch (repo variable HUB_DEPLOY_PAUSED=1, or an open issue
# labelled hub-deploy-paused — bin/fleet-hub-pause.sh) stops the train's call.
#
# No long-lived credential exists for it, in this repo or anywhere: the deploy
# job runs in environment `prod` (master only) and
# trades GitHub's OIDC token for STS as RAM role gha-claudefleet-deploy
# (.github/actions/hub-acr, .github/actions/hub-kubeconfig). In the cluster that
# role is Role new-deploy/claudefleet-deployer: the hub's own Deployment,
# Service, Ingress and pricing ConfigMap, a read of its PVC, pod exec for the
# snapshot, `set image` on the credential proxy's Deployment (issue #2092) —
# no secrets, no RBAC. The runbook is deploy/k8s/README.md.
#
# Where the hub runs (task PNWW): repo variable FLEET_HUB_TARGET. `ack` (unset =
# ack) is everything above, byte for byte. `aws-k3s` is the one EC2 box running
# k3s in us-west-2 (deploy/aws/README.md): the build phase pushes the image to
# ECR (HUB_PUSH_REPO_AWS) on ubuntu-latest, through GitHub's OIDC token traded
# for AWS role AWS_DEPLOY_ROLE_ARN; the `deploy` job is skipped and `deploy-aws`
# runs instead — the same pause gate, the same "never backwards" read of the
# hub's /version, the same fleet-train-prebuild.sh verify of the digest and
# revision (on ECR), then bin/fleet-hub-aws-deploy.sh: AWS SSM AWS-RunShellScript
# on the box (instance AWS_BOX_INSTANCE_ID, else the one tagged Name=tokenman-core)
# fetches TRAIN_SHA into its checkout, pins HUB_IMAGE=<repo>:<tag>@<digest> in
# /etc/fleet-core/deploy.env and runs `bootstrap.sh apply` (a rolling release; a
# failed apply puts the previous release back on the box), then the same health
# check on HUB_URLS_AWS (else FLEET_HUB_URL_AWS, else https://core.tokenman.io);
# a red health check rolls the box back. BREAK-IT train-aws-ssm-fails.
#
# The `check` job (hub-deploy-check.yml, issue #4815) runs on every PR that
# touches any of it — the PR gate calls it — and needs no credential: the
# actions' selftests, the overlay renders, the base names no environment.

on:
  # its PR check is hub-deploy-check.yml, called by the PR gate (ci.yml, issue #4815)
  workflow_call:
    inputs:
      sha:
        description: "The release train's TRAIN_SHA — build, deploy and health-check exactly this commit"
        type: string
        required: true
      phase:
        description: "The train's half (issue #3867): build = only push prod-<sha7> of sha (beside the tests); deploy = deploy the image `digest` names, build nothing; empty = both, one job"
        type: string
        required: false
        default: ''
      runs_on:
        description: "phase build: where it builds — ubuntu-latest, or the train's JSON label list (e.g. [\"fleet-ack\"]: the cluster's buildkitd)"
        type: string
        required: false
        default: ubuntu-latest
      digest:
        description: "phase deploy: the digest the build phase pushed (or kept) — the deploy refuses any other image"
        type: string
        required: false
        default: ''
    outputs:
      deployed:
        description: "success = the hub runs prod-<sha> and answers healthy; empty = nothing deployed (paused: bin/fleet-hub-pause.sh)"
        value: ${{ jobs.deploy.outputs.deployed || jobs.deploy-aws.outputs.deployed }}
      digest:
        description: "phase build: the digest of prod-<sha7> — built here, or the same sha's image already there"
        value: ${{ jobs.build.outputs.digest }}
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy an EXISTING image tag (prod-<sha7>) instead of building this commit — the rollback"
        required: false
        default: ''
      snapshot:
        description: "Snapshot the database first (turn off only when the hub pod is down and cannot be exec'd into)"
        type: boolean
        default: true
      simulate_unhealthy:
        description: "Rollback drill: treat the health check as failed, so the job rolls back to the live image and goes red"
        type: boolean
        default: false
      simulate_migration_failure:
        description: "Rehearsal drill: the new image's migrations fail on the copy, so the release stops before the apply and goes red"
        type: boolean
        default: false
      simulate_check_failure:
        description: "Check drill: the new image starts with half a GitHub sign-in pair (what a Secret holding only github-client-id does), so --check fails and the release stops before the apply"
        type: boolean
        default: false

# One deploy at a time, never cancelled half-way (a cancelled Recreate rollout
# leaves the hub down until the next one): a newer run waits, and replaces any
# run that is still only waiting. The train's call (inputs.sha) and a dispatch
# share `prod`. The train's build phase (issue #3867) changes nothing live and
# runs beside it in a group of its own sha, so it never holds or replaces a deploy.
concurrency:
  group: hub-deploy-${{ github.event_name == 'pull_request' && github.ref || inputs.phase == 'build' && format('build-{0}', inputs.sha) || 'prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Where the image goes and the hub's addresses are the deployment's, not the
# code's (claude-fleet#3630): repo variables HUB_PUSH_REPO (registry/ns/name) and
# HUB_URLS (space-separated https:// addresses, the first one probed). The deploy
# job refuses to start without them.
env:
  NS: new-deploy
  PUSH_REPO: ${{ vars.HUB_PUSH_REPO }}
  PLACEHOLDER: set-by-hub-deploy
  HUB_URLS: ${{ vars.HUB_URLS }}

jobs:
  check:
    if: inputs.phase != 'build'
    uses: ./.github/workflows/hub-deploy-check.yml
    with:
      sha: ${{ inputs.sha }}

  # The pause switch (issues #2013, #4621): the release train's call deploys
  # nothing while repo variable HUB_DEPLOY_PAUSED=1 (as read when the run was
  # QUEUED — GitHub fixes `vars` then) or an open issue is labelled
  # hub-deploy-paused (read NOW, so it also stops a train already waiting in the
  # lane; `bin/fleet-hub-pause.sh on|off`). This job goes green, says 已暂停 on the
  # summary, and the deploy job is skipped (the train then publishes nothing: it
  # needed the hub); the label unreadable is red. A person's workflow_dispatch is
  # never paused: that is how you deploy (or roll back) by hand while automatic
  # releases are off.
  gate:
    if: github.event_name != 'pull_request' && inputs.phase != 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      go: ${{ steps.pause.outputs.paused != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}   # the train's TRAIN_SHA; empty = the event's commit
          sparse-checkout: bin/fleet-hub-pause.sh
          sparse-checkout-cone-mode: false
      - name: Paused?
        id: pause
        env:
          PAUSED: ${{ vars.HUB_DEPLOY_PAUSED }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash bin/fleet-hub-pause.sh check --repo "$GITHUB_REPOSITORY" --sha "$INPUT_SHA" --var "$PAUSED" || exit 1
          if grep -q '^paused=true$' "$GITHUB_OUTPUT"; then
            why=$(sed -n 's/^why=//p' "$GITHUB_OUTPUT" | tail -1)
            { echo "## hub-deploy · ⏸ 已暂停"
              echo
              echo "${why}：发布列车这一趟（\`${INPUT_SHA:0:7}\`）没有部署入口。"
              echo "恢复自动发布：\`bin/fleet-hub-pause.sh off\`（关掉带 \`hub-deploy-paused\` 标签的单），并删掉仓库变量 \`HUB_DEPLOY_PAUSED\`；要现在发这一版：Actions → hub-deploy → Run workflow。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::hub-deploy paused (${why}) — the release train's call deployed nothing"
          fi

  # The train's hub image, built BESIDE its tests (issue #3867, EPIC #3863 C4):
  # the same inputs as the deploy job's build steps — the client pack, the
  # console, the website — then the image, labelled with TRAIN_SHA. On the cluster's
  # fleet-ack runner it is the cluster's buildkitd (buildctl, native amd64, the
  # registry's VPC endpoint, its layer cache `<repo>:buildcache` in the registry —
  # no GitHub cache across the Pacific); on ubuntu-latest buildx with GitHub's
  # cache as before. The same sha's image already in the registry (a red train's)
  # is reused. Pushing a tag deploys nothing: the deploy phase does that, after
  # the tests, and only this digest.
  build:
    if: inputs.phase == 'build'
    # FLEET_HUB_TARGET=aws-k3s: ECR is in us-west-2 — GitHub's runner, never the Shenzhen pool
    runs-on: ${{ vars.FLEET_HUB_TARGET == 'aws-k3s' && 'ubuntu-latest' || startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    environment: prod
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      TRAIN_SHA: ${{ inputs.sha }}
      ACK: ${{ vars.FLEET_HUB_TARGET != 'aws-k3s' && contains(inputs.runs_on, 'fleet-ack') }}
      AWS: ${{ vars.FLEET_HUB_TARGET == 'aws-k3s' }}
      # aws-k3s: the ECR repository (an unset variable is named, never the ACR one)
      PUSH_REPO: ${{ vars.FLEET_HUB_TARGET == 'aws-k3s' && (vars.HUB_PUSH_REPO_AWS || 'unset-HUB_PUSH_REPO_AWS') || vars.HUB_PUSH_REPO }}
      HUB_PLATFORM: ${{ vars.FLEET_HUB_TARGET == 'aws-k3s' && (vars.HUB_AWS_PLATFORM || 'linux/amd64') || 'linux/amd64' }}
      HUB_BASE_IMAGES: ${{ vars.HUB_BASE_IMAGES }}
      # the registry's VPC endpoint from inside the cluster (repo variable), else the public one
      BUILD_REPO: ${{ vars.FLEET_HUB_TARGET != 'aws-k3s' && contains(inputs.runs_on, 'fleet-ack') && vars.HUB_BUILD_PUSH_REPO || '' }}
    steps:
      # GitHub from Shenzhen: a shallow checkout, tried twice
      - uses: actions/checkout@v4
        id: co
        continue-on-error: true
        with:
          ref: ${{ inputs.sha }}
      - if: steps.co.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: The deployment's settings are here
        run: |
          [[ "$TRAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the train's sha must be a full commit sha, got '$TRAIN_SHA'"; exit 1; }
          [ -n "$PUSH_REPO" ] || { echo "::error::repo variable HUB_PUSH_REPO is not set (the image registry/ns/name)"; exit 1; }
          [ "$PUSH_REPO" != unset-HUB_PUSH_REPO_AWS ] || { echo "::error::FLEET_HUB_TARGET=aws-k3s but repo variable HUB_PUSH_REPO_AWS is not set (<acct>.dkr.ecr.us-west-2.amazonaws.com/tokenman/ccquota)"; exit 1; }
          [ -n "$BUILD_REPO" ] || BUILD_REPO=$PUSH_REPO
          echo "BUILD_REPO=$BUILD_REPO" >> "$GITHUB_ENV"
          echo "TAG=prod-${TRAIN_SHA:0:7}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/hub-acr
        if: env.AWS != 'true'

      # aws-k3s (task PNWW): GitHub's OIDC token → AWS role AWS_DEPLOY_ROLE_ARN → ECR
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - uses: aws-actions/amazon-ecr-login@v2
        if: env.AWS == 'true'

      - uses: docker/setup-buildx-action@v3
        if: env.ACK != 'true'

      - name: Already built? (fleet-train-prebuild.sh look)
        id: look
        run: bin/fleet-train-prebuild.sh look "$PUSH_REPO" "$TAG" "$TRAIN_SHA"

      - name: Pack the client
        if: steps.look.outputs.reuse != 'true'
        run: bin/fleet-client-pack.sh
      - name: Pack the new console
        if: steps.look.outputs.reuse != 'true'
        run: bin/web-console-pack.sh
      - name: Build the website and its docs
        if: steps.look.outputs.reuse != 'true'
        run: bin/docs-build.sh && bin/site-build.sh

      - name: Build and push (buildx)
        id: bx
        if: steps.look.outputs.reuse != 'true' && env.ACK != 'true'
        uses: docker/build-push-action@v6
        with:
          context: tokenledger
          platforms: ${{ env.HUB_PLATFORM }}
          push: true
          provenance: false
          tags: ${{ env.PUSH_REPO }}:${{ env.TAG }}
          labels: org.opencontainers.image.revision=${{ inputs.sha }}
          build-args: |
            VERSION=${{ env.TAG }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (the cluster's buildkitd)
        id: bk
        if: steps.look.outputs.reuse != 'true' && env.ACK == 'true'
        run: |
          set -euo pipefail
          : "${BUILDKIT_HOST:?BUILDKIT_HOST is not set on this runner (the cluster buildkitd)}"
          tls=(); [ -z "${BUILDKIT_TLSDIR:-}" ] || tls=(--tlsdir "$BUILDKIT_TLSDIR")
          # Base images (issue #4133): HUB_BASE_IMAGES = "GO_IMAGE=<ref> ALPINE_IMAGE=<ref>"
          # (registry copies) overrides the Dockerfile's docker.io defaults; unset = them.
          # The copies are pulled with hub-acr's login above, so they must sit in a
          # repository its RAM policy may pull (acme/alpine, acme/golang —
          # issue #4143); a copy anywhere else answers insufficient_scope.
          [ -z "$HUB_BASE_IMAGES" ] || echo "base images: $HUB_BASE_IMAGES"
          base=(); for kv in $HUB_BASE_IMAGES; do
            [[ "$kv" =~ ^(GO_IMAGE|ALPINE_IMAGE)=[^[:space:]]+$ ]] || { echo "::error::HUB_BASE_IMAGES: '$kv' is not GO_IMAGE=<ref> / ALPINE_IMAGE=<ref>"; exit 1; }
            base+=(--opt "build-arg:$kv"); done
          # Go modules: the Dockerfile's default GOPROXY (goproxy.cn) — inside CN.
          # A base image the registry mirror could not resolve (a 5xx from docker.io's
          # mirror, 2026-10-14) is retried twice after a pause; any other red is final.
          for try in 1 2 3; do
          set +e
          buildctl --addr "$BUILDKIT_HOST" ${tls[@]+"${tls[@]}"} build \
            --frontend dockerfile.v0 \
            --local context=tokenledger --local dockerfile=tokenledger \
            --opt platform=linux/amd64 \
            --opt build-arg:VERSION="$TAG" \
            --opt label:org.opencontainers.image.revision="$TRAIN_SHA" \
            --output "type=image,name=$BUILD_REPO:$TAG,push=true" \
            --import-cache "type=registry,ref=$BUILD_REPO:buildcache" \
            --export-cache "type=registry,ref=$BUILD_REPO:buildcache,mode=max" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            ${base[@]+"${base[@]}"} \
            --progress plain 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}; set -e
          [ "$rc" -ne 0 ] || break
          if grep -qE 'insufficient_scope|pull access denied' "$RUNNER_TEMP/build.log"; then
            echo "::error::a base image was refused (insufficient_scope): the HUB_BASE_IMAGES copy is outside what RAM policy gha-claudefleet-acr-push may pull — copy it into acme/alpine or acme/golang, or clear the variable"
            exit "$rc"
          fi
          if [ "$try" -lt 3 ] && grep -q 'failed to resolve source metadata' "$RUNNER_TEMP/build.log"; then
            echo "::warning::a base image did not resolve (try $try of 3) — retrying in $((try * 30))s"
            sleep $((try * 30)); continue
          fi
          exit "$rc"
          done
          d=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("containerimage.digest") or "")' "$RUNNER_TEMP/meta.json")
          [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::pushed, but buildctl named no digest"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: The digest
        id: digest
        env:
          REUSED: ${{ steps.look.outputs.digest }}
          BX: ${{ steps.bx.outputs.digest }}
          BK: ${{ steps.bk.outputs.digest }}
        run: |
          d=${REUSED:-${BX:-$BK}}
          [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $PUSH_REPO:$TAG"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          how=built; [ -z "$REUSED" ] || how='reused (that sha'"'"'s image was there)'
          where=ubuntu-latest; [ "$ACK" != true ] || where='fleet-ack · buildkitd'
          [ "$AWS" != true ] || where="ubuntu-latest · ECR · $HUB_PLATFORM"
          echo "### 入口镜像 \`$TAG\`：$how · $where · \`$d\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # FLEET_HUB_TARGET=aws-k3s: `deploy-aws` below instead (unset = this job, as always)
    if: github.event_name != 'pull_request' && inputs.phase != 'build' && needs.gate.outputs.go == 'true' && vars.FLEET_HUB_TARGET != 'aws-k3s'
    needs: [check, gate]
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      issues: write   # the release notice on $HUB_DEPLOY_NOTIFY_ISSUE, nothing else
    outputs:
      deployed: ${{ steps.health.outcome }}   # the release train reads it (workflow_call output)
    env:
      HUB_DEPLOY_SIMULATE_UNHEALTHY: ${{ github.event.inputs.simulate_unhealthy || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}   # the train's TRAIN_SHA; empty = the event's commit
          fetch-depth: 0   # the summary's commit list runs from the live commit to this one

      - name: The deployment's settings are here
        run: |
          [ -n "$PUSH_REPO" ] || { echo "::error::repo variable HUB_PUSH_REPO is not set (the image registry/ns/name)"; exit 1; }
          [ -n "$HUB_URLS" ] || { echo "::error::repo variable HUB_URLS is not set (the hub's https:// addresses)"; exit 1; }

      # The deployment's own overlays (claude-fleet#3630): repo variable
      # FLEET_DEPLOY_OVERLAY_REPO (owner/name) names a private repo whose k8s/ is
      # laid over deploy/k8s/, so every path below is unchanged; the prod
      # environment's secret FLEET_DEPLOY_OVERLAY_SSH_KEY is its read-only deploy
      # key. Not set ⇒ refused: this tree carries no prod overlay.
      # A missing key must say so, not 404 (claude-fleet#3860): with no ssh-key,
      # checkout asks the REST API with GITHUB_TOKEN, which never sees a private
      # repo — "Not Found" named neither the repo nor the credential.
      - name: The overlay repo's deploy key is here
        if: vars.FLEET_DEPLOY_OVERLAY_REPO != ''
        env:
          OVERLAY_REPO: ${{ vars.FLEET_DEPLOY_OVERLAY_REPO }}
          OVERLAY_KEY_SET: ${{ secrets.FLEET_DEPLOY_OVERLAY_SSH_KEY != '' }}
        run: |
          [ "$OVERLAY_KEY_SET" = true ] || {
            echo "::error::cannot read $OVERLAY_REPO: secret FLEET_DEPLOY_OVERLAY_SSH_KEY (environment prod, the repo's read-only deploy key) is empty here — a release-train call must pass it (secrets: inherit)"
            exit 1
          }

      - name: Fetch the deployment's overlays
        if: vars.FLEET_DEPLOY_OVERLAY_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FLEET_DEPLOY_OVERLAY_REPO }}
          ssh-key: ${{ secrets.FLEET_DEPLOY_OVERLAY_SSH_KEY }}
          persist-credentials: false
          path: .deploy-overlay

      - name: Lay the deployment's overlays over deploy/k8s
        id: overlay
        run: |
          set -euo pipefail
          if [ -d .deploy-overlay ]; then
            [ -d .deploy-overlay/k8s ] || { echo "::error::$OVERLAY_REPO has no k8s/ directory"; exit 1; }
            sha=$(git -C .deploy-overlay rev-parse HEAD)
            cp -R .deploy-overlay/k8s/. deploy/k8s/
            rm -rf .deploy-overlay
            echo "from=$OVERLAY_REPO@${sha:0:7}" >> "$GITHUB_OUTPUT"
            echo "overlays: $OVERLAY_REPO@$sha"
          else
            echo "::error::repo variable FLEET_DEPLOY_OVERLAY_REPO is not set — the prod overlays live in the private deploy repo, this tree carries none"
            exit 1
          fi
          .github/actions/hub-release/render-check.sh --need-prod deploy/k8s
        env:
          OVERLAY_REPO: ${{ vars.FLEET_DEPLOY_OVERLAY_REPO }}

      - name: Which image
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          TRAIN_SHA: ${{ inputs.sha }}
          PHASE: ${{ inputs.phase }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "$TRAIN_SHA" ]; then
            [[ "$TRAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the train's sha must be a full commit sha, got '$TRAIN_SHA'"; exit 1; }
            [ "$(git rev-parse HEAD)" = "$TRAIN_SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), not the train's $TRAIN_SHA"; exit 1; }
            tag="prod-${TRAIN_SHA:0:7}" build=true
            if [ "$PHASE" = deploy ]; then
              # built beside the tests (issue #3867): deploy only what that build pushed
              [ -n "$DIGEST" ] || { echo "::error::phase deploy without the build phase's digest — nothing to deploy"; exit 1; }
              build=false
            fi
          elif [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] || { echo "::error::tag must look like prod-<sha7>, got '$INPUT_TAG'"; exit 1; }
            tag=$INPUT_TAG build=false
          else
            tag="prod-${GITHUB_SHA:0:7}" build=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "commit=${tag#prod-}" >> "$GITHUB_OUTPUT"
          echo "image: $PUSH_REPO:$tag (build=$build)"

      - uses: ./.github/actions/hub-acr

      - uses: docker/setup-buildx-action@v3

      # The client /install serves lives once, in bin/ conf/ … (#1803): pack it
      # into the build context first; the Dockerfile refuses an empty pack.
      - name: Pack the client
        if: steps.tag.outputs.build == 'true'
        run: bin/fleet-client-pack.sh

      # The new console (issue #3925): its committed build, copied in.
      - name: Pack the new console
        if: steps.tag.outputs.build == 'true'
        run: bin/web-console-pack.sh

      # The website (/ and /en/) and its docs (/docs/) are build outputs the
      # image embeds (issue #3584); the site reads its FAQ off docs/public itself.
      # A RED: line (no fresh drill under 60 s) is a warning, not a failure.
      - name: Build the website and its docs
        if: steps.tag.outputs.build == 'true'
        run: bin/docs-build.sh && bin/site-build.sh

      - name: Build and push
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: tokenledger
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.PUSH_REPO }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image exists
        run: docker buildx imagetools inspect "$PUSH_REPO:${{ steps.tag.outputs.tag }}" >/dev/null

      # The train planned this deploy when it boarded, minutes ago (issue #3867):
      # a hub deployed past TRAIN_SHA by hand since is never rolled back
      # (BREAK-IT train-hub-backwards) — this train stops, the next one plans again.
      - name: The hub has not moved past the train
        if: inputs.phase == 'deploy'
        env:
          TRAIN_SHA: ${{ inputs.sha }}
        run: |
          why=$(GITHUB_OUTPUT=/dev/null bin/fleet-train-hub.sh "$TRAIN_SHA" --dir . --hub "${HUB_URLS%% *}" | sed -n 's/^why=//p') || exit 1
          echo "$why"
          case "$why" in
            ('hub superseded'*) echo "::error::$why — nothing deployed; the next train plans again"; exit 1 ;;
          esac

      # The train's prebuilt image (issue #3867, BREAK-IT train-prebuild-wrong-sha):
      # the tag must still name the digest this run's build phase reported, and
      # that image TRAIN_SHA's revision — else something pushed over it.
      - name: The image is this run's build
        if: inputs.phase == 'deploy'
        env:
          TRAIN_SHA: ${{ inputs.sha }}
          DIGEST: ${{ inputs.digest }}
        run: bin/fleet-train-prebuild.sh verify "$PUSH_REPO" "${{ steps.tag.outputs.tag }}" "$TRAIN_SHA" "$DIGEST"

      - uses: ./.github/actions/hub-kubeconfig

      # Before anything changes: what is live — the image a failed release
      # rolls back to, and the env the summary compares with.
      - name: What is live
        id: live
        run: |
          set -euo pipefail
          if kubectl -n "$NS" get deploy ccquota-hub -o json > "$RUNNER_TEMP/live.json" 2>"$RUNNER_TEMP/live.err"; then
            image=$(kubectl -n "$NS" get deploy ccquota-hub -o jsonpath='{.spec.template.spec.containers[?(@.name=="ccquota")].image}')
          else
            grep -q NotFound "$RUNNER_TEMP/live.err" || { cat "$RUNNER_TEMP/live.err"; exit 1; }
            image=''; : > "$RUNNER_TEMP/live.json"
          fi
          tag=${image##*:}; [ -n "$image" ] || tag=''
          commit=''; [[ "$tag" =~ ^prod-([0-9a-f]{7,40})$ ]] && commit=${BASH_REMATCH[1]}
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "live: ${image:-<no deployment yet — nothing to roll back to>}"

      - name: Render the manifests with this tag
        run: |
          set -euo pipefail
          kubectl kustomize deploy/k8s/overlays/prod \
            | sed "s#:$PLACEHOLDER\$#:${{ steps.tag.outputs.tag }}#" > "$RUNNER_TEMP/hub.yaml"
          ! grep -q "$PLACEHOLDER" "$RUNNER_TEMP/hub.yaml" || { echo "::error::placeholder left in the render"; exit 1; }
          # The 「正在更新」 page (issue #2052) is installed by a person
          # (deploy/k8s/updating): until a pod of it runs, the Ingress must not
          # name it as its default backend.
          if [ -z "$(kubectl -n "$NS" get pod -l app=ccquota-hub-updating --field-selector=status.phase=Running -o name 2>/dev/null)" ]; then
            yq -i '(select(.kind == "Ingress") | .metadata.annotations) |= del(."nginx.ingress.kubernetes.io/default-backend")' "$RUNNER_TEMP/hub.yaml"
            echo "::warning::no ccquota-hub-updating pod runs in $NS — released without the 正在更新 page (deploy/k8s/updating/README.md installs it)"
          fi
          grep -n 'image:\|default-backend' "$RUNNER_TEMP/hub.yaml"

      # Which shape this release is (issue #2125): sqlite — snapshot + check
      # on a copy, Recreate; postgres — rolling, neither needed. A mix is
      # refused here, before anything changes.
      - name: Which shape
        id: shape
        run: |
          set -euo pipefail
          out=$(yq -o=json '.' "$RUNNER_TEMP/hub.yaml" | .github/actions/hub-release/release.sh shape -) \
            || { printf '%s\n' "$out" | sed 's/^/::error::/'; exit 1; }
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "$out"

      # Before anything changes: a transaction-consistent copy of the live
      # database (VACUUM INTO via /data/snapshot-tool — never a raw copy, the
      # database is in WAL mode). Named after the image it was taken FROM, so a
      # rollback finds its pair. This step keeps the newest 3 of ITS OWN
      # snapshots (backup-hubdeploy-*); a person's backup-* is never touched.
      - name: Snapshot the database
        id: snapshot
        if: github.event.inputs.snapshot != 'false' && steps.shape.outputs.mode == 'sqlite'
        run: |
          set -euo pipefail
          pod=$(kubectl -n "$NS" get pod -l app=ccquota-hub --field-selector=status.phase=Running -o name | head -1)
          [ -n "$pod" ] || { echo "::error::no running hub pod to snapshot — re-run from workflow_dispatch with snapshot off if the hub is down"; exit 1; }
          from=$(kubectl -n "$NS" get deploy ccquota-hub -o jsonpath='{.spec.template.spec.containers[?(@.name=="ccquota")].image}')
          from=${from##*:}
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          echo "path=/data/backup-hubdeploy-$ts-$from.db (pod $pod, PVC ccquota-data)" >> "$GITHUB_OUTPUT"
          echo "file=/data/backup-hubdeploy-$ts-$from.db" >> "$GITHUB_OUTPUT"
          echo "pod=${pod#pod/}" >> "$GITHUB_OUTPUT"
          kubectl -n "$NS" exec "$pod" -c ccquota -- sh -c '
            set -e
            ls -1t /data/backup-hubdeploy-*.db 2>/dev/null | tail -n +3 | while read -r f; do rm -f "$f"; echo "pruned $f"; done
            db_kb=$(du -k /data/ccquota.db | cut -f1)
            free_kb=$(df -Pk /data | awk "NR==2{print \$4}")
            echo "db ${db_kb}K, free ${free_kb}K"
            [ "$free_kb" -gt $((db_kb * 12 / 10)) ] || { echo "not enough room on /data for a snapshot (deploy/k8s/RUNBOOK.md: 数据盘水位)"; exit 1; }
            out="/data/backup-hubdeploy-$1-$2.db"
            /data/snapshot-tool /data/ccquota.db "$out"
            ls -la "$out"
          ' _ "$ts" "$from"

      # Before anything changes, part two (issues #2050, #2052): the NEW image
      # starts up on a copy of that snapshot with the environment it is about
      # to get — `ccquota hub --check` runs the pending migrations AND every
      # startup check the hub dies on (a GitHub pair with one half, an
      # unreadable CA or credential key, a --pricing that does not parse, …),
      # then exits without binding a port. Non-zero stops the release here —
      # the live pod keeps serving. C5's migration died on a foreign key only
      # production had, after Recreate had already stopped the old pod: ten
      # minutes of 503; a Secret with half a GitHub pair would have been the
      # same. The PVC is ReadWriteOnce and a file moves in or out of the pod at
      # ~9 KB/s (RUNBOOK.md), so neither the database nor the binary can
      # travel: the new image goes INTO the live pod as an ephemeral container
      # (the kubelet pulls it as it would for the release) with the render's
      # env / envFrom / args and the live pod's volume mounts (a running pod
      # takes no new volume — a mount only the render has is named as a
      # warning, unchecked), on /data/rehearse-<run>.db, deleted afterwards.
      # A Secret key the env names but the Secret lacks fails the container's
      # start (CreateContainerConfigError) — that is a red check too. Needs the
      # deploy Role to patch pods/ephemeralcontainers; without it the step
      # refuses — a release nothing vouched for does not go out.
      - name: Check the new image (real config, a copy of the database)
        id: rehearse
        if: steps.snapshot.outcome == 'success'
        env:
          POD: ${{ steps.snapshot.outputs.pod }}
          SNAP: ${{ steps.snapshot.outputs.file }}
          SIMULATE_MIGRATION: ${{ github.event.inputs.simulate_migration_failure || 'false' }}
          SIMULATE_CHECK: ${{ github.event.inputs.simulate_check_failure || 'false' }}
        run: |
          set -uo pipefail
          yq -o=json 'select(.kind == "Deployment") | .spec.template.spec.containers[] | select(.name == "ccquota")' "$RUNNER_TEMP/hub.yaml" > "$RUNNER_TEMP/new-container.json"
          image=$(jq -r '.image // ""' "$RUNNER_TEMP/new-container.json")
          [ -n "$image" ] || { echo "::error::no ccquota image in the render"; exit 1; }
          name="rehearse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          copy="/data/$name.db"
          if [ "$(kubectl -n "$NS" auth can-i patch pods --subresource=ephemeralcontainers)" != yes ]; then
            echo "::error::the deploy role cannot patch pods/ephemeralcontainers in $NS — the check cannot run, so nothing is released (deploy/k8s/README.md «Who may do what»)"
            exit 1
          fi
          kubectl -n "$NS" get pod "$POD" -o json > "$RUNNER_TEMP/pod.json" || { echo "::error::cannot read pod $POD"; exit 1; }
          missing=$(jq -r --slurpfile p "$RUNNER_TEMP/pod.json" '
            ([$p[0].spec.containers[] | select(.name == "ccquota") | .volumeMounts[]?.name]) as $live
            | [.volumeMounts[]?.name | select(. as $n | $live | index($n) | not)] | join(" ")' "$RUNNER_TEMP/new-container.json")
          [ -z "$missing" ] || echo "::warning::the render mounts volume(s) the live pod does not have ($missing) — the check runs without them; whatever reads them is first tried by the real start"
          # …and the hub is told where they would be (CCQUOTA_CHECK_UNMOUNTED,
          # #2366): a setting naming a file under one is reported, not refused.
          unmounted=$(jq -r --slurpfile p "$RUNNER_TEMP/pod.json" '
            ([$p[0].spec.containers[] | select(.name == "ccquota") | .volumeMounts[]?.name]) as $live
            | [.volumeMounts[]? | select(.name as $n | $live | index($n) | not) | .mountPath] | join(" ")' "$RUNNER_TEMP/new-container.json")
          cleanup() { kubectl -n "$NS" exec "$POD" -c ccquota -- sh -c 'rm -f "$1" "$1-wal" "$1-shm"' _ "$copy" || echo "::warning::could not delete $copy from /data"; }
          kubectl -n "$NS" exec "$POD" -c ccquota -- sh -c '
            set -e
            db_kb=$(du -k "$1" | cut -f1)
            free_kb=$(df -Pk /data | awk "NR==2{print \$4}")
            [ "$free_kb" -gt $((db_kb * 12 / 10)) ] || { echo "not enough room on /data for the check copy (db ${db_kb}K, free ${free_kb}K)"; exit 1; }
            cp "$1" "$2"
          ' _ "$SNAP" "$copy" || { echo "::error::could not copy the snapshot for the check"; cleanup; exit 1; }
          # The ephemeral container: the image's entrypoint (`ccquota hub
          # --addr … --db /data/ccquota.db`) + the render's args + `--check
          # --db <copy>` (the later --db wins). simulate_check_failure is the
          # drill for a Secret holding half a GitHub pair. An image older than
          # --check (a rollback to a tag before #2052) gets --migrate-only.
          attempt() { # <container name> <--check | --migrate-only> → $code $why $state
            jq -c --slurpfile p "$RUNNER_TEMP/pod.json" --arg name "$1" --arg mode "$2" --arg copy "$copy" --arg unmounted "$unmounted" \
              --argjson simmig "$( [ "$SIMULATE_MIGRATION" = true ] && echo true || echo false )" \
              --argjson simgh "$( [ "$SIMULATE_CHECK" = true ] && echo true || echo false )" '
              {spec: {ephemeralContainers: [
                {name: $name, image: .image,
                 args: ((.args // []) + [$mode, "--db", $copy] + (if $simmig then ["--simulate-migration-failure"] else [] end)),
                 env: ((.env // []) + (if $unmounted != "" then [{name: "CCQUOTA_CHECK_UNMOUNTED", value: $unmounted}] else [] end)
                   | if $simgh then map(select(.name != "CCQUOTA_GITHUB_CLIENT_ID" and .name != "CCQUOTA_GITHUB_CLIENT_SECRET"))
                       + [{name: "CCQUOTA_GITHUB_CLIENT_ID", value: "simulated-half-pair"}, {name: "CCQUOTA_GITHUB_CLIENT_SECRET", value: ""}]
                     else . end),
                 envFrom: (.envFrom // []),
                 volumeMounts: ([$p[0].spec.containers[] | select(.name == "ccquota") | .volumeMounts[]?]),
                 securityContext: {runAsUser: 10001}}
                + (if .command then {command: .command} else {} end)
              ]}}' "$RUNNER_TEMP/new-container.json" > "$RUNNER_TEMP/patch.json" \
              || { echo "::error::could not build the check container"; return 1; }
            echo "checking $image on $copy (pod $POD, container $1): $(jq -c '.spec.ephemeralContainers[0].args' "$RUNNER_TEMP/patch.json")"
            kubectl -n "$NS" patch pod "$POD" --subresource ephemeralcontainers --type strategic --patch-file "$RUNNER_TEMP/patch.json" >/dev/null \
              || { echo "::error::could not start the check container"; return 1; }
            code='' why='' state=''
            for _ in $(seq 1 100); do   # ≤ ~5 minutes: the pull plus the migrations
              state=$(kubectl -n "$NS" get pod "$POD" -o json 2>/dev/null | jq -c --arg n "$1" '.status.ephemeralContainerStatuses[]? | select(.name == $n) | .state' || true)
              code=$(jq -r '.terminated.exitCode // empty' <<<"$state" 2>/dev/null || true)
              [ -z "$code" ] || break
              why=$(jq -r '.waiting.reason // empty' <<<"$state" 2>/dev/null || true)
              case "$why" in
                CreateContainerConfigError|CreateContainerError|InvalidImageName) break ;;
              esac
              sleep 3
            done
            kubectl -n "$NS" logs "$POD" -c "$1" 2>/dev/null | tee "$RUNNER_TEMP/rehearse.log" || echo "(no log access — the exit code decides)"
          }
          attempt "$name" --check || { cleanup; exit 1; }
          if [ "$code" = 2 ] && grep -q 'flag provided but not defined: -check' "$RUNNER_TEMP/rehearse.log" 2>/dev/null; then
            echo "::warning::$image predates --check (#2052) — only its migrations are rehearsed, not its config"
            attempt "$name-m" --migrate-only || { cleanup; exit 1; }
          fi
          cleanup
          if [ -z "$code" ]; then
            echo "$state"
            case "$why" in
              CreateContainerConfigError|CreateContainerError)
                echo "::error::the new image could not even start with this config ($why: $(jq -r '.waiting.message // ""' <<<"$state")) — a Secret key the env names is missing? Nothing released, the live hub is untouched" ;;
              *) echo "::error::the check did not finish within ~5 minutes${why:+ ($why)} — nothing released" ;;
            esac
            exit 1
          fi
          [ "$code" = 0 ] || { echo "::error::the new image's startup check FAILED (exit $code: a migration on the copy of the live database, or a setting it refuses to start without — the log above) — nothing released, the live hub is untouched"; exit 1; }
          echo "check passed: the new image migrated a copy of the live database and read every startup setting"

      # From here until the health check / rollback is done (issue #2125):
      # once a second, /healthz + a write on the first address; the stop step
      # below reads how many seconds were down. In the background of the job —
      # the runner ends it with the job, and probe.sh has its own deadline.
      - name: Start the availability probe
        id: probe
        run: |
          set -euo pipefail
          url=${HUB_URLS%% *}
          echo "out=$RUNNER_TEMP/probe.log" >> "$GITHUB_OUTPUT"
          nohup .github/actions/hub-release/release.sh probe "$url" "$RUNNER_TEMP/probe.stop" 3000 > "$RUNNER_TEMP/probe.log" 2>&1 &
          echo "probing $url/healthz + POST $url/v1/deploy-probe every second (pid $!)"

      - name: Apply
        id: apply
        run: kubectl apply -f "$RUNNER_TEMP/hub.yaml"

      - name: Rollout
        id: rollout
        run: |
          # Recreate: 3 minutes, not 10 (issue #2050) — the old pod is already
          # gone, so every minute waited here is a minute of 503 before the
          # rollback below starts. Rolling (issue #2125): the old pods serve
          # until each new one is ready, so waiting costs nothing — 8 minutes
          # for two pulls, migrations and readiness one after the other.
          t=3m; [ "${{ steps.shape.outputs.mode }}" = postgres ] && t=8m
          if ! kubectl -n "$NS" rollout status deploy/ccquota-hub --timeout=$t; then
            kubectl -n "$NS" get pod -l app=ccquota-hub -o wide || true
            echo "::error::rollout did not finish — a pod stuck in ContainerCreating is the disk attach (deploy/k8s/RUNBOOK.md)"
            exit 1
          fi

      # The release is good only when every address answers /healthz = 200
      # AND /version names this commit, within ~2 minutes each — and the entry
      # people reach first is whole (issue #2060): /install 200 with `#!`,
      # /version names stable, login/start is not 404.
      - name: Health check (/healthz + /version + entry, every address)
        id: health
        run: .github/actions/hub-release/release.sh health "${{ steps.tag.outputs.commit }}"

      # The cluster credential proxy (#1973, deploy/k8s/credproxy) runs the
      # hub's image, so a good release rolls it too (issue #2092): the same
      # image, `set image` only — its manifests stay a person's to apply. Not
      # applied yet (NotFound), or the Role not yet granted it (Forbidden) ⇒
      # skipped with a notice. It never paints the release red and never
      # touches the hub: a proxy that will not roll is a warning + the
      # summary's 中心代理 row (its old pods keep serving, maxUnavailable 0).
      - name: Roll the credential proxy to the same image
        id: credproxy
        if: steps.health.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          image=$(kubectl -n "$NS" get deploy ccquota-hub -o jsonpath='{.spec.template.spec.containers[?(@.name=="ccquota")].image}')
          [ -n "$image" ] || { echo "::warning::could not read the hub's image — the credential proxy was not rolled"; echo "result=error" >> "$GITHUB_OUTPUT"; exit 1; }
          if ! kubectl -n "$NS" get deploy ccquota-credproxy -o name >/dev/null 2>"$RUNNER_TEMP/credproxy.err"; then
            if grep -q NotFound "$RUNNER_TEMP/credproxy.err"; then
              echo "::notice::no ccquota-credproxy deployment in $NS — skipped (deploy/k8s/credproxy/README.md applies it)"
              echo "result=absent" >> "$GITHUB_OUTPUT"; exit 0
            elif grep -qi forbidden "$RUNNER_TEMP/credproxy.err"; then
              echo "::warning::Role claudefleet-deployer may not read deploy/ccquota-credproxy — skipped (deploy/k8s/README.md «Who may do what»)"
              echo "result=forbidden" >> "$GITHUB_OUTPUT"; exit 0
            fi
            cat "$RUNNER_TEMP/credproxy.err"; echo "result=error" >> "$GITHUB_OUTPUT"; exit 1
          fi
          kubectl -n "$NS" set image deploy/ccquota-credproxy "credproxy=$image" \
            || { echo "::warning::could not set the credential proxy's image"; echo "result=error" >> "$GITHUB_OUTPUT"; exit 1; }
          if ! kubectl -n "$NS" rollout status deploy/ccquota-credproxy --timeout=5m; then
            kubectl -n "$NS" get pod -l app=ccquota-credproxy -o wide || true
            echo "::warning::the credential proxy's rollout to $image did not finish — its old pods keep serving"
            echo "result=error" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "result=rolled" >> "$GITHUB_OUTPUT"
          echo "credential proxy now on $image"

      # Before the rollback deletes them (claude-fleet T829): every hub pod on
      # the new image prints its crashed container's last 200 lines (and its
      # current ones), so a CrashLoopBackOff is never again a release with no
      # cause on record — on 2026-10-21 three releases rolled back that way
      # while the cause was one log line («--pricing: record …»). Never fails
      # the job; a Role without pods/log says so.
      - name: Logs of the new image's pods
        if: failure() && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        continue-on-error: true
        env:
          NEW_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          pods=$(kubectl -n "$NS" get pod -l app=ccquota-hub \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[?(@.name=="ccquota")].image}{"\n"}{end}' \
            | awk -F'\t' -v t=":$NEW_TAG" 'substr($2, length($2) - length(t) + 1) == t { print $1 }')
          [ -n "$pods" ] || { echo "no hub pod on $NEW_TAG left to read"; exit 0; }
          for p in $pods; do
            kubectl -n "$NS" get pod "$p" \
              -o jsonpath='{.metadata.name}: {.status.containerStatuses[0].state} last={.status.containerStatuses[0].lastState}{"\n"}' || true
            for prev in --previous ""; do
              echo "::group::$p ${prev:-(current)} — last 200 lines"
              kubectl -n "$NS" logs "$p" -c ccquota $prev --tail=200 >"$RUNNER_TEMP/crash.log" 2>&1; rc=$?
              cat "$RUNNER_TEMP/crash.log"
              echo "::endgroup::"
              last=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/crash.log" | tail -1)
              if [ -n "$prev" ] && [ "$rc" = 0 ] && [ -n "$last" ]; then echo "::error::$p crashed: ${last:0:400}"; fi
            done
          done

      # Anything after the apply went wrong ⇒ put the live image back. Only the
      # image: the manifests stay master's, and a migration the new image ran
      # stays run (the snapshot is in the summary; restoring it is a person's,
      # RUNBOOK.md). The job stays red either way.
      - name: Roll back to the live image
        id: rollback
        if: failure() && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        env:
          PREV_IMAGE: ${{ steps.live.outputs.image }}
          PREV_COMMIT: ${{ steps.live.outputs.commit }}
          NEW_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          if [ -z "$PREV_IMAGE" ]; then
            echo "::error::no live image was recorded before the deploy — nothing to roll back to"; exit 1
          fi
          if [ "${PREV_IMAGE##*:}" = "$NEW_TAG" ]; then
            echo "::error::the live image already was $NEW_TAG — rolling back would change nothing"; exit 1
          fi
          echo "rolling back to $PREV_IMAGE"
          kubectl -n "$NS" set image deploy/ccquota-hub "ccquota=$PREV_IMAGE" || exit 1
          if ! kubectl -n "$NS" rollout status deploy/ccquota-hub --timeout=10m; then
            kubectl -n "$NS" get pod -l app=ccquota-hub -o wide || true
            echo "::error::the rollback's rollout did not finish either — the hub may be down (deploy/k8s/RUNBOOK.md)"; exit 1
          fi
          if [ -n "$PREV_COMMIT" ]; then
            HUB_DEPLOY_SIMULATE_UNHEALTHY=false .github/actions/hub-release/release.sh health "$PREV_COMMIT" \
              || { echo "::error::rolled back to $PREV_IMAGE, but it does not answer healthy"; exit 1; }
          fi
          echo "::error::release ${NEW_TAG} failed its checks — rolled back to ${PREV_IMAGE##*:}"

      - name: Stop the availability probe
        id: downtime
        if: always() && steps.probe.outcome == 'success'
        continue-on-error: true
        env:
          OUT: ${{ steps.probe.outputs.out }}
        run: |
          touch "$RUNNER_TEMP/probe.stop"
          for _ in $(seq 1 20); do tail -1 "$OUT" | grep -q '^probes=' && break; sleep 0.5; done
          grep '^DOWN' "$OUT" | head -40 || true
          last=$(tail -1 "$OUT")
          case "$last" in probes=*) ;; *) echo "::warning::the probe gave no verdict: $last"; exit 0 ;; esac
          echo "$last"
          for kv in $last; do echo "$kv" >> "$GITHUB_OUTPUT"; done

      # What happened, on the run's summary page — every run, red or green.
      # Its first lines decide the verdict (result / head, read by Notify);
      # everything after is reporting, and a reporting failure must never
      # paint a release red or turn its notice into 发布失败 — run 37578256836
      # released fine and went red on a SIGPIPE in the commit list. So the
      # step may fail without failing the job, and Notify keys on the head.
      - name: Summary
        id: summary
        if: always() && steps.tag.outcome == 'success'
        continue-on-error: true
        env:
          NEW_TAG: ${{ steps.tag.outputs.tag }}
          NEW_COMMIT: ${{ steps.tag.outputs.commit }}
          PREV_TAG: ${{ steps.live.outputs.tag }}
          PREV_COMMIT: ${{ steps.live.outputs.commit }}
          SNAPSHOT: ${{ steps.snapshot.outputs.path }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
          REHEARSE: ${{ steps.rehearse.outcome }}
          SHAPE: ${{ steps.shape.outputs.mode }}
          DOWN_SECS: ${{ steps.downtime.outputs.downtime_seconds }}
          PROBES: ${{ steps.downtime.outputs.probes }}
          WRITE_UNSUPPORTED: ${{ steps.downtime.outputs.write_unsupported }}
          SIMULATE_MIGRATION: ${{ github.event.inputs.simulate_migration_failure || 'false' }}
          SIMULATE_CHECK: ${{ github.event.inputs.simulate_check_failure || 'false' }}
          APPLY: ${{ steps.apply.outcome }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          CREDPROXY: ${{ steps.credproxy.outputs.result || steps.credproxy.outcome }}
          OVERLAY_FROM: ${{ steps.overlay.outputs.from }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "$HEALTH" = success ]; then
            result=success head="✅ 已发布 \`$NEW_TAG\`"
          elif [ "$ROLLBACK" = success ]; then
            result=rolled-back head="↩️ 已回退到 \`$PREV_TAG\`（\`$NEW_TAG\` 没过检查）"
          elif [ "$ROLLBACK" = failure ]; then
            result=rollback-failed head="🔥 回退失败 — 线上可能不健康，照 deploy/k8s/RUNBOOK.md 手工处理"
          elif [ "$APPLY" = success ] || [ "$APPLY" = failure ]; then
            result=failed head="❌ 发布失败"
          elif [ "$REHEARSE" = failure ]; then
            result=rehearsal-failed head="❌ 没部署：新镜像没过启动检查（真实配置 + 线上库副本，\`--check\`；线上没动）"
          else
            result=not-applied head="❌ 没部署（在 apply 之前失败，线上没动）"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          case "$SNAPSHOT_OUTCOME" in
            success) snap="\`$SNAPSHOT\`" ;;
            skipped) if [ "$SHAPE" = postgres ]; then snap="不需要（托管 Postgres，RDS 自动备份）"
                     else snap="没做（${{ github.event.inputs.snapshot == 'false' && '手动关掉' || '没走到这一步' }}）"; fi ;;
            *) snap="失败" ;;
          esac
          {
            echo "## hub-deploy · $head"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 线上旧版本 | \`${PREV_TAG:-（无）}\` |"
            echo "| 新版本 | \`$NEW_TAG\` |"
            echo "| 覆盖层 | ${OVERLAY_FROM:-（没走到这一步）} |"
            echo "| 快照 | $snap |"
            if [ "$SHAPE" = postgres ]; then
              echo "| 启动检查 | 不需要（滚动发布：新 pod 不就绪，旧 pod 不下） |"
            else
              echo "| 启动检查（真实配置 + 库副本） | $( [ "$REHEARSE" = skipped ] && echo '没做（没有快照可用）' || echo "$REHEARSE" ) |"
            fi
            echo "| 发布方式 | ${SHAPE:-?}$( [ "$SHAPE" = postgres ] && echo '（两份滚动）' || { [ "$SHAPE" = sqlite ] && echo '（单份 Recreate）'; } ) |"
            echo "| apply · rollout · 健康检查 | $APPLY · $ROLLOUT · $HEALTH |"
            if [ -n "$DOWN_SECS" ]; then
              echo "| 发布期间不可用 | downtime_seconds=$DOWN_SECS（每秒探 /healthz + 一次写，共 $PROBES 次$( [ "${WRITE_UNSUPPORTED:-0}" = 0 ] || echo "；$WRITE_UNSUPPORTED 次写探测 404 = 旧镜像还没有 /v1/deploy-probe，不计入" )） |"
            else
              echo "| 发布期间不可用 | 没测（探测没起来或没给出结果） |"
            fi
            echo "| 回退 | $( [ "$ROLLBACK" = skipped ] && echo 没回退 || echo "$ROLLBACK（只回镜像；数据库要恢复照 RUNBOOK.md 用上面的快照手工做）" ) |"
            case "$CREDPROXY" in
              rolled) echo "| 中心代理 | 已滚到 \`$NEW_TAG\` |" ;;
              absent) echo "| 中心代理 | 跳过（还没部署 ccquota-credproxy） |" ;;
              forbidden) echo "| 中心代理 | 跳过（部署 Role 还没有 ccquota-credproxy，deploy/k8s/README.md） |" ;;
              skipped|'') ;;
              *) echo "| 中心代理 | ⚠️ 没滚成（$CREDPROXY；旧 pod 继续服务，看这次运行的日志） |" ;;
            esac
            [ "$HUB_DEPLOY_SIMULATE_UNHEALTHY" != true ] || echo "| 演练 | simulate_unhealthy=true：健康检查按失败处理 |"
            [ "$SIMULATE_MIGRATION" != true ] || echo "| 演练 | simulate_migration_failure=true：副本上的迁移按失败处理 |"
            [ "$SIMULATE_CHECK" != true ] || echo "| 演练 | simulate_check_failure=true：检查容器只拿到一半 GitHub 登录键 |"
            echo
            echo "### 环境变量（ccquota 容器，线上 → 这次的渲染）"
            echo
            if [ ! -s "$RUNNER_TEMP/hub.yaml" ]; then
              echo "_没渲染出清单，没法比较。_"
            elif [ ! -s "$RUNNER_TEMP/live.json" ]; then
              echo "_线上还没有 deployment，没法比较。_"
            elif ! new_env=$(yq -o=json 'select(.kind == "Deployment")' "$RUNNER_TEMP/hub.yaml" | .github/actions/hub-release/release.sh env -) \
              || ! old_env=$(.github/actions/hub-release/release.sh env "$RUNNER_TEMP/live.json"); then
              echo "_读不出 env，没法比较。_"
            elif [ "$old_env" = "$new_env" ]; then
              echo "没变。"
            else
              echo '```diff'
              diff -U0 <(printf '%s\n' "$old_env") <(printf '%s\n' "$new_env") | grep -E '^[+-][^+-]' || true
              echo '```'
            fi
            echo
            .github/actions/hub-release/release.sh changes "$PREV_COMMIT" "$NEW_COMMIT" \
              || echo "_变更列表没生成出来（exit $?）— 看这次运行的日志。_"
            echo
            echo "[这次运行]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per release on the fixed issue (repo variable
      # HUB_DEPLOY_NOTIFY_ISSUE; unset = no comment), with this job's token.
      - name: Notify
        if: always() && vars.HUB_DEPLOY_NOTIFY_ISSUE != '' && steps.summary.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ vars.HUB_DEPLOY_NOTIFY_ISSUE }}
          HEAD: ${{ steps.summary.outputs.head }}
          PREV_TAG: ${{ steps.live.outputs.tag }}
          NEW_TAG: ${{ steps.tag.outputs.tag }}
          TRAIN: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "**hub-deploy** · $HEAD

          \`${PREV_TAG:-（无）}\` → \`$NEW_TAG\` · 触发：$GITHUB_EVENT_NAME${TRAIN:+（发布列车）} by @$GITHUB_ACTOR
          摘要（提交列表、migration、环境变量、快照）：$RUN_URL" \
            || echo "::warning::could not comment on issue #$ISSUE"

  # FLEET_HUB_TARGET=aws-k3s (task PNWW): the hub on ONE EC2 box running k3s
  # (deploy/aws/README.md). Same guarantees as `deploy` — the pause gate, one
  # commit (TRAIN_SHA), never backwards, only the digest the build phase pushed —
  # but the release is `bootstrap.sh apply` on the box, sent through AWS SSM by
  # bin/fleet-hub-aws-deploy.sh with the job's OIDC role (no ssh, no standing
  # key). A failed apply is put back on the box by the same command; a red health
  # check afterwards rolls the box back (`rollback`). BREAK-IT train-aws-ssm-fails.
  deploy-aws:
    if: github.event_name != 'pull_request' && inputs.phase != 'build' && needs.gate.outputs.go == 'true' && vars.FLEET_HUB_TARGET == 'aws-k3s'
    needs: [check, gate]
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      issues: write   # the release notice on $HUB_DEPLOY_NOTIFY_ISSUE, nothing else
    outputs:
      deployed: ${{ steps.health.outcome }}   # the release train reads it (workflow_call output)
    env:
      HUB_DEPLOY_SIMULATE_UNHEALTHY: ${{ github.event.inputs.simulate_unhealthy || 'false' }}
      PUSH_REPO: ${{ vars.HUB_PUSH_REPO_AWS }}
      HUB_PLATFORM: ${{ vars.HUB_AWS_PLATFORM || 'linux/amd64' }}
      HUB_URLS: ${{ vars.HUB_URLS_AWS || vars.FLEET_HUB_URL_AWS || 'https://core.tokenman.io' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_BOX_INSTANCE_ID: ${{ vars.AWS_BOX_INSTANCE_ID }}
      AWS_BOX_TAG: ${{ vars.AWS_BOX_TAG || 'tokenman-core' }}
      AWS_BOX_REPO_DIR: ${{ vars.AWS_BOX_REPO_DIR || '/home/ubuntu/src' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}   # the train's TRAIN_SHA; empty = the event's commit
          fetch-depth: 0   # fleet-train-hub.sh places the hub's commit against this one

      - name: The deployment's settings are here
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          [ -n "$PUSH_REPO" ] || { echo "::error::repo variable HUB_PUSH_REPO_AWS is not set (<acct>.dkr.ecr.us-west-2.amazonaws.com/tokenman/ccquota)"; exit 1; }
          [ -n "$ROLE" ] || { echo "::error::repo variable AWS_DEPLOY_ROLE_ARN is not set (deploy/aws/README.md «The release train's role»)"; exit 1; }
          echo "hub: $HUB_URLS · box: ${AWS_BOX_INSTANCE_ID:-tag Name=$AWS_BOX_TAG} · checkout $AWS_BOX_REPO_DIR · $AWS_REGION"

      - name: Which image
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          TRAIN_SHA: ${{ inputs.sha }}
          PHASE: ${{ inputs.phase }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "$TRAIN_SHA" ]; then
            [[ "$TRAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the train's sha must be a full commit sha, got '$TRAIN_SHA'"; exit 1; }
            [ "$(git rev-parse HEAD)" = "$TRAIN_SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), not the train's $TRAIN_SHA"; exit 1; }
            tag="prod-${TRAIN_SHA:0:7}" build=true
            if [ "$PHASE" = deploy ]; then
              [ -n "$DIGEST" ] || { echo "::error::phase deploy without the build phase's digest — nothing to deploy"; exit 1; }
              build=false
            fi
          elif [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^prod-[0-9a-f]{7,40}$ ]] || { echo "::error::tag must look like prod-<sha7>, got '$INPUT_TAG'"; exit 1; }
            tag=$INPUT_TAG build=false
          else
            tag="prod-${GITHUB_SHA:0:7}" build=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "commit=${tag#prod-}" >> "$GITHUB_OUTPUT"
          # the box's checkout (its overlay): this run's commit — TRAIN_SHA, or the dispatch's
          echo "box_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image: $PUSH_REPO:$tag (build=$build)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Pack the client
        if: steps.tag.outputs.build == 'true'
        run: bin/fleet-client-pack.sh
      - name: Pack the new console
        if: steps.tag.outputs.build == 'true'
        run: bin/web-console-pack.sh
      - name: Build the website and its docs
        if: steps.tag.outputs.build == 'true'
        run: bin/docs-build.sh && bin/site-build.sh
      - name: Build and push
        if: steps.tag.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: tokenledger
          platforms: ${{ env.HUB_PLATFORM }}
          push: true
          provenance: false
          tags: ${{ env.PUSH_REPO }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ steps.tag.outputs.box_sha }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image exists
        run: docker buildx imagetools inspect "$PUSH_REPO:${{ steps.tag.outputs.tag }}" >/dev/null

      # as `deploy` (BREAK-IT train-hub-backwards): a hub deployed past TRAIN_SHA
      # since the train boarded is never rolled back
      - name: The hub has not moved past the train
        if: inputs.phase == 'deploy'
        env:
          TRAIN_SHA: ${{ inputs.sha }}
        run: |
          why=$(GITHUB_OUTPUT=/dev/null bin/fleet-train-hub.sh "$TRAIN_SHA" --dir . --hub "${HUB_URLS%% *}" | sed -n 's/^why=//p') || exit 1
          echo "$why"
          case "$why" in
            ('hub superseded'*) echo "::error::$why — nothing deployed; the next train plans again"; exit 1 ;;
          esac

      # as `deploy` (BREAK-IT train-prebuild-wrong-sha): on ECR the tag must still
      # name the digest the build phase reported, of TRAIN_SHA's revision
      - name: The image is this run's build
        if: inputs.phase == 'deploy'
        env:
          TRAIN_SHA: ${{ inputs.sha }}
          DIGEST: ${{ inputs.digest }}
        run: bin/fleet-train-prebuild.sh verify "$PUSH_REPO" "${{ steps.tag.outputs.tag }}" "$TRAIN_SHA" "$DIGEST"

      # The box pulls by digest: a tag pushed over after this point changes nothing
      - name: Pin the image by digest
        id: pin
        env:
          DIGEST: ${{ inputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          d=$DIGEST
          [ -n "$d" ] || d=$(docker buildx imagetools inspect "$PUSH_REPO:$TAG" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest") or "")')
          [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $PUSH_REPO:$TAG"; exit 1; }
          echo "image=$PUSH_REPO:$TAG@$d" >> "$GITHUB_OUTPUT"
          echo "image: $PUSH_REPO:$TAG@$d"

      - name: Start the availability probe
        id: probe
        run: |
          set -euo pipefail
          url=${HUB_URLS%% *}
          echo "out=$RUNNER_TEMP/probe.log" >> "$GITHUB_OUTPUT"
          nohup .github/actions/hub-release/release.sh probe "$url" "$RUNNER_TEMP/probe.stop" 3000 > "$RUNNER_TEMP/probe.log" 2>&1 &
          echo "probing $url/healthz + POST $url/v1/deploy-probe every second (pid $!)"

      # TRAIN_SHA's checkout + HUB_IMAGE on the box, `bootstrap.sh apply` (it
      # waits for the rollout); a failed apply is put back there and goes red
      - name: Deploy on the box (SSM)
        id: deploy
        run: bin/fleet-hub-aws-deploy.sh deploy "${{ steps.tag.outputs.box_sha }}" "${{ steps.pin.outputs.image }}"

      - name: Health check (/healthz + /version + entry, every address)
        id: health
        run: .github/actions/hub-release/release.sh health "${{ steps.tag.outputs.commit }}"

      - name: Roll the box back
        id: rollback
        if: failure() && steps.deploy.outcome == 'success'
        run: bin/fleet-hub-aws-deploy.sh rollback

      - name: Stop the availability probe
        id: downtime
        if: always() && steps.probe.outcome == 'success'
        continue-on-error: true
        env:
          OUT: ${{ steps.probe.outputs.out }}
        run: |
          touch "$RUNNER_TEMP/probe.stop"
          for _ in $(seq 1 20); do tail -1 "$OUT" | grep -q '^probes=' && break; sleep 0.5; done
          grep '^DOWN' "$OUT" | head -40 || true
          last=$(tail -1 "$OUT")
          case "$last" in probes=*) ;; *) echo "::warning::the probe gave no verdict: $last"; exit 0 ;; esac
          echo "$last"
          for kv in $last; do echo "$kv" >> "$GITHUB_OUTPUT"; done

      - name: Summary
        id: summary
        if: always() && steps.tag.outcome == 'success'
        continue-on-error: true
        env:
          NEW_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ steps.pin.outputs.image }}
          DEPLOY: ${{ steps.deploy.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          DOWN_SECS: ${{ steps.downtime.outputs.downtime_seconds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$HEALTH" = success ]; then head="✅ 已发布 \`$NEW_TAG\`（aws-k3s）"
          elif [ "$ROLLBACK" = success ]; then head="↩️ 已回退（\`$NEW_TAG\` 没过健康检查，盒子上放回了上一版）"
          elif [ "$ROLLBACK" = failure ]; then head="🔥 回退失败 — 照 deploy/aws/README.md «Roll back» 手工处理"
          elif [ "$DEPLOY" = failure ]; then head="❌ 盒子上的发布失败（apply 失败时盒子已放回上一版；盒子的输出在这次运行的日志里）"
          else head="❌ 没部署（在盒子之前失败，线上没动）"; fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          {
            echo "## hub-deploy · $head"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 目标 | aws-k3s · ${AWS_BOX_INSTANCE_ID:-Name=$AWS_BOX_TAG} · $HUB_URLS |"
            echo "| 镜像 | \`${IMAGE:-$NEW_TAG}\` |"
            echo "| 盒子发布 · 健康检查 · 回退 | $DEPLOY · $HEALTH · $ROLLBACK |"
            if [ -n "$DOWN_SECS" ]; then echo "| 发布期间不可用 | downtime_seconds=$DOWN_SECS |"
            else echo "| 发布期间不可用 | 没测（探测没起来或没给出结果） |"; fi
            echo
            echo "[这次运行]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify
        if: always() && vars.HUB_DEPLOY_NOTIFY_ISSUE != '' && steps.summary.outputs.head != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ vars.HUB_DEPLOY_NOTIFY_ISSUE }}
          HEAD: ${{ steps.summary.outputs.head }}
          NEW_TAG: ${{ steps.tag.outputs.tag }}
          TRAIN: ${{ inputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "**hub-deploy** (aws-k3s) · $HEAD

          → \`$NEW_TAG\` · 触发：$GITHUB_EVENT_NAME${TRAIN:+（发布列车）} by @$GITHUB_ACTOR
          摘要：$RUN_URL" \
            || echo "::warning::could not comment on issue #$ISSUE"
