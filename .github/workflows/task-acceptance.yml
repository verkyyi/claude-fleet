name: task-acceptance

# No master `push` run (issue #4663): its PR ran this on the change already, and a
# post-merge re-run only re-checked it beside the release train.
on:
  # the PR gate calls it (.github/workflows/ci.yml, issue #4815) when bin/ci-plan.sh says
  # the change reaches it — its old `paths:` live there now
  workflow_call:
  # the whole check every night: ci-nightly.yml calls it (issue #4816)
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            tokenledger/hub/go.sum
            tokenledger/agent/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare offline fixture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y strace tmux jq gh iptables iproute2
          mkdir -p "$RUNNER_TEMP/task-acceptance/home"
          bin/fleet-client-pack.sh
          cd tokenledger
          # the hub is its own module since claude-fleet#4814
          (cd hub && CGO_ENABLED=0 GOWORK=off go build -o "$RUNNER_TEMP/task-acceptance/ccquota" ./cmd/ccquota)
          for package in store api; do
            (cd hub && CGO_ENABLED=0 GOWORK=off go test -c -o "$RUNNER_TEMP/task-acceptance/$package.test" "./$package")
          done
          # the node is its own module since claude-fleet#4812
          (cd agent && CGO_ENABLED=0 GOWORK=off go test -c -o "$RUNNER_TEMP/task-acceptance/agent.test" .)
          # the node's build beside the hub's: nogh-e2e's agent runs it (claude-fleet#4814)
          (cd agent && CGO_ENABLED=0 GOWORK=off go build -o "$RUNNER_TEMP/task-acceptance/ccquota-node" ./cmd/ccquota)
          npm install --prefix "$RUNNER_TEMP/task-acceptance/browser" --no-audit --no-fund playwright@1.58.2
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/task-acceptance/browsers" node "$RUNNER_TEMP/task-acceptance/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: C9 test-only isolation contracts (entry includes cleanup, under 60 seconds)
        run: bin/nogh-live-selftest.py
      - name: C9 actual kernel and strace (entry includes cleanup, under 60 seconds)
        run: python3 bin/nogh_live_kernel_test.py
      - name: C9 actual TLS authority and WebSocket (entry includes cleanup, under 60 seconds)
        run: python3 bin/nogh_live_http_test.py
      - name: A1–A12 with OS network deny and independent CLI counter
        timeout-minutes: 11
        # Only this new network namespace gets loopback enabled. Drop root before
        # fixtures; pass no runner credentials, live fleet config or SSH agent.
        run: |
          sudo unshare --net -- bash -c '
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --clear-groups env -i \
              PATH="$3" HOME="$4/home" PLAYWRIGHT_BROWSERS_PATH="$4/browsers" \
              python3 "$5/bin/nogh-task-acceptance.py" --work "$4"
          ' _ "$(id -u)" "$(id -g)" "$PATH" "$RUNNER_TEMP/task-acceptance" "$GITHUB_WORKSPACE"
      - name: Archive fixture evidence (never deployment/live acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-acceptance-fixtures
          path: ${{ runner.temp }}/task-acceptance/evidence
          if-no-files-found: error
          retention-days: 14
