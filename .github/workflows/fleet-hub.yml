name: fleet-hub-mcp

on:
  push:
    paths:
      - 'bin/fleet*'
      - 'requirements-mcp.txt'
      - '.github/workflows/fleet-hub.yml'
  pull_request:
    paths:
      - 'bin/fleet*'
      - 'requirements-mcp.txt'
      - '.github/workflows/fleet-hub.yml'

jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-mcp.txt
      - name: Verify registry, SSH bridge, MCP and OAuth in isolated fixtures
        run: bash bin/run-selftests.sh fleet-hub
