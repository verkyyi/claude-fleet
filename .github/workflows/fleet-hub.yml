name: fleet-hub-mcp

# Hub registry / SSH bridge / MCP / OAuth selftest (bin/fleet-hub-selftest.py).
#
# CI is shared by one free account (20 jobs, 5 macOS — issue #2034), so:
#   - no `push` run (issue #4663; a branch push only duplicated its PR's run,
#     #2034): its PR ran this on the change already, and a master re-run only
#     re-checked it beside the release train.
#   - a re-push to a PR cancels that PR's stale run.
#   - macOS runs nightly and on demand, not per PR. The test is Python in temp
#     fixtures; a PR-time macOS leg here only queued in front of the Mac shards.
on:
  # the PR gate calls it (.github/workflows/ci.yml, issue #4815) when bin/ci-plan.sh says
  # the change reaches it — its old `paths:` live there now
  workflow_call:
  schedule:
    - cron: '41 20 * * *'   # 04:41 CST — the macOS leg
  workflow_dispatch:

jobs:
  protocol:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-mcp.txt
      - name: Verify registry, SSH bridge, MCP and OAuth in isolated fixtures
        # The parent is part 1; include every numeric part with the optional SDK.
        # Plain selftests intentionally skip SDK cases when it is not installed.
        run: bash bin/run-selftests.sh fleet-hub 'fleet-hub-[0-9]*'
