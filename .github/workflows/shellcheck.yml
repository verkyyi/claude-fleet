name: shellcheck

# The PR gate lints only the *.sh the PR adds or modifies (issue #4663), each with
# -x (it follows what it sources), so each file's verdict is the full run's — in
# seconds instead of 8.5 min; bin/ci-shellcheck.sh --changed says why, and checks
# the whole tree when the lint's own config changes. No master push run: it
# re-linted a tree its PR had just linted (41 runs, 368 min in 15 h). The whole
# tree runs nightly and on dispatch (a sourced lib's change shows in its
# sourcers there). A re-push to a PR cancels its stale run — issue #2034.
on:
  pull_request:
    paths:
      - 'bin/**'
      - 'hooks/**'
      - 'shell/**'
      - 'extras/**'
      - '.shellcheckrc'
      - '.shellcheck-version'
      - '.github/workflows/shellcheck.yml'
  schedule:
    - cron: '23 21 * * *'   # 05:23 CST, the whole tree
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # a PR's checkout is its merge commit: HEAD^1 is the base it merges onto
          fetch-depth: 2

      - name: Install pinned shellcheck
        run: |
          # Pin the exact version so CI == local (`brew install shellcheck`).
          # The runner's stock binary drifts (0.9.0 vs modern 0.11.0) and the
          # two disagree on the SC2317/SC2329 unreachable-function heuristic,
          # so a disable that's clean locally fails on CI and vice-versa.
          # Single source of truth: .shellcheck-version. No third-party action —
          # download the official release straight from koalaman (supply-chain-clean).
          VER=$(tr -d '[:space:]' < .shellcheck-version)
          echo "Pinned shellcheck version: $VER"
          url="https://github.com/koalaman/shellcheck/releases/download/v${VER}/shellcheck-v${VER}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ
          sudo install -m 0755 "shellcheck-v${VER}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-v${VER}"

      - name: Lint shell scripts
        env:
          EVENT: ${{ github.event_name }}
        run: |
          shellcheck --version
          # Every *.sh under the script dirs, each from its own shebang; baseline
          # disables live in .shellcheckrc. --severity=warning: gate on real problems
          # (unquoted vars, unguarded cd, syntax errors) — not info-level heuristics
          # like SC2317/SC2329 that flag correct trap/dispatch code as "unreachable".
          # The PR gate: only what the PR touches (issue #4663); nightly: everything.
          set --
          [ "$EVENT" != pull_request ] || set -- --changed HEAD^1
          sh bin/ci-shellcheck.sh --jobs "$(nproc)" "$@"
