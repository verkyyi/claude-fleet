name: release train

# ONE lane for releasing (issue #3141, EPIC #3139 C2).
#
# Every merge to master used to start its own macOS run (selftests-macos.yml) and
# its own auto-move (stable-auto.yml); the next merge cancelled the macOS run, so
# on a busy night 17 of 20 were cancelled, the auto-move skipped 6 times in a row,
# and the more often master moved the less often anything shipped.
#
# Now a merge only boards the NEXT train:
#   * concurrency `release-train`, cancel-in-progress false — GitHub keeps one train
#     running and ONE waiting; a newer push replaces the waiting one (shown
#     cancelled, never started), never the running one. That is the whole train
#     scheduler (EPIC #3139 发起人拍板 1); three pushes during a train add one train.
#   * `board` fetches origin/master the moment the train starts and boards THAT head
#     as TRAIN_SHA (bin/fleet-train-board.sh) — never github.sha, which a waiting or
#     re-run train got long ago. stable already at the head ⇒ `skip`, the train is
#     empty and ends within the minute.
#   * the tests are the shared matrix (selftests-shards.yml), `--changed <stable>`:
#     Linux and macOS on TRAIN_SHA (发起人拍板 2 — the full suite stays nightly).
#   * the macOS half goes to OUR Macs first (issue #3145, C6): `board` asks the hub's
#     /v1/fleet/ci-runners (bin/fleet-train-macos.sh pick, secret
#     FLEET_HUB_VIEWER_TOKEN) — a runner online and idle/busy ⇒ `[self-hosted, macOS,
#     fleet-ci]`, one shard per machine (≤ 2); none, no secret or no answer ⇒
#     `macos-latest`, 2 shards — the train runs either way. `macos-wait` reports each
#     shard's runner and queue time, and a shard our runner left queued 20 minutes
#     reds the train (「自家测试机没接」) and cancels it; the next board reads the
#     heartbeat and picks GitHub's.
#   * the gate is `fleet-stable.sh move TRAIN_SHA --precheck`: trunk / forward /
#     oldcfg / release.json / artifacts, no tag pushed. Any red ⇒ this train is
#     red and ships nothing; the next merge starts the next one (拍板 7).
#   * `fail-fast` (issue #3143, C4) watches the stages beside them: the first red
#     shard, precheck or board cancels the whole run (bin/fleet-train-failfast.sh) —
#     a train that can no longer ship gives the lane back at once instead of
#     holding it while its other shards run on (BREAK-IT train-red-holds-lane).
#   * `train` leaves the macOS verdict on TRAIN_SHA as the commit status
#     `release train: macOS` — `fleet-stable.sh move` reads a green one as the BSD
#     half on that commit.
#   * then ONE commit goes out (issue #3142, C3) — the hub, the publish and stable
#     all name TRAIN_SHA, so the hub can never be a commit the release is not:
#       `hub plan`  bin/fleet-train-hub.sh: does the hub already run TRAIN_SHA's Go
#                   source and deploy/k8s/? (发起人拍板 9 — no new image then)
#       `hub`       hub-deploy.yml's own deploy job, called with sha=TRAIN_SHA:
#                   image prod-<TRAIN_SHA>, snapshot / check / rollout, /version
#                   must name TRAIN_SHA (its health step)
#       `release`   bin/fleet-release-publish.sh TRAIN_SHA (this run's OIDC;
#                   the hub takes release-train.yml) with the train's ledger
#                   (#3140), then `fleet-stable.sh move TRAIN_SHA --train <run>`:
#                   its CI and macOS gates read THIS run's jobs, its ccquota gate
#                   holds the hub to TRAIN_SHA's source; no --force, ever.
#     Any red stops the train where it is: a hub already rolled stays (it serves
#     older machines too), a publish is idempotent, and the next train starts over
#     (拍板 7 / 8 — the hub's rollback is still hub-deploy's dispatch with `tag`).
#   * this is the ONLY road that releases by itself (issue #3143, C4): hub-deploy
#     has no push trigger, stable-auto.yml is gone, stable-publish.yml is dispatch
#     only — and a red publish / move / train left on a commit is not counted
#     against the next train's move (fleet-stable.sh gate 3 passes over the release
#     workflows' own runs; BREAK-IT train-derived-red).
#
#   * a test red on TWO trains in a row is quarantined (issue #3243, C10; 拍板 10):
#       `quarantine` fetches the previous trains' state (the `train-quarantine`
#                   artifact — the train never pushes master) through
#                   bin/fleet-train-quarantine.sh: the entries in force (≤ 48 h each,
#                   + conf/selftest-quarantine.list) and the tests red on the newest
#                   earlier train on ANOTHER sha. The shards skip an entry this
#                   change does not touch, and a test red again, untouched, prints
#                   QUARANTINE instead of FAIL (bin/run-selftests.sh --quarantine /
#                   --prev-fails — the PR gate and the nightly never pass them).
#       `隔离`      files each new one's breakage issue (--breakage-key, one per
#                   test), writes the entry, uploads the state for the next train
#                   and says 「隔离了 N 个：…」 on the summary (nothing when none).
#     A workflow_dispatch with `drill_red: <test>` is the drill: that test counts red,
#     the state is `train-quarantine-drill` (never the real trains'), no issue is
#     filed (`drill_issue` stands in), and nothing past the tests runs — no gate, no
#     hub, no release. Two drills on two different heads show the second quarantine.
#
# Outputs of `board` (C1 / C3 hang off them): train_sha · stable_sha · skip ·
# merges (count) · merges_json (first-parent stable..TRAIN_SHA, newest first,
# {sha, subject, committed}) · macos_runs_on (JSON) · macos_shards · macos_where
# (fleet-ci | github) · macos_why.
run-name: release train

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      drill_red:
        description: 'the quarantine drill (issue #3243): count this test red; no gate, hub or release runs'
        type: string
        required: false
        default: ''
      drill_issue:
        description: 'the drill: the issue a drill quarantine names (nothing is filed)'
        type: string
        required: false
        default: '3243'
  schedule:
    # hourly backstop (a push lost, a train red on a flake): off the top of the hour
    - cron: '41 * * * *'

concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write   # `train` leaves `release train: macOS` on TRAIN_SHA
  actions: write    # `macos-wait` reads this run's jobs and cancels it when our runner never took it

jobs:
  board:
    name: board
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      train_sha: ${{ steps.board.outputs.train_sha }}
      stable_sha: ${{ steps.board.outputs.stable_sha }}
      skip: ${{ steps.board.outputs.skip }}
      merges: ${{ steps.board.outputs.merges }}
      merges_json: ${{ steps.board.outputs.merges_json }}
      macos_runs_on: ${{ steps.macos.outputs.macos_runs_on }}
      macos_shards: ${{ steps.macos.outputs.macos_shards }}
      macos_where: ${{ steps.macos.outputs.macos_where }}
      macos_why: ${{ steps.macos.outputs.macos_why }}
      drill: ${{ steps.drill.outputs.drill }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: board the head of master
        id: board
        run: |
          set -o pipefail
          bash bin/fleet-train-board.sh --dir . 2> board.err | grep -v '^merges_json=' || true
          cat board.err
          grep -q '^train_sha=' "$GITHUB_OUTPUT" || exit 1
          # shellcheck disable=SC2016  # the backticks are Markdown, inside python
          {
            echo "### 🚂 $(cat board.err)"
            echo
            sed -n 's/^merges_json=//p' "$GITHUB_OUTPUT" | python3 -c '
          import json, sys
          for m in json.load(sys.stdin):
              print("- `%s` %s · %s" % (m["sha"][:7], m["committed"], m["subject"]))'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: a quarantine drill?
        id: drill
        env:
          DRILL_RED: ${{ inputs.drill_red || '' }}
        run: |
          if [ -n "$DRILL_RED" ]; then
            echo drill=true >> "$GITHUB_OUTPUT"
            echo "### 演练：隔离（#3243）— $DRILL_RED 记红；不跑门、入口、发布" >> "$GITHUB_STEP_SUMMARY"
          else
            echo drill=false >> "$GITHUB_OUTPUT"
          fi
      - name: pick the macOS runners
        # issue #3145: our own Macs when the hub says one is there, else GitHub's.
        id: macos
        env:
          FLEET_HUB_URL: https://claudefleet.24haowan.com
          FLEET_HUB_CI_TOKEN: ${{ secrets.FLEET_HUB_VIEWER_TOKEN }}
        run: |
          bash bin/fleet-train-macos.sh pick 2> pick.err
          echo "macOS → $(cat pick.err)" >> "$GITHUB_STEP_SUMMARY"
          cat pick.err

  quarantine:
    # What the previous trains left (issue #3243): the entries in force and the
    # tests red on the newest earlier train on another sha.
    name: quarantine
    needs: board
    if: needs.board.outputs.skip == 'false' || needs.board.outputs.drill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read     # the previous trains' state artifacts
    outputs:
      raw: ${{ steps.q.outputs.raw }}
      active: ${{ steps.q.outputs.active }}
      prev_fails: ${{ steps.q.outputs.prev_fails }}
      prev_run: ${{ steps.q.outputs.prev_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
      - name: fleet-train-quarantine.sh fetch
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.board.outputs.train_sha }}
          NAME: ${{ needs.board.outputs.drill == 'true' && 'train-quarantine-drill' || 'train-quarantine' }}
        run: |
          sh bin/fleet-train-quarantine.sh fetch --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --sha "$SHA" --name "$NAME" --out q
          active=$(sh bin/fleet-train-quarantine.sh active q/list)
          {
            echo 'raw<<FLEET_TQ_EOF'; cat q/list; echo 'FLEET_TQ_EOF'
            echo 'active<<FLEET_TQ_EOF'; printf '%s\n' "$active"; echo 'FLEET_TQ_EOF'
            echo 'prev_fails<<FLEET_TQ_EOF'; cat q/prev-fails; echo 'FLEET_TQ_EOF'
            echo "prev_run=$(cat q/prev-run)"
          } >> "$GITHUB_OUTPUT"
          echo "in force: $(printf '%s' "$active" | grep -c . || true) · red on the previous train (run $(cat q/prev-run)): $(tr '\n' ' ' < q/prev-fails)"

  plan:
    # How wide each test half runs and how long a shard may take (issue #3241, C9):
    # the train tests everything changed since stable, close to the whole suite when
    # stable is behind, so it prices that selection off the durations table first
    # (bin/fleet-train-plan.sh) instead of wearing the PR's 12 × 8 minutes. Linux
    # picks its own width (≤ 6 minutes a shard, 12..20); our Macs keep board's width
    # (one shard a machine) at their own table; GitHub's Macs price at ×2.3 and pick
    # 2..4 shards of ≤ 40 minutes (issue #3412: a near-full selection on 2 ran ~90
    # minutes a shard and was cancelled as "hung" while it was still moving). A shard cut short with no test red reruns once
    # (bin/fleet-shard-run.sh); a forecast that cannot be made falls back, never stops.
    name: plan
    needs: board
    if: needs.board.outputs.skip == 'false' || needs.board.outputs.drill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux_shards: ${{ steps.plan.outputs.linux_shards }}
      linux_budget_secs: ${{ steps.plan.outputs.linux_budget_secs }}
      linux_step_minutes: ${{ steps.plan.outputs.linux_step_minutes }}
      linux_job_minutes: ${{ steps.plan.outputs.linux_job_minutes }}
      macos_shards: ${{ steps.plan.outputs.macos_shards }}
      macos_budget_secs: ${{ steps.plan.outputs.macos_budget_secs }}
      macos_step_minutes: ${{ steps.plan.outputs.macos_step_minutes }}
      macos_job_minutes: ${{ steps.plan.outputs.macos_job_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          fetch-depth: 0
      - name: fleet-train-plan.sh
        id: plan
        env:
          STABLE: ${{ needs.board.outputs.stable_sha }}
          WHERE: ${{ needs.board.outputs.macos_where }}
          MACOS_SHARDS: ${{ needs.board.outputs.macos_shards }}
        run: |
          {
            echo "### 预测（\`--changed ${STABLE:0:7}\`，按 bin/selftest-durations*.txt）"
            echo "| 段 | 选中 | 宽 | 最重一片 | 每次上限 | 步骤 |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          bash bin/fleet-train-plan.sh --base "$STABLE" --prefix linux
          n=$(printf '%s' "$MACOS_SHARDS" | tr -cd ',' | wc -c); n=$((n + 1))
          if [ "$WHERE" = fleet-ci ]; then
            bash bin/fleet-train-plan.sh --base "$STABLE" --prefix macos --shards "$n" \
              --durations selftest-durations-fleet-ci.txt --floor 1320
          else
            # a free account runs 5 macOS jobs at once: 4 at most, one left for the nightly
            bash bin/fleet-train-plan.sh --base "$STABLE" --prefix macos --min "$n" --max 4 --target 2400 \
              --scale 2.3 --floor 3000
          fi

  linux:
    name: Linux
    needs: [board, quarantine, plan]
    if: needs.board.outputs.skip == 'false' || needs.board.outputs.drill == 'true'
    uses: ./.github/workflows/selftests-shards.yml
    with:
      sha: ${{ needs.board.outputs.train_sha }}
      base: ${{ needs.board.outputs.stable_sha }}
      runs_on: ubuntu-latest
      shards: ${{ needs.plan.outputs.linux_shards }}
      budget_secs: ${{ needs.plan.outputs.linux_budget_secs }}
      step_minutes: ${{ needs.plan.outputs.linux_step_minutes }}
      job_minutes: ${{ needs.plan.outputs.linux_job_minutes }}
      quarantine: ${{ needs.quarantine.outputs.active }}
      prev_fails: ${{ needs.quarantine.outputs.prev_fails }}
      drill_red: ${{ inputs.drill_red || '' }}
      record: true

  macos:
    # Our Macs (fleet-ci, one shard each, ≤ 2) or GitHub's — as `board` picked
    # (issue #3145); GitHub's width is the plan's, 2..4 (a free account runs at most
    # 5 macOS jobs, and the nightly full suite needs the rest — issue #3412).
    name: macOS
    needs: [board, quarantine, plan]
    if: needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    uses: ./.github/workflows/selftests-shards.yml
    with:
      sha: ${{ needs.board.outputs.train_sha }}
      base: ${{ needs.board.outputs.stable_sha }}
      runs_on: ${{ needs.board.outputs.macos_runs_on }}
      shards: ${{ needs.plan.outputs.macos_shards || needs.board.outputs.macos_shards }}
      budget_secs: ${{ needs.plan.outputs.macos_budget_secs }}
      step_minutes: ${{ needs.plan.outputs.macos_step_minutes }}
      job_minutes: ${{ needs.plan.outputs.macos_job_minutes }}
      quarantine: ${{ needs.quarantine.outputs.active }}
      prev_fails: ${{ needs.quarantine.outputs.prev_fails }}
      record: true

  record:
    # New quarantines get their issue + entry; the state goes to the next train
    # (issue #3243). Red when a new one could not be filed — the train with it.
    name: 隔离
    needs: [board, quarantine, linux, macos]
    if: always() && needs.quarantine.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write     # the breakage issue of a new quarantine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: train-result-*
          path: results
      - name: fleet-train-quarantine.sh record
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.board.outputs.train_sha }}
          RAW: ${{ needs.quarantine.outputs.raw }}
          PREV_RUN: ${{ needs.quarantine.outputs.prev_run }}
          DRILL: ${{ needs.board.outputs.drill }}
          DRILL_ISSUE: ${{ inputs.drill_issue || '3243' }}
        run: |
          mkdir -p results; printf '%s\n' "$RAW" > raw.list
          set -- --results results --list raw.list --prev-run "${PREV_RUN:-0}" --run "$GITHUB_RUN_ID" \
                 --sha "$SHA" --repo "$GITHUB_REPOSITORY" --out state
          [ "$DRILL" != true ] || set -- "$@" --issue "$DRILL_ISSUE"
          set +e
          sh bin/fleet-train-quarantine.sh record "$@"; rc=$?
          sum=$(sh bin/fleet-train-quarantine.sh summary --expired raw.list state/list)
          [ -z "$sum" ] || { echo "$sum"; printf '### 🧪 %s\n' "$sum" >> "$GITHUB_STEP_SUMMARY"; }
          exit $rc
      - name: hand the state to the next train
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.board.outputs.drill == 'true' && 'train-quarantine-drill' || 'train-quarantine' }}
          path: state/
          retention-days: 7
          if-no-files-found: ignore

  macos-wait:
    # A job queued for a self-hosted label waits a day, and timeout-minutes only
    # starts counting once it runs: this watches the shards start, writes each one's
    # runner + queue time to the summary, and reds + cancels the train when our
    # runner left one queued 20 minutes (issue #3145).
    name: macOS 排队
    needs: board
    if: needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
      - name: watch the macOS shards start
        env:
          GH_TOKEN: ${{ github.token }}
          WHERE: ${{ needs.board.outputs.macos_where }}
        run: bash bin/fleet-train-macos.sh watch --where "$WHERE" --deadline 1200

  fail-fast:
    # A red stage cancels the run: the lane goes to the next train now (issue #3143).
    # It reads JOB conclusions only, so a shard C9 cut short and is rerunning inside
    # its step (bin/fleet-shard-run.sh) is never judged before its last attempt ends;
    # a QUARANTINE line (C10) leaves its shard green. After the cancel, `隔离`
    # (if: always()) still records the red shard's tests for the next train.
    # It must end green unless it cancels (`release`'s --train move reads every job),
    # so its deadline outlasts the longest shard plan sized and it then exits 0.
    name: 红灯即停
    needs: [board, plan]
    if: needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
      - name: watch the stages
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_JOB: ${{ needs.plan.outputs.linux_job_minutes }}
          MACOS_JOB: ${{ needs.plan.outputs.macos_job_minutes }}
        run: |
          m=60
          for v in "$LINUX_JOB" "$MACOS_JOB"; do case "$v" in ''|*[!0-9]*) ;; *) [ "$v" -le "$m" ] || m=$v ;; esac; done
          d=$(( (m + 30) * 60 )); [ "$d" -le 21000 ] || d=21000   # under the job's 360 minutes
          bash bin/fleet-train-failfast.sh --deadline "$d"

  gate:
    name: precheck
    needs: board
    if: needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          fetch-depth: 0
      - name: fleet-stable.sh move --precheck
        env:
          SHA: ${{ needs.board.outputs.train_sha }}
          # gate 7 (issue #2631): release.json's pins must be on the hub
          FLEET_HUB_URL: https://claudefleet.24haowan.com
        run: |
          set +e
          sh bin/fleet-stable.sh move "$SHA" --precheck --dir . --repo "$GITHUB_REPOSITORY" > out.txt 2>&1
          rc=$?
          cat out.txt
          {
            echo "### precheck → \`${SHA:0:7}\`"
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  train:
    # The train's verdict: green only when every stage is. It also pins the macOS
    # half's verdict to TRAIN_SHA (a commit status — a check run belongs to the
    # commit that queued the run, which may not be TRAIN_SHA).
    name: train
    # fail-fast is waited for (not judged) so `release`'s --train move finds it done.
    needs: [board, quarantine, plan, linux, macos, macos-wait, fail-fast, gate, record]
    if: always() && needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.board.outputs.train_sha }}
          BOARD: ${{ needs.board.result }}
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
          WAIT: ${{ needs.macos-wait.result }}
          WHERE: ${{ needs.board.outputs.macos_where }}
          WHY: ${{ needs.board.outputs.macos_why }}
          GATE: ${{ needs.gate.result }}
          QUAR: ${{ needs.quarantine.result }}
          REC: ${{ needs.record.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$MACOS" in
            success) st=success ;;
            failure) st=failure ;;
            *)       st='' ;;      # cancelled / skipped: no verdict on the BSD half
          esac
          if [ -n "$SHA" ] && [ -n "$st" ]; then
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$st" \
              -f context='release train: macOS' -f target_url="$URL" \
              -f description="the release train's macOS selftests: $MACOS" >/dev/null \
              || echo "::warning::could not leave the 'release train: macOS' status on $SHA"
          fi
          {
            echo "### 🚂 train \`${SHA:0:7}\`"
            echo "| stage | result |"
            echo "|---|---|"
            echo "| board | $BOARD |"
            echo "| Linux | $LINUX |"
            echo "| macOS | ${MACOS}（${WHERE}：${WHY}） |"
            echo "| macOS 排队 | $WAIT |"
            echo "| precheck | $GATE |"
            echo "| 隔离 | $QUAR · $REC |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$BOARD" "$QUAR" "$LINUX" "$MACOS" "$WAIT" "$GATE" "$REC"; do
            [ "$r" = success ] || { echo "::error::this train is red (board $BOARD · quarantine $QUAR · Linux $LINUX · macOS $MACOS · macOS 排队 $WAIT · precheck $GATE · 隔离 $REC) — it ships nothing; the next merge starts the next train"; exit 1; }
          done
          echo "train ${SHA:0:7} is green — the hub, the publish and stable follow"

  hub-plan:
    # Does the hub need TRAIN_SHA's image, or is it already TRAIN_SHA's source?
    name: hub plan
    needs: [board, train]
    if: needs.board.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      live: ${{ steps.plan.outputs.live }}
      why: ${{ steps.plan.outputs.why }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          fetch-depth: 0
      - name: fleet-train-hub.sh
        id: plan
        env:
          SHA: ${{ needs.board.outputs.train_sha }}
          RELEASE_TRAIN_HUB: ${{ vars.RELEASE_TRAIN_HUB }}
        run: |
          # only forward (#3319): a hub on TRAIN_SHA or past it / on a fork is never
          # redeployed (deploy=false, "hub superseded"); an unreadable /version is red
          bash bin/fleet-train-hub.sh "$SHA" --dir . --hub https://claudefleet.24haowan.com || exit 1
          echo "### 入口 → \`${SHA:0:7}\`: $(sed -n 's/^why=//p' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_STEP_SUMMARY"

  hub:
    # hub-deploy.yml's one deploy job, on TRAIN_SHA (its environment `prod` and
    # its OIDC role are the same as when it runs by itself).
    name: hub
    needs: [board, linux, macos, gate, train, hub-plan]
    if: needs.hub-plan.outputs.deploy == 'true'
    permissions:
      contents: read
      deployments: read
      id-token: write
      issues: write
    uses: ./.github/workflows/hub-deploy.yml
    with:
      sha: ${{ needs.board.outputs.train_sha }}

  release:
    # The last job, so `--train` finds every other job of this run finished.
    name: release
    needs: [board, train, hub-plan, hub]
    if: >-
      always() && needs.board.outputs.skip == 'false' &&
      needs.train.result == 'success' && needs.hub-plan.result == 'success' &&
      (needs.hub.result == 'success' || needs.hub.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the stable tag (GITHUB_TOKEN; a tag pushed so triggers nothing)
      id-token: write   # the publish's OIDC token (audience ccquota-fleet-release)
      actions: read     # --train reads this run's jobs
    env:
      TRAIN_SHA: ${{ needs.board.outputs.train_sha }}
      STABLE_SHA: ${{ needs.board.outputs.stable_sha }}
      PLANNED: ${{ needs.hub-plan.outputs.deploy }}
      HUB_WHY: ${{ needs.hub-plan.outputs.why }}
      DEPLOYED: ${{ needs.hub.outputs.deployed }}
      FLEET_HUB_URL: https://claudefleet.24haowan.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          fetch-depth: 0

      # A late train is not a red one (issue #3143, BREAK-IT train-superseded-red):
      # stable already at / past TRAIN_SHA (moved by hand, or by a later train) ⇒
      # nothing left to ship — the job ends green, saying so. Asked before the
      # publish, and again on a 409 not-forward or a move that no longer descends.
      - name: superseded?
        id: sup
        run: bash bin/fleet-train-superseded.sh "$TRAIN_SHA" --dir . --hub "$FLEET_HUB_URL" || true

      - name: the hub is TRAIN_SHA's
        if: steps.sup.outputs.superseded != 'true'
        run: |
          v=$(curl -fsS -m 30 "$FLEET_HUB_URL/version") || { echo "::error::cannot read $FLEET_HUB_URL/version"; exit 1; }
          echo "$v"
          img=$(printf '%s' "$v" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version") or "")')
          if [ "$PLANNED" = true ] && [ "$DEPLOYED" != success ]; then
            echo "::error::the hub needed prod-${TRAIN_SHA:0:7} and its deploy did not run (${DEPLOYED:-?}: HUB_DEPLOY_PAUSED=1?) — nothing published; the next train starts over"; exit 1
          fi
          if [ "$DEPLOYED" = success ] && [ "$img" != "prod-${TRAIN_SHA:0:7}" ]; then
            echo "::error::this train deployed prod-${TRAIN_SHA:0:7} but the hub answers $img — another deploy overtook it; the next train starts over"; exit 1
          fi
          case "$DEPLOYED:$HUB_WHY" in
            (success:*)              note='（本趟部署）' ;;
            (*:'hub superseded'*)    note='（入口已在本趟之后或分叉，未部署——只前进；发布由只前进门判断）' ;;
            (*)                      note='（与本趟同源，未重出镜像；挪动前 ccquota 门再核对）' ;;
          esac
          echo "### 入口 \`$img\`$note" >> "$GITHUB_STEP_SUMMARY"

      - name: the train's ledger (#3140)
        if: steps.sup.outputs.superseded != 'true'
        env:
          MERGES: ${{ needs.board.outputs.merges_json }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[]' > jobs.ndjson \
            || { echo "::warning::could not read this run's jobs — publishing without the ledger"; exit 0; }
          python3 - > train.json <<'PY' || { echo "::warning::no ledger: $(cat train.json)"; rm -f train.json; }
          import json, os, datetime
          jobs = [json.loads(l) for l in open("jobs.ndjson") if l.strip()]
          def ts(s):
              return datetime.datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ") if s else None
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None, microsecond=0)
          stages, queue = {}, []
          for j in jobs:
              a = ts(j.get("started_at"))
              if a is None or j.get("conclusion") == "skipped":
                  continue
              b = ts(j.get("completed_at")) or now   # this job: still running
              stage = (j.get("name") or "").split(" / ")[0]   # "Linux / shard 3" -> Linux
              lo, hi = stages.get(stage, (a, b))
              stages[stage] = (min(lo, a), max(hi, b))
              if stage == "macOS" and ts(j.get("created_at")):
                  queue.append(round((a - ts(j["created_at"])).total_seconds(), 1))
          iso = lambda t: t.strftime("%Y-%m-%dT%H:%M:%SZ")
          print(json.dumps({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "prev_sha": os.environ.get("STABLE_SHA", ""),
              "merges": [{"sha": m["sha"], "merged_at": m["committed"]} for m in json.loads(os.environ.get("MERGES") or "[]")],
              "stages": [{"name": n, "started_at": iso(a), "ended_at": iso(b)} for n, (a, b) in sorted(stages.items(), key=lambda kv: kv[1][0])],
              "macos_queue_secs": queue,
          }))
          PY
          [ ! -s train.json ] || python3 -c 'import json; d=json.load(open("train.json")); print("ledger: %d merge(s), stages %s" % (len(d["merges"]), ", ".join(s["name"] for s in d["stages"])))'

      - name: publish TRAIN_SHA to the hub
        id: pub
        if: steps.sup.outputs.superseded != 'true'
        run: |
          set +e
          train=''; [ ! -s train.json ] || train='--train train.json'
          # shellcheck disable=SC2086  # $train is one flag and its file, or nothing
          bash bin/fleet-release-publish.sh "$TRAIN_SHA" --dir . $train > pub.txt 2>&1
          rc=$?
          cat pub.txt
          { echo "### publish \`${TRAIN_SHA:0:7}\` → hub"; echo '```'; cat pub.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ] && grep -q '409' pub.txt; then
            bash bin/fleet-train-superseded.sh "$TRAIN_SHA" --dir . --hub "$FLEET_HUB_URL" && exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: move stable to TRAIN_SHA
        if: steps.sup.outputs.superseded != 'true' && steps.pub.outputs.superseded != 'true'
        run: |
          set +e
          sh bin/fleet-stable.sh move "$TRAIN_SHA" --train "$GITHUB_RUN_ID" --ignore-check release \
            --dir . --repo "$GITHUB_REPOSITORY" > out.txt 2>&1
          rc=$?
          cat out.txt
          { echo "### stable → \`${TRAIN_SHA:0:7}\`"; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 3 ] && grep -q 'does not descend from the current stable' out.txt; then
            bash bin/fleet-train-superseded.sh "$TRAIN_SHA" --dir . --hub "$FLEET_HUB_URL" && exit 0
          fi
          exit $rc
