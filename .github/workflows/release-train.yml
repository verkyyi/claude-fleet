name: release train

# ONE lane for releasing (issue #3141, EPIC #3139 C2).
#
# Every merge to master used to start its own macOS run (selftests-macos.yml) and
# its own auto-move (stable-auto.yml); the next merge cancelled the macOS run, so
# on a busy night 17 of 20 were cancelled, the auto-move skipped 6 times in a row,
# and the more often master moved the less often anything shipped.
#
# Now a merge only boards the NEXT train:
#   * concurrency `release-train`, cancel-in-progress false — GitHub keeps one train
#     running and ONE waiting; a newer push replaces the waiting one (shown
#     cancelled, never started), never the running one. That is the whole train
#     scheduler (EPIC #3139 发起人拍板 1); three pushes during a train add one train.
#   * `board` fetches origin/master the moment the train starts and boards THAT head
#     as TRAIN_SHA (bin/fleet-train-board.sh) — never github.sha, which a waiting or
#     re-run train got long ago. stable already at the head ⇒ `skip`, the train is
#     empty and ends within the minute.
#   * the tests are the shared matrix (selftests-shards.yml), `--changed <stable>`:
#     Linux on TRAIN_SHA (发起人拍板 2 — the full suite stays nightly).
#   * the macOS half is NOT the train's (issue #3869, EPIC #3863 C6): stable means
#     "Linux has verified it", and a Mac follows refs/tags/stable-macos (#3868).
#     mac-follow.yml runs the macOS shards on each stable after this train ends
#     green and moves the Mac lane when they are green; red, a Mac stays on the
#     previous version and fleet-macos-watch.sh files one issue. A train never
#     waits for, nor reds on, a Mac. `release` seeds the lane at the stable it
#     boarded the first time there is none (fleet-stable.sh move --ref stable-macos
#     --seed), so no Mac is ever handed a version its BSD half has not seen.
#   * the gate is `fleet-stable.sh move TRAIN_SHA --precheck`: trunk / forward /
#     oldcfg / release.json / artifacts, no tag pushed. Any red ⇒ this train is
#     red and ships nothing; the next merge starts the next one (拍板 7).
#   * `fail-fast` (issue #3143, C4) watches the stages beside them: the first red
#     shard, precheck or board cancels the whole run (bin/fleet-train-failfast.sh) —
#     a train that can no longer ship gives the lane back at once instead of
#     holding it while its other shards run on (BREAK-IT train-red-holds-lane).
#   * then ONE commit goes out (issue #3142, C3) — the hub, the publish and stable
#     all name TRAIN_SHA, so the hub can never be a commit the release is not:
#       `hub plan`  bin/fleet-train-hub.sh: does the hub already run TRAIN_SHA's Go
#                   source and deploy/k8s/? (发起人拍板 9 — no new image then)
#       `hub`       hub-deploy.yml's own deploy job, called with sha=TRAIN_SHA:
#                   image prod-<TRAIN_SHA>, snapshot / check / rollout, /version
#                   must name TRAIN_SHA (its health step)
#       `release`   bin/fleet-release-publish.sh TRAIN_SHA (this run's OIDC;
#                   the hub takes release-train.yml) with the train's ledger
#                   (#3140), then `fleet-stable.sh move TRAIN_SHA --train <run>`:
#                   its CI gate reads THIS run's jobs (gate 5 is the Mac lane's), its ccquota gate
#                   holds the hub to TRAIN_SHA's source; no --force, ever.
#       `node tools` / `node image` (issue #3855) the managed node image of that
#                   release: the Dockerfile's tools stage pushed from a GitHub
#                   runner when its tag is new, then the image built in the
#                   Shenzhen cluster (runs-on: fleet-ack, its buildkitd) and pushed
#                   as <NODE_IMAGE_REPO>:<TRAIN_SHA> — never a gate of the move.
#     Any red stops the train where it is: a hub already rolled stays (it serves
#     older machines too), a publish is idempotent, and the next train starts over
#     (拍板 7 / 8 — the hub's rollback is still hub-deploy's dispatch with `tag`).
#   * this is the ONLY road that releases by itself (issue #3143, C4): hub-deploy
#     has no push trigger, stable-auto.yml is gone, stable-publish.yml is dispatch
#     only — and a red publish / move / train left on a commit is not counted
#     against the next train's move (fleet-stable.sh gate 3 passes over the release
#     workflows' own runs; BREAK-IT train-derived-red).
#
#   * a test red on TWO trains in a row is quarantined (issue #3243, C10; 拍板 10):
#       `quarantine` fetches the previous trains' state (the `train-quarantine`
#                   artifact — the train never pushes master) through
#                   bin/fleet-train-quarantine.sh: the entries in force (≤ 48 h each,
#                   + conf/selftest-quarantine.list) and the tests red on the newest
#                   earlier train on ANOTHER sha. The shards skip an entry this
#                   change does not touch, and a test red again, untouched, prints
#                   QUARANTINE instead of FAIL (bin/run-selftests.sh --quarantine /
#                   --prev-fails — the PR gate and the nightly never pass them).
#       `隔离`      files each new one's breakage issue (--breakage-key, one per
#                   test), writes the entry, uploads the state for the next train
#                   and says 「隔离了 N 个：…」 on the summary (nothing when none).
#   * a red test runs ONCE more before it counts (issue #3866, EPIC #3863 C3): the
#     shards get --retry-red 1, so a test red then green on its rerun is `FLAKY`, its
#     shard stays green and the train ships; `隔离` files it (--breakage-key
#     flaky-<test>, label flaky — one issue a test, a later sighting a comment), keeps
#     its sightings seven days in the state and quarantines it at the third (reason
#     flaky), and the summary says 「重跑才过 N 个：…」. Red twice is red as before:
#     `红灯即停` judges job conclusions, and only a red rerun reds a job
#     (BREAK-IT train-flaky-retry-hides-red). The PR gate and the nightly never rerun.
#     A workflow_dispatch with `drill_flaky: <test>` counts that test's FIRST run red
#     on the Linux half: a whole train otherwise (it ships when there is a change),
#     its flaky issue filed for real, the sighting never counted toward a quarantine.
#     A workflow_dispatch with `drill_red: <test>` is the drill: that test counts red,
#     the state is `train-quarantine-drill` (never the real trains'), no issue is
#     filed (`drill_issue` stands in), and nothing past the tests runs — no gate, no
#     hub, no release. Two drills on two different heads show the second quarantine.
#
#   * the Linux half goes to the Shenzhen cluster when asked (issue #3864, EPIC #3863
#     C1): with the repo variable FLEET_TRAIN_RUNNER=fleet-ack, `linux-pick`
#     (bin/fleet-train-runner.sh pick, environment fleet-ack-probe: the runner
#     app's token, master only) looks for an online fleet-ack runner — there ⇒
#     the shards run on it and fetch TRAIN_SHA from the cluster's git mirror
#     (FLEET_TRAIN_GIT_MIRROR) before GitHub; not there ⇒ ubuntu-latest, the summary
#     says 「深圳不可用，退回 GitHub」. A shard whose spot runner went away mid-job
#     (GitHub's «lost communication» / «shutdown signal») is no red: `红灯即停`
#     waits, `Linux 补跑?` names those shards and `Linux rescue` reruns exactly them
#     on ubuntu-latest (--shard K/N kept); the train ships when the rescue is green
#     (BREAK-IT train-ack-reclaimed). The variable empty ⇒ no pick, no rescue: the
#     Linux half is ubuntu-latest exactly as before (BREAK-IT train-ack-down).
#
# Outputs of `board` (C1 / C3 hang off them): train_sha · stable_sha · skip ·
# merges (count) · merges_json (first-parent stable..TRAIN_SHA, newest first,
# {sha, subject, committed}).
# A drill names itself in the title: fleet_breakage_probe skips such a run (issue #3372).
run-name: ${{ inputs.drill_red != '' && format('release train (drill {0})', inputs.drill_red) || 'release train' }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      drill_red:
        description: 'the quarantine drill (issue #3243): count this test red; no gate, hub or release runs'
        type: string
        required: false
        default: ''
      drill_issue:
        description: 'the drill: the issue a drill quarantine names (nothing is filed)'
        type: string
        required: false
        default: '3243'
      drill_flaky:
        description: 'the flaky drill (issue #3866): this test''s first Linux run counts red, its rerun is real; the train runs whole'
        type: string
        required: false
        default: ''
  schedule:
    # hourly backstop (a push lost, a train red on a flake): off the top of the hour
    - cron: '41 * * * *'

concurrency:
  group: release-train
  cancel-in-progress: false

permissions:
  contents: read
  actions: write    # `红灯即停` reads this run's jobs and cancels it on the first red

jobs:
  board:
    name: board
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      train_sha: ${{ steps.board.outputs.train_sha }}
      stable_sha: ${{ steps.board.outputs.stable_sha }}
      skip: ${{ steps.board.outputs.skip }}
      merges: ${{ steps.board.outputs.merges }}
      merges_json: ${{ steps.board.outputs.merges_json }}
      drill: ${{ steps.drill.outputs.drill }}
      flaky_drill: ${{ steps.drill.outputs.flaky_drill }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: board the head of master
        id: board
        run: |
          set -o pipefail
          bash bin/fleet-train-board.sh --dir . 2> board.err | grep -v '^merges_json=' || true
          cat board.err
          grep -q '^train_sha=' "$GITHUB_OUTPUT" || exit 1
          # shellcheck disable=SC2016  # the backticks are Markdown, inside python
          {
            echo "### 🚂 $(cat board.err)"
            echo
            sed -n 's/^merges_json=//p' "$GITHUB_OUTPUT" | python3 -c '
          import json, sys
          for m in json.load(sys.stdin):
              print("- `%s` %s · %s" % (m["sha"][:7], m["committed"], m["subject"]))'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: a quarantine drill?
        id: drill
        env:
          DRILL_RED: ${{ inputs.drill_red || '' }}
          DRILL_FLAKY: ${{ inputs.drill_flaky || '' }}
        run: |
          if [ -n "$DRILL_RED" ]; then
            echo drill=true >> "$GITHUB_OUTPUT"
            echo "### 演练：隔离（#3243）— $DRILL_RED 记红；不跑门、入口、发布" >> "$GITHUB_STEP_SUMMARY"
          else
            echo drill=false >> "$GITHUB_OUTPUT"
          fi
          echo "flaky_drill=$DRILL_FLAKY" >> "$GITHUB_OUTPUT"
          [ -z "$DRILL_FLAKY" ] || echo "### 演练：重跑（#3866）— $DRILL_FLAKY 第一次记红、重跑照实；整趟照跑" >> "$GITHUB_STEP_SUMMARY"

  quarantine:
    # What the previous trains left (issue #3243): the entries in force and the
    # tests red on the newest earlier train on another sha.
    name: quarantine
    needs: board
    if: needs.board.outputs.skip == 'false' || needs.board.outputs.drill == 'true' || needs.board.outputs.flaky_drill != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read     # the previous trains' state artifacts
    outputs:
      raw: ${{ steps.q.outputs.raw }}
      active: ${{ steps.q.outputs.active }}
      prev_fails: ${{ steps.q.outputs.prev_fails }}
      prev_run: ${{ steps.q.outputs.prev_run }}
      flaky_hist: ${{ steps.q.outputs.flaky_hist }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
      - name: fleet-train-quarantine.sh fetch
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.board.outputs.train_sha }}
          NAME: ${{ needs.board.outputs.drill == 'true' && 'train-quarantine-drill' || 'train-quarantine' }}
        run: |
          sh bin/fleet-train-quarantine.sh fetch --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" \
            --sha "$SHA" --name "$NAME" --out q
          active=$(sh bin/fleet-train-quarantine.sh active q/list)
          {
            echo 'raw<<FLEET_TQ_EOF'; cat q/list; echo 'FLEET_TQ_EOF'
            echo 'active<<FLEET_TQ_EOF'; printf '%s\n' "$active"; echo 'FLEET_TQ_EOF'
            echo 'prev_fails<<FLEET_TQ_EOF'; cat q/prev-fails; echo 'FLEET_TQ_EOF'
            echo "prev_run=$(cat q/prev-run)"
            echo 'flaky_hist<<FLEET_TQ_EOF'; cat q/flaky; echo 'FLEET_TQ_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "in force: $(printf '%s' "$active" | grep -c . || true) · red on the previous train (run $(cat q/prev-run)): $(tr '\n' ' ' < q/prev-fails)"

  plan:
    # How wide the Linux half runs and how long a shard may take (issue #3241, C9):
    # the train tests everything changed since stable, close to the whole suite when
    # stable is behind, so it prices that selection off the durations table first
    # (bin/fleet-train-plan.sh) instead of wearing the PR's 12 × 8 minutes: ≤ 6
    # minutes a shard, 12..20 wide. A shard cut short with no test red reruns once
    # (bin/fleet-shard-run.sh); a forecast that cannot be made falls back, never
    # stops. The macOS half's plan is mac-follow.yml's (issue #3869).
    name: plan
    needs: board
    if: needs.board.outputs.skip == 'false' || needs.board.outputs.drill == 'true' || needs.board.outputs.flaky_drill != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux_shards: ${{ steps.plan.outputs.linux_shards }}
      linux_budget_secs: ${{ steps.plan.outputs.linux_budget_secs }}
      linux_step_minutes: ${{ steps.plan.outputs.linux_step_minutes }}
      linux_job_minutes: ${{ steps.plan.outputs.linux_job_minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          fetch-depth: 0
      - name: fleet-train-plan.sh
        id: plan
        env:
          STABLE: ${{ needs.board.outputs.stable_sha }}
        run: |
          {
            echo "### 预测（\`--changed ${STABLE:0:7}\`，按 bin/selftest-durations*.txt）"
            echo "| 段 | 选中 | 宽 | 最重一片 | 每次上限 | 步骤 |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          bash bin/fleet-train-plan.sh --base "$STABLE" --prefix linux

  linux-pick:
    # The Shenzhen cluster or GitHub (issue #3864): only when FLEET_TRAIN_RUNNER
    # names a runner set. Its token reads the repo's runner list — the runner app's
    # (secret FLEET_RUNNERS_APP_KEY, var FLEET_RUNNERS_APP_ID) in an environment
    # that admits master only. Red or skipped here never holds the train: Linux
    # then runs on ubuntu-latest.
    name: Linux 选机器
    needs: board
    if: (needs.board.outputs.skip == 'false' || needs.board.outputs.drill == 'true' || needs.board.outputs.flaky_drill != '') && vars.FLEET_TRAIN_RUNNER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: fleet-ack-probe
    outputs:
      linux_runs_on: ${{ steps.pick.outputs.linux_runs_on }}
      linux_where: ${{ steps.pick.outputs.linux_where }}
      linux_why: ${{ steps.pick.outputs.linux_why }}
      linux_mirror: ${{ steps.pick.outputs.linux_mirror }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          sparse-checkout: bin
      - name: the runner app's token
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FLEET_RUNNERS_APP_ID }}
          private-key: ${{ secrets.FLEET_RUNNERS_APP_KEY }}
      - name: fleet-train-runner.sh pick
        id: pick
        env:
          FLEET_TRAIN_RUNNER: ${{ vars.FLEET_TRAIN_RUNNER }}
          FLEET_TRAIN_RUNNER_TOKEN: ${{ steps.app.outputs.token }}
          FLEET_TRAIN_GIT_MIRROR: ${{ vars.FLEET_TRAIN_GIT_MIRROR }}
        run: |
          bash bin/fleet-train-runner.sh pick 2> pick.err
          cat pick.err
          echo "### $(cat pick.err)" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux
    needs: [board, quarantine, plan, linux-pick]
    # !cancelled(): a skipped / red linux-pick only means ubuntu-latest
    if: >-
      !cancelled() && needs.board.result == 'success' && needs.quarantine.result == 'success' &&
      needs.plan.result == 'success' &&
      (needs.board.outputs.skip == 'false' || needs.board.outputs.drill == 'true' || needs.board.outputs.flaky_drill != '')
    uses: ./.github/workflows/selftests-shards.yml
    with:
      sha: ${{ needs.board.outputs.train_sha }}
      base: ${{ needs.board.outputs.stable_sha }}
      runs_on: ${{ needs.linux-pick.outputs.linux_runs_on || 'ubuntu-latest' }}
      mirror: ${{ needs.linux-pick.outputs.linux_mirror }}
      shards: ${{ needs.plan.outputs.linux_shards }}
      budget_secs: ${{ needs.plan.outputs.linux_budget_secs }}
      step_minutes: ${{ needs.plan.outputs.linux_step_minutes }}
      job_minutes: ${{ needs.plan.outputs.linux_job_minutes }}
      quarantine: ${{ needs.quarantine.outputs.active }}
      prev_fails: ${{ needs.quarantine.outputs.prev_fails }}
      drill_red: ${{ inputs.drill_red || '' }}
      retry_red: '1'
      drill_flaky: ${{ inputs.drill_flaky || '' }}
      record: true

  linux-rescue-plan:
    # Which Linux shards ended red because their runner went away (issue #3864):
    # a reclaimed spot node, an evicted pod. Every red one of that kind ⇒ covers.
    name: Linux 补跑?
    needs: [board, linux]
    if: "!cancelled() && vars.FLEET_TRAIN_RUNNER != '' && needs.linux.result == 'failure'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      lost: ${{ steps.lost.outputs.lost }}
      total: ${{ steps.lost.outputs.total }}
      covers: ${{ steps.lost.outputs.covers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          sparse-checkout: bin
      - name: fleet-train-runner.sh lost
        id: lost
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash bin/fleet-train-runner.sh lost --prefix Linux 2> lost.err
          cat lost.err
          echo "### Linux 补跑：$(cat lost.err)" >> "$GITHUB_STEP_SUMMARY"

  linux-rescue:
    # Exactly the lost shards, on GitHub's runners, as K of the same N.
    name: Linux rescue
    needs: [board, quarantine, plan, linux-rescue-plan]
    if: "!cancelled() && needs.linux-rescue-plan.outputs.covers == 'true'"
    uses: ./.github/workflows/selftests-shards.yml
    with:
      sha: ${{ needs.board.outputs.train_sha }}
      base: ${{ needs.board.outputs.stable_sha }}
      runs_on: ubuntu-latest
      shards: ${{ needs.linux-rescue-plan.outputs.lost }}
      of: ${{ needs.linux-rescue-plan.outputs.total }}
      budget_secs: ${{ needs.plan.outputs.linux_budget_secs }}
      step_minutes: ${{ needs.plan.outputs.linux_step_minutes }}
      job_minutes: ${{ needs.plan.outputs.linux_job_minutes }}
      quarantine: ${{ needs.quarantine.outputs.active }}
      prev_fails: ${{ needs.quarantine.outputs.prev_fails }}
      drill_red: ${{ inputs.drill_red || '' }}
      retry_red: '1'
      drill_flaky: ${{ inputs.drill_flaky || '' }}
      record: true


  record:
    # New quarantines get their issue + entry; the state goes to the next train
    # (issue #3243). Red when a new one could not be filed — the train with it.
    # Each FLAKY test (issue #3866) gets its issue (or a comment on it) and a
    # sighting; a flaky filing that fails is said, never reds the train.
    name: 隔离
    needs: [board, quarantine, linux, linux-rescue]
    if: always() && needs.quarantine.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write     # the breakage issue of a new quarantine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: train-result-*
          path: results
      - name: fleet-train-quarantine.sh record
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.board.outputs.train_sha }}
          RAW: ${{ needs.quarantine.outputs.raw }}
          PREV_RUN: ${{ needs.quarantine.outputs.prev_run }}
          FLAKY_HIST: ${{ needs.quarantine.outputs.flaky_hist }}
          FLAKY_DRILL: ${{ needs.board.outputs.flaky_drill }}
          DRILL: ${{ needs.board.outputs.drill }}
          DRILL_ISSUE: ${{ inputs.drill_issue || '3243' }}
        run: |
          mkdir -p results; printf '%s\n' "$RAW" > raw.list; printf '%s\n' "$FLAKY_HIST" > flaky.hist
          set -- --results results --list raw.list --prev-run "${PREV_RUN:-0}" --run "$GITHUB_RUN_ID" \
                 --sha "$SHA" --repo "$GITHUB_REPOSITORY" --out state --flaky-hist flaky.hist
          [ "$DRILL" != true ] || set -- "$@" --issue "$DRILL_ISSUE"
          [ -z "$FLAKY_DRILL" ] || set -- "$@" --drill-flaky "$FLAKY_DRILL"
          set +e
          sh bin/fleet-train-quarantine.sh record "$@"; rc=$?
          sum=$(sh bin/fleet-train-quarantine.sh summary --expired raw.list --flaky state/flaky-now state/list)
          [ -z "$sum" ] || { echo "$sum"; printf '%s\n' "$sum" | sed 's/^/### 🧪 /' >> "$GITHUB_STEP_SUMMARY"; }
          exit $rc
      - name: hand the state to the next train
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.board.outputs.drill == 'true' && 'train-quarantine-drill' || 'train-quarantine' }}
          path: state/
          retention-days: 7
          if-no-files-found: ignore


  fail-fast:
    # A red stage cancels the run: the lane goes to the next train now (issue #3143).
    # It reads JOB conclusions only, so a shard C9 cut short and is rerunning inside
    # its step (bin/fleet-shard-run.sh) is never judged before its last attempt ends;
    # a QUARANTINE line (C10) leaves its shard green. After the cancel, `隔离`
    # (if: always()) still records the red shard's tests for the next train.
    # It must end green unless it cancels (`release`'s --train move reads every job),
    # so its deadline outlasts the longest shard plan sized and it then exits 0.
    name: 红灯即停
    needs: [board, plan]
    if: needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
      - name: watch the stages
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_JOB: ${{ needs.plan.outputs.linux_job_minutes }}
          # a Linux shard whose cluster runner went away waits for its rescue (#3864)
          LOST_OK: ${{ vars.FLEET_TRAIN_RUNNER != '' && 'Linux' || '' }}
        run: |
          m=60
          case "$LINUX_JOB" in ''|*[!0-9]*) ;; *) [ "$LINUX_JOB" -le "$m" ] || m=$LINUX_JOB ;; esac
          d=$(( (m + 30) * 60 )); [ "$d" -le 21000 ] || d=21000   # under the job's 360 minutes
          # no macOS shard in the train since #3869: never wait for one to show up
          set -- --deadline "$d" --need 'precheck|Linux / shard'
          [ -z "$LOST_OK" ] || set -- "$@" --lost-ok "$LOST_OK"
          bash bin/fleet-train-failfast.sh "$@"

  gate:
    name: precheck
    needs: board
    if: needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          fetch-depth: 0
      - name: fleet-stable.sh move --precheck
        env:
          SHA: ${{ needs.board.outputs.train_sha }}
          # gate 7 (issue #2631): release.json's pins must be on the hub
          FLEET_HUB_URL: https://claudefleet.24haowan.com
        run: |
          set +e
          sh bin/fleet-stable.sh move "$SHA" --precheck --dir . --repo "$GITHUB_REPOSITORY" > out.txt 2>&1
          rc=$?
          cat out.txt
          {
            echo "### precheck → \`${SHA:0:7}\`"
            echo '```'
            cat out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  train:
    # The train's verdict: green only when every stage is. No macOS stage: that
    # half follows the release (mac-follow.yml, issue #3869).
    name: train
    # fail-fast is waited for (not judged) so `release`'s --train move finds it done.
    needs: [board, quarantine, plan, linux-pick, linux, linux-rescue-plan, linux-rescue, fail-fast, gate, record]
    if: always() && needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verdict
        env:
          SHA: ${{ needs.board.outputs.train_sha }}
          BOARD: ${{ needs.board.result }}
          LINUX: ${{ needs.linux.result }}
          LWHERE: ${{ needs.linux-pick.outputs.linux_where || 'github' }}
          LWHY: ${{ needs.linux-pick.outputs.linux_why || 'FLEET_TRAIN_RUNNER 未设' }}
          COVERS: ${{ needs.linux-rescue-plan.outputs.covers }}
          LOST: ${{ needs.linux-rescue-plan.outputs.lost }}
          RESCUE: ${{ needs.linux-rescue.result }}
          GATE: ${{ needs.gate.result }}
          QUAR: ${{ needs.quarantine.result }}
          REC: ${{ needs.record.result }}
        run: |
          # a Linux half whose only reds were lost runners, rescued green (#3864)
          if [ "$LINUX" = failure ] && [ "$COVERS" = true ] && [ "$RESCUE" = success ]; then
            LINUX="success（补跑 $LOST）"; lok=success
          else
            lok=$LINUX
          fi
          {
            echo "### 🚂 train \`${SHA:0:7}\`"
            echo "| stage | result |"
            echo "|---|---|"
            echo "| board | $BOARD |"
            echo "| Linux | ${LINUX}（${LWHERE}：${LWHY}） |"
            echo "| macOS | 发布之后由 mac-follow 跟（#3869） |"
            echo "| precheck | $GATE |"
            echo "| 隔离 | $QUAR · $REC |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$BOARD" "$QUAR" "$lok" "$GATE" "$REC"; do
            [ "$r" = success ] || { echo "::error::this train is red (board $BOARD · quarantine $QUAR · Linux $LINUX · precheck $GATE · 隔离 $REC) — it ships nothing; the next merge starts the next train"; exit 1; }
          done
          echo "train ${SHA:0:7} is green — the hub, the publish and stable follow"

  hub-plan:
    # Does the hub need TRAIN_SHA's image, or is it already TRAIN_SHA's source?
    name: hub plan
    needs: [board, train]
    if: needs.board.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      live: ${{ steps.plan.outputs.live }}
      why: ${{ steps.plan.outputs.why }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          fetch-depth: 0
      - name: fleet-train-hub.sh
        id: plan
        env:
          SHA: ${{ needs.board.outputs.train_sha }}
          RELEASE_TRAIN_HUB: ${{ vars.RELEASE_TRAIN_HUB }}
        run: |
          # only forward (#3319): a hub on TRAIN_SHA or past it / on a fork is never
          # redeployed (deploy=false, "hub superseded"); an unreadable /version is red
          bash bin/fleet-train-hub.sh "$SHA" --dir . --hub https://claudefleet.24haowan.com || exit 1
          echo "### 入口 → \`${SHA:0:7}\`: $(sed -n 's/^why=//p' "$GITHUB_OUTPUT" | tail -1)" >> "$GITHUB_STEP_SUMMARY"

  hub:
    # hub-deploy.yml's one deploy job, on TRAIN_SHA (its environment `prod` and
    # its OIDC role are the same as when it runs by itself).
    name: hub
    needs: [board, linux, gate, train, hub-plan]
    # !cancelled(): a Linux shard lost and rescued leaves `linux` red; `train` judged it
    if: "!cancelled() && needs.train.result == 'success' && needs.hub-plan.outputs.deploy == 'true'"
    permissions:
      contents: read
      deployments: read
      id-token: write
      issues: write
    uses: ./.github/workflows/hub-deploy.yml
    with:
      sha: ${{ needs.board.outputs.train_sha }}
    # A called workflow sees no secret the caller does not hand it — not even its
    # own environment's (claude-fleet#3860: FLEET_DEPLOY_OVERLAY_SSH_KEY arrived
    # empty and checkout asked the REST API for the private overlay repo, 404).
    secrets: inherit

  release:
    # The last job, so `--train` finds every other job of this run finished.
    name: release
    needs: [board, train, hub-plan, hub, linux-rescue-plan]
    if: >-
      always() && needs.board.outputs.skip == 'false' &&
      needs.train.result == 'success' && needs.hub-plan.result == 'success' &&
      (needs.hub.result == 'success' || needs.hub.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The release signing key lives here and nowhere else (issue #3559): the
    # release-sign environment's RELEASE_SIGN_KEY secret, read only by the
    # publish step below. Unset ⇒ the hub signs with its own key, as before.
    environment: release-sign
    outputs:
      moved: ${{ steps.move.outputs.moved }}
    permissions:
      contents: write   # the stable tag (GITHUB_TOKEN; a tag pushed so triggers nothing)
      id-token: write   # the publish's OIDC token (audience ccquota-fleet-release)
      actions: read     # --train reads this run's jobs
    env:
      TRAIN_SHA: ${{ needs.board.outputs.train_sha }}
      STABLE_SHA: ${{ needs.board.outputs.stable_sha }}
      PLANNED: ${{ needs.hub-plan.outputs.deploy }}
      HUB_WHY: ${{ needs.hub-plan.outputs.why }}
      DEPLOYED: ${{ needs.hub.outputs.deployed }}
      LOST: ${{ needs.linux-rescue-plan.outputs.covers == 'true' && needs.linux-rescue-plan.outputs.lost || '' }}
      FLEET_HUB_URL: https://claudefleet.24haowan.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          fetch-depth: 0

      # A late train is not a red one (issue #3143, BREAK-IT train-superseded-red):
      # stable already at / past TRAIN_SHA (moved by hand, or by a later train) ⇒
      # nothing left to ship — the job ends green, saying so. Asked before the
      # publish, and again on a 409 not-forward or a move that no longer descends.
      - name: superseded?
        id: sup
        run: bash bin/fleet-train-superseded.sh "$TRAIN_SHA" --dir . --hub "$FLEET_HUB_URL" || true

      - name: the hub is TRAIN_SHA's
        if: steps.sup.outputs.superseded != 'true'
        run: |
          v=$(curl -fsS -m 30 "$FLEET_HUB_URL/version") || { echo "::error::cannot read $FLEET_HUB_URL/version"; exit 1; }
          echo "$v"
          img=$(printf '%s' "$v" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version") or "")')
          if [ "$PLANNED" = true ] && [ "$DEPLOYED" != success ]; then
            echo "::error::the hub needed prod-${TRAIN_SHA:0:7} and its deploy did not run (${DEPLOYED:-?}: HUB_DEPLOY_PAUSED=1?) — nothing published; the next train starts over"; exit 1
          fi
          if [ "$DEPLOYED" = success ] && [ "$img" != "prod-${TRAIN_SHA:0:7}" ]; then
            echo "::error::this train deployed prod-${TRAIN_SHA:0:7} but the hub answers $img — another deploy overtook it; the next train starts over"; exit 1
          fi
          case "$DEPLOYED:$HUB_WHY" in
            (success:*)              note='（本趟部署）' ;;
            (*:'hub superseded'*)    note='（入口已在本趟之后或分叉，未部署——只前进；发布由只前进门判断）' ;;
            (*)                      note='（与本趟同源，未重出镜像；挪动前 ccquota 门再核对）' ;;
          esac
          echo "### 入口 \`$img\`$note" >> "$GITHUB_STEP_SUMMARY"

      - name: the train's ledger (#3140)
        if: steps.sup.outputs.superseded != 'true'
        env:
          MERGES: ${{ needs.board.outputs.merges_json }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[]' > jobs.ndjson \
            || { echo "::warning::could not read this run's jobs — publishing without the ledger"; exit 0; }
          # the same builder as the ledger job's (bin/fleet-train-ledger.py, #3870)
          python3 bin/fleet-train-ledger.py build --jobs jobs.ndjson --run-id "$GITHUB_RUN_ID" --sha "$TRAIN_SHA" \
            --prev "$STABLE_SHA" > train.json || { echo "::warning::no ledger: $(cat train.json)"; rm -f train.json; }
          [ ! -s train.json ] || python3 -c 'import json; d=json.load(open("train.json")); print("ledger: %d merge(s), stages %s" % (len(d["merges"]), ", ".join(s["name"] for s in d["stages"])))'

      # The Mac lane's first value (issue #3869): this train's move no longer asks
      # macOS, so before stable leaves the commit it boarded a Mac must have a lane
      # of its own — the hub's first (else it would serve a Mac the new stable),
      # then the tag, at the stable this train boarded (it passed the BSD half when
      # it moved). A lane already there ⇒ nothing. Red ⇒ nothing published, the
      # move never runs (with no lane it would refuse anyway: no macOS job here).
      - name: seed the Mac lane (once)
        if: steps.sup.outputs.superseded != 'true' && needs.board.outputs.stable_sha != ''
        run: |
          if git ls-remote --exit-code origin refs/tags/stable-macos >/dev/null; then
            echo "Mac lane: refs/tags/stable-macos exists — mac-follow moves it"; exit 0
          fi
          bash bin/fleet-release-publish.sh "$STABLE_SHA" --dir . --ref stable-macos
          sh bin/fleet-stable.sh move "$STABLE_SHA" --ref stable-macos --seed --dir . --repo "$GITHUB_REPOSITORY"
          echo "### Mac 通道起点：\`${STABLE_SHA:0:7}\`（之后由 mac-follow 跟）" >> "$GITHUB_STEP_SUMMARY"

      - name: publish TRAIN_SHA to the hub
        id: pub
        if: steps.sup.outputs.superseded != 'true'
        env:
          # the train's signing key (issue #3559): a keyless hub builds the
          # release unsigned, this step checks it against the checkout and signs
          FLEET_RELEASE_SIGN_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        run: |
          set +e
          train=''; [ ! -s train.json ] || train='--train train.json'
          # shellcheck disable=SC2086  # $train is one flag and its file, or nothing
          bash bin/fleet-release-publish.sh "$TRAIN_SHA" --dir . $train > pub.txt 2>&1
          rc=$?
          cat pub.txt
          { echo "### publish \`${TRAIN_SHA:0:7}\` → hub"; echo '```'; cat pub.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != 0 ] && grep -q '409' pub.txt; then
            bash bin/fleet-train-superseded.sh "$TRAIN_SHA" --dir . --hub "$FLEET_HUB_URL" && exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          exit $rc

      # BREAK-IT release-key-outside-train, the train's look (issue #3559): with
      # the key here, the hub must not hold one too — neither its answer nor the
      # deploy tree may name CCQUOTA_FLEET_RELEASE_KEY. A warning, never a stop:
      # the migration's step A runs a train while the hub still signs.
      - name: the signing key is only in the train
        if: steps.sup.outputs.superseded != 'true'
        env:
          HAVE_KEY: ${{ secrets.RELEASE_SIGN_KEY != '' }}
        run: |
          signer=$(curl -sS -m 30 -D - -o /dev/null "$FLEET_HUB_URL/v1/fleet/release/key" | tr -d '\r' |
            awk -F': ' 'tolower($1) == "x-ccquota-release-signer" { print $2 }')
          held=$(grep -rln 'CCQUOTA_FLEET_RELEASE_KEY' deploy/ 2>/dev/null | tr '\n' ' ')
          if [ "$HAVE_KEY" != true ]; then
            echo "### 发布签名：入口自己签（release-sign 环境还没有 RELEASE_SIGN_KEY）" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$signer" = train ] && [ -z "$held" ]; then
            echo "### 发布签名：发布列车（入口只有根公钥）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the release signing key is in the train AND the hub still holds one (signer: ${signer:-?}; deploy names CCQUOTA_FLEET_RELEASE_KEY in: ${held:-nothing}) — finish the move: docs/dev/FLEET-HUB.md 发布签名"
            echo "### 发布签名：⚠️ 入口还握着私钥（signer ${signer:-?}；${held:-deploy 未提}）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: move stable to TRAIN_SHA
        id: move
        if: steps.sup.outputs.superseded != 'true' && steps.pub.outputs.superseded != 'true'
        run: |
          set +e
          # node tools / node image (#3855) build the node image beside the
          # release, never gate it: a registry hiccup does not hold stable back;
          # nor does the ledger (#3870), which waits for this job
          set -- --ignore-check release --ignore-check 'node tools' --ignore-check 'node image' --ignore-check ledger
          # a Linux shard whose cluster runner went away and that `Linux rescue`
          # reran green (issue #3864): its red job is not this train's verdict
          for k in $(printf '%s' "$LOST" | tr -c '0-9' ' '); do set -- "$@" --ignore-check "Linux / shard $k"; done
          sh bin/fleet-stable.sh move "$TRAIN_SHA" --train "$GITHUB_RUN_ID" "$@" \
            --dir . --repo "$GITHUB_REPOSITORY" > out.txt 2>&1
          rc=$?
          cat out.txt
          { echo "### stable → \`${TRAIN_SHA:0:7}\`"; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 3 ] && grep -q 'does not descend from the current stable' out.txt; then
            bash bin/fleet-train-superseded.sh "$TRAIN_SHA" --dir . --hub "$FLEET_HUB_URL" && exit 0
          fi
          [ "$rc" != 0 ] || echo "moved=true" >> "$GITHUB_OUTPUT"
          exit $rc

  ledger:
    # Every run into the hub's ledger, shipped or not (issue #3870, EPIC #3863 C7 —
    # 共同约定 7): until #3870 only `release` wrote one, as its publish's `train`
    # part, so a red, cancelled or overtaken train left nothing and the board could
    # not say where it stuck. This runs after everything else (if: always(), so a
    # run 红灯即停 cancelled writes its row too), folds this run's jobs into stages
    # (bin/fleet-train-ledger.py build — the release step's own builder), names the
    # first FAIL test off the shards' train-result-* artifacts, POSTs it to
    # /v1/fleet/release/train with this run's OIDC, and puts the hub's 「卡在…」 line
    # on the summary. Bookkeeping: it never reds — a red here would stop
    # mac-follow (it follows only a green train) — and the move ignores it.
    name: ledger
    needs: [board, quarantine, plan, linux-pick, linux, linux-rescue-plan, linux-rescue, record, fail-fast, gate, train, hub-plan, hub, release]
    if: always() && needs.board.outputs.skip == 'false' && needs.board.outputs.drill != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read     # this run's jobs and its train-result-* artifacts
      id-token: write   # the ledger's OIDC token (audience ccquota-fleet-release)
    env:
      TRAIN_SHA: ${{ needs.board.outputs.train_sha }}
      STABLE_SHA: ${{ needs.board.outputs.stable_sha }}
      MERGES: ${{ needs.board.outputs.merges_json }}
      MOVED: ${{ needs.release.outputs.moved }}
      RESULTS: ${{ needs.quarantine.result }} ${{ needs.plan.result }} ${{ needs.linux.result }} ${{ needs.record.result }} ${{ needs.gate.result }} ${{ needs.train.result }} ${{ needs.hub-plan.result }} ${{ needs.hub.result }}
      RELEASE: ${{ needs.release.result }}
      FLEET_HUB_URL: https://claudefleet.24haowan.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          sparse-checkout: bin/fleet-train-ledger.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: train-result-*
          path: results
      - name: the run into the ledger
        run: |
          # moved ⇒ shipped · release green but no move ⇒ overtaken (superseded) ·
          # any stage red ⇒ failure · else (红灯即停 / a person cancelled) cancelled
          case " $RESULTS $RELEASE " in
            (*' failure '*) concl=failure ;;
            (*) concl=cancelled ;;
          esac
          [ "$RELEASE" != success ] || concl=superseded
          [ "$MOVED" != true ] || concl=success
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[]' > jobs.ndjson \
            || { echo "::warning::could not read this run's jobs — no ledger row"; exit 0; }
          python3 bin/fleet-train-ledger.py build --jobs jobs.ndjson --results results --run-id "$GITHUB_RUN_ID" \
            --sha "$TRAIN_SHA" --prev "$STABLE_SHA" --conclusion "$concl" --exclude ledger > run.json \
            || { echo "::warning::no ledger row: $(cat run.json)"; exit 0; }
          python3 -c 'import json; d=json.load(open("run.json")); print("run %s: %s · %s" % (d["run_id"], d["conclusion"], ", ".join(s["name"] for s in d["stages"])))'
          python3 bin/fleet-train-ledger.py post run.json --hub "$FLEET_HUB_URL" --summary "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::the hub did not take this run's ledger row (the board misses it; nothing else does)"

  node-tools:
    # The managed node image's `tools` stage (extras/managed-node/Dockerfile),
    # pushed once per text as <repo>:<tools-tag.sh> from here — outside CN, where
    # GitHub's release assets and dl.k8s.io download (issue #3855). Already there
    # = a look and nothing pushed, the usual case.
    name: node tools
    needs: [board, train]
    if: needs.board.outputs.skip == 'false' && vars.NODE_IMAGE_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: node-image
    permissions:
      contents: read
      id-token: write   # OIDC → STS as gha-claudefleet-node-image (acme/fleet-managed-node only)
    outputs:
      tag: ${{ steps.tools.outputs.tag }}
      digest: ${{ steps.tools.outputs.digest }}
    env:
      REPO: ${{ vars.NODE_IMAGE_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
      - uses: ./.github/actions/hub-acr
        with:
          role: gha-claudefleet-node-image
      - uses: docker/setup-buildx-action@v3
      - name: the tools image, pushed when its tag is new
        id: tools
        run: |
          tag=$(bash extras/managed-node/tools-tag.sh)
          if ! docker buildx imagetools inspect "$REPO:$tag" >/dev/null 2>&1; then
            docker buildx build --platform linux/amd64 --target tools --provenance=false --sbom=false --push -t "$REPO:$tag" extras/managed-node
            note='pushed'
          else
            note='already there'
          fi
          digest=$(docker buildx imagetools inspect "$REPO:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in (sha256:*) ;; (*) echo "::error::cannot read the digest of $REPO:$tag"; exit 1 ;; esac
          printf 'tag=%s\ndigest=%s\n' "$tag" "$digest" >> "$GITHUB_OUTPUT"
          echo "### 节点镜像工具层 \`$tag\`（$note）: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  node-image:
    # The managed node image of the release this train just shipped (issue
    # #3855): built in the Shenzhen cluster on the fleet-ack runner set (ARC,
    # deploy/k8s/runners/) by its buildkitd, native amd64, pushed over ACR's VPC
    # endpoint as <repo>:<TRAIN_SHA> — the image a person deploys by its digest.
    # Red here is the image's alone: stable has already moved.
    name: node image
    needs: [board, release, node-tools]
    if: >-
      always() && needs.release.outputs.moved == 'true' &&
      needs.node-tools.result == 'success'
    runs-on: fleet-ack
    timeout-minutes: 45
    environment: node-image
    permissions:
      contents: read
      id-token: write
    env:
      TRAIN_SHA: ${{ needs.board.outputs.train_sha }}
      HUB_URLS: ${{ vars.HUB_URLS }}   # the hub's addresses (hub-deploy's); the first is asked
      REPO: ${{ vars.NODE_IMAGE_REPO }}
      BUILD_REPO: ${{ vars.NODE_IMAGE_BUILD_REPO || vars.NODE_IMAGE_REPO }}
      TOOLS_DIGEST: ${{ needs.node-tools.outputs.digest }}
    steps:
      # GitHub from Shenzhen: a sparse, shallow checkout, tried twice
      - uses: actions/checkout@v4
        id: co
        continue-on-error: true
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /extras/managed-node/
            /conf/release-keys/
            /bin/fleet-release-verify.py
            /.github/actions/hub-acr/
            /.github/actions/hub-kubeconfig/
      - if: steps.co.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.train_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /extras/managed-node/
            /conf/release-keys/
            /bin/fleet-release-verify.py
            /.github/actions/hub-acr/
            /.github/actions/hub-kubeconfig/
      - uses: ./.github/actions/hub-acr
        with:
          role: gha-claudefleet-node-image
      - name: build and push (train-build.sh)
        id: build
        run: bash extras/managed-node/train-build.sh "${HUB_URLS%% *}" "$TRAIN_SHA" "$BUILD_REPO" "$BUILD_REPO@$TOOLS_DIGEST"
      - name: summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### 节点镜像 \`${TRAIN_SHA:0:7}\`"
            echo '```'
            echo "$REPO:$TRAIN_SHA"
            echo "$REPO@$DIGEST"
            echo '```'
            echo "部署按 digest 引用（render.py --image $REPO@$DIGEST）。"
          } >> "$GITHUB_STEP_SUMMARY"
