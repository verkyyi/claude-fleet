name: web-console

# The new console (EPIC #3923, issue #3926) is built from extras/web-console and
# its output, dist/<side>, is committed: bin/web-console-pack.sh copies it into
# the hub image as is, so no machine builds it and the page never reaches a CDN.
# This job rebuilds it from the lockfile and fails when the committed dist is
# not exactly what the sources make, or when it loads from another origin.
# No master `push` run (issue #4663): its PR ran this on the change already, and a
# post-merge re-run only re-checked it beside the release train.
on:
  # the PR gate calls it (.github/workflows/ci.yml, issue #4815) when bin/ci-plan.sh says
  # the change reaches it — its old `paths:` live there now
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extras/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extras/web-console/package-lock.json
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Subscription pool behavior
        run: node --experimental-strip-types src/admin/pool.test.mjs
      - name: Subscription identity join
        run: node test/pool.mjs
      - name: Task outcome and stale reads
        run: node --experimental-strip-types test/tasks.mjs
      - name: Terminal touch scroll
        run: node --experimental-strip-types test/terminal.mjs
      - name: One 会话 list — tasks and sessions joined (T769)
        run: node --experimental-strip-types test/work.mjs
      - name: The session list — status and title only, ⌘P's top level and order (GR5E C2)
        run: node --experimental-strip-types test/session-list.mjs
      - name: New session — chat or terminal, five starts (GR5E C3)
        run: node --experimental-strip-types test/new-session.mjs
      - name: Session workspace rules (GR5E C4)
        run: node --experimental-strip-types test/workspace-view.mjs
      - name: Images reach the page as parts assistant-ui keeps (T773)
        run: node --experimental-strip-types test/chat-media.mjs
      - name: No copy yet is no error (J091)
        run: node --experimental-strip-types test/chat-copy.mjs
      - name: chat continue (R9A2)
        run: node --experimental-strip-types test/chat-continue.mjs
      - name: Build
        run: npm run build
      - name: The committed dist is the build
        run: |
          git add -N dist
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::extras/web-console/dist is stale — run: cd extras/web-console && npm ci && npm run build, then commit dist/"
            exit 1
          fi
      - name: Nothing from another origin, no review mock
        run: |
          for side in dist/*/; do
            if grep -rEn '(src|href)="https?://' "$side/index.html"; then echo "::error::$side/index.html loads from another origin"; exit 1; fi
          done
          if grep -rEn 'fonts\.(googleapis|gstatic)\.com|cdn\.jsdelivr|unpkg\.com|cdnjs' dist; then echo "::error::a CDN in dist"; exit 1; fi
          # the review build's mock API never ships (src/proto, --mode proto)
          if grep -rq 'dash-w41' dist; then echo "::error::the review mock is in dist"; exit 1; fi
          # nor the admin side's demo data (src/admin/demo.ts, VITE_DEMO=1) — C10
          if grep -rq 'designer@example.com' dist; then echo "::error::the admin demo data is in dist"; exit 1; fi
      - name: No admin code in the member side (EPIC #3923 C10)
        run: |
          if grep -rEq '/v1/fleet/(invites|users|cred-policy)' dist/app; then echo "::error::the member side's bundle carries the admin side's code"; exit 1; fi
          grep -rq '/v1/fleet/invites' dist/admin/assets || { echo "::error::no admin side in dist/admin"; exit 1; }
      - name: The pack takes it
        run: |
          ../../bin/web-console-pack.sh --out "$RUNNER_TEMP/console" --theme-out "$RUNNER_TEMP/theme"
          grep -q 'src="/app/assets/' "$RUNNER_TEMP/console/app/index.html" || { echo "::error::the member side is not under /app/"; exit 1; }
          grep -rq '/v1/chat' "$RUNNER_TEMP/console/app/assets" || { echo "::error::the member side does not talk to /v1/chat"; exit 1; }
          grep -q 'src="/admin/assets/' "$RUNNER_TEMP/console/admin/index.html" || { echo "::error::the admin side is not under /admin/"; exit 1; }
      - name: The review builds still build
        run: |
          npm run build:proto
          VITE_DEMO=1 npx vite build --mode admin --outDir "$RUNNER_TEMP/admin-proto" --base ./
