name: tmp-4610 spinner diag (removed before merge)
on: pull_request
jobs:
  diag:
    if: github.head_ref == 'issue-4610'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: command -v tmux >/dev/null 2>&1 || brew install tmux; tmux -V; python3 -V
      - run: |
          for i in 1 2 3 4; do
            echo "=== part run $i"
            bin/run-selftests.sh fleet-break-it-selftest.sh > out.txt 2>&1 || true
            grep -nE 'spinner-unwatched|^FAIL' out.txt | cut -c1-200
            grep -q '^FAIL  spinner-unwatched' out.txt && sed -n '/^FAIL  spinner-unwatched/,/^PASS  [a-z]/p' out.txt | head -150
          done
