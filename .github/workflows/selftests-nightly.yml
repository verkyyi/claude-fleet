name: selftests nightly

# The whole Linux suite, once a day, on stable (issue #3871, EPIC #3863 C8).
#
# About 65 merges a day reach stable through the release train, and the train
# tests only what each change SELECTS (`run-selftests.sh --changed <stable>`: a
# test runs when its source names a changed file). A test that reads a file it
# never names goes red with no train running it — and nothing said so. This is
# the backstop:
#
#   * 22:17 UTC = 06:17 Beijing (and workflow_dispatch: `sha`, default
#     refs/tags/stable; `since`, the window's start) — `board` resolves the commit
#     and the window: since = the first-parent commit a day before it (stable as
#     the previous night saw it).
#   * the Linux shards run the FULL suite (no base) on that commit through the one
#     shared matrix (selftests-shards.yml) on GitHub's own ubuntu-24.04, as wide
#     as bin/fleet-train-plan.sh --full prices it — never the train's Shenzhen
#     pool: its job gate (bin/fleet-ci-job-gate.sh) takes only the merged train and
#     refused every nightly shard 2026-10-14..19 (T517, BREAK-IT
#     nightly-refused-by-runner; the repo is public, so GitHub's runners are free —
#     made private, this starts billing). Never retry_red, never a quarantine: the
#     nightly wants the real red (共同约定 5).
#   * `report` writes the run's 全量 line (shards · tests · wall time) through
#     bin/fleet-nightly-report.py summary: a shard that left no result never ran a
#     step, and the summary says 拒收 / 没跑 — never a red test — and reds the job.
#     A red test is the run's red — GitHub's own failed-run notice is the alert;
#     nothing here files an issue (issue #4900 removed #3871's 「漏测自动开单」).
#   * it keeps the night's numbers as the artifact `selftests-baseline`
#     (`baseline.json`: files · lines · tests · seconds_total · seconds_breakit ·
#     per_test{}, fleet-nightly-report.py baseline) — a batch's 改前 / 改后 reads it.
#   * the same job then asks bin/fleet-durations-drift.sh whether the durations
#     table still prices the shards right (issue #4819): every shard's tests off
#     bin/selftest-durations.txt against the seconds they took; past ±20% on any
#     shard ⇒ the summary names `bin/selftest-durations.sh --run <id>` and one
#     workflow warning marks the run — a person refreshes it.
#
# Nothing here moves stable, releases or touches a machine.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('selftests nightly @ {0}', inputs.sha || 'stable') || 'selftests nightly' }}

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'the commit to test (default refs/tags/stable)'
        type: string
        required: false
        default: ''
      since:
        description: 'the window''s start for the miss analysis (default: a day before the commit)'
        type: string
        required: false
        default: ''

concurrency:
  group: selftests-nightly
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  board:
    name: board
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.board.outputs.sha }}
      since: ${{ steps.board.outputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: the commit and the window
        id: board
        env:
          SHA: ${{ inputs.sha || '' }}
          SINCE: ${{ inputs.since || '' }}
        run: |
          set -u
          git fetch -q --force origin 'refs/tags/stable:refs/tags/stable' || true
          sha=$(git rev-parse --verify -q "${SHA:-refs/tags/stable}^{commit}") \
            || { echo "::error::${SHA:-refs/tags/stable} is not a commit"; exit 1; }
          if [ -n "$SINCE" ]; then
            since=$(git rev-parse --verify -q "$SINCE^{commit}") || { echo "::error::$SINCE is not a commit"; exit 1; }
          else
            since=$(git rev-list -1 --first-parent --before="$(( $(git log -1 --format=%ct "$sha") - 86400 ))" "$sha")
          fi
          n=$( [ -z "$since" ] || git rev-list --first-parent --count "$since..$sha")
          { echo "sha=$sha"; echo "since=$since"; } >> "$GITHUB_OUTPUT"
          echo "### 🌙 全量：stable ${sha:0:7} · 窗口 ${since:0:7}..${sha:0:7}（${n:-0} 次合并）" >> "$GITHUB_STEP_SUMMARY"

  plan:
    # The whole suite, priced off the durations table (bin/fleet-train-plan.sh
    # --full) for GitHub's runners: 12..20 shards.
    name: plan
    needs: board
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux_shards: ${{ steps.plan.outputs.linux_shards }}
      linux_budget_secs: ${{ steps.plan.outputs.linux_budget_secs }}
      linux_step_minutes: ${{ steps.plan.outputs.linux_step_minutes }}
      linux_job_minutes: ${{ steps.plan.outputs.linux_job_minutes }}
      linux_solo_secs: ${{ steps.plan.outputs.linux_solo_secs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.sha }}
      - name: fleet-train-plan.sh --full
        id: plan
        run: |
          {
            echo "### 预测（全量，按 bin/selftest-durations.txt）"
            echo "| 段 | 选中 | 宽 | 最重一片 | 每次上限 | 步骤 |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          bash bin/fleet-train-plan.sh --full --prefix linux

  linux:
    name: Linux
    needs: [board, plan]
    uses: ./.github/workflows/selftests-shards.yml
    with:
      sha: ${{ needs.board.outputs.sha }}
      # GitHub's own runners, never the train's pool: fleet-ack's job gate
      # (bin/fleet-ci-job-gate.sh) takes only the merged train and refused every
      # nightly shard 2026-10-14..19 (BREAK-IT nightly-refused-by-runner).
      runs_on: ubuntu-24.04
      shards: ${{ needs.plan.outputs.linux_shards }}
      budget_secs: ${{ needs.plan.outputs.linux_budget_secs }}
      step_minutes: ${{ needs.plan.outputs.linux_step_minutes }}
      job_minutes: ${{ needs.plan.outputs.linux_job_minutes }}
      solo_secs: ${{ needs.plan.outputs.linux_solo_secs }}
      record: true

  report:
    # The 全量 line and the durations check — the shards already carry the red.
    name: 汇总
    needs: [board, plan, linux]
    if: "!cancelled() && needs.board.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.board.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: train-result-*
          path: results
      # the readers are the workflow's own commit's (stable may predate them)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tools
          sparse-checkout: bin
      - name: the run in one line — a shard that never ran is said, not read as a red test
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED: ${{ needs.plan.outputs.linux_shards }}
        run: |
          set -u
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | [.name, (.conclusion // ""), (.started_at // ""), (.completed_at // ""), (.id | tostring)] | @tsv' > jobs.tsv || true
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at' 2>/dev/null || echo '')
          mkdir -p results
          set +e
          python3 tools/bin/fleet-nightly-report.py summary --jobs jobs.tsv --results results \
            --planned "$PLANNED" --started "$started" --repo "$GITHUB_REPOSITORY" > summary.md; rc=$?
          cat summary.md; cat summary.md >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || echo "::error::selftests nightly: shards that never ran — not a red test (see the summary)"
          exit $rc
      - name: the baseline (selftests-baseline)
        if: "!cancelled()"
        env:
          SHA: ${{ needs.board.outputs.sha }}
        run: |
          mkdir -p results baseline
          python3 tools/bin/fleet-nightly-report.py baseline --results results --bin bin \
            --run "$GITHUB_RUN_ID" --sha "$SHA" > baseline/baseline.json
          python3 -c 'import json,sys; b=json.load(open(sys.argv[1])); print("### 基线：%(files)d 个 bin/*selftest* 文件 · %(lines)d 行 · 量到 %(tests)d 个测试 · 合计 %(seconds_total)ss（演练 %(seconds_breakit)ss）" % b)' \
            baseline/baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: "!cancelled()"
        with:
          name: selftests-baseline
          path: baseline/baseline.json
          retention-days: 90
      - name: fleet-durations-drift.sh
        # the durations table against tonight's seconds (issue #4819)
        if: "!cancelled()"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.board.outputs.sha }}
        run: |
          [ -f bin/fleet-durations-drift.sh ] || { echo "no bin/fleet-durations-drift.sh at ${SHA:0:7}"; exit 0; }
          mkdir -p results
          set +e
          bash bin/fleet-durations-drift.sh --results results --sha "$SHA" --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" > drift.md; rc=$?
          cat drift.md
          { echo; cat drift.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
