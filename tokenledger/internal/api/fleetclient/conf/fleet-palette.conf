# conf/fleet-palette.conf — the fleet's ONE colour table (issue #1534, EPIC #1529 E5).
#
# Tokyo Night, at the values the bar, the dash rows and the sidebar drew before
# they read it — a first version moves no pixel, it only gives every colour one
# source. Change a colour HERE and every surface follows; never write a hex into
# a script or a conf again.
#
# Read three ways, so the syntax is the one all three accept — keep it that way:
#   · tmux        conf/tmux-attention.conf `source-file`s it right before
#                 conf/tmux-bar.conf, which spells colours `$PAL_BLUE`. `%hidden`
#                 keeps the names in tmux's config scope only: a plain NAME=value
#                 would land in the environment of every pane the fleet spawns.
#   · shell       bin/fleet-palette.sh `fleet_palette_load` — a `read` loop, never
#                 `.` (a shell would run `%hidden` as a command).
#   · python      bin/fleet-sidebar.py `palette()` — the same line rule.
#
# One `%hidden PAL_<NAME>='#rrggbb'` per line, single quotes, nothing after the
# closing quote. The names are a contract (E6 #1535 and every later surface read
# them): PAL_BG PAL_FG PAL_DIM PAL_BLUE PAL_GREEN PAL_YELLOW PAL_RED PAL_CYAN
# PAL_MAGENTA, plus PAL_SEL — the raised background of the ⌂ button.
%hidden PAL_BG='#1a1b26'
%hidden PAL_FG='#a9b1d6'
%hidden PAL_DIM='#565f89'
%hidden PAL_BLUE='#7aa2f7'
%hidden PAL_GREEN='#9ece6a'
%hidden PAL_YELLOW='#e0af68'
%hidden PAL_RED='#f7768e'
%hidden PAL_CYAN='#7dcfff'
%hidden PAL_MAGENTA='#bb9af7'
%hidden PAL_SEL='#414868'
