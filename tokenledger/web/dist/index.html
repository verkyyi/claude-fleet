<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ccquota</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Crect x='3' y='7' width='10' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Palette: the dataviz reference instance, validated with
   scripts/validate_palette.js for both surfaces. Light mode reports aqua and
   yellow below 3:1, so every chart ships a legend, direct labels and a table
   view — colour never carries meaning on its own here. */
:root {
  color-scheme: light;
  --plane:        #f9f9f7;
  --surface:      #fcfcfb;
  --border:       #e3e2dd;
  --grid:         #eeede9;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --ink-3:        #85847e;

  --s1: #2a78d6;  --s2: #eb6834;  --s3: #1baf7a;  --s4: #eda100;
  --s5: #e87ba4;  --s6: #008300;  --s7: #4a3aa7;  --s8: #e34948;

  --good: #0ca30c;  --warning: #fab219;  --serious: #ec835a;  --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --border: #2f2f2c; --grid: #262624;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8b8a81;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --border: #2f2f2c; --grid: #262624;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8b8a81;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
a { color: var(--s1); }

.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 20px 64px; }

header {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
header h1 { font-size: 17px; }
header .sub { color: var(--ink-3); font-size: 12.5px; }
header .spacer { flex: 1 1 auto; }

select, button {
  font: inherit; font-size: 13px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 9px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--ink-3); }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.controls .label { color: var(--ink-3); font-size: 12px; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.card > h2 { font-size: 13px; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 4px; }
.card > .hint { color: var(--ink-3); font-size: 12px; margin: 0 0 14px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }

/* ---- banner: the degrade path. An unavailable reading is never a 0% gauge. */
.banner {
  border: 1px solid var(--border); border-left: 3px solid var(--warning);
  background: var(--surface); border-radius: 10px; padding: 12px 14px;
  margin-bottom: 16px; display: flex; gap: 10px; align-items: flex-start;
}
.banner.err { border-left-color: var(--critical); }
.banner .ico { font-size: 15px; line-height: 1.3; }
.banner .msg { font-size: 13px; color: var(--ink-2); }
.banner .msg b { color: var(--ink); font-weight: 600; }

/* ---- gauges ---- */
.gauge + .gauge { margin-top: 20px; }
.gauge .top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
.gauge .name { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.gauge .pct { font-size: 30px; font-weight: 620; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.gauge .state { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid; }
.gauge .reset { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.track { height: 10px; border-radius: 5px; background: var(--grid); overflow: hidden; }
.fill { height: 100%; border-radius: 5px; transition: width .35s ease; }
.gauge .note { margin-top: 7px; font-size: 12px; color: var(--ink-3); }

/* Status colour is reinforced by the label text beside it, never alone. */
.st-good     { color: var(--good);     border-color: var(--good); }
.st-warning  { color: var(--warning);  border-color: var(--warning); }
.st-serious  { color: var(--serious);  border-color: var(--serious); }
.st-critical { color: var(--critical); border-color: var(--critical); }
.bg-good     { background: var(--good); }
.bg-warning  { background: var(--warning); }
.bg-serious  { background: var(--serious); }
.bg-critical { background: var(--critical); }

/* ---- bars ---- */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 250px) 1fr auto; gap: 12px; align-items: center; }
.bar-row .k { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .v { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bar-track { height: 16px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }

/* ---- legend ---- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

svg { display: block; max-width: 100%; overflow: visible; }
.axis text { font-size: 10.5px; fill: var(--ink-3); }
.axis line { stroke: var(--grid); }

table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
th { color: var(--ink-3); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }

/* ---- live strip ---- */
.live {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 18px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.live-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.live-head h2 { font-size: 13px; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); }
.live-head .note { color: var(--ink-3); font-size: 11.5px; }
.pulse {
  width: 8px; height: 8px; border-radius: 50%; background: var(--good);
  box-shadow: 0 0 0 0 var(--good); animation: pulse 2s infinite;
}
.pulse.off { background: var(--ink-3); animation: none; box-shadow: none; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(12,163,12,.5); }
  70%  { box-shadow: 0 0 0 7px rgba(12,163,12,0); }
  100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
.tile .n {
  font-size: 26px; font-weight: 620; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; line-height: 1.15;
}
.tile .l { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

.live-rows { margin-top: 16px; display: flex; flex-direction: column; gap: 7px; }
.live-row {
  display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
  padding: 7px 10px; border-radius: 8px; background: var(--grid);
}
.live-row .who { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-row .who b { font-weight: 600; }
.live-row .who span { color: var(--ink-3); }
.live-row .rate { font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctxbar { width: 54px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.ctxbar i { display: block; height: 100%; background: var(--s1); }

.muted { color: var(--ink-3); font-size: 12.5px; }
.empty { color: var(--ink-3); font-size: 13px; padding: 22px 0; text-align: center; }
footer { margin-top: 26px; color: var(--ink-3); font-size: 12px; line-height: 1.7; }
.tip {
  position: fixed; pointer-events: none; z-index: 20; opacity: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow); transition: opacity .1s;
  font-variant-numeric: tabular-nums; max-width: 260px;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ccquota</h1>
    <span class="sub" id="sub">loading…</span>
    <span class="spacer"></span>
    <select id="account" aria-label="Subscription"></select>
    <select id="range" aria-label="Time range">
      <option value="1d">last 24h</option>
      <option value="7d" selected>last 7 days</option>
      <option value="30d">last 30 days</option>
      <option value="90d">last 90 days</option>
    </select>
    <button id="tables" aria-pressed="false" title="Show the numbers as tables">Tables</button>
    <button id="theme" title="Toggle light / dark">◐</button>
  </header>

  <div id="live"></div>
  <div id="banners"></div>
  <main id="main"></main>

  <footer id="footer"></footer>
</div>
<div class="tip" id="tip" role="status"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ utils */

const $ = (sel) => document.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElementNS(
    tag === "svg" || SVG_TAGS.has(tag) ? "http://www.w3.org/2000/svg" : "http://www.w3.org/1999/xhtml", tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.setAttribute("class", v);
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
};
const SVG_TAGS = new Set(["g","rect","text","line","path","circle","svg","title"]);

const fmtInt = (n) => {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(Math.round(n));
};
const fmtUSD = (n) => "$" + (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtFull = (n) => (Number(n) || 0).toLocaleString();

/** shortProject trims a working directory to its last two segments. Full paths
 *  are long, and on a shared hub they leak more than they inform. */
const shortProject = (p) => {
  if (!p) return "(unknown)";
  const parts = p.replace(/\\/g, "/").replace(/\/+$/, "").split("/").filter(Boolean);
  if (parts.length <= 2) return p;
  // Two segments where they fit, one where they do not. What distinguishes
  // sibling worktrees is the LAST segment, so it must never be the part that
  // gets clipped — otherwise every row reads "…/projects/24haowan-monorepo…".
  const two = parts.slice(-2).join("/");
  return "…/" + (two.length <= 30 ? two : parts[parts.length - 1]);
};

const relTime = (iso) => {
  if (!iso) return "reset time unknown";
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return "resetting now";
  const m = Math.round(ms / 60000);
  if (m < 60) return `resets in ${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `resets in ${h}h ${m % 60}m`;
  return `resets in ${Math.floor(h / 24)}d ${h % 24}h`;
};

const ago = (secs) => {
  if (secs == null) return "";
  if (secs < 90) return `${Math.round(secs)}s ago`;
  if (secs < 5400) return `${Math.round(secs / 60)}m ago`;
  return `${Math.round(secs / 3600)}h ago`;
};

/** Utilization -> status. Four named bands so the label, not the hue, is what
 *  carries the meaning. */
const band = (pct) =>
  pct >= 90 ? { key: "critical", label: "critical" }
  : pct >= 75 ? { key: "serious", label: "high" }
  : pct >= 50 ? { key: "warning", label: "moderate" }
  : { key: "good", label: "healthy" };

const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
/** seriesColor assigns hues in FIXED order and never cycles. A ninth series
 *  folds into "Other" rather than reusing slot 1 and implying a relationship
 *  that is not there. */
const seriesColor = (i) => `var(${SERIES[Math.min(i, SERIES.length - 1)]})`;

/* ---------------------------------------------------------------- tooltip */

const tip = $("#tip");
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const pad = 14, r = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = "0"; };
addEventListener("scroll", hideTip, { passive: true });

/* -------------------------------------------------------------------- api */

async function api(path) {
  const res = await fetch(path, { headers: { Accept: "application/json" } });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

/* ------------------------------------------------------------------- live */

/** tween animates a number toward its target so a jump reads as movement
 *  rather than a flicker. Honours reduced-motion by snapping instead. */
function tween(node, to, fmt) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const from = Number(node.dataset.v || 0);
  node.dataset.v = String(to);
  if (reduce || !isFinite(from) || from === to) { node.textContent = fmt(to); return; }

  const t0 = performance.now(), dur = 600;
  cancelAnimationFrame(Number(node.dataset.raf || 0));
  const step = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    // ease-out: fast to start, settles gently on the final value
    const v = from + (to - from) * (1 - Math.pow(1 - p, 3));
    node.textContent = fmt(v);
    if (p < 1) node.dataset.raf = String(requestAnimationFrame(step));
  };
  node.dataset.raf = String(requestAnimationFrame(step));
}

const liveState = { snap: null, es: null };

function tile(id, label) {
  return el("div", { class: "tile" },
    el("div", { class: "n", id }, "—"),
    el("div", { class: "l" }, label));
}

function renderLive(snap) {
  liveState.snap = snap;
  const root = $("#live");
  const active = snap && snap.active_sessions > 0;

  if (!root.firstChild) {
    root.replaceChildren(el("div", { class: "live" },
      el("div", { class: "live-head" },
        el("span", { class: "pulse", id: "live-pulse" }),
        el("h2", {}, "Right now"),
        el("span", { class: "note", id: "live-note" }, "")),
      el("div", { class: "tiles" },
        tile("lv-sessions", "active sessions"),
        tile("lv-tpm", "tokens / min"),
        tile("lv-uph", "$ / hour (notional)"),
        tile("lv-stok", "tokens in flight"),
        tile("lv-total", "tokens (range)"),
        tile("lv-spend", "spend (range)")),
      el("div", { class: "live-rows", id: "live-rows" })));
  }

  $("#live-pulse").className = "pulse" + (active ? "" : " off");
  $("#live-note").textContent = active
    ? `${snap.endpoints} endpoint${snap.endpoints === 1 ? "" : "s"} reporting · updates as sessions work`
    : "no sessions reporting — install `ccquota stamp` as your statusLine to see live activity";

  if (!snap) return;
  tween($("#lv-sessions"), snap.active_sessions, (v) => String(Math.round(v)));
  tween($("#lv-tpm"), snap.tokens_per_min, (v) => fmtInt(Math.round(v)));
  tween($("#lv-uph"), snap.usd_per_hour, (v) => "$" + v.toFixed(2));
  tween($("#lv-stok"), snap.session_tokens || 0, (v) => fmtInt(Math.round(v)));
  renderStoredTotals();

  const rows = snap.sessions.slice(0, 8).map((s) => {
    const where = s.worktree || shortProject(s.cwd) || s.session_id.slice(0, 8);
    const ctx = Math.round(s.context_used_pct || 0);
    return el("div", { class: "live-row" },
      el("div", { class: "who", title: s.cwd || "" },
        el("b", {}, where), " ",
        el("span", {}, `${s.model || "?"}${s.effort ? " · " + s.effort : ""} · ${s.endpoint}`)),
      el("div", { class: "rate" },
        `${fmtInt((s.input_tokens || 0) + (s.output_tokens || 0))}` +
        (s.tokens_per_min > 0 ? ` · ${fmtInt(Math.round(s.tokens_per_min))}/min` : " · idle")),
      el("div", { class: "ctxbar", title: `context ${ctx}%` },
        el("i", { style: `width:${Math.min(100, ctx)}%` })));
  });
  $("#live-rows").replaceChildren(...rows);
}

/** renderStoredTotals fills the two tiles backed by the DURABLE store rather
 *  than the live heartbeat.
 *
 *  These are the numbers that only ever go up: the live tiles describe what is
 *  in flight and fall when a session ends, while these accumulate for the
 *  selected range and scope. Kept visibly separate because they are different
 *  measurements — summing them would double-count the work in progress. */
function renderStoredTotals() {
  const d = state.data;
  if (!d || !d.byEndpoint) return;
  const buckets = d.byEndpoint.buckets || [];
  const tokens = buckets.reduce((a, b) => a + (b.tokens || 0), 0);
  const cost = buckets.reduce((a, b) => a + (b.cost_usd || 0), 0);

  const t = $("#lv-total"), c = $("#lv-spend");
  if (t) tween(t, tokens, (v) => fmtInt(Math.round(v)));
  if (c) tween(c, cost, (v) => "$" + Math.round(v).toLocaleString());

  const labels = document.querySelectorAll(".tile .l");
  labels.forEach((el) => {
    if (el.textContent.startsWith("tokens (")) el.textContent = `tokens (${state.range})`;
    if (el.textContent.startsWith("spend (")) el.textContent = `spend (${state.range})`;
  });
}

/** connectLive subscribes to the hub's event stream, falling back to polling
 *  when the stream cannot be held open. */
function connectLive() {
  if (liveState.es) liveState.es.close();
  try {
    const es = new EventSource("/v1/live/stream");
    liveState.es = es;
    es.onmessage = (e) => { try { renderLive(JSON.parse(e.data)); } catch {} };
    es.onerror = () => {
      // EventSource reconnects on its own; a poll keeps the numbers moving
      // meanwhile rather than freezing on the last frame.
      es.close(); liveState.es = null;
      setTimeout(connectLive, 5000);
    };
  } catch {
    setInterval(async () => {
      try { renderLive(await api("/v1/live")); } catch {}
    }, 5000);
  }
}

/* ------------------------------------------------------------------ state */

// account is a SCOPE, not a mode: "all" is a first-class value, not the
// absence of a choice.
const state = { account: null, accounts: [], range: "7d", tables: false, data: null };
const ALL = "all";
const spanning = () => state.account === ALL;

/** accountLabel is THE display name for a subscription, everywhere.
 *
 *  Every surface must resolve it identically or the same account shows up
 *  under two names on one page — the switcher saying one thing while a table
 *  says another. The server exposes the same precedence; this mirrors it for
 *  the places that only hold a uuid. */
function accountLabel(uuid) {
  if (!uuid) return "—";
  const a = state.accounts.find((x) => x.account_uuid === uuid);
  if (!a) return uuid;
  return a.email || a.display_name || a.account_uuid;
}

/** accountSuffix marks a subscription identified by its reset schedule rather
 *  than by a login, so a heuristic never reads as a fact. */
function accountSuffix(uuid) {
  const a = state.accounts.find((x) => x.account_uuid === uuid);
  if (!a) return "";
  const bits = [];
  if (a.subscription_type) bits.push(a.subscription_type);
  if (String(a.account_uuid).startsWith("win_")) bits.push("inferred");
  return bits.length ? " · " + bits.join(" · ") : "";
}

/* --------------------------------------------------------------- controls */

$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "auto" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("ccquota-theme", next); } catch {}
});
try {
  const saved = localStorage.getItem("ccquota-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch {}

$("#tables").addEventListener("click", (e) => {
  state.tables = !state.tables;
  e.currentTarget.setAttribute("aria-pressed", String(state.tables));
  render();
});
$("#range").addEventListener("change", (e) => { state.range = e.target.value; load(); });
$("#account").addEventListener("change", (e) => { state.account = e.target.value; load(); });

/* ------------------------------------------------------------------- load */

function banner(kind, title, msg) {
  return el("div", { class: "banner" + (kind === "err" ? " err" : "") },
    el("span", { class: "ico" }, kind === "err" ? "✕" : "!"),
    el("div", { class: "msg" }, el("b", {}, title + " "), msg));
}

async function boot() {
  try {
    state.accounts = await api("/v1/accounts");
  } catch (err) {
    $("#banners").replaceChildren(banner("err", "Cannot reach the hub.", String(err.message)));
    $("#sub").textContent = "";
    return;
  }
  const sel = $("#account");
  const opts = state.accounts.map((a) =>
    el("option", { value: a.account_uuid },
      accountLabel(a.account_uuid) + accountSuffix(a.account_uuid)));
  if (state.accounts.length > 1) {
    // Spanning is the default with several subscriptions: showing everything
    // and labelling it beats silently picking one the viewer cannot tell is
    // the wrong one.
    opts.unshift(el("option", { value: ALL }, `All ${state.accounts.length} subscriptions`));
  }
  sel.replaceChildren(...opts);
  sel.style.display = state.accounts.length > 1 ? "" : "none";

  if (!state.accounts.length) {
    $("#sub").textContent = "";
    $("#banners").replaceChildren(banner("warn", "No data yet.",
      "No endpoint has reported to this hub. Enroll one with `ccquota enroll --name <host>`, then run `ccquota agent` there."));
    return;
  }
  state.account = state.accounts.length > 1 ? ALL : state.accounts[0].account_uuid;
  $("#account").value = state.account;
  await load();
}

async function load() {
  const a = encodeURIComponent(state.account), r = state.range;
  const gran = (r === "1d") ? "hour" : "day";
  try {
    const [limits, endpoints, byEndpoint, byProject, bySession, history, byAccount, switches] =
      await Promise.all([
        api(`/v1/limits?account=${a}`),
        api(`/v1/endpoints?account=${a}`),
        api(`/v1/usage?account=${a}&by=endpoint&since=${r}&limit=20`),
        api(`/v1/usage?account=${a}&by=project&since=${r}&limit=12`),
        api(`/v1/usage?account=${a}&by=session&since=${r}&limit=12`),
        api(`/v1/history?account=${a}&since=${r}&granularity=${gran}`),
        spanning() ? api(`/v1/usage?account=all&by=account&since=${r}&limit=20`) : null,
        api(`/v1/account-switches?limit=20`),
      ]);
    state.data = { limits, endpoints, byEndpoint, byProject, bySession, history, byAccount, switches };
    render();
  } catch (err) {
    $("#banners").replaceChildren(banner("err", "Query failed.", String(err.message)));
  }
}

/* ----------------------------------------------------------------- render */

function render() {
  const d = state.data;
  if (!d) return;

  const acct = state.accounts.find((x) => x.account_uuid === state.account) || {};
  void acct;
  const online = d.endpoints.filter((e) => e.last_seen &&
    (Date.now() - new Date(e.last_seen)) < 10 * 60_000).length;
  $("#sub").textContent =
    `${d.endpoints.length} endpoint${d.endpoints.length === 1 ? "" : "s"}` +
    ` · ${online} reporting${acct.rate_limit_tier ? " · " + acct.rate_limit_tier : ""}`;

  const banners = [];

  // What the agents refused to attribute. A total that quietly excludes
  // history is its own kind of lie, so it is stated before anything else.
  const lossy = d.endpoints.filter((e) => e.dropped_pre_account > 0 || e.dropped_beyond_backfill > 0);
  for (const e of lossy) {
    const bits = [];
    if (e.dropped_pre_account > 0) {
      bits.push(`${fmtFull(e.dropped_pre_account)} turn(s) older than this subscription` +
        (e.earliest_dropped ? ` (back to ${e.earliest_dropped.slice(0, 10)})` : "") +
        " — they cannot belong to it, so they are excluded");
    }
    if (e.dropped_beyond_backfill > 0) {
      bits.push(`${fmtFull(e.dropped_beyond_backfill)} turn(s) beyond the ${e.backfill_limit} backfill window`);
    }
    banners.push(banner("warn", `${e.label || e.hostname} excludes history.`, bits.join("; ") + "."));
  }

  if (spanning()) {
    // Nothing below is scoped to one subscription; say so once, at the top.
    banners.push(banner("warn", "Showing all subscriptions.",
      "Tokens and notional costs are summed across them. Rate-limit utilization is not — " +
      "each subscription is a separate quota pool and is shown separately."));
  }

  if (!spanning() && !d.limits.available) {
    banners.push(banner("warn", "Account-wide limits unavailable.",
      (d.limits.reason || "").replace(/\.?$/, ".") +
      " The usage totals below are still accurate; only the quota gauges are missing."));
  } else if (!spanning() && d.limits.available && d.limits.stale_seconds > 600) {
    banners.push(banner("warn", "Limits reading is stale.",
      `Last read ${ago(d.limits.stale_seconds)}. An agent may have stopped polling.`));
  }
  $("#banners").replaceChildren(...banners);

  $("#main").replaceChildren(
    wallCard(d.limits),
    d.byAccount ? accountCard(d.byAccount) : null,
    el("div", { class: "grid2" }, endpointCard(d), historyCard(d.history)),
    projectCard(d.byProject, d.bySession),
    endpointRosterCard(d.endpoints),
    switchesCard(d.switches),
  );

  renderStoredTotals();

  $("#footer").replaceChildren(el("div", {}, (d.limits && d.limits.disclaimer) ||
    "The account-wide utilization is exact and already covers every device. " +
    "Per-endpoint shares are proportional estimates. " +
    "Costs are notional API-equivalent figures, not a bill."));
}

/* ------------------------------------------------------------- wall (Q1) */

function wallCard(limits) {
  // The cross-subscription shape is a LIST, never a total: two pools at 4% and
  // 19% are not 23% of anything.
  if (limits && Array.isArray(limits.per_account)) {
    const card = el("div", { class: "card" },
      el("h2", {}, "Am I about to hit the wall?"),
      el("p", { class: "hint" }, limits.note));
    if (limits.worst) {
      card.appendChild(el("p", { class: "hint", style: "margin-top:-8px" },
        `Closest to its limit: ${limits.worst.label} at ` +
        `${limits.worst.limits.five_hour.utilization.toFixed(1)}%.`));
    }
    for (const entry of limits.per_account) {
      card.appendChild(el("h2", { style: "margin-top:20px" }, entry.label));
      if (!entry.limits.available) {
        card.appendChild(el("div", { class: "empty" }, entry.limits.reason || "No reading available."));
        continue;
      }
      card.appendChild(gauge("5-hour window", entry.limits.five_hour));
      card.appendChild(gauge("7-day window", entry.limits.seven_day));
    }
    return card;
  }

  const card = el("div", { class: "card" },
    el("h2", {}, "Am I about to hit the wall?"),
    el("p", { class: "hint" },
      "Exact, account-wide, and already covering every device on the subscription."));

  if (!limits.available) {
    // No gauge at all. A 0% bar rendered the same as a live one is the failure
    // this project exists to avoid.
    card.appendChild(el("div", { class: "empty" },
      "No reading available — see the notice above."));
    return card;
  }

  card.appendChild(gauge("5-hour window", limits.five_hour));
  card.appendChild(gauge("7-day window", limits.seven_day));

  for (const s of limits.scoped || []) {
    if (!s.model && !s.surface) continue;
    card.appendChild(gauge(`${s.model || s.surface} · weekly`, s));
  }

  const shares = (limits.endpoint_shares || []).filter((s) => s.weighted_tokens > 0);
  if (shares.length) {
    card.appendChild(el("h2", { style: "margin-top:24px" }, "Whose 5-hour window is it"));
    card.appendChild(el("p", { class: "hint" },
      `Estimated split of the ${limits.five_hour.utilization.toFixed(1)}% above, by weighted spend.`));
    card.appendChild(rankedBars(shares.map((s) => ({
      key: s.label || s.endpoint_id,
      value: s.estimated_utilization,
      right: s.estimated_utilization.toFixed(1) + "%",
      tip: `<b>${escapeHTML(s.label || s.endpoint_id)}</b><br>` +
           `${(s.fraction_of_window * 100).toFixed(1)}% of this window's spend<br>` +
           `${fmtFull(s.tokens)} tokens · ${s.events} turns<br>` +
           `<span style="opacity:.7">≈ ${s.estimated_utilization.toFixed(1)}% of the limit (estimate)</span>`,
    }))));
  }
  return card;
}

function gauge(name, w) {
  const pct = Math.max(0, Math.min(100, Number(w.utilization) || 0));
  const b = band(pct);
  const burn = w.burn || {};

  let note = "";
  if (burn.exhausted_at) {
    note = `At the current rate (${burn.percent_per_hour.toFixed(1)}%/h) this window fills around ` +
           new Date(burn.exhausted_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + ".";
  } else if (burn.percent_per_hour > 0) {
    note = `Burning ${burn.percent_per_hour.toFixed(1)}%/h — it resets before it fills.`;
  }

  return el("div", { class: "gauge" },
    el("div", { class: "top" },
      el("span", { class: "name" }, name),
      el("span", { class: "pct" }, pct.toFixed(1) + "%"),
      el("span", { class: "state st-" + b.key }, b.label),
      el("span", { class: "reset" }, relTime(w.resets_at))),
    el("div", { class: "track" }, el("div", { class: "fill bg-" + b.key, style: `width:${pct}%` })),
    note ? el("div", { class: "note" }, note) : null);
}

/* ----------------------------------------- by subscription (a dimension) */

function accountCard(byAccount) {
  const buckets = byAccount.buckets || [];
  const card = el("div", { class: "card" },
    el("h2", {}, "Which subscription is it on"),
    el("p", { class: "hint" },
      `Spend grouped by subscription · ${state.range}. Additive, unlike utilization.`));

  if (!buckets.length) {
    card.appendChild(el("div", { class: "empty" }, "No usage in this range."));
    return card;
  }
  if (state.tables) {
    card.appendChild(bucketTable(buckets, "Subscription"));
    return card;
  }
  card.appendChild(rankedBars(buckets.map((b, i) => ({
    key: b.label || b.key,
    value: b.tokens,
    right: `${fmtInt(b.tokens)} · ${fmtUSD(b.cost_usd)}`,
    color: seriesColor(i),
    tip: `<b>${escapeHTML(b.label || b.key)}</b><br>${fmtFull(b.tokens)} tokens<br>` +
         `${fmtFull(b.events)} turns · ${fmtUSD(b.cost_usd)} notional`,
  }))));
  card.appendChild(el("div", { class: "legend" }, buckets.map((b, i) =>
    el("span", {}, el("i", { style: `background:${seriesColor(i)}` }), b.label || b.key))));
  return card;
}

/* ------------------------------------- account switches (a regular view) */

function switchesCard(switches) {
  if (!switches || !switches.length) return null;

  const card = el("div", { class: "card" },
    el("h2", {}, "Subscription switches"),
    el("p", { class: "hint" },
      "Machines that logged out of one subscription and into another. Turns recorded " +
      "before a switch keep their old attribution and cannot be corrected — these are " +
      "the seams where historical figures stop being reliable."));

  const epByID = {};
  for (const e of (state.data.endpoints || [])) epByID[e.endpoint_id] = e.label || e.hostname;

  card.appendChild(el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {},
      el("th", {}, "When"), el("th", {}, "Machine"), el("th", {}, "From"), el("th", {}, "To"))),
    el("tbody", {}, switches.map((s) => el("tr", {},
      el("td", {}, new Date(s.observed_at).toLocaleString()),
      el("td", {}, epByID[s.endpoint_id] || s.endpoint_id),
      el("td", { title: s.from_account }, accountLabel(s.from_account)),
      el("td", { title: s.to_account }, accountLabel(s.to_account))))))));
  return card;
}

/* --------------------------------------------------- endpoints (Q2) */

function endpointCard(d) {
  const buckets = d.byEndpoint.buckets || [];
  const card = el("div", { class: "card" },
    el("h2", {}, "Which endpoint is burning it"),
    el("p", { class: "hint" }, `Weighted by notional cost · ${state.range}`));

  if (!buckets.length) return card.appendChild(el("div", { class: "empty" }, "No usage in this range.")), card;

  if (state.tables) { card.appendChild(bucketTable(buckets, "Endpoint")); return card; }

  card.appendChild(rankedBars(buckets.map((b) => ({
    key: b.label || b.key,
    value: b.tokens,
    right: `${fmtInt(b.tokens)} · ${fmtUSD(b.cost_usd)}`,
    tip: `<b>${escapeHTML(b.label || b.key)}</b><br>${fmtFull(b.tokens)} tokens<br>` +
         `${fmtFull(b.events)} turns · ${fmtUSD(b.cost_usd)} notional` +
         (b.unpriced_events ? `<br><span style="opacity:.7">${b.unpriced_events} turns unpriced</span>` : ""),
  }))));
  return card;
}

/* ------------------------------------------------ projects & sessions (Q3) */

function projectCard(byProject, bySession) {
  const card = el("div", { class: "card" },
    el("h2", {}, "Which project is burning it"),
    el("p", { class: "hint" }, `Top working directories and sessions · ${state.range}`));

  const proj = (byProject.buckets || []).map((b) => ({ ...b, label: shortProject(b.key) }));
  const sess = bySession.buckets || [];

  if (!proj.length) return card.appendChild(el("div", { class: "empty" }, "No usage in this range.")), card;

  if (state.tables) {
    card.appendChild(el("h2", { style: "margin-top:8px" }, "By project"));
    card.appendChild(bucketTable(proj, "Project"));
    card.appendChild(el("h2", { style: "margin-top:20px" }, "By session"));
    card.appendChild(bucketTable(sess, "Session"));
    return card;
  }

  card.appendChild(rankedBars(proj.map((b) => ({
    key: b.label,
    value: b.tokens,
    right: `${fmtInt(b.tokens)} · ${fmtUSD(b.cost_usd)}`,
    tip: `<b>${escapeHTML(b.key)}</b><br>${fmtFull(b.tokens)} tokens<br>` +
         `${fmtFull(b.events)} turns · ${fmtUSD(b.cost_usd)} notional` +
         (b.sidechain_tokens ? `<br>${fmtInt(b.sidechain_tokens)} of it in subagents` : ""),
  }))));

  if (sess.length) {
    card.appendChild(el("h2", { style: "margin-top:24px" }, "Heaviest sessions"));
    card.appendChild(el("p", { class: "hint" }, "A single runaway session shows up here."));
    card.appendChild(rankedBars(sess.map((b) => ({
      key: b.key.slice(0, 8) + "…",
      value: b.tokens,
      right: `${fmtInt(b.tokens)} · ${fmtUSD(b.cost_usd)}`,
      tip: `<b>session ${escapeHTML(b.key)}</b><br>${fmtFull(b.tokens)} tokens<br>` +
           `${fmtFull(b.events)} turns · ${fmtUSD(b.cost_usd)} notional` +
           (b.sidechain_tokens ? `<br>${fmtInt(b.sidechain_tokens)} of it in subagents` : ""),
    }))));
  }
  return card;
}

/* --------------------------------------------------------- history (Q4) */

function historyCard(history) {
  const series = history.series || [];
  const models = (history.by_model || []).slice(0, 8);
  const card = el("div", { class: "card" },
    el("h2", {}, "History and trend"),
    el("p", { class: "hint" }, `Tokens per ${history.granularity} · ${state.range}`));

  if (!series.length) return card.appendChild(el("div", { class: "empty" }, "No usage in this range.")), card;

  if (state.tables) {
    card.appendChild(bucketTable(series, history.granularity === "hour" ? "Hour" : "Day"));
    card.appendChild(el("h2", { style: "margin-top:20px" }, "By model"));
    card.appendChild(bucketTable(models, "Model"));
    return card;
  }

  card.appendChild(timeSeries(series, history.granularity));

  if (models.length) {
    card.appendChild(el("h2", { style: "margin-top:22px" }, "By model"));
    card.appendChild(rankedBars(models.map((b, i) => ({
      key: b.key || "(unknown)",
      value: b.tokens,
      right: `${fmtInt(b.tokens)} · ${fmtUSD(b.cost_usd)}`,
      color: seriesColor(i),
      tip: `<b>${escapeHTML(b.key || "(unknown)")}</b><br>${fmtFull(b.tokens)} tokens<br>` +
           `${fmtFull(b.events)} turns · ${fmtUSD(b.cost_usd)} notional`,
    }))));
    // >= 2 series, so identity never rests on colour alone.
    card.appendChild(el("div", { class: "legend" }, models.map((b, i) =>
      el("span", {}, el("i", { style: `background:${seriesColor(i)}` }), b.key || "(unknown)"))));
  }
  return card;
}

/** timeSeries draws one measure over time as bars: a single series, so no
 *  legend box — the card title names it. 2px gaps between bars, recessive
 *  gridlines, labels only at the ends and the peak. */
function timeSeries(series, granularity) {
  const W = 560, H = 190, PAD = { t: 14, r: 8, b: 26, l: 46 };
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const max = Math.max(...series.map((s) => s.tokens), 1);
  const n = series.length;
  const gap = n > 60 ? 1 : 2;
  const bw = Math.max(1, iw / n - gap);

  const ticks = [0, max / 2, max];
  const y = (v) => PAD.t + ih - (v / max) * ih;

  const g = el("g", {});
  for (const t of ticks) {
    g.appendChild(el("line", { x1: PAD.l, x2: W - PAD.r, y1: y(t), y2: y(t), stroke: "var(--grid)" }));
    g.appendChild(el("text", { x: PAD.l - 8, y: y(t) + 3.5, "text-anchor": "end", fill: "var(--ink-3)",
      "font-size": "10.5" }, fmtInt(t)));
  }

  const peak = series.reduce((a, b) => (b.tokens > a.tokens ? b : a), series[0]);
  series.forEach((s, i) => {
    const h = Math.max(s.tokens > 0 ? 1.5 : 0, (s.tokens / max) * ih);
    const x = PAD.l + i * (iw / n);
    const label = `<b>${escapeHTML(s.key)}</b><br>${fmtFull(s.tokens)} tokens<br>` +
      `${fmtFull(s.events)} turns · ${fmtUSD(s.cost_usd)} notional`;
    g.appendChild(el("rect", {
      x, y: y(s.tokens), width: bw, height: h, rx: 2, fill: "var(--s1)",
      onmousemove: (e) => showTip(e, label),
      onmouseleave: hideTip,
    }, el("title", {}, `${s.key}: ${fmtFull(s.tokens)} tokens`)));
  });

  // Selective labels: first, last and the peak — never a number on every bar.
  const labelAt = (s, i, anchor) => {
    const x = PAD.l + i * (iw / n) + bw / 2;
    return el("text", { x, y: H - 8, "text-anchor": anchor, fill: "var(--ink-3)", "font-size": "10.5" },
      granularity === "hour" ? s.key.slice(11, 16) : s.key.slice(5));
  };
  g.appendChild(labelAt(series[0], 0, "start"));
  if (n > 1) g.appendChild(labelAt(series[n - 1], n - 1, "end"));
  const pi = series.indexOf(peak);
  if (n > 4 && pi > 1 && pi < n - 2) g.appendChild(labelAt(peak, pi, "middle"));

  return el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", height: H,
    role: "img", "aria-label": `Tokens per ${granularity}, peak ${fmtInt(max)}` }, g);
}

/* --------------------------------------------------------- shared pieces */

function rankedBars(rows) {
  const max = Math.max(...rows.map((r) => r.value), 1);
  return el("div", { class: "bars" }, rows.map((r) =>
    el("div", { class: "bar-row",
        onmousemove: r.tip ? (e) => showTip(e, r.tip) : null,
        onmouseleave: r.tip ? hideTip : null },
      el("div", { class: "k", title: r.key }, r.key),
      el("div", { class: "bar-track" },
        el("div", { class: "bar-fill",
          style: `width:${Math.max(1.5, (r.value / max) * 100)}%${r.color ? ";background:" + r.color : ""}` })),
      el("div", { class: "v" }, r.right))));
}

/** bucketTable is the relief the palette validator requires in light mode, and
 *  the accessible fallback for anyone who cannot read the charts. */
function bucketTable(buckets, keyLabel) {
  return el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {},
      el("th", {}, keyLabel),
      el("th", { class: "num" }, "Turns"),
      el("th", { class: "num" }, "Tokens"),
      el("th", { class: "num" }, "Cost"),
      el("th", { class: "num" }, "Unpriced"))),
    el("tbody", {}, buckets.map((b) => el("tr", {},
      el("td", { title: b.key }, b.label || b.key || "(unknown)"),
      el("td", { class: "num" }, fmtFull(b.events)),
      el("td", { class: "num" }, fmtFull(b.tokens)),
      el("td", { class: "num" }, fmtUSD(b.cost_usd)),
      el("td", { class: "num" }, b.unpriced_events ? fmtFull(b.unpriced_events) : "—"))))));
}

function endpointRosterCard(endpoints) {
  const card = el("div", { class: "card" },
    el("h2", {}, "Endpoints"),
    el("p", { class: "hint" },
      "Every machine reporting in, which subscription it is on, and what it could not " +
      "attribute. An agent that stops reporting is the usual reason a total looks too low."));

  if (!endpoints.length) {
    card.appendChild(el("div", { class: "empty" }, "No endpoints enrolled yet."));
    return card;
  }
  card.appendChild(el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {},
      el("th", {}, "Name"), el("th", {}, "Subscription"), el("th", {}, "Platform"),
      el("th", {}, "Claude Code"), el("th", {}, "Agent"),
      el("th", {}, "Last seen"), el("th", {}, "Excluded"))),
    el("tbody", {}, endpoints.map((e) => {
      const secs = e.last_seen ? (Date.now() - new Date(e.last_seen)) / 1000 : null;
      const stale = secs == null || secs > 600;
      const dropped = (e.dropped_pre_account || 0) + (e.dropped_beyond_backfill || 0);
      return el("tr", {},
        el("td", { title: e.hostname || "" }, e.label || e.endpoint_id),
        el("td", { title: e.account_uuid || "" }, accountLabel(e.account_uuid)),
        el("td", {}, e.os ? `${e.os}/${e.arch}` : "—"),
        el("td", {}, e.cc_version || "—"),
        el("td", {}, e.agent_version || "—"),
        el("td", { style: stale ? "color:var(--ink-3)" : "" },
          secs == null ? "never reported" : ago(secs)),
        el("td", { style: dropped ? "" : "color:var(--ink-3)" },
          dropped ? `${fmtInt(dropped)} turns` : "—"));
    })))));
  return card;
}

const escapeHTML = (s) => String(s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

boot();
connectLive();
/* The 5-hour window moves fast enough that a dashboard left open goes stale
   within minutes; refresh it rather than let someone read an old number. */
setInterval(() => { if (state.account) load(); }, 60_000);
</script>
</body>
</html>
