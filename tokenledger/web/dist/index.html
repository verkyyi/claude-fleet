<!doctype html>
<!-- lang="en" is the shell's own default; lib/i18n.js rewrites it to the
     viewer's locale at module-eval time, before any card renders. -->
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TokenLedger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Crect x='3' y='7' width='10' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- The bar holds the wordmark, the view nav, and the two "how this page is
     rendered for me" toggles.
     OVERTURNED TWICE, and #98 is the second time. It first said the bar held
     no navigation because the page was one surface with nothing to navigate
     BETWEEN; #54 kept the premise and rejected the inference, giving the bar
     an ANCHOR nav that "moves the viewport and nothing else" over a page
     measuring 4,459px across ~20 cards. #98 rejects the premise itself: the
     bar's entries now MOUNT one band and unmount the rest, so the page is one
     surface at a time rather than one surface, full stop.
     What survived both turns is why the Now/Review tabs stay retired (the
     guard in web/embed_test.go, and the note in web/dist/lib/nav.js): those
     tabs split the page into regions that fetched and refreshed on their own
     rhythms. A view here is a slice of ONE hash, ONE scope and ONE refresh
     loop — `view` is a presentation key, so switching costs no request and
     every mounted band still answers as of the same moment.
     #secnav is filled by web/dist/scope.js (renderNav), not written here: it
     prints an "All" entry this markup has no element for, one of its band
     entries (Progress) exists only on a hub a shipper pushes to, and the
     current-view highlight has to be wired anyway.
     `data-band` is how a node says which view mounts it, and it is the whole
     mapping — app.js reads exactly these attributes. A band is several sibling
     nodes (a label and the sections under it), never one, which is why this is
     an attribute on each of them rather than one id the nav points at. An
     untagged child of #page belongs to no band and is therefore on EVERY view;
     #pulse and #alerts are the two, deliberately (see below).
     Subscription / span / chips are per-section scope, not global navigation:
     each section mounts its own "scope controls" widget (web/dist/scope.js's
     createScopeControls) on its first substantive card. See scope.js for why.
     Section ids are structural on purpose — web/embed_test.go anchors on them,
     and per #8 an anchor must not be a product name or a heading that a
     rewording moves. -->
<header class="scope" id="scope">
  <div class="row1">
    <h1>TokenLedger</h1>
    <nav id="secnav" class="secnav" hidden></nav>
    <span class="spacer"></span>
    <button id="lang" data-i18n-title="app.language" title="Language">中</button>
    <button id="theme" data-i18n-title="app.theme" title="Toggle light / dark">◐</button>
  </div>
  <div class="progress" id="progress" hidden></div>
</header>
<div class="wrap">
  <div id="banners"></div>
  <!-- Three tiers, and the boundary between them is WHICH QUESTION a card
       answers, not how important it is.

         1  the ledger  — what was paid, and to whom
         2  usage       — what drove it
         3  operations  — is the collection still healthy, am I near a limit

       The first two are what TokenLedger is for. The third is the job this
       tool started as, and it is the half that made the page read as "Claude
       monitoring": nine cards of quota gauges, machines and sessions,
       interleaved with the money. It is still here -- on `view=all` it is
       still the same continuous page, just folded, so the page opens as a
       ledger.

       Each tier is introduced by a `.band` label, and #54 made that true of
       the FIRST one too. It had none: the ledger simply began, and the reader
       inferred the tier from the fact that money was showing. That was
       survivable while the labels were only signposts. It stopped being
       survivable once the nav bar names the bands, because a nav that offers
       four destinations over a page showing three labels is a nav that
       disagrees with the page under it. Four bands, four nav entries, one
       structure -- and #ops's <summary> is the fourth band's label, which is
       why it is set in the same type (see the three-tiers block in
       styles.css).

       #98 made each tier a VIEW as well as a label: `data-band` tags every
       node a tier owns, and app.js's mountView puts exactly one tier's nodes
       (or all of them, on `view=all`) into this <main>. The order below is
       still the page order, and it is what `view=all` renders -- mounting
       preserves it, because it re-lists these same nodes rather than building
       new ones. -->
  <main id="page" aria-busy="false">
    <!-- These two carry NO `data-band`, which is what puts them on every view.
         Alerts float above the tiers rather than living in one: something that
         needs attention is not a tier-3 concern just because the fleet roster
         is. Empty renders as nothing (see #alerts:empty). Unmounting it with a
         band would be the same mistake as folding it away -- an alert nobody
         can reach is an alert nobody sees, and a reader on the usage view is
         no less entitled to be told the collector died. -->
    <!-- The lifetime token badge, same reasoning. Outside the fold on purpose:
         it is small enough not to compete with the money now, and it is the
         one ambient "is the fleet still moving" signal on the page -- folded
         away, or unmounted, it answers nothing. -->
    <div id="pulse"></div>

    <section id="alerts"></section>

    <!-- The tier-1 band (#54). Below #pulse and #alerts, not above: both of
         those float over the tiers rather than belonging to one, and a band
         label printed above them would be claiming they are ledger cards. -->
    <div class="band" id="ledger-band" data-band="ledger">
      <span class="band-title" data-i18n="band.ledger">Ledger</span>
      <span class="band-note" data-i18n="band.ledger.note">what was paid, and to whom</span>
    </div>
    <section id="spend" data-band="ledger"></section>
    <section id="consumption" data-band="ledger"></section>

    <!-- The tier-2 band. It reads as a sibling of the operations summary
         below on purpose: the page is four labelled bands, and the label is
         what says which question the cards under it answer. -->
    <div class="band" id="usage-band" data-band="usage">
      <span class="band-title" data-i18n="band.usage">Usage</span>
      <span class="band-note" data-i18n="band.usage.note">what drove the figures above</span>
    </div>
    <section id="analysis" data-band="usage"></section>

    <!-- The progress band. It is a band of its own, not a card inside Usage,
         because it answers a different question: Usage says what drove the
         figures above, this says what those figures BOUGHT. Renders as
         nothing on a hub no shipper pushes repo facts to -- a feature nobody
         turned on should leave the page exactly as it was -- and its nav entry
         goes with it (app.js's loadRepoTier). The one exception is a reader who
         asked for `view=progress` by URL anyway: there the label stays, because
         a blank page is a worse answer than an empty band that names itself. -->
    <div class="band" id="repo-band" data-band="progress" hidden>
      <span class="band-title" data-i18n="band.progress">Progress</span>
      <span class="band-note" data-i18n="band.progress.note">what the spend bought</span>
    </div>
    <section id="repo" data-band="progress"></section>

    <details id="ops" class="ops" data-band="ops">
      <summary>
        <span class="ops-title" data-i18n="ops.title">Operations</span>
        <span class="ops-note" data-i18n="ops.note">quota headroom · machines · collection health · sessions</span>
      </summary>
      <!-- The door map (#61). A plain link in the shell, not a rendered card:
           it must cost nothing on a page whose whole ops tier is lazy-loaded,
           and it must still be there when the thing a reader came to look up
           is why the rest of this tier will not load for them. -->
      <p class="ops-link">
        <a href="/access" data-i18n="ops.access">Ways in — every door, its credential, and what is turned on here</a>
      </p>
      <!-- now.js renders this whole block: live activity, quota gauges,
           collector health and the fleet roster. "status", not "live",
           because it is all four. -->
      <section id="status"></section>
      <!-- review.js puts its operational half here: findings, the hour/wall
           histories, and the session list. -->
      <section id="ops-analysis"></section>
    </details>
  </main>
  <!-- #54 removed a dead, empty <footer> element from here. No module ever
       wrote it, so it rendered as nothing on every page view, and the one
       thing a tail element would have been worth on a 4,459px page -- "back
       to top" -- is what the sticky bar above already is: it never leaves the
       viewport, and its first entry scrolls to the top of the ledger. The
       generic `footer` rule in styles.css stays; internal/api/growth.go links
       that stylesheet and renders a footer of its own.
       (web/embed_test.go guards the removal by id, so this note deliberately
       does not spell that attribute out -- it would match its own guard.) -->
</div>
<aside id="detail" class="detail" hidden aria-modal="true" role="dialog"></aside>
<div class="tip" id="tip" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
