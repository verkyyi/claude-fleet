<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TokenLedger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Crect x='3' y='7' width='10' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- The bar holds the wordmark and the theme toggle, and nothing else.
     There are no view tabs: the page is one continuous surface, because the
     split those tabs named was a split of REFRESH RHYTHM, not of question —
     "what is burning right now" and "what did this period cost" are the same
     question at two time scales.
     Subscription / span / chips are per-section scope, not global navigation:
     each section mounts its own "scope controls" widget (web/dist/scope.js's
     createScopeControls) on its first substantive card. See scope.js for why.
     Section ids are structural on purpose — web/embed_test.go anchors on them,
     and per #8 an anchor must not be a product name or a heading that a
     rewording moves. -->
<header class="scope" id="scope">
  <div class="row1">
    <h1>TokenLedger</h1>
    <span class="spacer"></span>
    <button id="theme" title="Toggle light / dark">◐</button>
  </div>
  <div class="progress" id="progress" hidden></div>
</header>
<div class="wrap">
  <div id="banners"></div>
  <main id="page" aria-busy="false">
    <section id="spend"></section>
    <!-- now.js renders this whole block: live activity, quota gauges,
         collector health and the fleet roster. "status", not "live",
         because it is all four. -->
    <section id="status"></section>
    <section id="consumption"></section>
    <section id="analysis"></section>
  </main>
  <footer id="footer"></footer>
</div>
<aside id="detail" class="detail" hidden aria-modal="true" role="dialog"></aside>
<div class="tip" id="tip" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
