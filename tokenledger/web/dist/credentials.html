<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>凭据发放</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23fff'/%3E%3C/svg%3E">
<!--
  The credential vault's audit page (claude-fleet#1415). Operator only. Every
  lease a node took (or was refused), every refresh the hub ran, every
  credential stored or removed, and every revocation — from
  /v1/fleet/credentials/audit, polled. The stored credentials list carries
  metadata only: no secret ever reaches this page.

  A row's kind (claude-fleet#1463): a refresh token the hub refreshes, or a
  Claude setup-token the hub hands down as is — that one ends on a date
  (secret_expires_at), and the banner at the top names every setup token with
  under 30 days left, since the only remedy is a person running
  `claude setup-token` and importing it again. Principal "pool" is the shared
  pool: leased by every active person.
-->
<style>
:root {
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --border:#e3e2dd;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#85847e;
  --ok:#1f8f4e; --lost:#e34948; --accent:#2a78d6;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --border:#2f2f2c;
    --ink:#fff; --ink-2:#c3c2b7; --ink-3:#8b8a81;
    --ok:#3fb871; --lost:#e66767; --accent:#3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--plane); color:var(--ink);
  font:14px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:980px; margin:0 auto; padding:32px 16px 72px; }
h1 { margin:0; font-size:26px; font-weight:600; }
.sub { color:var(--ink-3); margin:6px 0 24px; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.92em; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-bottom:28px; }
.card {
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:16px 18px; box-shadow:var(--shadow);
}
.card h2 { margin:0 0 8px; font-size:18px; display:flex; align-items:center; gap:10px; }
.pill { font-size:12px; font-weight:600; padding:1px 9px; border-radius:999px; color:#fff; white-space:nowrap; }
.pill.online { background:var(--ok); }
.pill.lost { background:var(--lost); }
.kv { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; color:var(--ink-2); }
.kv b { color:var(--ink); font-weight:600; }
table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
th { color:var(--ink-3); font-weight:500; font-size:12px; }
tr:last-child td { border-bottom:0; }
.scroll { overflow-x:auto; }
.muted { color:var(--ink-3); }
.err { color:var(--lost); }
.pill.issue { background:var(--ok); }
.pill.deny, .pill.revoke { background:var(--lost); }
.pill.other { background:var(--accent); }
.empty { color:var(--ink-3); padding:24px; text-align:center; }
.warn { color:#b7791f; }
.banner { border:1px solid #b7791f; background:rgba(183,121,31,.08); border-radius:12px; padding:12px 16px; margin:0 0 20px; }
.banner.crit { border-color:var(--lost); background:rgba(227,73,72,.08); }
.banner b { display:block; margin-bottom:4px; }
.banner ul { margin:0; padding-left:18px; }
.pill.pool { background:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>凭据发放</h1>
  <div class="sub">长期凭据只存在入口、由入口统一刷新；每台机器只领短期的那一份。setup-token 是例外：入口原样下发、不刷新，到期前 30 天在这里提醒。下面是存着的凭据（只有元数据）、吊销名单和每一次发放记录。<span id="at" class="mono"></span></div>
  <div id="expiring" class="banner" hidden></div>
  <h2 style="font-size:16px;margin:0 0 10px">存着的凭据</h2>
  <div class="scroll"><table>
    <thead><tr><th>人</th><th>来源</th><th>账号</th><th>类型</th><th>到期</th><th>上次刷新</th><th>刷新错误</th></tr></thead>
    <tbody id="creds"></tbody>
  </table></div>
  <h2 style="font-size:16px;margin:24px 0 10px">吊销</h2>
  <div class="scroll"><table>
    <thead><tr><th>机器</th><th>人</th><th>时间</th><th>原因</th></tr></thead>
    <tbody id="revs"></tbody>
  </table></div>
  <h2 style="font-size:16px;margin:24px 0 10px">发放记录</h2>
  <div class="scroll"><table>
    <thead><tr><th>时间</th><th>动作</th><th>人</th><th>来源 · 账号</th><th>机器 · 登录</th><th>到期</th><th>说明</th></tr></thead>
    <tbody id="audit"></tbody>
  </table></div>
  <div id="error" class="err"></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ACTION = { issue: "发放", deny: "拒绝", refresh: "刷新", put: "存入", delete: "删除", revoke: "吊销", unrevoke: "解除吊销" };
const PROVIDER = { claude: "Claude", codex: "Codex", github: "GitHub" };
const KIND = { refresh_token: "刷新令牌（入口刷新）", setup_token: "setup-token（原样下发）", token: "令牌（原样下发）" };
const POOL = "pool";
const DAY = 86400e3, WARN_DAYS = 30, CRIT_DAYS = 7;
const t = (s) => s ? new Date(s).toLocaleString() : "—";
const who = (p) => p === POOL ? '<span class="pill pool">共享池</span>' : `<span class="mono">${esc(p)}</span>`;
// kind "" is a row from before the column: the provider's original kind.
const kindOf = (x) => x.kind || (x.provider === "github" ? "token" : "refresh_token");
const daysLeft = (s) => Math.floor((new Date(s) - Date.now()) / DAY);
function expiry(x) {
  const k = kindOf(x);
  if (k === "setup_token") {
    if (!x.secret_expires_at) return '<span class="muted">未知</span>';
    const d = daysLeft(x.secret_expires_at), when = new Date(x.secret_expires_at).toLocaleDateString();
    if (d < 0) return `<span class="err">已于 ${when} 到期</span>`;
    const cls = d <= CRIT_DAYS ? "err" : d <= WARN_DAYS ? "warn" : "";
    return `<span class="${cls}">${when} · 还有 ${d} 天</span>`;
  }
  if (k === "token") return '<span class="muted">不过期（第一阶段）</span>';
  return t(x.access_expires_at);
}
function banner(creds) {
  const soon = creds.filter((x) => kindOf(x) === "setup_token" && x.secret_expires_at && daysLeft(x.secret_expires_at) <= WARN_DAYS);
  const el = $("expiring");
  if (!soon.length) { el.hidden = true; el.innerHTML = ""; return; }
  const crit = soon.some((x) => daysLeft(x.secret_expires_at) <= CRIT_DAYS);
  el.className = "banner" + (crit ? " crit" : "");
  el.innerHTML = `<b>${soon.length} 个 setup-token 将在 30 天内到期（或已到期）—— 请在那台机器上重新 <span class="mono">claude setup-token</span>，再用 <span class="mono">bin/fleet-creds-import.sh</span> 导入</b><ul>` +
    soon.map((x) => { const d = daysLeft(x.secret_expires_at);
      return `<li><span class="mono">${esc(x.account)}</span>（${x.principal_id === POOL ? "共享池" : esc(x.principal_id)} · ${PROVIDER[x.provider] || esc(x.provider)}）：${d < 0 ? "已到期" : "还有 " + d + " 天"}，${new Date(x.secret_expires_at).toLocaleDateString()}</li>`; }).join("") + "</ul>";
  el.hidden = false;
}
function pill(a) {
  const cls = a === "issue" ? "issue" : (a === "deny" || a === "revoke") ? "deny" : "other";
  return `<span class="pill ${cls}">${ACTION[a] || esc(a)}</span>`;
}
function empty(cols, msg) { return `<tr><td colspan="${cols}" class="empty">${msg}</td></tr>`; }

async function getJSON(path) {
  const r = await fetch(path, { credentials: "same-origin", cache: "no-store" });
  if (!r.ok) throw new Error(path + " HTTP " + r.status);
  return r.json();
}

async function tick() {
  try {
    const [c, a] = await Promise.all([getJSON("/v1/fleet/credentials"), getJSON("/v1/fleet/credentials/audit?limit=300")]);
    $("at").textContent = " · 更新于 " + new Date().toLocaleTimeString();
    banner(c.credentials);
    $("creds").innerHTML = c.credentials.length ? c.credentials.map((x) => `
      <tr><td>${who(x.principal_id)}</td><td>${PROVIDER[x.provider] || esc(x.provider)}</td>
      <td class="mono">${esc(x.account)}</td><td>${KIND[kindOf(x)] || esc(x.kind)}</td><td>${expiry(x)}</td>
      <td>${kindOf(x) === "refresh_token" ? t(x.refreshed_at) : '<span class="muted">—</span>'}</td><td class="err">${esc(x.refresh_error)}</td></tr>`).join("") : empty(7, "还没有存入任何凭据。");
    $("revs").innerHTML = c.revocations.length ? c.revocations.map((r) => `
      <tr><td class="mono">${esc(r.hostname) || '<span class="muted">所有机器</span>'}</td>
      <td class="mono">${esc(r.principal_id) || '<span class="muted">所有人</span>'}</td><td>${t(r.revoked_at)}</td><td>${esc(r.reason)}</td></tr>`).join("") : empty(4, "没有吊销。");
    $("audit").innerHTML = a.audit.length ? a.audit.map((r) => `
      <tr><td>${t(r.at)}</td><td>${pill(r.action)}</td><td>${r.principal_id ? who(r.principal_id) : ""}</td>
      <td>${r.provider ? (PROVIDER[r.provider] || esc(r.provider)) + ' · <span class="mono">' + esc(r.account) + "</span>" : ""}</td>
      <td class="mono">${r.hostname ? esc(r.hostname) + (r.os_user ? " · " + esc(r.os_user) : "") : ""}</td>
      <td>${t(r.expires_at)}</td><td class="muted">${esc(r.detail)}</td></tr>`).join("") : empty(7, "还没有记录。");
    $("error").textContent = "";
  } catch (e) {
    $("error").textContent = "读取失败：" + e.message;
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
