name: ci

on:
  # Name the branch commits actually land on. This read `[main]` while every
  # commit was going to `dashboard-redesign`, so 56 commits reached production
  # without a single push-CI run -- the last one fired 2026-09-02 (issue #9).
  # `main` is the trunk again; `dashboard-redesign` stays listed until the
  # branches cut from it have landed and it is retired.
  push: { branches: [main, dashboard-redesign] }
  # Unfiltered on purpose: this trigger was always the correct one, and it does
  # not care what the base branch is called.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # `node --test <dir>` (a bare directory positional) does not glob-search
      # the directory on Node 22 as shipped here -- it tries to require() the
      # directory itself and fails with ERR_MODULE_NOT_FOUND. The glob form
      # (shell-expanded) is what actually runs the suite.
      - run: node --test web/test/*.test.mjs

  cross-compile:
    # The whole adoption story is "download one binary", so a platform that
    # stops building is a release-blocking bug, not a nice-to-have.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./cmd/ccquota
